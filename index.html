              </div>
            </div>
            <div class="run-settings-actions">
              <button class="btn-orange" onclick="app.applyHeightToAll('${run.id}')">Apply Height to All</button>
              <button class="btn-delete" onclick="app.deleteRun('${run.id}')">Delete Run</button>
            </div>
          </div>

          ${(() => {
            const slope = run.slope || {};
            const slopeMode = slope.mode || 'simple';
            const simple = slope.simple || { direction: 'left-to-right', totalFallMm: 0, startsFrom: 'start' };
            const slopePts = (slope.points) || [];
            const rid = run.id;
            const runLen = run.length || 0;

            if (slopeMode === 'simple') {
              // ── SIMPLE MODE ──
              const dirLR = simple.direction === 'left-to-right';
              const fall = simple.totalFallMm || 0;
              // Helper label
              let helperText = '';
              if (fall === 0) {
                helperText = 'Flat ground (no slope)';
              } else {
                const dirText = dirLR ? 'left to right' : 'right to left';
                const startLabels = { 'start': '', '25': ' from 25%', '50': ' from 50%', '75': ' from 75%' };
                helperText = 'Ground drops ' + fall + 'mm over ' + runLen.toFixed(1) + 'm (' + dirText + ')' + (startLabels[simple.startsFrom] || '');
              }

              return '<div class="slope-section">' +
                '<h3>Ground Slope</h3>' +
                '<div class="slope-simple-controls">' +
                  '<div class="slope-control-row">' +
                    '<label>Direction</label>' +
                    '<div class="slope-direction-toggle">' +
                      '<button class="slope-direction-btn' + (dirLR ? ' active' : '') + '" onclick="app.updateSimpleSlope(\'' + rid + '\', \'direction\', \'left-to-right\')">Falls left \u2192 right</button>' +
                      '<button class="slope-direction-btn' + (!dirLR ? ' active' : '') + '" onclick="app.updateSimpleSlope(\'' + rid + '\', \'direction\', \'right-to-left\')">Falls right \u2192 left</button>' +
                    '</div>' +
                  '</div>' +
                  '<div class="slope-control-row">' +
                    '<label>Total Fall</label>' +
                    '<input type="number" class="slope-fall-input-simple" value="' + fall + '" step="150" min="0" max="1800" ' +
                      'onchange="app.updateSimpleSlope(\'' + rid + '\', \'totalFallMm\', this.value)">' +
                    '<span style="font-size:12px;color:#6B5335;">mm</span>' +
                  '</div>' +
                  '<div class="slope-helper-label">' + helperText + '</div>' +
                  '<div class="slope-control-row">' +
                    '<label>Starts at</label>' +
                    '<select class="slope-starts-select" onchange="app.updateSimpleSlope(\'' + rid + '\', \'startsFrom\', this.value)">' +
                      '<option value="start"' + (simple.startsFrom === 'start' ? ' selected' : '') + '>From start</option>' +
                      '<option value="25"' + (simple.startsFrom === '25' ? ' selected' : '') + '>From 25%</option>' +
                      '<option value="50"' + (simple.startsFrom === '50' ? ' selected' : '') + '>From 50%</option>' +
                      '<option value="75"' + (simple.startsFrom === '75' ? ' selected' : '') + '>From 75%</option>' +
                    '</select>' +
                  '</div>' +
                '</div>' +
                '<a class="slope-mode-link" onclick="app.toggleSlopeMode(\'' + rid + '\')">Advanced mode \u2192</a>' +
              '</div>';
            } else {
              // ── ADVANCED MODE ──
              const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
              let slopeRows = '';
              slopePts.forEach((pt, pi) => {
                const letter = pi < letters.length ? letters[pi] : '?';
                const hMm = pt.heightMm || 0;
                const userFlag = pt.userSet ? ' \u2022' : '';

                if (pi === 0) {
                  // Point A — UNLOCKED in advanced mode
                  slopeRows += '<div class="slope-point-row">' +
                    '<span class="slope-pt-label">' + letter + '</span>' +
                    '<span>' + letter + ' \u2014 Start (0m) \u2014 height</span>' +
                    '<input type="number" class="slope-fall-input" value="' + hMm + '" step="50" ' +
                    'onchange="app.updateSlopePoint(\'' + rid + '\', 0, \'heightMm\', this.value)">' +
                    '<span>mm' + userFlag + '</span>' +
                    '</div>';
                } else if (pi === slopePts.length - 1) {
                  // End point
                  slopeRows += '<div class="slope-point-row">' +
                    '<span class="slope-pt-label">' + letter + '</span>' +
                    '<span>' + letter + ' \u2014 End (' + pt.distanceM.toFixed(1) + 'm) \u2014 height</span>' +
                    '<input type="number" class="slope-fall-input" value="' + hMm + '" step="50" ' +
                    'onchange="app.updateSlopePoint(\'' + rid + '\', ' + pi + ', \'heightMm\', this.value)">' +
                    '<span>mm' + userFlag + '</span>' +
                    '</div>';
                } else {
                  // Intermediate point
                  slopeRows += '<div class="slope-point-row">' +
                    '<span class="slope-pt-label">' + letter + '</span>' +
                    '<span>' + letter + ' \u2014</span>' +
                    '<input type="number" class="slope-dist-input" value="' + pt.distanceM.toFixed(1) + '" step="0.5" min="0.5" max="' + (runLen - 0.5) + '" ' +
                    'onchange="app.updateSlopePoint(\'' + rid + '\', ' + pi + ', \'distanceM\', this.value)">' +
                    '<span>m \u2014 height</span>' +
                    '<input type="number" class="slope-fall-input" value="' + hMm + '" step="50" ' +
                    'onchange="app.updateSlopePoint(\'' + rid + '\', ' + pi + ', \'heightMm\', this.value)">' +
                    '<span>mm' + userFlag + '</span>' +
                    '<button class="slope-point-delete" onclick="app.removeSlopePoint(\'' + rid + '\', ' + pi + ')" title="Remove point">&times;</button>' +
                    '</div>';
                }
              });

              const monoLabel = slope.monotonic === 'falling' ? ' (falling)' : (slope.monotonic === 'rising' ? ' (rising)' : '');

              return '<div class="slope-section">' +
                '<h3>Ground Slope \u2014 Advanced' + monoLabel + '</h3>' +
                '<div class="slope-hint">Drag points in the profile view or edit heights directly. Monotonic direction is enforced. Waterfall: subsequent unset points auto-follow.</div>' +
                '<div class="slope-point-list">' + slopeRows + '</div>' +
                '<div class="slope-actions">' +
                '<button class="btn-slope" onclick="app.addSlopePoint(\'' + rid + '\')">+ Add Point</button>' +
                '<button class="btn-slope" onclick="app.resetSlope(\'' + rid + '\')" style="background:#A0895F;">Reset Flat</button>' +
                '</div>' +
                '<a class="slope-mode-link" onclick="app.toggleSlopeMode(\'' + rid + '\')">\u2190 Simple mode</a>' +
              '</div>';
            }
          })()}

          <div class="quick-retaining">
            <h3>Quick Retaining Tool</h3>
            <div class="quick-retaining-row">
              <div class="form-group">
                <label>From Panel</label>
                <input type="number" id="qr-start-${run.id}" min="1" max="${run.panels.length}" value="1" style="width:60px;">
              </div>
              <div class="form-group">
                <label>To Panel</label>
                <input type="number" id="qr-end-${run.id}" min="1" max="${run.panels.length}" value="${run.panels.length}" style="width:60px;">
              </div>
              <div class="form-group">
                <label>Retaining (mm)</label>
                <select id="qr-retaining-${run.id}">
                  ${RETAINING_OPTIONS.map(r =>
                    `<option value="${r}">${r}</option>`
                  ).join('')}
                </select>
              </div>
              <button class="btn-orange" onclick="app.applyQuickRetaining('${run.id}')">Apply</button>
            </div>
          </div>

          <div class="panel-table-section">
            <h3>Panel Table</h3>
            <div class="panel-table-wrap">
              <table class="panel-table">
                <thead>
                  <tr>
                    <th>P#</th>
                    <th>Sheet Ht</th>
                    <th title="Slope-generated plinths (auto)">Slope</th>
                    <th title="Manual retaining (mm)">Ret (mm)</th>
                    <th>Plinths</th>
                    <th>Step</th>
                    <th>Total</th>
                    <th>Post</th>
                    <th>&times;</th>
                  </tr>
                </thead>
                <tbody>
                  ${panelRows}
                </tbody>
              </table>
            </div>
          </div>

          <!-- Gates and Job Settings moved to their own scope sections -->
        `;
      },

      // ── View switching ──
      currentView: 'profile',

      switchView(view) {
        this.currentView = view;
        const tabs = document.querySelectorAll('.view-tab');
        tabs[0].classList.toggle('active', view === 'profile');
        tabs[1].classList.toggle('active', view === '3d');
        document.getElementById('profileViewContainer').style.display = view === 'profile' ? '' : 'none';
        document.getElementById('fence3DViewport').style.display = view === '3d' ? '' : 'none';
        if (view === '3d') {
          if (!this._fence3DReady) {
            // Delay init to ensure viewport has layout dimensions
            setTimeout(() => {
              this.initFence3D();
              this._resizeFence3D();
              this.buildFence3D();
            }, 100);
          } else {
            requestAnimationFrame(() => {
              this._resizeFence3D();
              this.buildFence3D();
            });
          }
        }
      },

      // ── Profile View: pan/zoom state ──
      profilePan: { x: 0, y: 0 },
      profileZoom: 1,
      _profileDrag: null,
      _profileHitRegions: [],
      _profileHover: null,
      highlightedPanelIdx: null,

      // ── Soil profile handle dragging state (retaining handles — per-panel, orange) ──
      _soilHandlePositions: [],    // [{x, y, postIdx}] world coords of each handle
      _soilHandleDrag: null,       // {postIdx, startY, startRetLeft, startRetRight} when dragging
      _soilHandleHover: -1,        // index of hovered handle, -1 if none
      _soilHandleProximity: false,  // true when mouse is near ground line
      _soilGroundOffsets: [],       // cached ground offsets in mm for handle drag calculations

      // ── Slope point state (variable control points) ──
      _slopePointPositions: [],   // [{x, y, pointIdx}] world coords of slope points
      _slopePointDrag: null,      // {pointIdx, startWorldY} when dragging
      _slopePointHover: -1,       // index of hovered slope point

      // Select a panel (from table click or canvas click)
      selectPanel(idx) {
        this.highlightedPanelIdx = (this.highlightedPanelIdx === idx) ? null : idx;
        if (this._openSections.visualizer) this.renderProfileView();
        // Update table row highlights without full re-render
        const rows = document.querySelectorAll('.panel-table tbody tr[data-panel-idx]');
        rows.forEach(row => {
          const ri = parseInt(row.getAttribute('data-panel-idx'));
          row.classList.toggle('panel-row-highlight', ri === this.highlightedPanelIdx);
        });
        // Scroll the selected row into view
        if (this.highlightedPanelIdx !== null) {
          const sel = document.querySelector(`.panel-table tbody tr[data-panel-idx="${this.highlightedPanelIdx}"]`);
          if (sel) sel.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
      },

      // Convert screen mouse coords to canvas world coords (accounting for pan/zoom)
      _screenToWorld(clientX, clientY) {
        const container = document.getElementById('profileViewContainer');
        if (!container) return { x: 0, y: 0 };
        const rect = container.getBoundingClientRect();
        const sx = clientX - rect.left;
        const sy = clientY - rect.top;
        const wx = (sx - this.profilePan.x) / this.profileZoom;
        const wy = (sy - this.profilePan.y) / this.profileZoom;
        return { x: wx, y: wy };
      },

      // Hit test: find which region the world coord falls in
      _hitTest(wx, wy) {
        // Test in reverse order so topmost drawn items match first
        for (let i = this._profileHitRegions.length - 1; i >= 0; i--) {
          const r = this._profileHitRegions[i];
          if (r.shape === 'rect') {
            if (wx >= r.x && wx <= r.x + r.w && wy >= r.y && wy <= r.y + r.h) return r;
          } else if (r.shape === 'circle') {
            const dx = wx - r.cx, dy = wy - r.cy;
            if (dx * dx + dy * dy <= r.r * r.r) return r;
          }
        }
        return null;
      },

      // Check if world coords are near a soil handle; returns index or -1
      _hitTestSoilHandle(wx, wy) {
        const isTouchDevice = 'ontouchstart' in window;
        // Handle is drawn at (handleR / zoom) world units; use a generous hit area
        const baseR = isTouchDevice ? 12 : 8;
        const worldR = (baseR + 4) / this.profileZoom; // slightly larger than visual for easy grabbing
        for (let i = 0; i < this._soilHandlePositions.length; i++) {
          const h = this._soilHandlePositions[i];
          const dx = wx - h.x, dy = wy - h.y;
          if (dx * dx + dy * dy <= worldR * worldR) return i;
        }
        return -1;
      },

      // Check if world Y is within proximity of the soil profile line
      _isNearSoilProfile(wx, wy) {
        const proximityPx = 30 / this.profileZoom;
        for (let i = 0; i < this._soilHandlePositions.length; i++) {
          const h = this._soilHandlePositions[i];
          if (Math.abs(wy - h.y) < proximityPx && Math.abs(wx - h.x) < proximityPx * 3) return true;
        }
        return false;
      },

      // Check if world coords are near a slope point; returns index or -1
      _hitTestSlopePoint(wx, wy) {
        const baseR = 12;
        const worldR = (baseR + 4) / this.profileZoom;
        for (let i = 0; i < this._slopePointPositions.length; i++) {
          const h = this._slopePointPositions[i];
          const dx = wx - h.x, dy = wy - h.y;
          if (dx * dx + dy * dy <= worldR * worldR) return i;
        }
        return -1;
      },

      // Apply slope point drag: update point heightMm from canvas drag
      // Advanced mode only. Point A unlocked. Monotonic + waterfall enforced.
      _applySlopePointDrag(pointIdx, worldY) {
        const run = this.job.runs.find(r => r.id === this.currentRunId);
        if (!run || !run.slope) return;
        // Block dragging in simple mode
        if (run.slope.mode === 'simple') return;
        const pts = run.slope.points;
        if (!pts[pointIdx]) return;
        const layout = this._soilHandleLayout;
        if (!layout) return;

        const rawMm = (layout.groundY - worldY) / layout.scale;
        let snapped = Math.max(-2400, Math.min(2400, Math.round(rawMm / 50) * 50));

        // Determine monotonic direction on first drag
        const prevHeight = pts[pointIdx].heightMm;
        if (run.slope.monotonic === null && snapped !== prevHeight) {
          run.slope.monotonic = snapped < prevHeight ? 'falling' : 'rising';
        }

        // Enforce monotonic: this point must be consistent with previous
        if (pointIdx > 0 && run.slope.monotonic === 'falling') {
          snapped = Math.min(snapped, pts[pointIdx - 1].heightMm);
        } else if (pointIdx > 0 && run.slope.monotonic === 'rising') {
          snapped = Math.max(snapped, pts[pointIdx - 1].heightMm);
        }

        pts[pointIdx].heightMm = snapped;
        pts[pointIdx].userSet = true;

        // Waterfall: auto-adjust subsequent non-userSet points
        for (let i = pointIdx + 1; i < pts.length; i++) {
          if (!pts[i].userSet) {
            pts[i].heightMm = snapped;
          } else {
            // Enforce monotonic on userSet subsequent points too
            if (run.slope.monotonic === 'falling') {
              pts[i].heightMm = Math.min(pts[i].heightMm, pts[i - 1].heightMm);
            } else if (run.slope.monotonic === 'rising') {
              pts[i].heightMm = Math.max(pts[i].heightMm, pts[i - 1].heightMm);
            }
          }
        }

        this.calcSlopeForRun(run);
      },

      _showSlopePointTooltip(clientX, clientY, pointIdx) {
        const run = this.job.runs.find(r => r.id === this.currentRunId);
        if (!run || !run.slope) return;
        const container = document.getElementById('profileViewContainer');
        const tooltip = document.getElementById('soilHandleTooltip');
        if (!tooltip || !container) return;

        const pts = run.slope.points;
        if (!pts[pointIdx]) return;
        const mm = pts[pointIdx].heightMm || 0;
        let text;
        if (mm === 0) {
          text = '0mm (level)';
        } else if (mm < 0) {
          text = `Falls ${Math.abs(mm)}mm`;
        } else {
          text = `Rises ${mm}mm`;
        }

        const rect = container.getBoundingClientRect();
        tooltip.textContent = text;
        tooltip.style.display = 'block';
        tooltip.style.background = 'rgba(139,115,85,0.95)';
        tooltip.style.left = (clientX - rect.left + 14) + 'px';
        tooltip.style.top = (clientY - rect.top - 34) + 'px';
      },

      // Apply retaining handle drag: update ONE panel's retaining from handle position
      // Retaining is capped so that total plinths (slope + manual) ≤ 4
      _applySoilHandleDrag(panelIdx, worldY) {
        const run = this.job.runs.find(r => r.id === this.currentRunId);
        if (!run || panelIdx < 0 || panelIdx >= run.panels.length) return;

        const plinthHeightMm = 150;
        const layout = this._soilHandleLayout;
        if (!layout) return;

        // handle going UP (smaller worldY) = more retaining
        const lowOff = Math.max(layout.groundOffsets[panelIdx], layout.groundOffsets[panelIdx + 1]);
        const lowGndY = layout.groundY + lowOff * layout.scale;
        const rawRetMm = (lowGndY - worldY) / layout.scale;
        const snapped = Math.round(rawRetMm / plinthHeightMm) * plinthHeightMm;
        run.panels[panelIdx].retaining = Math.max(0, Math.min(600, snapped));
      },

      // Show the retaining handle drag tooltip
      _showSoilHandleTooltip(clientX, clientY, panelIdx) {
        const run = this.job.runs.find(r => r.id === this.currentRunId);
        if (!run || panelIdx < 0 || panelIdx >= run.panels.length) return;
        const container = document.getElementById('profileViewContainer');
        const tooltip = document.getElementById('soilHandleTooltip');
        if (!tooltip || !container) return;

        const retMm = run.panels[panelIdx].retaining;
        const plinths = retMm / 150;
        let text;
        if (retMm === 0) {
          text = '0mm (no retaining)';
        } else {
          text = `+${retMm}mm (${plinths} plinth${plinths !== 1 ? 's' : ''})`;
        }

        const rect = container.getBoundingClientRect();
        tooltip.textContent = text;
        tooltip.style.display = 'block';
        tooltip.style.background = 'rgba(241,90,41,0.92)';
        tooltip.style.left = (clientX - rect.left + 14) + 'px';
        tooltip.style.top = (clientY - rect.top - 34) + 'px';
      },

      _hideSoilHandleTooltip() {
        const tooltip = document.getElementById('soilHandleTooltip');
        if (tooltip) tooltip.style.display = 'none';
      },

      initProfileViewControls() {
        const container = document.getElementById('profileViewContainer');
        if (!container || container._pvBound) return;
        container._pvBound = true;

        const isTouchDevice = 'ontouchstart' in window;

        container.addEventListener('mousedown', (e) => {
          const w = this._screenToWorld(e.clientX, e.clientY);

          // Check slope points (variable ground profile) — advanced mode only
          const curRun = this.job.runs.find(r => r.id === this.currentRunId);
          if (curRun && curRun.slope && curRun.slope.mode === 'advanced') {
            const slopeIdx = this._hitTestSlopePoint(w.x, w.y);
            if (slopeIdx >= 0) {
              e.preventDefault();
              e.stopPropagation();
              this._slopePointDrag = { pointIdx: slopeIdx, startWorldY: w.y, active: true };
              this._slopePointHover = slopeIdx;
              container.style.cursor = 'ns-resize';
              this._showSlopePointTooltip(e.clientX, e.clientY, slopeIdx);
              return;
            }
          }

          // Check retaining handles (per-panel)
          const handleIdx = this._hitTestSoilHandle(w.x, w.y);
          if (handleIdx >= 0) {
            e.preventDefault();
            e.stopPropagation();
            const run = this.job.runs.find(r => r.id === this.currentRunId);
            if (!run) return;
            this._soilHandleDrag = {
              panelIdx: handleIdx,
              startWorldY: w.y,
              active: true
            };
            this._soilHandleHover = handleIdx;
            container.style.cursor = 'ns-resize';
            this._showSoilHandleTooltip(e.clientX, e.clientY, handleIdx);
            return;
          }

          this._profileDrag = { startX: e.clientX, startY: e.clientY, panX: this.profilePan.x, panY: this.profilePan.y, moved: false };
        });

        window.addEventListener('mousemove', (e) => {
          // Slope point drag in progress
          if (this._slopePointDrag && this._slopePointDrag.active) {
            const w = this._screenToWorld(e.clientX, e.clientY);
            this._applySlopePointDrag(this._slopePointDrag.pointIdx, w.y);
            this._showSlopePointTooltip(e.clientX, e.clientY, this._slopePointDrag.pointIdx);
            this.renderProfileView();
            this._syncPanelTableRetaining();
            return;
          }

          // Retaining handle drag in progress
          if (this._soilHandleDrag && this._soilHandleDrag.active) {
            const w = this._screenToWorld(e.clientX, e.clientY);
            this._applySoilHandleDrag(this._soilHandleDrag.panelIdx, w.y);
            this._showSoilHandleTooltip(e.clientX, e.clientY, this._soilHandleDrag.panelIdx);
            this.renderProfileView();
            // Sync panel table retaining dropdowns without full re-render
            this._syncPanelTableRetaining();
            return;
          }

          // Pan drag in progress
          if (this._profileDrag) {
            const dx = e.clientX - this._profileDrag.startX;
            const dy = e.clientY - this._profileDrag.startY;
            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) this._profileDrag.moved = true;
            this.profilePan.x = this._profileDrag.panX + dx * 0.6;
            this.profilePan.y = this._profileDrag.panY + dy * 0.6;
            this.renderProfileView();
            return;
          }

          // Hover: check slope handles, retaining handles, and hit regions
          const w = this._screenToWorld(e.clientX, e.clientY);

          // Slope point hover — advanced mode only
          const hoverRun = this.job.runs.find(r => r.id === this.currentRunId);
          const slopeHoverIdx = (hoverRun && hoverRun.slope && hoverRun.slope.mode === 'advanced') ? this._hitTestSlopePoint(w.x, w.y) : -1;
          if (slopeHoverIdx >= 0) {
            this._slopePointHover = slopeHoverIdx;
            container.style.cursor = 'ns-resize';
            this._showSlopePointTooltip(e.clientX, e.clientY, slopeHoverIdx);
            if (this._soilHandleHover >= 0) { this._soilHandleHover = -1; }
            if (this._profileHover) { this._profileHover = null; const pvT = document.getElementById('pvTooltip'); if (pvT) pvT.style.display = 'none'; }
            this.renderProfileView();
            return;
          } else if (this._slopePointHover >= 0) {
            this._slopePointHover = -1;
            this._hideSoilHandleTooltip();
            this.renderProfileView();
          }

          // Retaining handle hover
          const handleIdx = this._hitTestSoilHandle(w.x, w.y);
          const nearSoil = this._isNearSoilProfile(w.x, w.y);

          if (handleIdx >= 0) {
            this._soilHandleHover = handleIdx;
            this._soilHandleProximity = true;
            container.style.cursor = 'ns-resize';
            this._showSoilHandleTooltip(e.clientX, e.clientY, handleIdx);
            if (this._profileHover) {
              this._profileHover = null;
              const pvTooltip = document.getElementById('pvTooltip');
              if (pvTooltip) pvTooltip.style.display = 'none';
            }
            this.renderProfileView();
            return;
          } else if (this._soilHandleHover >= 0) {
            this._soilHandleHover = -1;
            this._hideSoilHandleTooltip();
            this.renderProfileView();
          }

          // Track proximity to soil line (show/hide retaining handles)
          const wasNear = this._soilHandleProximity;
          this._soilHandleProximity = nearSoil;
          if (wasNear !== nearSoil) this.renderProfileView();

          // Standard hover hit-testing
          const hit = this._hitTest(w.x, w.y);
          const tooltip = document.getElementById('pvTooltip');
          if (hit) {
            this._profileHover = hit;
            if (tooltip) {
              const rect = container.getBoundingClientRect();
              tooltip.textContent = hit.label;
              tooltip.style.display = 'block';
              tooltip.style.left = (e.clientX - rect.left + 12) + 'px';
              tooltip.style.top = (e.clientY - rect.top - 28) + 'px';
            }
            container.style.cursor = 'pointer';
            this.renderProfileView();
          } else if (this._profileHover) {
            this._profileHover = null;
            if (tooltip) tooltip.style.display = 'none';
            if (!nearSoil) container.style.cursor = 'grab';
            this.renderProfileView();
          } else if (!nearSoil) {
            container.style.cursor = 'grab';
          }
        });

        window.addEventListener('mouseup', (e) => {
          if (this._slopePointDrag && this._slopePointDrag.active) {
            // Finish slope point drag — save and do full re-render
            this._slopePointDrag = null;
            this._hideSoilHandleTooltip();
            container.style.cursor = 'grab';
            this.save();
            this.render();
            return;
          }
          if (this._soilHandleDrag && this._soilHandleDrag.active) {
            // Finish retaining handle drag — save and do full re-render
            this._soilHandleDrag = null;
            this._hideSoilHandleTooltip();
            container.style.cursor = 'grab';
            this.save();
            this.render();
            return;
          }
          if (this._profileDrag && !this._profileDrag.moved) {
            // Click — check for panel number circle hit
            const w = this._screenToWorld(e.clientX, e.clientY);
            const hit = this._hitTest(w.x, w.y);
            if (hit && hit.type === 'circle') {
              this.selectPanel(hit.panelIdx);
            }
          }
          this._profileDrag = null;
        });

        // Touch support for slope points + retaining handles
        container.addEventListener('touchstart', (e) => {
          if (e.touches.length !== 1) return;
          const touch = e.touches[0];
          const w = this._screenToWorld(touch.clientX, touch.clientY);

          // Slope points (variable ground profile) — advanced mode only
          const curRunT = this.job.runs.find(r => r.id === this.currentRunId);
          if (curRunT && curRunT.slope && curRunT.slope.mode === 'advanced') {
            const slopeIdx = this._hitTestSlopePoint(w.x, w.y);
            if (slopeIdx >= 0) {
              e.preventDefault();
              this._slopePointDrag = { pointIdx: slopeIdx, startWorldY: w.y, active: true, isTouch: true };
              this._slopePointHover = slopeIdx;
              this._showSlopePointTooltip(touch.clientX, touch.clientY, slopeIdx);
              this.renderProfileView();
              return;
            }
          }

          // Retaining handles
          const handleIdx = this._hitTestSoilHandle(w.x, w.y);
          if (handleIdx >= 0) {
            e.preventDefault();
            this._soilHandleDrag = { panelIdx: handleIdx, startWorldY: w.y, active: true, isTouch: true };
            this._soilHandleHover = handleIdx;
            this._showSoilHandleTooltip(touch.clientX, touch.clientY, handleIdx);
            this.renderProfileView();
          }
        }, { passive: false });

        container.addEventListener('touchmove', (e) => {
          if (this._slopePointDrag && this._slopePointDrag.active && this._slopePointDrag.isTouch) {
            e.preventDefault();
            const touch = e.touches[0];
            const w = this._screenToWorld(touch.clientX, touch.clientY);
            this._applySlopePointDrag(this._slopePointDrag.pointIdx, w.y);
            this._showSlopePointTooltip(touch.clientX, touch.clientY, this._slopePointDrag.pointIdx);
            this.renderProfileView();
            this._syncPanelTableRetaining();
            return;
          }
          if (this._soilHandleDrag && this._soilHandleDrag.active && this._soilHandleDrag.isTouch) {
            e.preventDefault();
            const touch = e.touches[0];
            const w = this._screenToWorld(touch.clientX, touch.clientY);
            this._applySoilHandleDrag(this._soilHandleDrag.panelIdx, w.y);
            this._showSoilHandleTooltip(touch.clientX, touch.clientY, this._soilHandleDrag.panelIdx);
            this.renderProfileView();
            this._syncPanelTableRetaining();
          }
        }, { passive: false });

        container.addEventListener('touchend', (e) => {
          if (this._slopePointDrag && this._slopePointDrag.active && this._slopePointDrag.isTouch) {
            this._slopePointDrag = null;
            this._hideSoilHandleTooltip();
            this.save();
            this.render();
            return;
          }
          if (this._soilHandleDrag && this._soilHandleDrag.active && this._soilHandleDrag.isTouch) {
            this._soilHandleDrag = null;
            this._hideSoilHandleTooltip();
            this.save();
            this.render();
          }
        });

        container.addEventListener('wheel', (e) => {
          e.preventDefault();
          const delta = e.deltaY > 0 ? 0.95 : 1.05;
          const rect = container.getBoundingClientRect();
          const mx = e.clientX - rect.left;
          const my = e.clientY - rect.top;
          this.profilePan.x = mx - (mx - this.profilePan.x) * delta;
          this.profilePan.y = my - (my - this.profilePan.y) * delta;
          this.profileZoom *= delta;
          this.profileZoom = Math.max(0.5, Math.min(5, this.profileZoom));
          this.renderProfileView();
        }, { passive: false });
      },

      // Sync panel table retaining dropdowns to match current panel data (no full re-render)
      _syncPanelTableRetaining() {
        const run = this.job.runs.find(r => r.id === this.currentRunId);
        if (!run) return;
        const dragIdx = this._soilHandleDrag ? this._soilHandleDrag.panelIdx : -1;
        const rows = document.querySelectorAll('.panel-table tbody tr[data-panel-idx]');
        rows.forEach(row => {
          const idx = parseInt(row.getAttribute('data-panel-idx'));
          if (idx >= 0 && idx < run.panels.length) {
            const panel = run.panels[idx];
            const derived = this.getPanelDerived(panel);

            // Update slope plinths display
            const slopeTd = row.querySelector('.col-slope');
            if (slopeTd) {
              slopeTd.textContent = derived.slopePlinths > 0 ? `${derived.slopePlinths}` : '—';
            }

            const sel = row.querySelector('.col-ret select');
            if (sel && parseInt(sel.value) !== panel.retaining) {
              sel.value = panel.retaining;
            }

            // Update plinths display (total, capped at 4)
            const plTd = row.querySelector('.col-pl');
            if (plTd) {
              const maxW = derived.plinthsCapped
                ? ' <span title="Max plinth capacity" style="color:#e65100;font-weight:700;">\u26A0</span>'
                : (derived.plinths >= 4 ? ' <span title="Max retaining" style="color:#e65100;font-weight:700;">\u26A0</span>' : '');
              plTd.innerHTML = (derived.plinths >= 3 ? `${derived.plinths}\u2020` : `${derived.plinths}`) + maxW;
            }

            // Update step display with mm amount
            const stepTd = row.querySelector('.col-step');
            if (stepTd) {
              const stepMm = panel.stepMm || 0;
              if (stepMm < 0) stepTd.textContent = '\u2193' + Math.abs(stepMm);
              else if (stepMm > 0) stepTd.textContent = '\u2191' + stepMm;
              else stepTd.textContent = '\u2014';
            }

            // Update total display
            const totTd = row.querySelector('.col-total');
            if (totTd) {
              const total = derived.totalHeight;
              totTd.textContent = total;
              totTd.className = 'col-total ' + (total > 1800 ? 'total-elevated' : 'total-standard');
            }
            // Update post display
            const postTd = row.querySelector('.col-post');
            if (postTd) {
              const posts = this.getRunPosts(run);
              const leftPost = posts[idx];
              const rightPost = posts[idx + 1];
              const maxPost = Math.max(leftPost.postSize, rightPost.postSize);
              const anyPatio = leftPost.patio || rightPost.patio;
              postTd.innerHTML = anyPatio ? `<span class="post-patio">${maxPost}†</span>` : `${maxPost}`;
            }
            // Highlight dragged panel during handle drag
            row.style.background = (dragIdx === idx) ? 'rgba(241,90,41,0.10)' : '';
          }
        });
      },

      // ── Profile View: main render ──
      // Panel texture image (loaded from file, cached)
      _panelTextureImg: null,
      _panelTextureLoaded: false,

      // Source crop rectangles from textures/panel_harmony_surfmist.png (2816x1536)
      // Posts: left x=327..389 (63px), right x=2426..2489 (64px)
      // Cap rail: y=51..92 (42px high)
      // Sheet: x=390..2425, y=93..1436 (2036w x 1344h)
      // Bottom rail: y=1437..1482 (46px high)
      SRC_SHEET: { sx: 390, sy: 93, sw: 2036, sh: 1344 },
      SRC_CAP:   { sx: 390, sy: 51, sw: 2036, sh: 42 },
      SRC_RAIL:  { sx: 390, sy: 1437, sw: 2036, sh: 46 },

      _loadPanelTexture() {
        const img = new Image();
        img.onload = () => {
          console.log('Panel texture loaded OK:', img.naturalWidth, 'x', img.naturalHeight);
          this._panelTextureImg = img;
          this._panelTextureLoaded = true;
          this.renderProfileView();

        img.onerror = (e) => {

      // ══════════════════════════════════════════════════════════════
      // THREE.JS 3D FENCE VISUALIZER
      // ══════════════════════════════════════════════════════════════
      _fence3DReady: false,
      _f3d: {},
      _f3dSelected: null,
      _f3dOrigMats: new Map(),
      _f3dFocusAnim: null,

      initFence3D() {
        const container = document.getElementById('fence3DViewport');
        const canvas = document.getElementById('fence3DCanvas');
        if (!container || !canvas) return;
        const w = container.clientWidth || 600;
        const h = container.clientHeight || 400;
        const f = this._f3d;

        // Scene
        f.scene = new THREE.Scene();

        // Sky gradient — Perth afternoon
        (function() {
          const c = document.createElement('canvas');
          c.width = 2; c.height = 512;
          const ctx = c.getContext('2d');
          const g = ctx.createLinearGradient(0, 0, 0, 512);
          g.addColorStop(0.0, '#3A6FB8');
          g.addColorStop(0.2, '#6AA0D0');
          g.addColorStop(0.4, '#95C4E0');
          g.addColorStop(0.6, '#C0D8E8');
          g.addColorStop(0.72, '#DEEADC');
          g.addColorStop(0.82, '#E0DCC8');
          g.addColorStop(0.88, '#C8D4B8');
          g.addColorStop(0.94, '#6B8F50');
          g.addColorStop(1.0, '#558A38');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, 2, 512);
          f.scene.background = new THREE.CanvasTexture(c);
        })();

        // Camera
        f.camera = new THREE.PerspectiveCamera(35, w / h, 0.1, 200);
        f.camera.position.set(6, 3, 6);

        // Orthographic camera for elevation views
        const aspect = w / h;
        f.orthoCam = new THREE.OrthographicCamera(-5 * aspect, 5 * aspect, 5, -5, 0.1, 200);
        f.activeCamera = f.camera;

        // Renderer
        f.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
        f.renderer.setSize(w, h);
        f.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        f.renderer.shadowMap.enabled = true;
        f.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        f.renderer.outputEncoding = THREE.sRGBEncoding;
        f.renderer.toneMapping = THREE.ReinhardToneMapping;
        f.renderer.toneMappingExposure = 1.2;

        // Environment map for PBR reflections
        (function() {
          const pmrem = new THREE.PMREMGenerator(f.renderer);
          pmrem.compileEquirectangularShader();
          const envScene = new THREE.Scene();
          envScene.background = new THREE.Color(0xB8C8D8);
          const gnd = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshBasicMaterial({ color: 0xD4C4A8 }));
          gnd.rotation.x = -Math.PI / 2; gnd.position.y = -1;
          envScene.add(gnd);
          f.scene.environment = pmrem.fromScene(envScene, 0.04).texture;
          pmrem.dispose();
        })();

        // Lighting — warm Perth afternoon
        f.scene.add(new THREE.HemisphereLight(0xE8D8C0, 0x7B9450, 0.55));

        const sun = new THREE.DirectionalLight(0xFFF0D0, 1.0);
        sun.position.set(6, 8, 5);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 50;
        sun.shadow.camera.left = -15;
        sun.shadow.camera.right = 15;
        sun.shadow.camera.top = 15;
        sun.shadow.camera.bottom = -15;
        sun.shadow.bias = -0.0005;
        sun.shadow.normalBias = 0.02;
        f.scene.add(sun);

        const fill = new THREE.DirectionalLight(0xFFF0E0, 0.25);
        fill.position.set(-3, 2, -3);
        f.scene.add(fill);

        // Shadow-receiving ground
        const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.15 }));
        shadowPlane.rotation.x = -Math.PI / 2;
        shadowPlane.receiveShadow = true;
        f.scene.add(shadowPlane);

        // Fog
        f.scene.fog = new THREE.Fog(0xD8DDD4, 30, 80);

        // Scene groups
        f.fenceGrp = new THREE.Group();
        f.envGrp = new THREE.Group();
        f.dimGrp = new THREE.Group();
        f.scene.add(f.fenceGrp);
        f.scene.add(f.envGrp);
        f.scene.add(f.dimGrp);

        // Raycaster for click-to-select
        f.raycaster = new THREE.Raycaster();
        f.mouse = new THREE.Vector2();

        // OrbitControls
        f.controls = new THREE.OrbitControls(f.camera, canvas);
        f.controls.enableDamping = true;
        f.controls.dampingFactor = 0.05;
        f.controls.minDistance = 1;
        f.controls.maxDistance = 25;
        f.controls.maxPolarAngle = Math.PI / 2 - 0.05;
        f.controls.panSpeed = 0.5;
        f.controls.target.set(0, 1, 0);

        // Click-to-select
        let clickTimer = null;
        canvas.addEventListener('click', (e) => {
          clearTimeout(clickTimer);
          clickTimer = setTimeout(() => this._onFence3DClick(e), 220);
        });
        canvas.addEventListener('dblclick', (e) => {
          clearTimeout(clickTimer);
          this._onFence3DDblClick(e);
        });

        // Hover cursor
        canvas.addEventListener('mousemove', (e) => {
          const rect = canvas.getBoundingClientRect();
          f.mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          f.mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          f.raycaster.setFromCamera(f.mouse, f.activeCamera);
          const hits = f.raycaster.intersectObjects(f.fenceGrp.children, false);
          canvas.style.cursor = hits.length > 0 ? 'pointer' : 'grab';
        });

        // Render loop with focus animation
        f._animating = true;
        const animate = () => {
          if (!f._animating) return;
          requestAnimationFrame(animate);
          // Focus animation lerp
          if (this._f3dFocusAnim) {
            const a = this._f3dFocusAnim;
            f.camera.position.lerp(a.targetPos, 0.08);
            f.controls.target.lerp(a.targetLook, 0.08);
            if (f.camera.position.distanceTo(a.targetPos) < 0.01) this._f3dFocusAnim = null;
          }
          f.controls.update();
          f.renderer.render(f.scene, f.activeCamera);
        };
        animate();

        this._fence3DReady = true;
      },

      _resizeFence3D() {
        const f = this._f3d;
        const container = document.getElementById('fence3DViewport');
        if (!container || !f.renderer) return;
        const w = container.clientWidth || 600;
        const h = container.clientHeight || 400;
        f.renderer.setSize(w, h, false);
        f.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        const canvas = f.renderer.domElement;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        f.camera.aspect = w / h;
        f.camera.updateProjectionMatrix();
        const a = w / h;
        f.orthoCam.left = -5 * a; f.orthoCam.right = 5 * a;
        f.orthoCam.updateProjectionMatrix();
      },

      // ── Click-to-select panel ──
      _onFence3DClick(e) {
        const f = this._f3d;
        const canvas = document.getElementById('fence3DCanvas');
        const rect = canvas.getBoundingClientRect();
        f.mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        f.mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        f.raycaster.setFromCamera(f.mouse, f.activeCamera);
        const hits = f.raycaster.intersectObjects(f.fenceGrp.children, false);

        // Deselect previous
        if (this._f3dSelected) {
          const orig = this._f3dOrigMats.get(this._f3dSelected);
          if (orig) this._f3dSelected.material = orig;
          this._f3dSelected = null;
          this._hideF3DPanel();
        }

        if (hits.length > 0) {
          const obj = hits[0].object;
          if (obj.userData && obj.userData.info) {
            this._f3dOrigMats.set(obj, obj.material);
            obj.material = new THREE.MeshStandardMaterial({
              color: 0xF15A29, metalness: 0.1, roughness: 0.4,
              emissive: 0xF15A29, emissiveIntensity: 0.15, side: THREE.DoubleSide
            });
            this._f3dSelected = obj;
            this._showF3DPanel(obj.userData.info);
          }
        }
      },

      // ── Double-click focus animation ──
      _onFence3DDblClick(e) {
        const f = this._f3d;
        const canvas = document.getElementById('fence3DCanvas');
        const rect = canvas.getBoundingClientRect();
        f.mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        f.mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        f.raycaster.setFromCamera(f.mouse, f.activeCamera);
        const hits = f.raycaster.intersectObjects(f.fenceGrp.children, false);

        if (hits.length > 0) {
          const obj = hits[0].object;
          const box = new THREE.Box3().setFromObject(obj);
          const centre = new THREE.Vector3();
          const sz = new THREE.Vector3();
          box.getCenter(centre);
          box.getSize(sz);
          const radius = Math.max(sz.x, sz.y, sz.z) * 3.5;
          this._f3dFocusAnim = {
            targetPos: new THREE.Vector3(centre.x + radius * 0.5, centre.y + radius * 0.3, centre.z + radius),
            targetLook: centre.clone()
          };
          f.activeCamera = f.camera;
          f.controls.object = f.camera;
        } else {
          // Double-click empty → reset to full fence view
          const box = new THREE.Box3().setFromObject(f.fenceGrp);
          const centre = new THREE.Vector3();
          box.getCenter(centre);
          const sz = new THREE.Vector3();
          box.getSize(sz);
          const maxDim = Math.max(sz.x, sz.y, sz.z);
          this._f3dFocusAnim = {
            targetPos: new THREE.Vector3(centre.x + maxDim * 0.8, centre.y + maxDim * 0.5, maxDim * 1.2),
            targetLook: centre.clone()
          };
        }
      },

      // ── Properties panel ──
      _showF3DPanel(info) {
        let panel = document.getElementById('fence3DInfoPanel');
        if (!panel) {
          panel = document.createElement('div');
          panel.id = 'fence3DInfoPanel';
          panel.style.cssText = 'position:absolute;top:12px;right:12px;background:rgba(41,60,70,0.92);color:#fff;padding:14px 18px;border-radius:8px;font-size:13px;line-height:1.6;z-index:20;max-width:260px;pointer-events:auto;';
          document.getElementById('fence3DViewport').appendChild(panel);
        }
        panel.innerHTML = info;
        panel.style.display = 'block';
      },
      _hideF3DPanel() {
        const p = document.getElementById('fence3DInfoPanel');
        if (p) p.style.display = 'none';
      },

      // ── Dimension sprite creator ──
      _createDimSprite(text) {
        const c = document.createElement('canvas');
        const ctx = c.getContext('2d');
        ctx.font = 'bold 28px Arial, sans-serif';
        const tw = ctx.measureText(text).width;
        c.width = Math.ceil(tw + 20);
        c.height = 36;
        // Background pill
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.strokeStyle = '#bbb';
        ctx.lineWidth = 1.5;
        const r = 6;
        ctx.beginPath();
        ctx.moveTo(r, 0); ctx.lineTo(c.width - r, 0); ctx.quadraticCurveTo(c.width, 0, c.width, r);
        ctx.lineTo(c.width, c.height - r); ctx.quadraticCurveTo(c.width, c.height, c.width - r, c.height);
        ctx.lineTo(r, c.height); ctx.quadraticCurveTo(0, c.height, 0, c.height - r);
        ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        // Text
        ctx.fillStyle = '#1a365d';
        ctx.font = 'bold 28px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, c.width / 2, c.height / 2);
        const tex = new THREE.CanvasTexture(c);
        const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, depthWrite: false });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(c.width * 0.004, c.height * 0.004, 1);
        return sprite;
      },

      // ── Dimension line with label ──
      _createDimLine(start, end, offset, label) {
        const grp = new THREE.Group();
        const dir = new THREE.Vector3().subVectors(end, start);
        const mid = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5).add(offset);
        // Main line
        const pts = [start.clone().add(offset), end.clone().add(offset)];
        const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x1a365d, depthTest: false });
        grp.add(new THREE.Line(lineGeo, lineMat));
        // Extension lines
        const ext1Geo = new THREE.BufferGeometry().setFromPoints([start, start.clone().add(offset)]);
        const ext2Geo = new THREE.BufferGeometry().setFromPoints([end, end.clone().add(offset)]);
        const extMat = new THREE.LineBasicMaterial({ color: 0x999999, depthTest: false });
        grp.add(new THREE.Line(ext1Geo, extMat));
        grp.add(new THREE.Line(ext2Geo, extMat));
        // Label
        const sprite = this._createDimSprite(label);
        sprite.position.copy(mid);
        grp.add(sprite);
        return grp;
      },

      // ── Corrugated fence sheet geometry ──
      _createFenceSheetGeo(widthM, heightM, profile) {
        const segs = profile === 'Harmony' ? 80 : 60;
        const geo = new THREE.PlaneGeometry(widthM, heightM, segs, 1);
        const pos = geo.attributes.position;
        if (profile === 'Harmony' || profile === 'Corodek') {
          const waveH = 0.008;
          const freq = profile === 'Harmony' ? 14 : 10;
          for (let i = 0; i < pos.count; i++) {
            pos.setZ(i, Math.sin(pos.getX(i) * freq * Math.PI) * waveH);
          }
        } else {
          const ribH = 0.012, ribW = 0.04;
          for (let i = 0; i < pos.count; i++) {
            const phase = ((pos.getX(i) / ribW) % 1 + 1) % 1;
            let z = 0;
            if (phase < 0.08) z = ribH * (phase / 0.08);
            else if (phase < 0.38) z = ribH;
            else if (phase < 0.46) z = ribH * (1 - (phase - 0.38) / 0.08);
            pos.setZ(i, z);
          }
        }
        geo.computeVertexNormals();
        return geo;
      },

      // ── Procedural textures ──
      _createGrassTexture(darken) {
        const c = document.createElement('canvas');
        c.width = 256; c.height = 256;
        const ctx = c.getContext('2d');
        ctx.fillStyle = darken ? '#4E7A32' : '#5C8A3C';
        ctx.fillRect(0, 0, 256, 256);
        for (let i = 0; i < 2000; i++) {
          const bx = Math.random() * 256, by = Math.random() * 256;
          const v = Math.floor(Math.random() * 30) - 15;
          ctx.strokeStyle = `rgba(${92+v},${138+v},${60+v},0.6)`;
          ctx.lineWidth = 0.5 + Math.random();
          ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + (Math.random()-0.5)*3, by - 2 - Math.random()*4); ctx.stroke();
        }
        for (let p = 0; p < 40; p++) {
          ctx.fillStyle = 'rgba(140,130,80,0.15)';
          ctx.fillRect(Math.random()*256, Math.random()*256, 3+Math.random()*8, 2+Math.random()*5);
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(20, 20);
        return tex;
      },

      _createPaverTexture() {
        const c = document.createElement('canvas');
        c.width = 512; c.height = 512;
        const ctx = c.getContext('2d');
        // Grout base
        ctx.fillStyle = '#A89878';
        ctx.fillRect(0, 0, 512, 512);
        // Paver palette — WA limestone tones
        const palette = [[210,195,168],[200,186,160],[218,202,176],[192,178,154],[205,190,162],[188,174,150]];
        const pw = 80, ph = 40, gap = 3;
        for (let row = 0; row < Math.ceil(512/ph); row++) {
          const offset = (row % 2) * (pw / 2);
          for (let col = -1; col < Math.ceil(512/pw) + 1; col++) {
            const x = col * pw + offset;
            const y = row * ph;
            const base = palette[Math.floor(Math.random() * palette.length)];
            const jit = Math.floor(Math.random() * 10) - 5;
            ctx.fillStyle = `rgb(${base[0]+jit},${base[1]+jit},${base[2]+jit})`;
            ctx.fillRect(x + gap/2, y + gap/2, pw - gap, ph - gap);
            // Stone speckle
            for (let s = 0; s < 4; s++) {
              const sv = Math.floor(Math.random() * 16) - 8;
              ctx.fillStyle = `rgba(${base[0]+sv},${base[1]+sv},${base[2]+sv},0.35)`;
              ctx.fillRect(x + gap + Math.random()*(pw-gap*2), y + gap + Math.random()*(ph-gap*2), 2+Math.random()*3, 1+Math.random()*2);
            }
          }
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(4, 4);
        return tex;
      },

      _createMulchTexture() {
        const c = document.createElement('canvas');
        c.width = 256; c.height = 256;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#6B4D3A';
        ctx.fillRect(0, 0, 256, 256);
        for (let i = 0; i < 800; i++) {
          const mx = Math.random()*256, my = Math.random()*256;
          const v = Math.floor(Math.random()*40)-20;
          ctx.fillStyle = `rgba(${107+v},${77+v},${58+v},0.7)`;
          ctx.fillRect(mx, my, 3+Math.random()*8, 1+Math.random()*3);
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(6, 6);
        return tex;
      },

      // ── Create property label for 3D scene (flat on ground) ──
      _create3DPropertyLabel(name, address, bgCol, accentCol) {
        const c = document.createElement('canvas');
        c.width = 512; c.height = 120;
        const ctx = c.getContext('2d');
        // Background
        ctx.fillStyle = bgCol;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.rect(0, 0, c.width, c.height);
        ctx.fill();
        ctx.globalAlpha = 1;
        // Accent bar
        ctx.fillStyle = accentCol;
        ctx.fillRect(0, 0, 6, c.height);
        // Name
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px Arial, sans-serif';
        ctx.textBaseline = 'middle';
        ctx.fillText(name, 24, 40);
        // Address
        if (address) {
          ctx.font = '22px Arial, sans-serif';
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.fillText(address, 24, 82);
        }
        const tex = new THREE.CanvasTexture(c);
        const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide });
        const labelMesh = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 0.8), mat);
        return labelMesh;
      },

      // ── Build 3D fence scene from job data ──
      buildFence3D() {
        try { this._buildFence3DInner(); } catch(e) {
          console.error('[3D] buildFence3D error:', e);
          // Show error on viewport
          var vp = document.getElementById('fence3DViewport');
          if (vp) {
            var errDiv = vp.querySelector('.f3d-error');
            if (!errDiv) { errDiv = document.createElement('div'); errDiv.className = 'f3d-error'; errDiv.style.cssText = 'position:absolute;top:10px;left:10px;right:10px;background:rgba(220,38,38,0.9);color:#fff;padding:10px;border-radius:6px;font-size:13px;z-index:10;'; vp.appendChild(errDiv); }
            errDiv.textContent = '3D Error: ' + e.message;
          }
        }
      },
      _buildFence3DInner() {
        const f = this._f3d;
        if (!f.fenceGrp) return;

        // Clear old geometry (deep dispose)
        [f.fenceGrp, f.envGrp, f.dimGrp].forEach(grp => {
          grp.traverse(child => {
            if (child.geometry) child.geometry.dispose();
            if (child.material) {
              if (Array.isArray(child.material)) child.material.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
              else { if (child.material.map) child.material.map.dispose(); child.material.dispose(); }
            }
          });
          while (grp.children.length) grp.remove(grp.children[0]);
        });
        this._f3dSelected = null;
        this._f3dOrigMats.clear();
        this._hideF3DPanel();

        const job = this.job;
        const run = job.runs.find(r => r.id === this.currentRunId) || job.runs[0];
        if (!run || !run.panels.length) return;

        // Colour lookup
        const allColours = [...(COLOURS_STOCK || []), ...(COLOURS_SPECIAL || [])];
        const colourEntry = allColours.find(c => c.name === job.colour);
        const colourHex = colourEntry ? colourEntry.hex : '#C4C0B6';
        const fenceCol = new THREE.Color(colourHex).convertSRGBToLinear();

        // Materials — PBR Colorbond
        const panelMat = new THREE.MeshStandardMaterial({ color: fenceCol, metalness: 0.1, roughness: 0.4, side: THREE.DoubleSide });
        const postMat = new THREE.MeshStandardMaterial({ color: fenceCol.clone().multiplyScalar(0.85), metalness: 0.1, roughness: 0.45 });
        const railMat = new THREE.MeshStandardMaterial({ color: fenceCol.clone().multiplyScalar(0.9), metalness: 0.1, roughness: 0.35 });
        const plinthMat = new THREE.MeshStandardMaterial({ color: fenceCol.clone().multiplyScalar(0.8), metalness: 0.05, roughness: 0.5 });
        const capMat = new THREE.MeshStandardMaterial({ color: fenceCol.clone().multiplyScalar(0.95), metalness: 0.15, roughness: 0.3 });
        const earthMat = new THREE.MeshStandardMaterial({ color: 0xC4A882, roughness: 0.85, metalness: 0.0 });
        const galvMat = new THREE.MeshStandardMaterial({ color: 0xB0B0B0, metalness: 0.5, roughness: 0.45 });
        const concreteMat = new THREE.MeshStandardMaterial({ color: 0xB8B8B0, roughness: 0.85, metalness: 0.0 });

        // Dimensions
        const supplier = SUPPLIER_PROFILES[job.supplier] || SUPPLIER_PROFILES.RNR;
        const panelWidthMm = supplier.panelWidth;
        const panelWidthM = panelWidthMm / 1000;
        const postW = 0.05;
        const railH = 0.025;
        const plinthH = 0.15;
        const embedDepth = 0.6;
        const profile = job.profile || 'Trimclad';

        // Compute slope data
        this.calcSlopeForRun(run);
        const panelCount = run.panels.length;

        // Ground offsets from slope
        const groundOffsets = new Array(panelCount + 1).fill(0);
        if (run.slope && run.slope.points && run.slope.points.length >= 2) {
          const pts = run.slope.points;
          const totalLen = run.length || (panelCount * panelWidthMm / 1000);
          for (let pi = 0; pi <= panelCount; pi++) {
            const xM = pi * panelWidthM;
            let hMm = 0;
            for (let si = 0; si < pts.length - 1; si++) {
              const dS = pts[si].distanceM || 0;
              const dE = pts[si+1].distanceM || totalLen;
              if (xM >= dS && xM <= dE) {
                const t = dE > dS ? (xM - dS) / (dE - dS) : 0;
                hMm = (pts[si].heightMm||0) + t * ((pts[si+1].heightMm||0) - (pts[si].heightMm||0));
                break;
              }
            }
            groundOffsets[pi] = hMm / 1000;
          }
        }
        const minGnd = Math.min(...groundOffsets);
        for (let i = 0; i < groundOffsets.length; i++) groundOffsets[i] -= minGnd;

        // Track panel positions for dimensions
        const panelPositions = [];
        let cursorX = 0;
        let maxFenceTop = 0;

        // ══ BUILD FENCE ══
        for (let pi = 0; pi <= panelCount; pi++) {
          const gndY = groundOffsets[pi];

          // ── POST ──
          let postH = 0;
          const leftPanel = pi > 0 ? run.panels[pi-1] : null;
          const rightPanel = pi < panelCount ? run.panels[pi] : null;
          if (leftPanel) {
            const lk = lookupPost(leftPanel.height, Math.min(4, (leftPanel.slopePlinths||0) + leftPanel.retaining/150) * 150);
            postH = Math.max(postH, lk.post / 1000);
          }
          if (rightPanel) {
            const rk = lookupPost(rightPanel.height, Math.min(4, (rightPanel.slopePlinths||0) + rightPanel.retaining/150) * 150);
            postH = Math.max(postH, rk.post / 1000);
          }
          if (postH === 0) postH = (run.sheetHeight + 600) / 1000; // fallback
          const aboveGnd = postH - embedDepth;
          maxFenceTop = Math.max(maxFenceTop, gndY + aboveGnd);

          // Post body
          const postGeo = new THREE.BoxGeometry(postW, aboveGnd, postW);
          const post = new THREE.Mesh(postGeo, postMat);
          post.position.set(cursorX, gndY + aboveGnd/2, 0);
          post.castShadow = true; post.receiveShadow = true;
          post.userData = { info: `<b>Post ${pi+1}</b><br>Height: ${postH*1000}mm<br>Above ground: ${Math.round(aboveGnd*1000)}mm<br>Embed: ${embedDepth*1000}mm` };
          f.fenceGrp.add(post);

          // Post cap (small square on top)
          const postCapGeo = new THREE.BoxGeometry(postW + 0.008, 0.006, postW + 0.008);
          const postCap = new THREE.Mesh(postCapGeo, capMat);
          postCap.position.set(cursorX, gndY + aboveGnd + 0.003, 0);
          f.fenceGrp.add(postCap);

          // Underground elements hidden — only visible in side/section view if needed

          // Patio tube if needed
          if (leftPanel || rightPanel) {
            const checkP = rightPanel || leftPanel;
            const totalPl = Math.min(4, (checkP.slopePlinths||0) + checkP.retaining/150);
            if (totalPl >= 3 && totalPl <= 4) {
              const tube = new THREE.Mesh(new THREE.BoxGeometry(0.076, aboveGnd, 0.038), galvMat);
              tube.position.set(cursorX, gndY + aboveGnd/2, -0.04);
              tube.castShadow = true;
              tube.userData = { info: '<b>Patio Tube</b><br>76×38mm RHS<br>Galvanised steel<br>Reinforcement for high retaining' };
              f.fenceGrp.add(tube);
            }
          }

          // ── PANEL ──
          if (pi < panelCount) {
            const panel = run.panels[pi];
            const panelX = cursorX + postW/2 + panelWidthM/2;
            const panelGnd = Math.min(groundOffsets[pi], groundOffsets[pi+1]);

            const slopePl = panel.slopePlinths || 0;
            const manualPl = panel.retaining / 150;
            const totalPl = Math.min(4, slopePl + manualPl);
            const retH = totalPl * plinthH;
            let stackY = panelGnd;

            // Plinths (single block, same depth as fence sheet)
            if (totalPl > 0) {
              const plGeo = new THREE.BoxGeometry(panelWidthM, retH, 0.015);
              const pl = new THREE.Mesh(plGeo, plinthMat.clone());
              pl.material.color = fenceCol.clone().multiplyScalar(0.75);
              pl.position.set(panelX, panelGnd + retH/2, 0);
              pl.castShadow = true; pl.receiveShadow = true;
              pl.userData = { info: `<b>${Math.round(totalPl)} Plinths</b><br>Panel ${pi+1}<br>${Math.round(retH*1000)}mm retaining<br>${job.colour}` };
              f.fenceGrp.add(pl);
              // Horizontal lines to show plinth divisions
              for (let pli = 1; pli < totalPl; pli++) {
                const line = new THREE.Mesh(new THREE.BoxGeometry(panelWidthM, 0.003, 0.017), postMat);
                line.position.set(panelX, panelGnd + pli * plinthH, 0);
                f.fenceGrp.add(line);
              }
              stackY = panelGnd + retH;
            }

            // Bottom rail
            const bRail = new THREE.Mesh(new THREE.BoxGeometry(panelWidthM, railH, 0.04), railMat);
            bRail.position.set(panelX, stackY + railH/2, 0);
            bRail.castShadow = true;
            f.fenceGrp.add(bRail);
            stackY += railH;

            // Sheet (corrugated)
            const sheetH = panel.height / 1000;
            const sheetGeo = this._createFenceSheetGeo(panelWidthM, sheetH, profile);
            const sheet = new THREE.Mesh(sheetGeo, panelMat);
            sheet.position.set(panelX, stackY + sheetH/2, 0);
            sheet.castShadow = true; sheet.receiveShadow = true;
            sheet.userData = { info: `<b>Panel ${pi+1}</b><br>${panel.height}mm ${profile}<br>${job.colour}<br>Width: ${panelWidthMm}mm${totalPl > 0 ? '<br>Retaining: '+Math.round(retH*1000)+'mm ('+Math.round(totalPl)+' plinths)' : ''}` };
            f.fenceGrp.add(sheet);
            stackY += sheetH;

            // Cap rail
            const cRail = new THREE.Mesh(new THREE.BoxGeometry(panelWidthM, railH, 0.045), capMat);
            cRail.position.set(panelX, stackY + railH/2, 0);
            cRail.castShadow = true;
            f.fenceGrp.add(cRail);

            // Track panel position
            const panelTop = stackY + railH;
            maxFenceTop = Math.max(maxFenceTop, panelTop);
            panelPositions.push({ x: panelX, gnd: panelGnd, top: panelTop, retH, sheetH, panelIdx: pi });

            cursorX += postW + panelWidthM;
          }
        }

        // ══ GATES ══
        if (job.gates && job.gates.length > 0) {
          let gateX = cursorX + 0.3;
          job.gates.forEach((gate, gi) => {
            const gateW = gate.type === 'double' ? 3.255 : 0.9;
            const gateH = (gate.height || run.sheetHeight || 1800) / 1000;
            const gateLk = lookupPost(gate.height || run.sheetHeight || 1800, 0);
            const gatePostH = gateLk.post / 1000;
            const gpMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.5, roughness: 0.4 });

            // Gate posts (90x90mm SHS)
            for (let gpi = 0; gpi < 2; gpi++) {
              const gp = new THREE.Mesh(new THREE.BoxGeometry(0.09, gatePostH - embedDepth, 0.09), gpMat);
              gp.position.set(gateX + gpi * gateW, (gatePostH - embedDepth)/2, 0);
              gp.castShadow = true;
              gp.userData = { info: `<b>Gate Post</b><br>90×90mm SHS<br>${gate.type === 'double' ? 'Double' : 'Pedestrian'} gate` };
              f.fenceGrp.add(gp);
              // Post cap
              const gc = new THREE.Mesh(new THREE.BoxGeometry(0.098, 0.006, 0.098), capMat);
              gc.position.set(gateX + gpi * gateW, (gatePostH - embedDepth) + 0.003, 0);
              f.fenceGrp.add(gc);
            }

            // Gate panels
            if (gate.type === 'double') {
              for (let leaf = 0; leaf < 2; leaf++) {
                const lW = gateW/2 - 0.03;
                const lMesh = new THREE.Mesh(this._createFenceSheetGeo(lW, gateH, profile), panelMat);
                lMesh.position.set(gateX + leaf*(gateW/2) + lW/2 + 0.015, gateH/2 + railH, 0);
                lMesh.castShadow = true;
                lMesh.userData = { info: `<b>Double Gate Leaf ${leaf+1}</b><br>${gateH*1000}mm × ${Math.round(lW*1000)}mm<br>${job.colour} ${profile}` };
                f.fenceGrp.add(lMesh);
              }
              // Hinge cylinders
              for (let hi = 0; hi < 2; hi++) {
                const hinge = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.06, 6), galvMat);
                hinge.position.set(gateX, 0.4 + hi * 0.95, 0.025);
                f.fenceGrp.add(hinge);
                const hinge2 = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.06, 6), galvMat);
                hinge2.position.set(gateX + gateW, 0.4 + hi * 0.95, 0.025);
                f.fenceGrp.add(hinge2);
              }
            } else {
              const gP = new THREE.Mesh(this._createFenceSheetGeo(gateW - 0.03, gateH, profile), panelMat);
              gP.position.set(gateX + gateW/2, gateH/2 + railH, 0);
              gP.castShadow = true;
              gP.userData = { info: `<b>Pedestrian Gate</b><br>${gateH*1000}mm × ${Math.round((gateW-0.03)*1000)}mm<br>${job.colour} ${profile}` };
              f.fenceGrp.add(gP);
              // Hinges
              for (let hi = 0; hi < 2; hi++) {
                const hinge = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.06, 6), galvMat);
                hinge.position.set(gateX, 0.4 + hi * 0.95, 0.025);
                f.fenceGrp.add(hinge);
              }
              // Handle
              const handle = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.08, 0.02), galvMat);
              handle.position.set(gateX + gateW - 0.06, gateH/2 + railH, 0.025);
              f.fenceGrp.add(handle);
            }

            // Top rail on gate
            const gCap = new THREE.Mesh(new THREE.BoxGeometry(gateW, railH, 0.045), capMat);
            gCap.position.set(gateX + gateW/2, gateH + railH*1.5, 0);
            f.fenceGrp.add(gCap);
            // Bottom rail on gate
            const gBot = new THREE.Mesh(new THREE.BoxGeometry(gateW, railH, 0.04), railMat);
            gBot.position.set(gateX + gateW/2, railH/2, 0);
            f.fenceGrp.add(gBot);

            gateX += gateW + 0.3;
          });
        }

        // ══ DIMENSIONS ══
        const totalLenM = run.length || (panelCount * panelWidthM);
        // Run length dimension (along top)
        const dimOffY = maxFenceTop + 0.3;
        f.dimGrp.add(this._createDimLine(
          new THREE.Vector3(0, dimOffY, 0),
          new THREE.Vector3(cursorX, dimOffY, 0),
          new THREE.Vector3(0, 0.15, 0),
          `${totalLenM.toFixed(1)}m`
        ));

        // Fence height dimension (first panel)
        if (panelPositions.length > 0) {
          const pp = panelPositions[0];
          f.dimGrp.add(this._createDimLine(
            new THREE.Vector3(-0.3, pp.gnd, 0),
            new THREE.Vector3(-0.3, pp.top, 0),
            new THREE.Vector3(-0.2, 0, 0),
            `${run.panels[0].height}mm`
          ));
          // Retaining height if present
          if (pp.retH > 0) {
            f.dimGrp.add(this._createDimLine(
              new THREE.Vector3(-0.3, pp.gnd, 0),
              new THREE.Vector3(-0.3, pp.gnd + pp.retH, 0),
              new THREE.Vector3(-0.5, 0, 0),
              `${Math.round(pp.retH*1000)}mm ret.`
            ));
          }
        }

        // Panel number labels
        panelPositions.forEach((pp, i) => {
          const lbl = this._createDimSprite(`P${i+1}`);
          lbl.position.set(pp.x, pp.gnd + pp.retH + railH + pp.sheetH/2, 0.08);
          f.dimGrp.add(lbl);
        });

        // ══ ENVIRONMENT ══
        const grassTex = this._createGrassTexture();
        const mulchTex = this._createMulchTexture();
        const fenceLen = Math.max(cursorX + 2, 10);
        const cx = cursorX / 2;
        const envDepth = 6;

        // Client side lawn (front — lighter green)
        const clientLawn = new THREE.Mesh(new THREE.PlaneGeometry(fenceLen + 4, envDepth),
          new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.92, metalness: 0.0 }));
        clientLawn.rotation.x = -Math.PI/2;
        clientLawn.position.set(cx, -0.005, envDepth/2 + 0.4);
        clientLawn.receiveShadow = true;
        f.envGrp.add(clientLawn);

        // Neighbour side lawn (back — slightly different tone)
        const nbGrassTex = this._createGrassTexture(0.92);
        const nbLawn = new THREE.Mesh(new THREE.PlaneGeometry(fenceLen + 4, envDepth),
          new THREE.MeshStandardMaterial({ map: nbGrassTex, roughness: 0.92, metalness: 0.0, color: 0xD0DFC0 }));
        nbLawn.rotation.x = -Math.PI/2;
        nbLawn.position.set(cx, -0.006, -envDepth/2 - 0.4);
        nbLawn.receiveShadow = true;
        f.envGrp.add(nbLawn);

        // Raised ground on neighbour side where retaining is present
        const nbEarthMat = new THREE.MeshStandardMaterial({ color: 0x8B7355, roughness: 0.9, metalness: 0.0 });
        const nbGrassMat = new THREE.MeshStandardMaterial({ map: nbGrassTex.clone(), roughness: 0.92, metalness: 0.0, color: 0xC8D8B8 });
        panelPositions.forEach((pp, pi) => {
          const panel = run.panels[pi];
          if (!panel) return;
          const totalPl = Math.min(4, (panel.slopePlinths||0) + panel.retaining/150);
          if (totalPl <= 0) return;
          const retH = totalPl * plinthH;
          const pX = pp.x;
          const pGnd = pp.gnd;
          // Earth bank behind fence — starts at fence line (z=0), slopes down over ~1.5m
          const bankDepth = 1.5;
          const bankShape = new THREE.Shape();
          bankShape.moveTo(0, pGnd);
          bankShape.lineTo(0, pGnd + retH);
          bankShape.lineTo(-bankDepth * 0.3, pGnd + retH);
          bankShape.lineTo(-bankDepth, pGnd + retH * 0.1);
          bankShape.lineTo(-bankDepth, pGnd);
          bankShape.closePath();
          const bankGeo = new THREE.ExtrudeGeometry(bankShape, { depth: panelWidthM, bevelEnabled: false });
          const bank = new THREE.Mesh(bankGeo, nbEarthMat);
          bank.rotation.y = Math.PI/2;
          bank.position.set(pX + panelWidthM/2, 0, -postW/2);
          bank.castShadow = true; bank.receiveShadow = true;
          bank.userData = { info: '<b>Neighbour Ground</b><br>Raised ' + Math.round(retH*1000) + 'mm<br>Retaining wall holds this earth back' };
          f.envGrp.add(bank);
          // Grass cap on top of bank
          const grassCap = new THREE.Mesh(new THREE.PlaneGeometry(panelWidthM, bankDepth * 0.35),
            nbGrassMat);
          grassCap.rotation.x = -Math.PI/2;
          grassCap.position.set(pX, pGnd + retH + 0.002, -postW/2 - bankDepth * 0.15);
          grassCap.receiveShadow = true;
          f.envGrp.add(grassCap);
        });

        // Mulch strip along fence base (client side)
        const mulchMat = new THREE.MeshStandardMaterial({ map: mulchTex, roughness: 0.9, metalness: 0.0 });
        const mulchStrip = new THREE.Mesh(new THREE.PlaneGeometry(cursorX + 0.6, 0.5), mulchMat);
        mulchStrip.rotation.x = -Math.PI/2;
        mulchStrip.position.set(cx, -0.003, 0.35);
        mulchStrip.receiveShadow = true;
        f.envGrp.add(mulchStrip);

        // Small shrubs along neighbour side (subtle)
        const shrubCols = [0x3D6B35, 0x4A7D42, 0x356130];
        const shrubCount = Math.min(5, Math.floor(cursorX / 3));
        for (let i = 0; i < shrubCount; i++) {
          const sx = (i + 0.5) * (cursorX / shrubCount);
          const sz = -1.5 - Math.random() * 0.5;
          const scale = 0.2 + Math.random() * 0.15;
          const col = shrubCols[i % shrubCols.length];
          const shrub = new THREE.Mesh(new THREE.SphereGeometry(scale, 6, 5),
            new THREE.MeshStandardMaterial({ color: col, roughness: 0.9 }));
          shrub.position.set(sx, scale * 0.6, sz);
          shrub.castShadow = true;
          f.envGrp.add(shrub);
        }

        // ── Property boundary line (dashed on ground) ──
        const boundaryLineMat = new THREE.MeshStandardMaterial({ color: 0xF15A29, roughness: 0.5, metalness: 0.0 });
        const dashCount = Math.ceil(cursorX / 0.5);
        for (let di = 0; di < dashCount; di++) {
          const dx = di * 0.5 + 0.15;
          if (dx > cursorX) break;
          const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 0.06), boundaryLineMat);
          dash.rotation.x = -Math.PI/2;
          dash.position.set(dx, 0.001, 0);
          f.envGrp.add(dash);
        }

        // ── Property labels (client side / neighbour side) ──
        const clientName = [job.clientFirstName, job.clientLastName].filter(Boolean).join(' ') || 'Client';
        const clientAddr = job.address || '';
        const nbs = job.neighbours || [];
        const nbName = [nbs[0]?.firstName, nbs[0]?.lastName].filter(Boolean).join(' ') || 'Neighbour';
        const nbAddr = nbs[0]?.address || '';

        const clientLabel = this._create3DPropertyLabel(clientName, clientAddr, '#293C46', '#F15A29');
        clientLabel.position.set(cx, 0.01, 2.5);
        clientLabel.rotation.x = -Math.PI/2;
        f.envGrp.add(clientLabel);

        const nbLabel = this._create3DPropertyLabel(nbName, nbAddr, '#4C6A7C', '#8FA4B2');
        nbLabel.position.set(cx, 0.01, -2.5);
        nbLabel.rotation.x = -Math.PI/2;
        f.envGrp.add(nbLabel);

        // ── Camera ──
        f.controls.target.set(cx, maxFenceTop * 0.4, 0);
        if (!this._fence3DUserMoved) {
          f.camera.position.set(cx + cursorX * 0.4, maxFenceTop * 0.7, cursorX * 0.6 + 3);
          this._fence3DUserMoved = false;
          f.controls.addEventListener('start', () => { this._fence3DUserMoved = true; }, { once: true });
        }
        f.controls.update();
      },

      // ── View presets ──
      setFence3DView(view) {
        const f = this._f3d;
        if (!f.scene) return;

        document.querySelectorAll('.fence-3d-view-btns button').forEach(btn => {
          btn.classList.toggle('active', btn.textContent.trim().toLowerCase() === view);
        });

        const box = new THREE.Box3().setFromObject(f.fenceGrp);
        const centre = new THREE.Vector3();
        const size = new THREE.Vector3();
        box.getCenter(centre);
        box.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);
        const padding = 1.3;

        if (view === '3d') {
          f.activeCamera = f.camera;
          f.controls.object = f.camera;
          this._f3dFocusAnim = {
            targetPos: new THREE.Vector3(centre.x + maxDim * 0.8, centre.y + maxDim * 0.5, maxDim * 1.2),
            targetLook: centre.clone()
          };
          f.controls.enableRotate = true;
        } else {
          const aspect = (document.getElementById('fence3DViewport').clientWidth || 600) /
                         (document.getElementById('fence3DViewport').clientHeight || 400);
          const frustum = maxDim * padding;
          f.orthoCam.left = -frustum * aspect / 2;
          f.orthoCam.right = frustum * aspect / 2;
          f.orthoCam.top = frustum / 2;
          f.orthoCam.bottom = -frustum / 2;
          f.orthoCam.near = -100;
          f.orthoCam.far = 100;
          f.orthoCam.updateProjectionMatrix();

          if (view === 'front') {
            f.orthoCam.position.set(centre.x, centre.y, centre.z + 20);
          } else if (view === 'side') {
            f.orthoCam.position.set(centre.x - 20, centre.y, centre.z);
          } else if (view === 'top') {
            f.orthoCam.position.set(centre.x, centre.y + 20, centre.z);
          }
          f.orthoCam.lookAt(centre);

          f.activeCamera = f.orthoCam;
          f.controls.object = f.orthoCam;
          f.controls.target.copy(centre);
          f.controls.enableRotate = false;
          f.controls.update();
        }
      },

      // ── Export 3D screenshot ──
      export3DScreenshot() {
        const f = this._f3d;
        if (!f || !f.renderer) { this.showToast('3D view not active', 'warning'); return; }
        // Render one frame with preserveDrawingBuffer
        f.renderer.render(f.scene, f.activeCamera || f.camera);
        const dataUrl = f.renderer.domElement.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = `fence_3d_${this.job.ref || 'view'}_${Date.now()}.png`;
        link.href = dataUrl;
        link.click();
        this.showToast('3D screenshot saved', 'success');
      },

        const canvas = document.getElementById('profileCanvas');

        const link = document.createElement('a');

      // ── AI Image Prompt Generator ──

        let totalMetres = 0, totalPanels = 0, totalPlinths = 0;
