          'COLORBOND FENCE CONSTRUCTION DETAILS (CRITICAL — get these right):\n' +
          '- Panels are FLAT vertical sheets with evenly-spaced vertical ribs/corrugations running top to bottom\n' +
          '- Each panel spans between two steel posts — the posts are recessed behind the panels (visible as a narrow vertical strip from the neighbour\'s side)\n' +
          '- From the street/front side: you see CONTINUOUS smooth panels with the cap rail along the top. Posts are barely visible\n' +
          '- The fence has a clean, modern, uniform appearance — no horizontal rails visible from the front\n' +
          '- Colorbond steel has a subtle satin/matte sheen — NOT glossy or mirror-like\n' +
          '- The colour should be accurate to the real BlueScope Colorbond swatch for "' + job.colour + '"\n' +
          slopeDesc + plinthDesc + gateDesc + '\n\n' +

          'PERTH SUBURBAN SCENE:\n' +
          '- Location: typical Perth, Western Australia residential suburb\n' +
          '- The fence is a boundary fence between two properties\n' +
          '- House style: single-storey brick or rendered home with Colorbond roof (typical Perth build)\n' +
          '- Garden: established lawn (kikuyu or couch grass), some native plants (grevillea, kangaroo paw, bottlebrush)\n' +
          '- Landscaping features: limestone garden edging or retaining, red-brown sandy Perth soil visible where freshly dug\n' +
          '- Driveway: exposed aggregate or plain concrete\n' +
          '- Street trees: mature eucalyptus or jacaranda providing dappled shade\n' +
          '- A typical 700m² suburban block, ~15m frontage\n' +
          '- Background: neighbouring houses with similar style, typical Perth suburban streetscape\n\n' +

          'CAMERA & LIGHTING:\n' +
          '- Camera position: eye-level (~1.6m height), standing in the front garden or on the street footpath, ' +
          'looking along the fence line at a 25–35 degree angle to show depth and perspective\n' +
          '- Focal length: 35mm (slight wide angle, natural perspective, no distortion)\n' +
          '- Aperture: f/5.6 — fence in sharp focus, background with gentle bokeh\n' +
          '- Depth of field: first 2–3 panels tack-sharp, gentle falloff toward the far end of the fence\n' +
          '- Lighting: late afternoon golden hour (Perth summer, ~5:30pm WST), warm directional light from the west\n' +
          '- Shadows: long warm shadows cast by the fence and posts onto the lawn, some dappled tree shadow on panels\n' +
          '- Sky: clear blue Perth sky with a few wispy cirrus clouds catching golden light\n\n' +

          'PHOTOREALISM REQUIREMENTS:\n' +
          '- Must look like an ACTUAL PHOTOGRAPH taken with a Canon EOS R5 or Sony A7 IV, NOT a 3D render or CGI\n' +
          '- Style: professional architectural/home renovation photography — like an Australian Outdoor Living magazine feature\n' +
          '- Show natural imperfections: slight grass overgrowth near fence base, a garden hose, a wheelie bin in background\n' +
          '- The fence should look BRAND NEW — clean panels, no marks, freshly installed\n' +
          '- High resolution, sharp detail on the steel panel ribbing and cap rail\n' +
          '- Natural colour grading — warm but not oversaturated';

        // Copy to clipboard
        navigator.clipboard.writeText(prompt).then(() => {
          this.showToast('AI prompt copied — paste into Gemini or ChatGPT', 'success');
        }).catch(() => {
          // Fallback: textarea for manual copy
          const ta = document.createElement('textarea');
          ta.value = prompt;
          ta.style.cssText = 'position:fixed;top:10%;left:10%;width:80%;height:60%;z-index:99999;font-size:12px;padding:12px;border-radius:8px;border:2px solid #F15A29;';
          document.body.appendChild(ta);
          ta.select();
          this.showToast('Prompt shown in text box — select all and copy manually', 'warning');
          ta.addEventListener('blur', () => ta.remove());
        });
      },

      // Track the last run ID we auto-fitted, so we re-fit when switching runs
      _lastFittedRunId: null,

      resetProfileView() {
        this.profilePan = { x: 0, y: 0 };
        this.profileZoom = 1;
        this._lastFittedRunId = null; // force re-fit
        this.renderProfileView();
      },

      renderProfileView() {
        const container = document.getElementById('profileViewContainer');
        const canvas = document.getElementById('profileCanvas');
        if (!container || !canvas) return;

        this.initProfileViewControls();

        const cw = container.clientWidth;
        const ch = container.clientHeight;
        if (cw === 0 || ch === 0) return;

        canvas.width = cw;
        canvas.height = ch;
        const ctx = canvas.getContext('2d');

        // Background
        ctx.fillStyle = '#f0f4f8';
        ctx.fillRect(0, 0, cw, ch);

        const run = this.job.runs.find(r => r.id === this.currentRunId);
        if (!run || run.panels.length === 0) {
          ctx.fillStyle = '#4C6A70';
          ctx.font = '18px Helvetica Neue, Helvetica, Arial, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('No panels — add a run and set its length', cw / 2, ch / 2);
          return;
        }

        // ── Colour lookup ──
        const allColours = [...COLOURS_STOCK, ...COLOURS_SPECIAL];
        const colourEntry = allColours.find(c => c.name === this.job.colour) || { hex: '#BDBFBA' };
        const fenceHex = colourEntry.hex;

        function darkenHex(hex, factor) {
          const r = parseInt(hex.slice(1, 3), 16);
          const g = parseInt(hex.slice(3, 5), 16);
          const b = parseInt(hex.slice(5, 7), 16);
          return `rgb(${Math.round(Math.min(255, r * factor))},${Math.round(Math.min(255, g * factor))},${Math.round(Math.min(255, b * factor))})`;
        }

        // Total retaining per panel (slope plinths + manual retaining), capped at 4 plinths (600mm)
        function panelTotalRetaining(p) {
          const raw = (p.slopePlinths || 0) * 150 + p.retaining;
          return Math.min(600, raw); // cap at 4 plinths
        }

        // ── Dimensions in mm ──
        const panelCount = run.panels.length;
        const postCount = panelCount + 1;
        const panelWidthMm = this.getPanelWidthMm();
        const postWidthMm = 50;
        const patioWidthMm = 120;  // visual only, does not affect layout spacing
        const embedDepthMm = 600;
        const railHeightMm = 25;
        const plinthHeightMm = 150;

        let maxTotalH = 0;
        run.panels.forEach(p => {
          const th = p.height + panelTotalRetaining(p);
          if (th > maxTotalH) maxTotalH = th;
        });

        // ── Ground offsets from step amounts (variable per panel) ──
        const groundOffsets = new Array(postCount).fill(0);
        for (let i = 0; i < panelCount; i++) {
          const stepMm = run.panels[i].stepMm || 0;
          // stepMm negative = step down = ground lower → offset increases
          // stepMm positive = step up = ground higher → offset decreases
          groundOffsets[i + 1] = groundOffsets[i] - stepMm;
        }
        const minGndOffset = Math.min(...groundOffsets);
        for (let i = 0; i < groundOffsets.length; i++) groundOffsets[i] -= minGndOffset;
        const maxGndOffset = Math.max(...groundOffsets);

        // Cache ground offsets for soil handle drag calculations (stored as array in mm)
        this._soilGroundOffsets = groundOffsets.slice();

        const posts = this.getRunPosts(run);

        let maxPostAbove = 0;
        posts.forEach(p => {
          const above = p.postSize - embedDepthMm;
          if (above > maxPostAbove) maxPostAbove = above;
        });

        // ── Scaling: 90% width, 70% height ──
        // Compute max visible extent above groundY (accounting for plinths raising sheets)
        let maxAboveGndYMm = 0;
        run.panels.forEach((p, idx) => {
          const lowOffset = Math.max(groundOffsets[idx], groundOffsets[idx + 1]);
          const panelTopMm = panelTotalRetaining(p) + railHeightMm + p.height + railHeightMm;
          const above = panelTopMm - lowOffset;
          if (above > maxAboveGndYMm) maxAboveGndYMm = above;
        });
        const totalFenceWidthMm = panelCount * panelWidthMm + postCount * postWidthMm;
        const totalAboveMm = maxAboveGndYMm + 50; // small padding above fence top
        const totalBelowMm = maxGndOffset + embedDepthMm + 200;
        const totalVisualHeightMm = totalAboveMm + totalBelowMm + 150;

        const scaleX = (cw * 0.90) / totalFenceWidthMm;
        const scaleY = (ch * 0.70) / totalVisualHeightMm;
        const scale = Math.min(scaleX, scaleY);

        // Auto-fit on first render or when switching runs
        if (this._lastFittedRunId !== run.id) {
          this.profilePan = { x: 0, y: 0 };
          this.profileZoom = 1;
          this._lastFittedRunId = run.id;
        }

        // Pan/zoom transform
        ctx.save();
        ctx.translate(this.profilePan.x, this.profilePan.y);
        ctx.scale(this.profileZoom, this.profileZoom);

        const fencePixelW = totalFenceWidthMm * scale;
        const originX = (cw / this.profileZoom - fencePixelW) / 2;
        const groundY = (ch / this.profileZoom) * 0.55 + totalAboveMm * scale * 0.1;

        // Cache layout for soil handle drag math
        this._soilHandleLayout = { groundY, scale, groundOffsets, originX, postWidthMm, panelWidthMm };

        const railH = railHeightMm * scale;
        const footingWMm = 300;
        const footingHMm = 450;

        // ── Run label ──
        const labelFontSize = Math.max(11, Math.min(18, 14 * scale * 2.5));
        ctx.fillStyle = '#293C46';
        ctx.font = `700 ${labelFontSize}px Helvetica Neue, Helvetica, Arial, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        const _nbForRun = run.neighbourId && (this.job.neighbours || []).find(n => n.id === run.neighbourId);
        const _nbLabel = _nbForRun ? '  ·  ' + ([_nbForRun.firstName, _nbForRun.lastName].filter(Boolean).join(' ') || 'Neighbour') : '';
        ctx.fillText(
          `${run.name}  ·  ${panelCount} panels  ·  ${run.length}m${_nbLabel}`,
          originX + fencePixelW / 2,
          groundY - maxAboveGndYMm * scale - 10
        );

        // ── Soil profile (retained earth behind plinths, viewed from LOW side) ──
        // Build the high-side ground profile as a path across the full run
        {
          let sx = originX;
          const earthBottomY = groundY + maxGndOffset * scale + embedDepthMm * scale + 50;

          ctx.save();
          ctx.beginPath();
          // Start at bottom-left
          ctx.moveTo(sx, earthBottomY);

          for (let ei = 0; ei <= panelCount; ei++) {
            const postGnd = groundY + groundOffsets[ei] * scale;
            const epanel = ei < panelCount ? run.panels[ei] : null;
            const epw = postWidthMm * scale;
            const epanelW = panelWidthMm * scale;

            // High-side ground at this post = low-side ground of adjacent panel - plinth stack
            // For a post, we use the highest adjacent panel's high-side level
            let highSideAtPost = postGnd; // default: no retaining = ground level
            if (ei > 0) {
              const lp = run.panels[ei - 1];
              const lpLowOff = Math.max(groundOffsets[ei - 1], groundOffsets[ei]);
              const lpLowGndY = groundY + lpLowOff * scale;
              const lpHighSide = lpLowGndY - panelTotalRetaining(lp) * scale;
              highSideAtPost = Math.min(highSideAtPost, lpHighSide);
            }
            if (ei < panelCount) {
              const rp = run.panels[ei];
              const rpLowOff = Math.max(groundOffsets[ei], groundOffsets[ei + 1]);
              const rpLowGndY = groundY + rpLowOff * scale;
              const rpHighSide = rpLowGndY - panelTotalRetaining(rp) * scale;
              highSideAtPost = Math.min(highSideAtPost, rpHighSide);
            }

            if (ei === 0) {
              // First post: line up from bottom to high-side level
              ctx.lineTo(sx, highSideAtPost);
            } else {
              // Step vertically at post junction then across
              ctx.lineTo(sx, highSideAtPost);
            }

            sx += epw; // past post

            if (epanel) {
              // Across the panel at its high-side level
              const pLowOff = Math.max(groundOffsets[ei], groundOffsets[ei + 1]);
              const pLowGndY = groundY + pLowOff * scale;
              const pHighSide = pLowGndY - panelTotalRetaining(epanel) * scale;
              ctx.lineTo(sx, pHighSide); // left edge of panel at high-side
              sx += epanelW;
              ctx.lineTo(sx, pHighSide); // right edge of panel at high-side
            }
          }

          // Close path down to bottom-right and back
          ctx.lineTo(sx, earthBottomY);
          ctx.closePath();

          // Earth fill gradient
          const earthTopY = groundY - maxGndOffset * scale - 200;
          const grdEarth = ctx.createLinearGradient(0, earthTopY, 0, earthBottomY);
          grdEarth.addColorStop(0, '#C4A882');
          grdEarth.addColorStop(1, '#8B7355');
          ctx.fillStyle = grdEarth;
          ctx.fill();
          ctx.restore();

          // Grass strip along the top edge of the earth profile (4px green line)
          ctx.save();
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#5B8C3E';
          ctx.beginPath();
          let gx = originX;
          let firstPoint = true;
          for (let ei = 0; ei <= panelCount; ei++) {
            const postGnd = groundY + groundOffsets[ei] * scale;
            const epw = postWidthMm * scale;
            const epanelW = panelWidthMm * scale;
            const epanel = ei < panelCount ? run.panels[ei] : null;

            let highSideAtPost = postGnd;
            if (ei > 0) {
              const lp = run.panels[ei - 1];
              const lpLowOff = Math.max(groundOffsets[ei - 1], groundOffsets[ei]);
              const lpLowGndY = groundY + lpLowOff * scale;
              highSideAtPost = Math.min(highSideAtPost, lpLowGndY - panelTotalRetaining(lp) * scale);
            }
            if (ei < panelCount) {
              const rp = run.panels[ei];
              const rpLowOff = Math.max(groundOffsets[ei], groundOffsets[ei + 1]);
              const rpLowGndY = groundY + rpLowOff * scale;
              highSideAtPost = Math.min(highSideAtPost, rpLowGndY - panelTotalRetaining(rp) * scale);
            }

            if (firstPoint) {
              ctx.moveTo(gx, highSideAtPost);
              firstPoint = false;
            } else {
              ctx.lineTo(gx, highSideAtPost);
            }

            gx += epw;

            if (epanel) {
              const pLowOff = Math.max(groundOffsets[ei], groundOffsets[ei + 1]);
              const pLowGndY = groundY + pLowOff * scale;
              const pHighSide = pLowGndY - panelTotalRetaining(epanel) * scale;
              ctx.lineTo(gx, pHighSide);
              gx += epanelW;
              ctx.lineTo(gx, pHighSide);
            }
          }
          ctx.stroke();
          ctx.restore();
        }

        // ── Draw posts and panels ──
        let cursorX = originX;
        const pw = postWidthMm * scale;

        for (let i = 0; i <= panelCount; i++) {
          const panel = i < panelCount ? run.panels[i] : null;
          const gndOff = groundOffsets[i] * scale;
          const postGndY = groundY + gndOff;

          // ── POST — height clamped to adjacent panel tops ──
          const postInfo = posts[i];

          // Find post top Y from adjacent panels' cap rail tops
          let postTopY = postGndY; // default
          const leftPanel = i > 0 ? run.panels[i - 1] : null;
          const rightPanel = i < panelCount ? run.panels[i] : null;
          if (leftPanel) {
            const lpLowOff = Math.max(groundOffsets[i - 1], groundOffsets[i]);
            const lpLowGndY = groundY + lpLowOff * scale;
            const lpCapTopY = lpLowGndY - (panelTotalRetaining(leftPanel) + railHeightMm + leftPanel.height + railHeightMm) * scale;
            postTopY = Math.min(postTopY, lpCapTopY);
          }
          if (rightPanel) {
            const rpLowOff = Math.max(groundOffsets[i], groundOffsets[i + 1]);
            const rpLowGndY = groundY + rpLowOff * scale;
            const rpCapTopY = rpLowGndY - (panelTotalRetaining(rightPanel) + railHeightMm + rightPanel.height + railHeightMm) * scale;
            postTopY = Math.min(postTopY, rpCapTopY);
          }
          const postAboveH = postGndY - postTopY;

          // Patio tube RHS behind the post (wider backing, same height)
          if (postInfo.patio) {
            const patioW = patioWidthMm * scale;
            const patioX = cursorX - (patioW - pw) / 2;
            ctx.fillStyle = fenceHex;
            ctx.fillRect(patioX, postTopY, patioW, postAboveH);
            ctx.strokeStyle = darkenHex(fenceHex, 0.7);
            ctx.lineWidth = 0.5;
            ctx.strokeRect(patioX, postTopY, patioW, postAboveH);
          }

          // Post body — fence colour
          ctx.fillStyle = fenceHex;
          ctx.fillRect(cursorX, postTopY, pw, postAboveH);
          ctx.fillStyle = 'rgba(0,0,0,0.2)';
          ctx.fillRect(cursorX, postTopY, 1, postAboveH);
          ctx.fillRect(cursorX + pw - 1, postTopY, 1, postAboveH);
          ctx.fillStyle = 'rgba(0,0,0,0.15)';
          ctx.fillRect(cursorX + (pw - 1) / 2, postTopY, 1, postAboveH);
          ctx.strokeStyle = darkenHex(fenceHex, 0.7);
          ctx.lineWidth = 0.5;
          ctx.strokeRect(cursorX, postTopY, pw, postAboveH);

          // Underground: faded post extension + concrete footing
          const embedH = embedDepthMm * scale;
          const postCentreX = cursorX + pw / 2;
          ctx.save();
          ctx.globalAlpha = 0.5;
          ctx.fillStyle = fenceHex;
          ctx.fillRect(cursorX, postGndY, pw, embedH);
          ctx.strokeStyle = darkenHex(fenceHex, 0.7);
          ctx.lineWidth = 0.5;
          ctx.strokeRect(cursorX, postGndY, pw, embedH);
          ctx.restore();
          const footingW = footingWMm * scale;
          const footingH = footingHMm * scale;
          const footingX = postCentreX - footingW / 2;
          const footingY = postGndY + embedH - footingH;
          ctx.fillStyle = '#A0A0A0';
          ctx.fillRect(footingX, footingY, footingW, footingH);
          ctx.save();
          ctx.setLineDash([4, 3]);
          ctx.strokeStyle = '#808080';
          ctx.lineWidth = 1;
          ctx.strokeRect(footingX, footingY, footingW, footingH);
          ctx.restore();

          cursorX += pw;

          // ── PANEL (correct construction stacking: plinths → bottom rail → sheets → cap rail) ──
          if (panel) {
            const panelW = panelWidthMm * scale;
            const sheetH = panel.height * scale;
            const totalRet = panelTotalRetaining(panel);
            const plinths = totalRet / plinthHeightMm;
            const plinthStackH = totalRet * scale;
            const btmRailH = railH;
            const capRailH = railH;

            // Low-side ground (bottom of plinths)
            const lowSideOff = Math.max(groundOffsets[i], groundOffsets[i + 1]);
            const lowSideGndY = groundY + lowSideOff * scale;
            // High-side ground (top of plinths)
            const highSideGndY = lowSideGndY - plinthStackH;

            // Stacking from bottom to top:
            const plinthBottomY = lowSideGndY;
            const btmRailBottomY = highSideGndY;
            const btmRailTopY = btmRailBottomY - btmRailH;
            const sheetBottomY = btmRailTopY;
            const sheetTopY = sheetBottomY - sheetH;
            const capRailTopY = sheetTopY - capRailH;

            // ── Plinths (Colorbond steel plinth panels with horizontal ribs) ──
            if (plinths > 0) {
              const plinthH = plinthHeightMm * scale;
              for (let pi = 0; pi < plinths; pi++) {
                const py = plinthBottomY - (pi + 1) * plinthH; // stack upward from low-side ground
                ctx.fillStyle = fenceHex;
                ctx.fillRect(cursorX, py, panelW, plinthH);
                const ribCount = 5;
                const ribSpacing = plinthH / (ribCount + 1);
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                for (let ri = 1; ri <= ribCount; ri++) {
                  ctx.fillRect(cursorX, py + ri * ribSpacing, panelW, 1);
                }
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(cursorX, py + plinthH - 1, panelW, 1);
                if (pi < plinths - 1) {
                  ctx.fillStyle = 'rgba(0,0,0,0.25)';
                  ctx.fillRect(cursorX, py, panelW, 1);
                }
              }
              ctx.strokeStyle = darkenHex(fenceHex, 0.7);
              ctx.lineWidth = 0.5;
              ctx.strokeRect(cursorX, highSideGndY, panelW, plinthStackH);
            }

            // ── Bottom rail (from image crop) on top of plinths ──
            if (this._panelTextureLoaded) {
              const sr = this.SRC_RAIL;
              ctx.drawImage(this._panelTextureImg, sr.sx, sr.sy, sr.sw, sr.sh,
                cursorX, btmRailTopY, panelW, btmRailH);
              ctx.save();
              ctx.globalCompositeOperation = 'multiply';
              ctx.fillStyle = fenceHex;
              ctx.fillRect(cursorX, btmRailTopY, panelW, btmRailH);
              ctx.globalCompositeOperation = 'source-over';
              ctx.restore();
            } else {
              ctx.fillStyle = fenceHex;
              ctx.fillRect(cursorX, btmRailTopY, panelW, btmRailH);
            }
            ctx.strokeStyle = darkenHex(fenceHex, 0.7);
            ctx.lineWidth = 0.5;
            ctx.strokeRect(cursorX, btmRailTopY, panelW, btmRailH);

            // ── Sheets (tiled from image crop) on top of bottom rail ──
            ctx.save();
            ctx.beginPath();
            ctx.rect(cursorX, sheetTopY, panelW, sheetH);
            ctx.clip();

            if (this._panelTextureLoaded) {
              const ss = this.SRC_SHEET;
              const sheetWidthMm = 762;
              const numSheets = Math.max(1, Math.floor(panelWidthMm / sheetWidthMm));
              const tileW = panelW / numSheets;
              for (let si = 0; si < numSheets; si++) {
                ctx.drawImage(this._panelTextureImg, ss.sx, ss.sy, ss.sw, ss.sh,
                  cursorX + si * tileW, sheetTopY, tileW, sheetH);
              }
              ctx.globalCompositeOperation = 'multiply';
              ctx.fillStyle = fenceHex;
              ctx.fillRect(cursorX, sheetTopY, panelW, sheetH);
              ctx.globalCompositeOperation = 'source-over';
            } else {
              ctx.fillStyle = fenceHex;
              ctx.fillRect(cursorX, sheetTopY, panelW, sheetH);
            }
            ctx.restore();

            ctx.strokeStyle = darkenHex(fenceHex, 0.7);
            ctx.lineWidth = 0.5;
            ctx.strokeRect(cursorX, sheetTopY, panelW, sheetH);

            // ── Per-panel capping rail (from image crop) on top of sheets ──
            if (this._panelTextureLoaded) {
              const sc = this.SRC_CAP;
              ctx.drawImage(this._panelTextureImg, sc.sx, sc.sy, sc.sw, sc.sh,
                cursorX, capRailTopY, panelW, capRailH);
              ctx.save();
              ctx.globalCompositeOperation = 'multiply';
              ctx.fillStyle = fenceHex;
              ctx.fillRect(cursorX, capRailTopY, panelW, capRailH);
              ctx.globalCompositeOperation = 'source-over';
              ctx.restore();
            } else {
              ctx.fillStyle = fenceHex;
              ctx.fillRect(cursorX, capRailTopY, panelW, capRailH);
            }
            ctx.strokeStyle = darkenHex(fenceHex, 0.7);
            ctx.lineWidth = 0.5;
            ctx.strokeRect(cursorX, capRailTopY, panelW, capRailH);

            // ── Panel number (circled) ──
            const circleCX = cursorX + panelW / 2;
            const circleCY = sheetTopY + sheetH / 2;
            const circleR = Math.max(9, Math.min(18, 14 * scale));
            ctx.fillStyle = 'rgba(255,255,255,0.88)';
            ctx.beginPath();
            ctx.arc(circleCX, circleCY, circleR, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#293C46';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.fillStyle = '#293C46';
            const numFontSize = Math.max(8, Math.min(14, 11 * scale));
            ctx.font = `700 ${numFontSize}px Helvetica Neue, Helvetica, Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`P${i + 1}`, circleCX, circleCY);

            // ── Highlight panel during retaining handle drag ──
            if (this._soilHandleDrag && this._soilHandleDrag.active) {
              const dragIdx = this._soilHandleDrag.panelIdx;
              if (dragIdx === i) {
                ctx.save();
                ctx.fillStyle = 'rgba(241,90,41,0.10)';
                ctx.fillRect(cursorX, capRailTopY, panelW, lowSideGndY - capRailTopY);
                ctx.strokeStyle = 'rgba(241,90,41,0.30)';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(cursorX, capRailTopY, panelW, lowSideGndY - capRailTopY);
                ctx.restore();
              }
            }

            cursorX += panelW;
          }
        }

        // ── Ground gradient band ──
        const groundBandTop = groundY;
        const groundBandH = (ch / this.profileZoom) - groundBandTop + 100;
        if (groundBandH > 0) {
          const grdGround = ctx.createLinearGradient(0, groundBandTop, 0, groundBandTop + groundBandH);
          grdGround.addColorStop(0, 'rgba(74, 222, 128, 0.15)');
          grdGround.addColorStop(0.12, 'rgba(74, 222, 128, 0.06)');
          grdGround.addColorStop(0.4, 'rgba(146,64,14,0.05)');
          grdGround.addColorStop(1, 'rgba(146,64,14,0.1)');
          ctx.fillStyle = grdGround;
          ctx.fillRect(originX - 30, groundBandTop, fencePixelW + 60, groundBandH);
        }

        // ── Slope line (variable point-based ground profile) ──
        {
          const slopePoints = (run.slope && run.slope.points) || [];
          const slopeHandleR = 12;
          const runLengthM = run.length || 0;
          const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

          // Map slope points to world coordinates
          this._slopePointPositions = [];
          const slopeWorldPoints = [];
          for (let si = 0; si < slopePoints.length; si++) {
            const pt = slopePoints[si];
            const frac = runLengthM > 0 ? pt.distanceM / runLengthM : 0;
            const wx = originX + frac * fencePixelW;
            const wy = groundY - pt.heightMm * scale;
            slopeWorldPoints.push({ x: wx, y: wy });
            this._slopePointPositions.push({ x: wx, y: wy, pointIdx: si });
          }

          if (slopeWorldPoints.length >= 2) {
            // Draw slope line (2px solid earth brown)
            ctx.save();
            ctx.strokeStyle = '#8B7355';
            ctx.lineWidth = 2 / this.profileZoom;
            ctx.beginPath();
            ctx.moveTo(slopeWorldPoints[0].x, slopeWorldPoints[0].y);
            for (let si = 1; si < slopeWorldPoints.length; si++) {
              ctx.lineTo(slopeWorldPoints[si].x, slopeWorldPoints[si].y);
            }
            ctx.stroke();

            // 4px green grass strip on top of slope line
            ctx.strokeStyle = '#5B8C3E';
            ctx.lineWidth = 4 / this.profileZoom;
            ctx.beginPath();
            ctx.moveTo(slopeWorldPoints[0].x, slopeWorldPoints[0].y);
            for (let si = 1; si < slopeWorldPoints.length; si++) {
              ctx.lineTo(slopeWorldPoints[si].x, slopeWorldPoints[si].y);
            }
            ctx.stroke();
            ctx.restore();
          }

          // Draw labelled circles at each slope point — advanced mode only
          const slopeIsAdvanced = run.slope && run.slope.mode === 'advanced';
          if (slopeIsAdvanced) {
            for (let si = 0; si < slopeWorldPoints.length; si++) {
              const sp = slopeWorldPoints[si];
              const isHovered = this._slopePointHover === si;
              const isDragged = this._slopePointDrag && this._slopePointDrag.active && this._slopePointDrag.pointIdx === si;
              const letter = si < letters.length ? letters[si] : '?';

              ctx.beginPath();
              ctx.arc(sp.x, sp.y, slopeHandleR / this.profileZoom, 0, Math.PI * 2);
              ctx.fillStyle = isDragged ? '#6B5335' : (isHovered ? '#A0895F' : '#8B7355');
              ctx.fill();
              ctx.strokeStyle = '#FFFFFF';
              ctx.lineWidth = 2 / this.profileZoom;
              ctx.stroke();

              const labelSize = Math.max(7, Math.min(11, 9 / this.profileZoom));
              ctx.fillStyle = '#FFFFFF';
              ctx.font = `700 ${labelSize}px Helvetica Neue, Helvetica, Arial, sans-serif`;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(letter, sp.x, sp.y);

              if (isDragged) {
                ctx.save();
                ctx.setLineDash([6 / this.profileZoom, 4 / this.profileZoom]);
                ctx.strokeStyle = 'rgba(139,115,85,0.5)';
                ctx.lineWidth = 1 / this.profileZoom;
                ctx.beginPath();
                ctx.moveTo(originX - 20, sp.y);
                ctx.lineTo(originX + fencePixelW + 20, sp.y);
                ctx.stroke();
                ctx.restore();
              }
            }
          }
        }

        // ── Retaining draggable handles (per-panel, orange) ──
        {
          const isTouchDevice = 'ontouchstart' in window;
          const showHandles = isTouchDevice || this._soilHandleProximity || (this._soilHandleDrag && this._soilHandleDrag.active);
          const handleR = isTouchDevice ? 12 : 8;
          const epw = postWidthMm * scale;
          const epanelW = panelWidthMm * scale;

          // Calculate handle positions (world coords) at each panel centre
          this._soilHandlePositions = [];
          let hx = originX;

          for (let hi = 0; hi < panelCount; hi++) {
            const panel = run.panels[hi];
            const totalRet = panelTotalRetaining(panel);

            // Panel X start = after post hi
            const panelStartX = hx + epw;
            const panelCentreX = panelStartX + epanelW / 2;

            // Handle Y = bottom rail position (top of plinths / high-side ground)
            const lowSideOff = Math.max(groundOffsets[hi], groundOffsets[hi + 1]);
            const lowSideGndY = groundY + lowSideOff * scale;
            const highSideGndY = lowSideGndY - totalRet * scale;
            const handleY = highSideGndY;

            this._soilHandlePositions.push({ x: panelCentreX, y: handleY, panelIdx: hi });

            // Draw handle if visible
            if (showHandles) {
              const isHovered = this._soilHandleHover === hi;
              const isDragged = this._soilHandleDrag && this._soilHandleDrag.active && this._soilHandleDrag.panelIdx === hi;

              ctx.beginPath();
              ctx.arc(panelCentreX, handleY, handleR / this.profileZoom, 0, Math.PI * 2);
              ctx.fillStyle = isDragged ? '#C44520' : (isHovered ? '#F47A52' : '#F15A29');
              ctx.fill();
              ctx.strokeStyle = '#FFFFFF';
              ctx.lineWidth = 2 / this.profileZoom;
              ctx.stroke();

              // If dragging this handle, draw a horizontal guide line
              if (isDragged) {
                ctx.save();
                ctx.setLineDash([6 / this.profileZoom, 4 / this.profileZoom]);
                ctx.strokeStyle = 'rgba(241,90,41,0.4)';
                ctx.lineWidth = 1 / this.profileZoom;
                ctx.beginPath();
                ctx.moveTo(originX - 20, handleY);
                ctx.lineTo(originX + fencePixelW + 20, handleY);
                ctx.stroke();
                ctx.restore();
              }
            }

            // Advance cursor: past this post + this panel
            hx += epw + epanelW;
          }
        }

        ctx.restore();
      },

      // ── Job Settings (legacy — now integrated into scope sections) ──

      // ── Compliance checks ──
      _runComplianceChecks() {
        const errors = []; // STOP errors
        const warnings = [];
        this.job.runs.forEach(run => {
          run.panels.forEach((panel, idx) => {
            const slopePl = panel.slopePlinths || 0;
            const manualPl = panel.retaining / 150;
            const totalPl = slopePl + manualPl;
            if (totalPl > 4) {
              errors.push(`${run.name} P${idx+1}: ${totalPl} plinths exceeds maximum 4. Requires engineered retaining solution.`);
            }
            const totalRet = Math.min(4, totalPl) * 150;
            if (totalRet > 500) {
              warnings.push(`${run.name} P${idx+1}: Retaining ${totalRet}mm > 500mm requires Building Permit + Engineer Cert in WA.`);
            }
          });
        });
        return { errors, warnings };
      },

      // ── Site Plan Diagram (canvas-based, colour-coded by neighbour) ──
      // Aerial site plan: bird's-eye view looking down
      // Orientation: Front = bottom (street side), Rear = top,
      // LHS (when facing house from street) = RIGHT on aerial,
      // RHS (when facing house from street) = LEFT on aerial
      _generateSitePlanDataUrl() {
        const job = this.job;
        const runs = job.runs || [];
        const nbs = job.neighbours || [];
        if (!runs.length) return null;

        const c = document.createElement('canvas');
        const W = 600, H = 480;
        c.width = W; c.height = H;
        const ctx = c.getContext('2d');

        // Background
        ctx.fillStyle = '#F8F6F3';
        ctx.fillRect(0, 0, W, H);

        // Property rectangle
        const propX = 120, propY = 50, propW = 360, propH = 300;
        ctx.strokeStyle = '#293C46';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.strokeRect(propX, propY, propW, propH);
        ctx.setLineDash([]);

        // House icon (small rectangle in centre)
        const houseW = 120, houseH = 70;
        const houseX = propX + (propW - houseW) / 2;
        const houseY = propY + (propH - houseH) / 2 - 10;
        ctx.fillStyle = '#293C46';
        ctx.globalAlpha = 0.08;
        ctx.fillRect(houseX, houseY, houseW, houseH);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = '#293C46';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([]);
        ctx.strokeRect(houseX, houseY, houseW, houseH);

        // House label
        ctx.fillStyle = '#293C46';
        ctx.font = 'bold 13px Helvetica Neue, Helvetica, Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('HOUSE', houseX + houseW / 2, houseY + houseH / 2 + 5);

        // Client name below house
        ctx.font = '10px Helvetica Neue, Helvetica, Arial, sans-serif';
        ctx.fillStyle = '#4C6A7C';
        const clientName = [job.clientFirstName, job.clientLastName].filter(Boolean).join(' ') || '';
        if (clientName) ctx.fillText(clientName, propX + propW / 2, houseY + houseH + 16);

        // Street label at bottom
        ctx.fillStyle = '#8FA4B2';
        ctx.font = 'bold 11px Helvetica Neue, Helvetica, Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('— STREET —', propX + propW / 2, propY + propH + 34);

        // Compass
        ctx.fillStyle = '#4C6A7C';
        ctx.font = 'bold 10px Helvetica Neue, Helvetica, Arial, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('AERIAL VIEW', 10, 18);

        // Neighbour colour palette
        const nbColours = ['#F15A29', '#2196F3', '#4CAF50', '#9C27B0'];
        const clientColour = '#8FA4B2';

        // Aerial orientation: LHS when facing house = RIGHT on plan, RHS = LEFT
        const sideMap = {
          'Front': { x1: propX, y1: propY + propH, x2: propX + propW, y2: propY + propH,
                     labelX: propX + propW / 2, labelY: propY + propH + 16,
                     nbLabelX: propX + propW / 2, nbLabelY: propY + propH + 48 },
          'Rear':  { x1: propX, y1: propY, x2: propX + propW, y2: propY,
                     labelX: propX + propW / 2, labelY: propY - 10,
                     nbLabelX: propX + propW / 2, nbLabelY: propY - 24 },
          'LHS':   { x1: propX + propW, y1: propY, x2: propX + propW, y2: propY + propH,
                     labelX: propX + propW + 14, labelY: propY + propH / 2, rotate: true,
                     nbLabelX: propX + propW + 30, nbLabelY: propY + propH / 2, nbRotate: true },
          'Left':  { x1: propX + propW, y1: propY, x2: propX + propW, y2: propY + propH,
                     labelX: propX + propW + 14, labelY: propY + propH / 2, rotate: true,
                     nbLabelX: propX + propW + 30, nbLabelY: propY + propH / 2, nbRotate: true },
          'RHS':   { x1: propX, y1: propY, x2: propX, y2: propY + propH,
                     labelX: propX - 14, labelY: propY + propH / 2, rotate: true,
                     nbLabelX: propX - 30, nbLabelY: propY + propH / 2, nbRotate: true },
          'Right': { x1: propX, y1: propY, x2: propX, y2: propY + propH,
                     labelX: propX - 14, labelY: propY + propH / 2, rotate: true,
                     nbLabelX: propX - 30, nbLabelY: propY + propH / 2, nbRotate: true },
        };

        // Track legend entries
        const legend = [];
        const legendSeen = {};

        // Draw each run as a coloured line segment
        runs.forEach(run => {
          const side = sideMap[run.name];
          if (!side) return;

          // Determine colour + neighbour name
          let colour = clientColour;
          let legendLabel = 'Client';
          let nbName = '';
          if (run.neighbourId) {
            const nbIdx = nbs.findIndex(n => n.id === run.neighbourId);
            if (nbIdx >= 0) {
              colour = nbColours[nbIdx % nbColours.length];
              nbName = [nbs[nbIdx].firstName, nbs[nbIdx].lastName].filter(Boolean).join(' ') || 'Neighbour ' + (nbIdx + 1);
              legendLabel = nbName;
            }
          }

          // Draw thick coloured line on boundary
          ctx.strokeStyle = colour;
          ctx.lineWidth = 6;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(side.x1, side.y1);
          ctx.lineTo(side.x2, side.y2);
          ctx.stroke();

          // Run label (side name + length)
          ctx.fillStyle = colour;
          ctx.font = 'bold 10px Helvetica Neue, Helvetica, Arial, sans-serif';
          ctx.textAlign = 'center';
          const runLabel = run.name + (run.length ? ' · ' + run.length + 'm' : '');
          if (side.rotate) {
            ctx.save();
            ctx.translate(side.labelX, side.labelY);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText(runLabel, 0, 0);
            ctx.restore();
          } else {
            ctx.fillText(runLabel, side.labelX, side.labelY);
          }

          // Neighbour name label (outside boundary)
          if (nbName) {
            ctx.fillStyle = colour;
            ctx.font = '9px Helvetica Neue, Helvetica, Arial, sans-serif';
            if (side.nbRotate) {
              ctx.save();
              ctx.translate(side.nbLabelX, side.nbLabelY);
              ctx.rotate(-Math.PI / 2);
              ctx.fillText(nbName, 0, 0);
              ctx.restore();
            } else {
              ctx.fillText(nbName, side.nbLabelX, side.nbLabelY);
            }
          }

          // Track for legend
          if (!legendSeen[legendLabel]) {
            legendSeen[legendLabel] = true;
            legend.push({ label: legendLabel, colour });
          }
        });

        // Legend (bottom-left)
        if (legend.length > 0) {
          let lx = 10, ly = H - 10 - legend.length * 16;
          ctx.font = 'bold 10px Helvetica Neue, Helvetica, Arial, sans-serif';
          ctx.fillStyle = '#293C46';
          ctx.textAlign = 'left';
          ctx.fillText('LEGEND', lx, ly);
          ly += 14;
          ctx.font = '10px Helvetica Neue, Helvetica, Arial, sans-serif';
          legend.forEach(l => {
            ctx.fillStyle = l.colour;
            ctx.fillRect(lx, ly - 8, 10, 10);
            ctx.fillStyle = '#293C46';
            ctx.fillText(l.label, lx + 14, ly + 1);
            ly += 16;
          });
        }

        return c.toDataURL('image/png');
      },

      // ── Collect all data for outputs ──
      _collectOutputData() {
        const job = this.job;
        const rem = job.removal || {};
        const q = job.quote || {};
        const js = {
          access: rem.access || 'easy',
          urgency: q.urgency || 'standard',
          delivery: q.deliveryFee != null ? q.deliveryFee : 200,
          removeHardie: rem.existingFenceType === 'hardie',
          removeHardieQty: rem.existingFenceType === 'hardie' ? Math.ceil(rem.existingFenceLength || 0) : 0,
          removeTimber: rem.existingFenceType === 'timber' || rem.existingFenceType === 'lap',
          removeTimberQty: (rem.existingFenceType === 'timber' || rem.existingFenceType === 'lap') ? (rem.existingFenceLength || 0) : 0,
          removeColorbond: rem.existingFenceType === 'colourbond',
          removeColorbondQty: rem.existingFenceType === 'colourbond' ? (rem.existingFenceLength || 0) : 0,
          removeAsbestos: rem.existingFenceType === 'asbestos',
          removeAsbestosQty: rem.existingFenceType === 'asbestos' ? (rem.asbestosSheetCount != null ? rem.asbestosSheetCount : Math.ceil(rem.existingFenceLength || 0)) : 0,
          vegClear: rem.vegetation,
          groundFinish: q.groundFinish || 'none',
          custom: (q.customLineItems || []).map(c => ({ desc: c.desc || '', qty: c.qty || 0, unit: c.unit || '', price: c.price || 0 })),
          notes: job.siteNotes || '',
          pedGate: false, pedGateQty: 0,
          dblGate: false, dblGateQty: 0,
        };
        // Aggregate removalExtras into the same qty totals
        (rem.removalExtras || []).forEach(ex => {
          const t = (ex.fenceType || '').toLowerCase();
          const len = parseFloat(ex.length) || 0;
          if (!t || len <= 0) return;
          if (t === 'hardie') { js.removeHardie = true; js.removeHardieQty += Math.ceil(len); }
          else if (t === 'timber' || t === 'lap') { js.removeTimber = true; js.removeTimberQty += len; }
          else if (t === 'colourbond') { js.removeColorbond = true; js.removeColorbondQty += len; }
          else if (t === 'asbestos') { js.removeAsbestos = true; js.removeAsbestosQty += Math.ceil(len); }
        });
        const supplier = SUPPLIER_PROFILES[job.supplier] || SUPPLIER_PROFILES.RNR;
        const panelWidthMm = supplier.panelWidth;
        const panelWidthM = panelWidthMm / 1000;

        // Unit prices (needed inside per-run loop for run subtotals)
        const pricePerMetre = job.pricePerMetre || 125;
        const plinthSell = q.plinthPrice || 80;
        const patioSell = q.patioTubePrice || 75;

        let totalMetres = 0;
        let totalPanels = 0;
        let totalPosts = 0;
        let totalPlinths = 0;
        let totalPatioTubes = 0;
        const postGroups = {}; // { "1800_2400": { sheetH, postH, count } }
        const runDetails = [];

        job.runs.forEach(run => {
          const panelCount = run.panels.length;
          const postCount = panelCount + 1;
          totalMetres += run.length || 0;
          totalPanels += panelCount;
          totalPosts += postCount;

          let runPlinths = 0;
          let panelsWithPatio = 0;
          const panelDetails = [];

          // For each panel, compute derived values
          run.panels.forEach((panel, idx) => {
            const slopePl = panel.slopePlinths || 0;
            const manualPl = panel.retaining / 150;
            const totalPl = Math.min(4, slopePl + manualPl);
            const totalRet = totalPl * 150;
            const plinths = totalPl;
            runPlinths += plinths;

            const lookup = lookupPost(panel.height, totalRet);
            const postH = lookup.post;
            const patio = plinths >= 3 && plinths <= 4;
            if (patio) panelsWithPatio++;

            // Group panels by sheet height + post height for material order
            const key = `${panel.height}_${postH}`;
            if (!postGroups[key]) postGroups[key] = { sheetH: panel.height, postH, count: 0 };
            postGroups[key].count++;

            panelDetails.push({
              num: idx + 1,
              height: panel.height,
              retaining: totalRet,
              plinths,
              totalH: panel.height + totalRet,
              postH,
              patio,
              stepMm: panel.stepMm || 0
            });
          });

          const patioTubes = panelsWithPatio > 0 ? panelsWithPatio + 1 : 0;
          totalPlinths += runPlinths;
          totalPatioTubes += patioTubes;

          // Check if run has any retaining at all
          const hasRetaining = run.panels.some(p => {
            const sp = p.slopePlinths || 0;
            const mp = p.retaining / 150;
            return (sp + mp) > 0;
          });

          // Per-run cost subtotal (fencing + plinths + patio tubes for this run)
          const runFencing = (run.length || 0) * pricePerMetre;
          const runPlinthsCost = runPlinths * plinthSell;
          const runPatioCost = patioTubes * patioSell;
          const runSubtotal = runFencing + runPlinthsCost + runPatioCost;

          runDetails.push({
            name: run.name,
            length: run.length || 0,
            neighbourId: run.neighbourId || null,
            panelCount,
            postCount,
            plinths: runPlinths,
            patioTubes,
            panelsWithPatio,
            hasRetaining,
            panels: panelDetails,
            runSubtotal,
            runFencing,
            runPlinthsCost,
            runPatioCost
          });
        });

        // Corner post sharing: subtract (runs - 1) for connected runs
        if (job.runs.length > 1) totalPosts -= (job.runs.length - 1);

        // Gate posts
        let gatePosts = 0;
        const gateDetails = [];
        (job.gates || []).forEach(g => {
          const gp = g.type === 'double' ? 4 : 2;
          gatePosts += gp;
          gateDetails.push({ type: g.type, width: g.width, posts: gp });
        });

        // Concrete: (totalPosts + gatePosts) * 2 * 1.1, round up to even
        const allPosts = totalPosts + gatePosts;
        const rawBags = allPosts * 2 * 1.1;
        const concreteBags = Math.ceil(rawBags / 2) * 2;

        // Tek screw boxes: 1 per 4 panels, min 1
        const tekBoxes = totalPanels > 0 ? Math.max(1, Math.ceil(totalPanels / 4)) : 0;

        // ── Pricing ──
        // (pricePerMetre, plinthSell, patioSell declared above runs loop)

        // Fencing line item
        const fencingTotal = totalMetres * pricePerMetre;

        // Plinths
        const plinthsTotal = totalPlinths * plinthSell;

        // Patio tubes
        const patioTotal = totalPatioTubes * patioSell;

        // Gates
        let gatesTotal = 0;
        const gateLineItems = [];
        (job.gates || []).forEach(g => {
          if (g.type === 'pedestrian') {
            const pedSell = 1100;
            gatesTotal += pedSell;
            gateLineItems.push({ desc: `Pedestrian gate ${g.width}mm`, qty: 1, total: pedSell });
          } else if (g.type === 'double') {
            const dblSell = 2400;
            gatesTotal += dblSell;
            gateLineItems.push({ desc: `Double swing gate ${g.width}mm`, qty: 1, total: dblSell });
          }
        });

        // Removal items
        let removalTotal = 0;
        const removalItems = [];
        if (js.removeHardie && js.removeHardieQty > 0) {
          const hardiePerM = q.hardiePrice || 30;
          const t = js.removeHardieQty * hardiePerM;
          removalTotal += t;
          removalItems.push({ desc: 'Remove Hardie fence', qty: js.removeHardieQty, unit: 'm', unitPrice: hardiePerM, costPrice: COST_PRICES.removeHardie, total: t });
        }
        if (js.removeTimber && js.removeTimberQty > 0) {
          const timberPerM = q.timberPrice || 45;
          const t = js.removeTimberQty * timberPerM;
          removalTotal += t;
          removalItems.push({ desc: 'Remove timber/lap fence', qty: js.removeTimberQty, unit: 'm', unitPrice: timberPerM, costPrice: COST_PRICES.removeTimberLap, total: t });
        }
        if (js.removeColorbond && js.removeColorbondQty > 0) {
          const cbPerM = q.colorbondRemovalPrice || 30;
          const t = js.removeColorbondQty * cbPerM;
          removalTotal += t;
          removalItems.push({ desc: 'Remove Colorbond fence', qty: js.removeColorbondQty, unit: 'm', unitPrice: cbPerM, costPrice: COST_PRICES.removeColorbond, total: t });
        }
        if (js.removeAsbestos && js.removeAsbestosQty > 0) {
          const asbestosPerM = q.asbestosPrice || 90;
          const t = js.removeAsbestosQty * asbestosPerM;
          removalTotal += t;
          removalItems.push({ desc: 'Remove asbestos fence (licenced)', qty: js.removeAsbestosQty, unit: 'm', unitPrice: asbestosPerM, costPrice: COST_PRICES.removeAsbestos, total: t });
        }
        // Asbestos removal certificate (auto-included when asbestos selected)
        if (js.removeAsbestos && rem.asbestosCert !== false) {
          const certFee = q.asbestosCertFee || 300;
          removalTotal += certFee;
          removalItems.push({ desc: 'Asbestos removal certificate', qty: 1, unit: 'job', total: certFee });
        }
        if (js.vegClear) {
          const vegPrice = q.vegClearPrice || 215;
          removalTotal += vegPrice;
          removalItems.push({ desc: 'Vegetation / site clear', qty: 1, unit: 'lot', total: vegPrice });
        }

        // Ground finish
        let groundFinishTotal = 0;
        let groundFinishDesc = '';
        if (js.groundFinish && js.groundFinish !== 'none') {
          const rates = { mulch: COST_PRICES.groundMulch, stones: COST_PRICES.groundStones, turf: COST_PRICES.groundTurf };
          const costPerM = rates[js.groundFinish] || 0;
          const sellPerM = costPerM / (1 - MARGIN);
          groundFinishTotal = totalMetres * sellPerM;
          groundFinishDesc = js.groundFinish.charAt(0).toUpperCase() + js.groundFinish.slice(1) + ' ground finish';
        }

        // Custom items
        let customTotal = 0;
        const customItems = [];
        (js.custom || []).forEach(c => {
          if (c.desc && c.qty > 0 && c.price > 0) {
            const t = c.qty * c.price;
            customTotal += t;
            customItems.push({ desc: c.desc, qty: c.qty, unit: c.unit, unitPrice: c.price, total: t });
          }
        });

        // Scope add-ons
        const addons = q.addons || {};
        let addonsTotal = 0;
        const addonItems = [];
        const addonLabels = { demo: 'Demolition', skipBin: 'Skip bin hire', permit: 'Council permit', soakwell: 'Soakwell installation', electrical: 'Electrical relocation', crane: 'Crane hire' };
        Object.entries(addonLabels).forEach(([key, label]) => {
          const val = addons[key] || 0;
          if (val > 0) {
            addonsTotal += val;
            addonItems.push({ desc: label, total: val });
          }
        });

        // Access surcharge (on labour only)
        const labourBase = totalMetres * COST_PRICES.labourPerMetre;
        const accessRate = ACCESS_SURCHARGE[js.access] || 0;
        const accessSurcharge = labourBase * accessRate;

        // Delivery
        const deliveryFee = js.delivery || 200;

        // Subtotal before urgency
        const subtotalBeforeUrgency = fencingTotal + plinthsTotal + patioTotal + gatesTotal + removalTotal + groundFinishTotal + addonsTotal + customTotal + accessSurcharge + deliveryFee;

        // Urgency surcharge (on subtotal)
        const urgencyRate = URGENCY_SURCHARGE[js.urgency] || 0;
        const urgencySurcharge = subtotalBeforeUrgency * urgencyRate;

        const subtotal = subtotalBeforeUrgency + urgencySurcharge;
        const gst = subtotal * 0.10;
        const grandTotal = subtotal + gst;

        // ── Internal cost breakdown ──
        let internalCost = 0;
        // Panel costs
        Object.values(postGroups).forEach(g => {
          let unitCost = COST_PRICES.panelKit1800_2400; // default
          if (g.sheetH === 1200) unitCost = COST_PRICES.panelKit1200_2400;
          else if (g.sheetH === 1500) unitCost = COST_PRICES.panelKit1500_2400;
          else if (g.sheetH === 1800) {
            if (g.postH <= 2400) unitCost = COST_PRICES.panelKit1800_2400;
            else if (g.postH <= 2700) unitCost = COST_PRICES.panelKit1800_2700;
            else unitCost = COST_PRICES.panelKit1800_3000;
          } else if (g.sheetH === 2100) {
            if (g.postH <= 2700) unitCost = COST_PRICES.panelKit2100_2700;
            else unitCost = COST_PRICES.panelKit2100_3000;
          }
          internalCost += g.count * unitCost;
        });
        internalCost += totalPlinths * COST_PRICES.plinth;
        internalCost += totalPatioTubes * COST_PRICES.patioTube;
        internalCost += concreteBags * COST_PRICES.concrete;
        internalCost += tekBoxes * COST_PRICES.tekScrewBox;
        (job.gates || []).forEach(g => {
          if (g.type === 'pedestrian') internalCost += COST_PRICES.gateKitPedestrian + 2 * COST_PRICES.gatePost90x90;
          else if (g.type === 'double') internalCost += COST_PRICES.gateKitDouble + 4 * COST_PRICES.gatePost90x90;
        });
        // Removal costs
        let internalRemovalCost = 0;
        removalItems.forEach(r => {
          if (r.costPrice) internalRemovalCost += r.qty * r.costPrice;
        });
        internalCost += internalRemovalCost;
        // Delivery cost (actual cost to us, not the sell price charged to client)
        internalCost += COST_PRICES.delivery;

        const plinthLabourCost = totalPlinths * COST_PRICES.plinthInstall;
        let gateLabourCost = 0;
        (job.gates || []).forEach(g => {
          if (g.type === 'pedestrian') gateLabourCost += COST_PRICES.gateLabourPedestrian;
          else if (g.type === 'double') gateLabourCost += COST_PRICES.gateLabourDouble;
        });
        const labourCost = labourBase + plinthLabourCost + gateLabourCost;
        const internalLabour = labourCost * (1 + accessRate);
        const materialMargin = subtotal - gst - internalCost - internalLabour;

        // ── Per-neighbour cost calculation (from assigned runs) ──
        const neighbourCosts = {};
        const hasRunAssignments = runDetails.some(r => r.neighbourId);
        if (hasRunAssignments && (job.neighbours || []).length > 0) {
          // Sum direct run costs per neighbour
          const totalRunSubtotals = runDetails.reduce((s, r) => s + r.runSubtotal, 0);
          const sharedCosts = removalTotal + gatesTotal + deliveryFee + accessSurcharge + urgencySurcharge + groundFinishTotal + addonsTotal + customTotal;

          runDetails.forEach(rd => {
            const key = rd.neighbourId || '__client__';
            if (!neighbourCosts[key]) neighbourCosts[key] = { directCost: 0, runs: [], runNames: [] };
            neighbourCosts[key].directCost += rd.runSubtotal;
            neighbourCosts[key].runs.push(rd);
            neighbourCosts[key].runNames.push(rd.name);
          });

          // Split shared costs proportionally by each party's direct run cost
          Object.keys(neighbourCosts).forEach(key => {
            const nc = neighbourCosts[key];
            const proportion = totalRunSubtotals > 0 ? nc.directCost / totalRunSubtotals : 0;
            nc.sharedCost = sharedCosts * proportion;
            nc.totalExGst = nc.directCost + nc.sharedCost;
            nc.gst = nc.totalExGst * 0.10;
            nc.totalIncGst = nc.totalExGst + nc.gst;
          });
        }

        return {
          job, js, supplier: job.supplier, profile: job.profile, colour: job.colour,
          panelWidthMm, panelWidthM, pricePerMetre,
          totalMetres, totalPanels, totalPosts, totalPlinths, totalPatioTubes,
          postGroups, runDetails, gatePosts, gateDetails, gateLineItems,
          concreteBags, tekBoxes, allPosts,
          fencingTotal, plinthsTotal, plinthSell, patioTotal, patioSell,
          gatesTotal, removalTotal, removalItems, internalRemovalCost,
          groundFinishTotal, groundFinishDesc, customTotal, customItems,
          addonsTotal, addonItems,
          accessSurcharge, accessRate, deliveryFee,
          urgencySurcharge, urgencyRate,
          subtotal, gst, grandTotal,
          internalCost, internalLabour, materialMargin,
          neighbourCosts, hasRunAssignments
        };
      },

        if (d.totalPatioTubes > 0) parts.push('with structural bracing where required');

            return qty + g.desc;
          });
          parts.push('Gates: ' + gateDescs.join(', '));

        const rem = d.job.removal || {};

        if (rem.existingFenceType && rem.existingFenceType !== 'none') {

          let remDesc = `${ftype}`;
          if (rem.existingFenceLength > 0) remDesc += ` (approx. ${rem.existingFenceLength}m)`;
          remTypes.push(remDesc);

        return `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>${this._outputCSS()}</style></head><body>

            ${d.job.sitePlanImage ? '<p style="font-size:11px;color:#4C6A7C;margin-top:4px;">Orange lines indicate fence locations</p>' : ''}

          <div class="section">

              <div><span class="label">Tek screws:</span> <span class="value">${(d.job._materialOverrides && d.job._materialOverrides.tekBoxes != null) ? d.job._materialOverrides.tekBoxes + ' boxes <span style="color:#F59E0B;font-weight:700;">\u26A0 MANUAL (calc: ' + d.tekBoxes + ')</span>' : d.tekBoxes + ' boxes'}</span></div>

      // ── Toast notifications ──
      showToast(msg, type = 'info') {
        const c = document.getElementById('toastContainer');
        if (!c) return;
        const t = document.createElement('div');
        t.className = 'toast ' + type;
        t.textContent = msg;
        c.appendChild(t);
        setTimeout(() => { if (t.parentNode) t.remove(); }, 3600);

      // ── Generate Quote PDF (jsPDF) ──

      async generateQuotePDF() {
        const missing = this._validateRequired();
        if (missing.length > 0) {
          this.showToast('Missing required fields — run QA Check first', 'error');
          return;
        }

        // Ensure job exists in Supabase before any quote PDF is generated
        if (window._swIntegration) {
          var sync = window._swIntegration;
          if (!sync.getJobId()) {
            this.showToast('Syncing...', 'info');
            var result = await sync.ensureJobSynced();
            if (!result.ok) {
              this.showToast('You need to be online to send quotes — log in and try again', 'error');
              if (result.reason === 'login' && window.SECUREWORKS_CLOUD) window.SECUREWORKS_CLOUD.ui.showLoginModal();
              return;
            }
          }
        }
        this.job.client = [this.job.clientFirstName, this.job.clientLastName].filter(Boolean).join(' ');
        const d = this._collectOutputData();
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: 'mm', format: 'a4' });
        const pw = 210, ph = 297, mx = 20;
        let y = 20;
        const scopeDesc = this._buildQuoteScopeDesc(d);
        const colourHex = this._getColourHex(d.colour);
        const screenshot3D = this._get3DScreenshotDataUrl();

        // Header bar
        doc.setFillColor(41, 60, 70);
        doc.rect(0, 0, pw, 32, 'F');
        doc.setTextColor(241, 90, 41);
        doc.setFontSize(16);
        doc.setFont('helvetica', 'bold');
        doc.text('SECUREWORKS WA PTY LTD', pw / 2, 14, { align: 'center' });
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(9);
        doc.setFont('helvetica', 'normal');
        doc.text('ABN 64 689 223 416  |  fencing@secureworkswa.com.au  |  +61 489 267 772', pw / 2, 22, { align: 'center' });
        doc.setFontSize(12);
        doc.setFont('helvetica', 'bold');
        var quoteNumLabel = window._currentQuoteNumber ? 'CLIENT QUOTE  —  ' + window._currentQuoteNumber : 'CLIENT QUOTE';
        doc.text(quoteNumLabel, pw / 2, 29, { align: 'center' });
        y = 40;

        // Client details
        doc.setTextColor(41, 60, 70);
        doc.setFontSize(10);
        const date = d.job.date || new Date().toISOString().slice(0, 10);
        const validUntil = new Date(new Date(date).getTime() + 30 * 86400000).toISOString().slice(0, 10);
        const info = [
          ['Client', d.job.client || '\u2014'], ['Job Ref', d.job.ref || '\u2014'],
          ['Address', d.job.address || '\u2014'], ['Date', date],
          ['Phone', d.job.phone || '\u2014'], ['Valid Until', validUntil],
          ['Email', d.job.email || '\u2014']
        ];
        info.forEach((row, i) => {
          const col = i % 2;
          const ry = y + Math.floor(i / 2) * 7;
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(8);
          doc.setTextColor(76, 106, 124);
          doc.text(row[0].toUpperCase(), mx + col * 85, ry);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(10);
          doc.setTextColor(41, 60, 70);
          doc.text(String(row[1]), mx + col * 85 + 30, ry);
        });
        y += Math.ceil(info.length / 2) * 7 + 6;

        // 3D Screenshot
        if (screenshot3D) {
          try {
            const imgW = pw - mx * 2;
            const imgH = imgW * 0.5; // 2:1 aspect ratio
            if (y + imgH + 10 > ph - 40) { doc.addPage(); y = 20; }
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(11);
            doc.setTextColor(41, 60, 70);
            doc.text('YOUR FENCE', mx, y);
            doc.setDrawColor(76, 106, 124);
            doc.line(mx, y + 1, pw - mx, y + 1);
            y += 4;
            doc.addImage(screenshot3D, 'PNG', mx, y, imgW, imgH);

        }

        // Site Plan

          try {

        doc.rect(mx, y - 3, pw - mx * 2, 6, 'F');

        doc.setFontSize(8);

        if (d.totalPlinths > 0) detailStr += ` | ${d.totalPlinths} retaining plinths`;
        if (d.gateLineItems.length > 0) detailStr += ` | ${d.gateLineItems.length} gate${d.gateLineItems.length > 1 ? 's' : ''}`;
        if (d.removalTotal > 0) detailStr += ' | Old fence removal';
        const detailLines = doc.splitTextToSize(detailStr, pw - mx * 2 - 4);

      // ── Generate Material Order (categorised) ──
      generateMaterialOrder() {
        const missing = this._validateRequired();
        if (missing.length > 0) {
          this.showToast('Missing required fields — run QA Check first', 'error');
          return;
        }
        this.job.client = [this.job.clientFirstName, this.job.clientLastName].filter(Boolean).join(' ');
        const d = this._collectOutputData();
        this._openOutputTab('Material Order', this._generateMaterialOrderHTML(d));
        this.showToast('Material order generated', 'success');
      },

      // ── Generate Work Order ──
      generateWorkOrder() {
        const missing = this._validateRequired();
        if (missing.length > 0) {
          this.showToast('Missing required fields — run QA Check first', 'error');
          return;
        }
        this.job.client = [this.job.clientFirstName, this.job.clientLastName].filter(Boolean).join(' ');
        const { errors, warnings } = this._runComplianceChecks();
        if (errors.length > 0) {
          this.showToast('Compliance errors — fix before generating', 'error');
          return;
        }
        const d = this._collectOutputData();
        this._openOutputTab('Work Order', this._generateWorkOrderHTML(d));
        this.showToast('Work order generated', 'success');
        // Fire-and-forget: upload 3D screenshot to job_media
        (async () => {
          try {
            var cloud = window.SECUREWORKS_CLOUD;
            var jobId = window._swIntegration ? window._swIntegration.getJobId() : null;
            if (!cloud || !jobId) return;
            var dataUrl = this._get3DScreenshotDataUrl();
            if (!dataUrl) return;
            var existing = await cloud.ghl.listMedia(jobId);
            if (existing.some(m => m.label === '3D Preview')) return;
            await cloud.ghl.uploadPhoto(jobId, dataUrl, '3D Preview', 'Auto-captured from fencing scoping tool');
            console.log('[fence] 3D preview uploaded to job_media');
          } catch (e) {
            console.log('[fence] 3D preview upload skipped:', e);
          }
        })();
      },

      // ── Validation helper ──
      _validateRequired() {
        const missing = [];
        if (!this.job.clientFirstName) missing.push('Client first name');
        if (!this.job.clientLastName) missing.push('Client last name');
        if (!this.job.address) missing.push('Site address');
        if (!this.job.phone) missing.push('Phone');
        if (!this.job.email) missing.push('Email');
        if (!this.job.runs.some(r => r.panels.length > 0)) missing.push('At least one fence run with panels');
        return missing;
      },
