      // ── Export / Import job data ──
      exportJobJSON() {
        this.job.client = [this.job.clientFirstName, this.job.clientLastName].filter(Boolean).join(' ');
        const data = JSON.parse(JSON.stringify(this.job));
        // Strip photo data URLs to keep export small
        if (data.checklist && data.checklist.photos) {
          data.checklist.photos = data.checklist.photos.map(p => ({ ...p, dataUrl: '[stripped]' }));
        }
        if (data.checklist && data.checklist.videoFile) {
          data.checklist.videoFile = '[stripped]';
        }
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const link = document.createElement('a');
        const clientName = (this.job.client || 'job').replace(/[^a-zA-Z0-9]/g, '_');
        link.download = `SecureWorks_Fence_${clientName}_${this.job.date || 'export'}.json`;
        link.href = URL.createObjectURL(blob);
        link.click();
        URL.revokeObjectURL(link.href);
        this.showToast('Job exported as JSON', 'success');
      },

      importJobJSON(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (!data.runs || !Array.isArray(data.runs)) throw new Error('Invalid fence job format');
            if (!confirm(`Import job for "${data.client || data.clientFirstName || 'Unknown'}"? This will replace current data.`)) return;
            localStorage.setItem('fenceJob', JSON.stringify(data));
            this.job = null;
            this.currentRunId = null;
            this.init();
            this.showToast('Job imported successfully', 'success');
          } catch (err) {
            this.showToast('Import failed: ' + err.message, 'error');
          }
        };
        reader.readAsText(file);
        event.target.value = ''; // reset so same file can be re-imported
      },

      // ── LocalStorage ──
      _cleanupStorage() {
        // Remove any localStorage keys that aren't ours
        var keep = ['fenceJob', 'fenceQA_verification'];
        var toRemove = [];
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i);
          if (keep.indexOf(key) === -1) toRemove.push(key);
        }
        toRemove.forEach(function(k) { localStorage.removeItem(k); });
        return toRemove.length;
      },

      _compressJobData() {
        // Reduce data size: convert PNG site plans to smaller JPEG, remove duplicate from checklist
        var changed = false;
        if (this.job.sitePlanImage && this.job.sitePlanImage.indexOf('data:image/png') === 0) {
          // Re-encode as JPEG via canvas
          try {
            var img = new Image();
            img.src = this.job.sitePlanImage;
            var c = document.createElement('canvas');
            c.width = img.naturalWidth || 800;
            c.height = img.naturalHeight || 600;
            var ctx = c.getContext('2d');
            ctx.drawImage(img, 0, 0);
            this.job.sitePlanImage = c.toDataURL('image/jpeg', 0.7);
            changed = true;
          } catch(e) { /* ignore conversion errors */ }
        }
        // Remove site plan duplicate from checklist photos (it's stored separately in sitePlanImage)
        if (this.job.checklist && this.job.checklist.photos) {
          var before = this.job.checklist.photos.length;
          this.job.checklist.photos = this.job.checklist.photos.filter(function(p) { return p.label !== 'Site Plan'; });
          if (this.job.checklist.photos.length < before) changed = true;
        }
        // Compress any remaining checklist photo data URLs that are PNG
        if (this.job.checklist && this.job.checklist.photos) {
          this.job.checklist.photos.forEach(function(p) {
            if (p.dataUrl && p.dataUrl.indexOf('data:image/png') === 0) {
              try {
                var img2 = new Image();
                img2.src = p.dataUrl;
                var c2 = document.createElement('canvas');
                c2.width = img2.naturalWidth || 400;
                c2.height = img2.naturalHeight || 300;
                var ctx2 = c2.getContext('2d');
                ctx2.drawImage(img2, 0, 0);
                p.dataUrl = c2.toDataURL('image/jpeg', 0.7);
                changed = true;
              } catch(e) { /* ignore */ }
            }
          });
        }
        return changed;
      },

      save() {
        try {
          localStorage.setItem('fenceJob', JSON.stringify(this.job));
          updateSyncDot('local');
        } catch (e) {
          if (e.name === 'QuotaExceededError' || e.code === 22) {
            // Step 1: Clean up orphaned keys
            this.showToast('Local storage full — clearing old data...', 'info');
            this._cleanupStorage();

            // Step 2: Compress images in job data
            this._compressJobData();

            // Step 3: Retry save
            try {
              localStorage.setItem('fenceJob', JSON.stringify(this.job));
              updateSyncDot('local');
              this.showToast('Storage recovered — saved successfully', 'success');
            } catch (e2) {
              if (e2.name === 'QuotaExceededError' || e2.code === 22) {
                // Step 4: Last resort — strip all photo data URLs (cloud has copies)
                if (this.job.checklist && this.job.checklist.photos) {
                  this.job.checklist.photos = this.job.checklist.photos.map(function(p) {
                    return { id: p.id, name: p.name, label: p.label, timestamp: p.timestamp, dataUrl: '' };
                  });
                }
                try {
                  localStorage.setItem('fenceJob', JSON.stringify(this.job));
                  updateSyncDot('local');
                  this.showToast('Storage full — photos cleared from local (cloud copies kept)', 'warning');
                } catch (e3) {
                  this.showToast('Storage full — save to cloud or start a new job', 'error');
                  updateSyncDot('error', 'Storage full');
                }
              } else {
                throw e2;
              }
            }
          } else {
            throw e;
          }
        }
      },

      loadFromStorage() {
        const saved = localStorage.getItem('fenceJob');
        if (saved) {
          try {
            this.job = JSON.parse(saved);
            // Migration: ensure new fields exist
            if (!this.job.gates) this.job.gates = [];
            if (this.job.gatesRequired === undefined && !('gatesRequired' in this.job)) this.job.gatesRequired = undefined;
            this.job.runs.forEach(run => {
              if (run.sheetHeight === undefined) run.sheetHeight = run.defaultHeight || 1800;
              if (run.extension === undefined || run.extension === null) run.extension = 'none';
              // Migrate to new slope.points system
              if (!run.slope || !run.slope.points) {
                const runLen = run.length || 0;
                if (run.slopeProfile && run.slopeProfile.some(v => v !== 0)) {
                  const fracs = [0, 0.25, 0.50, 0.75, 1.0];
                  const rawPts = fracs.map((f, i) => ({
                    distanceM: Math.round(f * runLen * 2) / 2,
                    heightMm: run.slopeProfile[i]
                  }));
                  const simplified = [rawPts[0]];
                  for (let j = 1; j < rawPts.length - 1; j++) {
                    const prev = simplified[simplified.length - 1];
                    const next = rawPts[rawPts.length - 1];
                    const span = next.distanceM - prev.distanceM;
                    if (span === 0) continue;
                    const t = (rawPts[j].distanceM - prev.distanceM) / span;
                    const interp = prev.heightMm + t * (next.heightMm - prev.heightMm);
                    if (Math.abs(rawPts[j].heightMm - interp) > 10) simplified.push(rawPts[j]);
                  }
                  simplified.push(rawPts[rawPts.length - 1]);
                  run.slope = { mode: 'advanced', points: simplified, simple: { direction: 'left-to-right', totalFallMm: 0, startsFrom: 'start' }, monotonic: null };
                } else if (run.slopePoints && run.slopePoints.length >= 2) {
                  run.slope = {
                    mode: 'advanced',
                    points: run.slopePoints.map(p => ({
                      distanceM: Math.round(p.x * runLen * 2) / 2,
                      heightMm: p.y || 0
                    })),
                    simple: { direction: 'left-to-right', totalFallMm: 0, startsFrom: 'start' },
                    monotonic: null
                  };
                } else {
                  run.slope = {
                    mode: 'simple',
                    points: [
                      { distanceM: 0, heightMm: 0 },
                      { distanceM: runLen, heightMm: 0 }
                    ],
                    simple: { direction: 'left-to-right', totalFallMm: 0, startsFrom: 'start' },
                    monotonic: null
                  };
                }
                delete run.slopeProfile;
                delete run.slopePoints;
              }
              // Ensure new slope fields exist on existing slope data
              if (!run.slope.mode) run.slope.mode = 'simple';
              if (!run.slope.simple) run.slope.simple = { direction: 'left-to-right', totalFallMm: 0, startsFrom: 'start' };
              if (run.slope.monotonic === undefined) run.slope.monotonic = null;
              // Migration: ensure neighbourId exists on runs
              if (run.neighbourId === undefined) run.neighbourId = null;
              run.panels.forEach(p => {
                if (p.step === undefined) p.step = p.ground || 'level';
                if (p.slopePlinths === undefined) p.slopePlinths = 0;
                if (p.stepMm === undefined) p.stepMm = 0;
                // Clamp any legacy 750mm retaining to 600mm max
                if (p.retaining > 600) p.retaining = 600;
              });
            });
            // Migration: new scope form fields
            if (!this.job.scoper) this.job.scoper = '';
            if (!this.job.siteNotes) this.job.siteNotes = '';
            if (!this.job.clientFirstName) {
              const parts = (this.job.client || '').trim().split(/\s+/);
              this.job.clientFirstName = parts[0] || '';
              this.job.clientLastName = parts.slice(1).join(' ') || '';
            }
            if (!this.job.clientLastName && this.job.clientLastName !== '') this.job.clientLastName = '';

            if (!this.job.removal) {
              const js = this.job.jobSettings || {};
              this.job.removal = {
                existingFenceLength: 0,
                existingFenceType: js.removeAsbestos ? 'asbestos' : js.removeHardie ? 'hardie' : js.removeTimber ? 'timber' : 'none',
                disposal: 'company',
                vegetation: !!js.vegClear,
                gateOnExisting: false,
                access: js.access || 'easy',
                notes: ''
              };
            }

            if (!this.job.installation) {
              this.job.installation = {
                coreDrill: false,
                coreDrillHoles: 0,
                fenceLocation: [],
                manufacturer: '',
                supplierSource: ''
              };
            }

            if (!this.job.quote) {
              const js = this.job.jobSettings || {};
              this.job.quote = {
                urgency: js.urgency || 'standard',
                deliveryFee: js.delivery || 200,
                groundFinish: js.groundFinish || 'none',
                customLineItems: (js.custom || []).filter(c => c && c.desc).length > 0
                  ? js.custom.map(c => ({ desc: c.desc || '', qty: c.qty || 0, unit: c.unit || '', price: c.price || 0 }))
                  : [{}, {}, {}]
              };
            }
            // Migration: ensure addon fields exist
            if (!this.job.quote.addons) this.job.quote.addons = {};

            if (!this.job.checklist) {
              this.job.checklist = { photosTaken: 0, photos: [], videoWalkthrough: false, finalNotes: '' };
            }
            if (this.job.phone === undefined) this.job.phone = '';
            if (this.job.email === undefined) this.job.email = '';
            if (!this.job.neighbours) this.job.neighbours = [{ id: 'nb-1', firstName: '', lastName: '', phone: '', email: '', address: '' }];
            if (this.job.neighboursRequired === undefined && !('neighboursRequired' in this.job)) this.job.neighboursRequired = undefined;
            if (!this.job.checklist.photos) this.job.checklist.photos = [];

            // Migrate gate objects
            (this.job.gates || []).forEach(g => {
              if (g.height === undefined) g.height = 1800;
              if (g.groundFinish === undefined) g.groundFinish = 'none';
              if (g.gatePosts === undefined) g.gatePosts = '';
            });

            if (this.job.runs.length > 0 && !this.currentRunId) {
              this.currentRunId = this.job.runs[0].id;
            }
          } catch (e) {
            this.job = null;
          }
        }
      }
    };

    // ════════════════════════════════════════════════════════
    // CLOUD INTEGRATION: buildPricingJson + scopeComplete
    // ════════════════════════════════════════════════════════

    // Build structured pricing JSON from _collectOutputData for dashboard/Xero
    app.buildPricingJson = function() {
      var d = this._collectOutputData();
      var lineItems = [];

      if (d.totalMetres > 0) {
        lineItems.push({
          description: d.totalPanels + '× ' + (d.profile || 'panels') + ' (' + d.totalMetres.toFixed(1) + 'm total)',
          quantity: d.totalMetres, unit: 'm',
          cost_price: null, sell_price: d.pricePerMetre,
          total_cost: null, total_sell: d.fencingTotal,
          category: 'fencing'
        });
      }
      if (d.totalPlinths > 0) {
        lineItems.push({
          description: 'Retaining plinths (150mm COLORBOND)',
          quantity: d.totalPlinths, unit: 'each',
          cost_price: COST_PRICES.plinth, sell_price: d.plinthSell,
          total_cost: d.totalPlinths * COST_PRICES.plinth, total_sell: d.plinthsTotal,
          category: 'materials'
        });
      }
      if (d.totalPatioTubes > 0) {
        lineItems.push({
          description: 'Patio tubes (76×38 RHS 3000mm)',
          quantity: d.totalPatioTubes, unit: 'each',
          cost_price: COST_PRICES.patioTube, sell_price: d.patioSell,
          total_cost: d.totalPatioTubes * COST_PRICES.patioTube, total_sell: d.patioTotal,
          category: 'materials'
        });
      }
      (d.gateLineItems || []).forEach(function(g) {
        lineItems.push({ description: g.desc, quantity: g.qty, unit: 'each', total_sell: g.total, category: 'gates' });
      });
      (d.removalItems || []).forEach(function(r) {
        lineItems.push({ description: r.desc, quantity: r.qty, unit: r.unit, total_sell: r.total, category: 'removal' });
      });
      if (d.groundFinishTotal > 0) {
        lineItems.push({ description: d.groundFinishDesc, quantity: d.totalMetres, unit: 'm', total_sell: d.groundFinishTotal, category: 'ground_finish' });
      }
      (d.addonItems || []).forEach(function(a) {
        lineItems.push({ description: a.desc, quantity: 1, unit: 'lot', total_sell: a.total, category: 'addon' });
      });
      (d.customItems || []).forEach(function(c) {
        lineItems.push({ description: c.desc, quantity: c.qty, unit: c.unit, sell_price: c.unitPrice, total_sell: c.total, category: 'custom' });
      });
      if (d.accessSurcharge > 0) {
        lineItems.push({ description: 'Access surcharge (' + (d.accessRate * 100) + '%)', quantity: 1, unit: 'lot', total_sell: d.accessSurcharge, category: 'surcharges' });
      }
      if (d.urgencySurcharge > 0) {
        lineItems.push({ description: 'Urgency surcharge (' + (d.urgencyRate * 100) + '%)', quantity: 1, unit: 'lot', total_sell: d.urgencySurcharge, category: 'surcharges' });
      }
      if (d.deliveryFee > 0) {
        lineItems.push({ description: 'Delivery', quantity: 1, unit: 'lot', cost_price: COST_PRICES.delivery, sell_price: d.deliveryFee, total_sell: d.deliveryFee, category: 'delivery' });
      }

      // Enhanced cost estimates for dashboard/reporting (includes commission)
      var materialCostEstimate = d.internalCost || 0;
      var labourCostEstimate = d.internalLabour || 0;
      var commissionCostEstimate = d.grandTotal * 0.0525;
      var totalCostEstimate = materialCostEstimate + labourCostEstimate + commissionCostEstimate;
      var margin_pct = d.subtotal > 0 ? Math.round(((d.subtotal - totalCostEstimate) / d.subtotal) * 1000) / 10 : 0;

      // Auto-generate job description from scope data
      var heights = (d.runDetails || []).map(function(r) { return r.panels && r.panels[0] ? r.panels[0].height : null; }).filter(Boolean);
      var dominantHeight = heights.length > 0 ? heights[0] : '';
      var job_description = d.totalMetres.toFixed(0) + 'm Colorbond Fencing'
        + (dominantHeight ? ' — ' + dominantHeight + 'mm' : '')
        + (d.colour ? ' ' + d.colour : '')
        + (d.job && d.job.suburb ? ' — ' + d.job.suburb : '');

      // Build deposit config (fencing default: 50%)
      var depPercent = 50;
      var depTotal = Math.round(d.grandTotal * (depPercent / 100) * 100) / 100;

      // Build neighbour splits if present
      var neighbourSplits = null;
      var j = d.job || app.job || {};
      if (j.neighboursRequired && j.neighbours && j.neighbours.length > 0) {
        var nbs = j.neighbours.filter(function(n) { return n.firstName || n.lastName; });
        if (nbs.length > 0) {
          // Per-run cost method (preferred when runs have neighbourId assigned)
          if (d.hasRunAssignments && d.neighbourCosts) {
            var clientCost = d.neighbourCosts['__client__'];
            neighbourSplits = {
              method: 'per_run',
              client_portion_ex_gst: clientCost ? Math.round(clientCost.totalExGst * 100) / 100 : d.subtotal,
              client_portion_inc_gst: clientCost ? Math.round(clientCost.totalIncGst * 100) / 100 : d.grandTotal,
              client_assigned_runs: clientCost ? clientCost.runNames : [],
              neighbours: nbs.map(function(n) {
                var nc = d.neighbourCosts[n.id];
                return {
                  id: n.id,
                  name: [n.firstName, n.lastName].filter(Boolean).join(' '),
                  phone: n.phone || '',
                  email: n.email || '',
                  address: n.address || '',
                  portion_ex_gst: nc ? Math.round(nc.totalExGst * 100) / 100 : 0,
                  portion_inc_gst: nc ? Math.round(nc.totalIncGst * 100) / 100 : 0,
                  assigned_runs: nc ? nc.runNames : [],
                  // Fallback flat % still included for backward compat
                  share_percent: n.sharePercent || Math.round(100 / (nbs.length + 1))
                };
              })
            };
          } else {
            // Fallback: flat percentage method (legacy)
            var nbTotalShare = nbs.reduce(function(s, n) { return s + (n.sharePercent || 50); }, 0);
            var clientShare = 100 - nbTotalShare;
            neighbourSplits = {
              method: 'flat_percent',
              client_share_percent: clientShare,
              client_portion_inc_gst: Math.round(d.grandTotal * (clientShare / 100) * 100) / 100,
              neighbours: nbs.map(function(n, i) {
                return {
                  id: n.id,
                  name: [n.firstName, n.lastName].filter(Boolean).join(' '),
                  phone: n.phone || '',
                  email: n.email || '',
                  address: n.address || '',
                  share_percent: n.sharePercent || 50,
                  portion_inc_gst: Math.round(d.grandTotal * ((n.sharePercent || 50) / 100) * 100) / 100
                };
              })
            };
          }
        }
      }

      return {
        source: 'scoping_tool', version: '2.1', generated_at: new Date().toISOString(),
        line_items: lineItems,
        subtotal: d.subtotal, gst: d.gst, totalExGST: d.subtotal, totalIncGST: d.grandTotal,
        totalCostEstimate: totalCostEstimate,
        materialCostEstimate: materialCostEstimate,
        labourCostEstimate: labourCostEstimate,
        commissionCostEstimate: commissionCostEstimate,
        margin_pct: margin_pct,
        job_description: job_description,
        internal: { cost: d.internalCost, labour: d.internalLabour, commission: commissionCostEstimate, margin: d.materialMargin },
        deposit: {
          percent: depPercent,
          fixed_amount: null,
          council_fees: 0,
          description: depPercent + '% deposit',
          total_deposit_inc_gst: depTotal
        },
        neighbour_splits: neighbourSplits
      };
    };

    // Validation gate for Scope Complete
    function validateForScopeComplete() {
      var j = app.job;
      var errors = [];
      if (!j.clientFirstName || j.clientFirstName.trim().length < 2) errors.push('• Client first name is required');
      if (!j.clientLastName || j.clientLastName.trim().length < 1) errors.push('• Client last name is required');
      if (!j.address || j.address.trim().length < 5) errors.push('• Site address is required');
      if (!j.email || !j.email.includes('@')) errors.push('• Valid email is required');
      if (!j.phone || j.phone.replace(/\D/g,'').length < 8) errors.push('• Phone number is required (min 8 digits)');
      if (!j.runs || j.runs.length === 0) errors.push('• At least 1 fence run required');
      if (j.runs && j.runs.some(function(r) { return !r.panels || r.panels.length === 0; })) errors.push('• All runs must have at least 1 panel');
      var totalM = (j.runs || []).reduce(function(s, r) { return s + (r.length || 0); }, 0);
      if (totalM <= 0) errors.push('• Total fence length must be > 0');
      var photos = (j.checklist && j.checklist.photos) || [];
      if (photos.length < 1) errors.push('• At least 1 site photo required');
      // Check pricing
      try {
        var d = app._collectOutputData();
        if (d.grandTotal <= 0) errors.push('• Pricing must be calculated (total > $0)');
      } catch(e) {
        errors.push('• Unable to calculate pricing — check fence run data');
      }
      return errors;
    }

    // Scope Complete — validation gate + cloud chain trigger
    async function scopeComplete() {
      // Sync client name
      app.job.client = [app.job.clientFirstName, app.job.clientLastName].filter(Boolean).join(' ');

      // Validate required fields
      var errors = validateForScopeComplete();
      if (errors.length > 0) {
        app.showToast('Cannot complete scope — ' + errors.length + ' issues found', 'error');
        return;
      }

      // Run compliance checks
      var checks = app._runComplianceChecks();
      if (checks.errors.length > 0) {
        app.showToast('Compliance errors — fix before completing', 'error');
        return;
      }

      // Warnings
      var warnings = checks.warnings.slice();
      var photos = (app.job.checklist && app.job.checklist.photos) || [];
      if (photos.length < 5) warnings.push('Fewer than 5 site photos (' + photos.length + ').');
      if (!(app.job.checklist && app.job.checklist.videoWalkthrough)) warnings.push('Video walkthrough not marked as done.');
      if (!app.job.scoper) warnings.push('Scoper name not filled in.');

      if (warnings.length > 0) {
        if (!confirm('Warnings:\n\n' + warnings.map(function(w) { return '• ' + w; }).join('\n') + '\n\nProceed anyway?')) return;
      }

      // Final confirmation
      var _yr = String(new Date().getFullYear()).slice(-2);
      if (!confirm('Mark scope COMPLETE?\n\nThis will:\n• Lock the scope and generate all documents\n• Generate a job number (SWF-' + _yr + 'XXX)\n• Create 3 draft POs (materials, labour, commission)\n• Upload quote PDF to ops\n• Create Xero contact\n• Update GHL opportunity stage\n\nProceed?')) return;

      // Gate behind QA sign-off
      if (!fenceQA.isSignedOff()) {
        app.showToast('QA must be passed before completing scope — run QA Check first', 'error');
        return;
      }

      // Auto-generate quote PDF blob for upload (don't download)
      try {
        app._capturePdfBlob = undefined; // sentinel: trigger blob capture mode
        await app.generateQuotePDF();
      } catch(pdfErr) {
        console.warn('[ScopeComplete] PDF generation failed (non-blocking):', pdfErr);
      }

      // Enrich job state before cloud save
      app.job._pricing_json = app.buildPricingJson();

      // Trigger full cloud save + link chain via saveAfterSignOff (gates GHL link + job number + PO + doc upload)
      if (window._swIntegration) {
        try {
          var result = await window._swIntegration.saveAfterSignOff();
          if (result.success) {
            app.showToast('Scope locked. Quote PDF + POs sent to ops. Job: ' + (result.jobNumber || 'pending'), 'success');
            if (typeof updateButtonStages === 'function') updateButtonStages();
          } else {
            app.showToast('Scope complete failed: ' + (result.reason || 'unknown'), 'error');
          }
        } catch (e) {
          app.showToast('Scope complete failed: ' + e.message, 'error');
        }
      } else {
        app.showToast('Cloud integration not available — sign in first', 'warning');
      }
    }

    // ════════════════════════════════════════════════════════
    // QA VERIFICATION SYSTEM
    // ════════════════════════════════════════════════════════
    const fenceQA = {
      _acknowledged: new Set(),
      _verificationState: JSON.parse(localStorage.getItem('fenceQA_verification') || '{}'),

      _saveState() {
        localStorage.setItem('fenceQA_verification', JSON.stringify(this._verificationState));
      },

      isSignedOff() {
        return !!(this._verificationState.scoper && this._verificationState.scoper.signedOff);
      },

      close() {
        document.getElementById('qaOverlay').style.display = 'none';
      },

      showScopeVerification() {
        const checks = this.runScopeChecks();
        const cards = {};
        checks.forEach(c => {
          if (!cards[c.card]) cards[c.card] = { title: c.card, items: [], worst: 'green' };
          cards[c.card].items.push(c);
          if (c.severity === 'red') cards[c.card].worst = 'red';
          else if (c.severity === 'amber' && cards[c.card].worst !== 'red') cards[c.card].worst = 'amber';
        });

        // Add green cards for sections with no issues
        const allCards = ['Job Details', 'Fence Design', 'Colours & Profile', 'Gates', 'Removal', 'Pricing', 'Photos & Checklist', 'Compliance'];
        allCards.forEach(title => {
          if (!cards[title]) cards[title] = { title, items: [], worst: 'green' };
        });

        const hasRed = Object.values(cards).some(c => c.worst === 'red');
        const hasAmber = Object.values(cards).some(c => c.worst === 'amber');

        let html = `<div class="qa-modal">
          <div class="qa-modal-header">
            <h2>Scope QA Verification</h2>
            <button class="qa-modal-close" onclick="fenceQA.close()">&times;</button>
          </div>
          <div class="qa-modal-body">
            <div style="margin-bottom:16px;font-size:13px;color:#4C6A70;">
              ${hasRed ? '<span style="color:#dc2626;font-weight:700;">RED items must be fixed before outputs can be generated.</span>' :
                hasAmber ? '<span style="color:#d97706;font-weight:700;">AMBER warnings found — review before proceeding.</span>' :
                '<span style="color:#16a34a;font-weight:700;">All checks passed — ready to generate outputs.</span>'}
            </div>`;

        allCards.forEach(title => {
          const card = cards[title];
          html += `<div class="qa-card ${card.worst}">
            <div class="qa-card-title"><span class="qa-dot ${card.worst}"></span>${card.title}</div>`;
          if (card.items.length > 0) {
            html += '<ul class="qa-card-items">';
            card.items.forEach(item => {
              const icon = item.severity === 'red' ? '&#9679;' : item.severity === 'amber' ? '&#9679;' : '&#8226;';
              const col = item.severity === 'red' ? '#dc2626' : item.severity === 'amber' ? '#d97706' : '#4C6A70';
              html += `<li style="color:${col}">${icon} ${item.message}</li>`;
            });
            html += '</ul>';
          } else {
            html += '<div style="font-size:12px;color:#16a34a;">All good</div>';
          }
          html += '</div>';
        });

        html += `</div>
          <div class="qa-actions">
            <button class="qa-btn qa-btn-secondary" onclick="fenceQA.close()">Close</button>
            ${!hasRed ? '<button class="qa-btn qa-btn-primary" onclick="fenceQA._verificationState.scoper = { signedOff: true, by: app.job.scoper || \'unknown\', at: new Date().toISOString() }; fenceQA._saveState(); fenceQA.close(); if (typeof updateButtonStages === \'function\') updateButtonStages(); app.showToast(\'QA passed — outputs unlocked\', \'success\')">Approve & Close</button>' : ''}
          </div>
        </div>`;

        const overlay = document.getElementById('qaOverlay');
        overlay.innerHTML = html;
        overlay.style.display = 'flex';
      },

      runScopeChecks() {
        const j = app.job;
        const flags = [];
        const flag = (card, severity, message, field) => flags.push({ card, severity, message, field });

        // Job Details
        if (!j.clientFirstName) flag('Job Details', 'red', 'Client first name missing', 'clientFirstName');
        if (!j.clientLastName) flag('Job Details', 'red', 'Client last name missing', 'clientLastName');
        if (!j.address) flag('Job Details', 'red', 'Site address missing', 'address');
        if (!j.phone) flag('Job Details', 'red', 'Phone number missing', 'phone');
        if (!j.email) flag('Job Details', 'red', 'Email missing', 'email');
        if (!j.ref) flag('Job Details', 'amber', 'Job reference not set', 'ref');
        if (!j.scoper) flag('Job Details', 'amber', 'Scoper name not filled in', 'scoper');
        if (j.neighboursRequired === undefined) flag('Job Details', 'amber', 'Neighbour details: not answered (Yes/No)', 'neighboursRequired');
        if (j.neighboursRequired === true && (!j.neighbours || !j.neighbours[0] || !j.neighbours[0].firstName)) {
          flag('Job Details', 'amber', 'Neighbour name not filled in', 'neighbours');
        }

        // Fence Design
        if (!j.runs || j.runs.length === 0) flag('Fence Design', 'red', 'No fence runs added');
        if (j.runs && j.runs.some(r => !r.panels || r.panels.length === 0)) flag('Fence Design', 'red', 'A run has no panels');
        if (j.runs && j.runs.some(r => !r.name)) flag('Fence Design', 'amber', 'A run has no side-of-property name');
        if (j.runs && j.runs.some(r => !r.length || r.length <= 0)) flag('Fence Design', 'red', 'A run has no length set');
        if (j.runs && j.runs.some(r => !r.sheetHeight)) flag('Fence Design', 'amber', 'A run has no sheet height set');

        // Colours & Profile
        if (!j.colour) flag('Colours & Profile', 'red', 'No fence colour selected');
        if (!j.profile) flag('Colours & Profile', 'amber', 'No sheet profile selected');
        if (!j.supplier) flag('Colours & Profile', 'amber', 'No supplier selected');

        // Gates
        if (j.gatesRequired === undefined) flag('Gates', 'amber', 'Gates: not answered (Yes/No)');

        // Removal
        const rem = j.removal || {};
        if (rem.removalRequired === undefined) flag('Removal', 'amber', 'Removal required: not answered');
        if (rem.existingFenceType === 'asbestos' && rem.asbestosCert !== false) {
          flag('Removal', 'info', 'Asbestos removal certificate will be included ($' + ((j.quote && j.quote.asbestosCertFee) || 300) + ')');
        }

        // Pricing
        const totalM = (j.runs || []).reduce((s, r) => s + (r.length || 0), 0);
        if (totalM > 0 && (!j.pricePerMetre || j.pricePerMetre <= 0)) flag('Pricing', 'red', 'Price per metre is $0');
        try {
          const d = app._collectOutputData();
          if (d.grandTotal <= 0) flag('Pricing', 'red', 'Total quote is $0');
          const commAmt = d.grandTotal * 0.0525;
          const marginPct = d.subtotal > 0 ? ((d.subtotal - d.internalCost - d.internalLabour - commAmt) / d.subtotal * 100) : 0;
          if (marginPct < 20) flag('Pricing', 'amber', `Margin is only ${marginPct.toFixed(1)}% — below 20% threshold`);
          if (marginPct > 60) flag('Pricing', 'amber', `Margin is ${marginPct.toFixed(1)}% — unusually high, double check`);
        } catch (e) {
          flag('Pricing', 'red', 'Cannot calculate pricing — check fence run data');
        }

        // PO Approvals
        if (!app._poApproved.materials) flag('Pricing', 'red', 'Material PO not approved');
        if (!app._poApproved.labour) flag('Pricing', 'red', 'Labour PO not approved');
        if (!app._poApproved.commission) flag('Pricing', 'red', 'Commission PO not approved');

        // Photos & Checklist
        const photos = (j.checklist && j.checklist.photos) || [];
        if (photos.length === 0) flag('Photos & Checklist', 'red', 'No site photos uploaded');
        else if (photos.length < 5) flag('Photos & Checklist', 'amber', `Only ${photos.length} photos — recommend at least 5`);
        if (!(j.checklist && j.checklist.videoWalkthrough)) flag('Photos & Checklist', 'amber', 'Video walkthrough not marked done');
        if (j.checklist && j.checklist.videoWalkthrough && !window.siteVideo && !(j.checklist.videoCloudUrl)) flag('Photos & Checklist', 'amber', 'Video marked done but no file attached — re-select video or do Cloud Save');
        if (window.siteVideo && !window.siteVideo.cloudUrl) flag('Photos & Checklist', 'amber', 'Video attached but not yet uploaded — do Cloud Save');

        // Compliance
        const comp = app._runComplianceChecks();
        comp.errors.forEach(e => flag('Compliance', 'red', e));
        comp.warnings.forEach(w => flag('Compliance', 'amber', w));

        return flags;
      }
    };

    // ════════════════════════════════════════════════════════
    // MATERIAL VERIFICATION GATE
    // ════════════════════════════════════════════════════════
    function showMaterialVerificationModal(d) {
      var existing = document.getElementById('materialVerifyModal');
      if (existing) existing.remove();

      // Get pricing JSON for cross-check
      var pricing = app.buildPricingJson();
      var pricingItems = pricing.line_items || [];

      // Helper to find pricing quantity for a category
      function pricingQty(category, descMatch) {
        var found = pricingItems.filter(function(li) {
          if (li.category !== category) return false;
          if (descMatch) return li.description && li.description.toLowerCase().includes(descMatch.toLowerCase());
          return true;
        });
        var total = 0;
        found.forEach(function(li) { total += (li.quantity || 0); });
        return { qty: total, count: found.length };
      }

      // Build checklist sections
      var sections = [];
      var checkIdx = 0;

      // ── Section 1: Panels & Posts ──
      var panelRows = [];
      Object.values(d.postGroups).forEach(function(g) {
        var desc = g.count + ' &times; ' + g.sheetH + 'H &times; ' + d.panelWidthMm + 'W panels W/ ' + g.postH + 'H posts | ' + (d.profile || 'Trimclad') + ' | ' + (d.colour || 'Shale Grey');
        panelRows.push({ idx: checkIdx++, desc: desc, matQty: g.count });
      });
      // Cross-check total panels vs pricing fencing line
      var pricingFencing = pricingQty('fencing');
      var panelMismatch = d.totalPanels !== Math.round(pricingFencing.qty / d.panelWidthM);

      sections.push({
        title: 'Panels & Posts',
        rows: panelRows,

    // ════════════════════════════════════════════════════════
    // SEND QUOTE — Gate through Material Verification
    // ════════════════════════════════════════════════════════
    async function showSendQuoteModal() {
      // Step 0: Auto-trigger QA if not yet passed
      if (!fenceQA.isSignedOff()) {
        fenceQA.showScopeVerification();
        return;
      }

      // Step 1: Validate required fields
      var missing = app._validateRequired();
      if (missing.length > 0) {
        app.showToast('Missing: ' + missing.join(', '), 'error');
        return;
      }

      // Step 2: Ensure job exists in Supabase + assign job number if not yet done
      if (window._swIntegration) {
        var sync = window._swIntegration;
        if (!sync.getJobId()) {
          app.showToast('Syncing...', 'info');
          var ensureResult = await sync.ensureJobSynced();
          if (!ensureResult.ok) {
            app.showToast('You need to be online to send quotes — log in and try again', 'error');
            if (ensureResult.reason === 'login') {
              var cloud = window.SECUREWORKS_CLOUD;
              if (cloud) cloud.ui.showLoginModal();
            }
            return;
          }
        }
        // Assign job number via saveAfterSignOff if not yet assigned
        var existingJobNum = sync.getLastJobNumber && sync.getLastJobNumber();
        if (!existingJobNum && !(app.job.ref && app.job.ref.startsWith('SW'))) {
          app.showToast('Assigning job number...', 'info');
          app.job._pricing_json = app.buildPricingJson();
          var signOffResult = await sync.saveAfterSignOff();
          if (signOffResult.success && signOffResult.jobNumber) {
            app.job.ref = signOffResult.jobNumber;
            app.showToast('Job number assigned: ' + signOffResult.jobNumber, 'success');
          }
          // Refresh header + bottom bar to show job number
          app._updateHeaderStatus();
          if (typeof updateButtonStages === 'function') updateButtonStages();
        }
      }

      // Step 3: Collect output data
      var d;
      try { d = app._collectOutputData(); } catch(e) {
        app.showToast('Error calculating output: ' + e.message, 'error');
        return;
      }
      // Step 4: Show material verification modal (blocks until confirmed)
      showMaterialVerificationModal(d);
    }

              '<input type="email" class="sq-nb-email" data-contact="nb-' + i + '" value="' + nbEmail.replace(/"/g, '&quot;') + '" placeholder="Email address" style="width:100%;padding:6px 8px;border:1px solid #D4DEE4;border-radius:4px;font-size:13px;margin-top:4px;box-sizing:border-box;">' +
            '</div>' +
          '</div>';
        });

        neighbourHtml =
          '<div style="font-size:12px;font-weight:600;color:#4C6A7C;margin-bottom:8px;margin-top:20px;text-transform:uppercase;letter-spacing:0.5px;">Recipients (Neighbour Quotes)</div>' +
          '<div style="background:#f9f9f9;border-radius:4px;padding:4px 12px;margin-bottom:20px;">' + nbRows + '</div>' +
          '<p style="font-size:12px;color:#999;margin-bottom:20px;">Each checked recipient will receive their own quote with their share amount. Uncheck to skip sending.</p>';
      }

      overlay.innerHTML =
        // Header
        '<div style="background:#F15A29;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;">' +
          '<button id="sqBackBtn" style="background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:4px 8px;line-height:1;">←</button>' +
          '<div style="flex:1;">' +
            '<div style="color:#fff;font-size:17px;font-weight:700;">Send Quote</div>' +
            '<div style="color:rgba(255,255,255,0.8);font-size:12px;">' + jobRef + ' — ' + clientName + '</div>' +
          '</div>' +
          '<button id="sqSendBtn" style="background:#fff;color:#F15A29;border:none;border-radius:8px;padding:10px 24px;font-size:15px;font-weight:700;cursor:pointer;">Send ▶</button>' +
        '</div>' +

        // Scrollable body
        '<div style="flex:1;overflow-y:auto;padding:20px;-webkit-overflow-scrolling:touch;">' +
          (hasNeighbours ? '' :
            '<label style="display:block;font-size:12px;font-weight:600;color:#4C6A7C;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;">To *</label>' +
            '<input type="email" id="sqTo" value="' + clientEmail.replace(/"/g, '&quot;') + '" placeholder="client@example.com" ' +
              'style="width:100%;padding:12px;border:1px solid #D4DEE4;border-radius:4px;font-size:16px;margin-bottom:16px;box-sizing:border-box;">'
          ) +

          (hasNeighbours ? neighbourHtml : '') +

          // CC field
          '<label style="display:block;font-size:12px;font-weight:600;color:#4C6A7C;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;">CC (optional)</label>' +
          '<input type="text" id="sqCC" placeholder="partner@example.com, builder@example.com" ' +
            'style="width:100%;padding:12px;border:1px solid #D4DEE4;border-radius:4px;font-size:16px;margin-bottom:16px;box-sizing:border-box;">' +

          // Subject
          '<label style="display:block;font-size:12px;font-weight:600;color:#4C6A7C;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;">Subject</label>' +
          '<input type="text" id="sqSubject" value="' + defaultSubject.replace(/"/g, '&quot;') + '" ' +
            'style="width:100%;padding:12px;border:1px solid #D4DEE4;border-radius:4px;font-size:16px;margin-bottom:16px;box-sizing:border-box;">' +

          // Message
          '<label style="display:block;font-size:12px;font-weight:600;color:#4C6A7C;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;">Personal Message (optional)</label>' +
          '<textarea id="sqMessage" rows="3" placeholder="Any additional notes for the client..." ' +
            'style="width:100%;padding:12px;border:1px solid #D4DEE4;border-radius:4px;font-size:15px;margin-bottom:20px;resize:vertical;box-sizing:border-box;"></textarea>' +

          // Attachments
          '<div style="font-size:12px;font-weight:600;color:#4C6A7C;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;">Attachments</div>' +
          '<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0;">' +
            '<span style="font-size:20px;">📄</span>' +
            '<span style="flex:1;font-size:14px;color:#333;font-weight:600;">Quote PDF <span style="color:#999;font-weight:400;">(auto-attached)</span></span>' +
            '<span style="background:#DCFCE7;color:#166534;font-size:11px;padding:2px 8px;border-radius:100px;">Included</span>' +
          '</div>' +
          '<div style="margin-top:4px;">' + docChecks + '</div>' +
          '<div id="sqSizeTracker" style="text-align:right;font-size:12px;color:#999;margin-top:8px;margin-bottom:20px;">Estimated: ~0.5 MB</div>' +

        '</div>' +

        // Bottom send button
        '<div style="padding:16px 20px;border-top:1px solid #eee;flex-shrink:0;background:#fff;">' +
          '<button id="sqSendBtnBottom" style="width:100%;padding:16px;background:#F15A29;color:#fff;border:none;border-radius:8px;font-size:17px;font-weight:700;cursor:pointer;min-height:56px;">Send Quote</button>' +
        '</div>';

      document.body.appendChild(overlay);

      // Wire events
      setTimeout(function() {
        document.getElementById('sqBackBtn').onclick = function() { overlay.remove(); };

        var sendHandler = function() {
          // Save form values before send
          window._sqLastMessage = (document.getElementById('sqMessage') || {}).value || '';
          window._sqLastCC = (document.getElementById('sqCC') || {}).value || '';
          window._sqLastSubject = (document.getElementById('sqSubject') || {}).value || '';
          window._sqLastLibPaths = [];
          document.querySelectorAll('.sq-lib-check:checked').forEach(function(cb) {
            window._sqLastLibPaths.push(cb.dataset.path);
          });

          // For neighbour mode, save per-contact emails
          if (hasNeighbours) {
            window._sqNeighbourSend = [];
            // Primary client
            var primaryEmailEl = document.querySelector('.sq-nb-email[data-contact="primary"]');
            window._sqNeighbourSend.push({
              contactType: 'primary',
              name: clientName,
              email: primaryEmailEl ? primaryEmailEl.value.trim() : clientEmail,
              send: true
            });
            // Neighbours
            neighbours.forEach(function(n, i) {
              var nbCheck = document.querySelector('.sq-nb-check[data-idx="' + i + '"]');
              var nbEmailEl = document.querySelector('.sq-nb-email[data-contact="nb-' + i + '"]');
              var nbName = [n.firstName, n.lastName].filter(Boolean).join(' ');
              window._sqNeighbourSend.push({
                contactType: 'neighbour',
                name: nbName,
                email: nbEmailEl ? nbEmailEl.value.trim() : '',
                send: nbCheck ? nbCheck.checked : false,
                neighbourId: n.id
              });
            });
          } else {
            window._sqNeighbourSend = null;
            window._sqLastTo = (document.getElementById('sqTo') || {}).value.trim();
          }

          executeSendQuote();
        };
        document.getElementById('sqSendBtn').onclick = sendHandler;
        document.getElementById('sqSendBtnBottom').onclick = sendHandler;

        // Validate send buttons
        function validateSend() {
          var valid = false;
          if (hasNeighbours) {
            // At least primary must have email
            var primaryEmailEl = document.querySelector('.sq-nb-email[data-contact="primary"]');
            valid = primaryEmailEl && primaryEmailEl.value.trim().includes('@');
          } else {
            var toEl = document.getElementById('sqTo');
            valid = toEl && toEl.value.trim().includes('@') && toEl.value.trim().includes('.');
          }
          [document.getElementById('sqSendBtn'), document.getElementById('sqSendBtnBottom')].forEach(function(b) {
            if (b) { b.disabled = !valid; b.style.opacity = valid ? '1' : '0.4'; }
          });
        }
        if (hasNeighbours) {
          document.querySelectorAll('.sq-nb-email').forEach(function(el) { el.addEventListener('input', validateSend); });
        } else {
          var toEl = document.getElementById('sqTo');
          if (toEl) toEl.addEventListener('input', validateSend);
        }
        validateSend();

        // Size tracker
        function updateSizeTracker() {
          var total = 500000;
          document.querySelectorAll('.sq-lib-check:checked').forEach(function(cb) {
            total += parseInt(cb.dataset.size) || 0;
          });
          var mb = (total / 1048576).toFixed(1);
          var el = document.getElementById('sqSizeTracker');
          if (el) {
            el.textContent = 'Estimated: ~' + mb + ' MB / 10 MB';
            el.style.color = total > 10485760 ? '#991B1B' : '#999';
          }
        }
        document.querySelectorAll('.sq-lib-check').forEach(function(cb) {
          cb.addEventListener('change', updateSizeTracker);
        });

        // Focus appropriate field
        if (hasNeighbours) {
          var firstNbEmail = document.querySelector('.sq-nb-email');
          if (firstNbEmail) firstNbEmail.focus();
        } else {
          var toEl = document.getElementById('sqTo');
          if (toEl) toEl.focus();
        }
      }, 50);
    }

    async function executeSendQuote() {
      var overlay = document.getElementById('sendQuoteModal');
      if (!overlay) return;

      var message = window._sqLastMessage || '';
      var ccField = window._sqLastCC || '';
      var customSubject = window._sqLastSubject || '';
      var libraryPaths = window._sqLastLibPaths || [];
      var neighbourSend = window._sqNeighbourSend;
      var singleTo = window._sqLastTo || '';

      // Validate
      if (!neighbourSend && (!singleTo || !singleTo.includes('@'))) {
        app.showToast('Please enter a valid email address', 'error');
        return;
      }

      // Parse CC
      var ccEmails = [];
      if (ccField) {
        ccEmails = ccField.split(',').map(function(e) { return e.trim(); }).filter(function(e) { return e && e.includes('@'); });
      }

      // Get scoper name
      var scoperName = 'The SecureWorks Team';
      var cloud = window.SECUREWORKS_CLOUD;
      if (cloud && cloud.auth && cloud.auth.getUser) {
        try {
          var user = cloud.auth.getUser();
          if (user && user.full_name) scoperName = user.full_name;
        } catch(e) {}
      }

      // Switch to sending screen
      overlay.innerHTML =
        '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;">' +
          '<div style="width:48px;height:48px;border:4px solid #D4DEE4;border-top-color:#F15A29;border-radius:50%;animation:sqSpin 0.8s linear infinite;margin-bottom:24px;"></div>' +
          '<div id="sqSendingStep" style="font-size:17px;font-weight:600;color:#293C46;margin-bottom:8px;">Preparing...</div>' +
          '<div id="sqSendingDetail" style="font-size:14px;color:#4C6A7C;"></div>' +
        '</div>' +
        '<style>@keyframes sqSpin { to { transform: rotate(360deg); } }</style>';

      function updateStep(step, detail) {
        var s = document.getElementById('sqSendingStep');
        var d = document.getElementById('sqSendingDetail');
        if (s) s.textContent = step;
        if (d) d.textContent = detail || '';
      }

      try {
        var jobId = window._swIntegration ? window._swIntegration.getJobId() : null;
        var clientName = [app.job.clientFirstName, app.job.clientLastName].filter(Boolean).join(' ') || 'Client';
        var jobRef = app.job.ref || '';
        var fileName = 'Quote_' + clientName.replace(/[^a-zA-Z0-9]/g, '_') + '_' + jobRef + '.pdf';

        // Step 1: Reserve quote numbers
        var quoteNumber = null;
        var neighbourQuoteData = null;
        var hasNeighbours = !!(neighbourSend && neighbourSend.length > 1);

        if (cloud && jobId) {
          updateStep('Reserving quote number...', '');
          try {
            if (hasNeighbours) {
              updateStep('Creating neighbour quotes...', '');
              var nbs = app.job.neighbours.filter(function(n) { return n.firstName || n.lastName; });
              var pricingJson = app.job._pricing_json || app.buildPricingJson();
              var splits = pricingJson.neighbour_splits;
              var usePerRun = splits && splits.method === 'per_run';

              var contacts;
              if (usePerRun) {
                contacts = [{
                  name: clientName,
                  phone: app.job.phone || '',
                  email: neighbourSend[0].email || '',
                  portion_ex_gst: splits.client_portion_ex_gst,
                  assigned_runs: splits.client_assigned_runs || [],
                  contact_type: 'primary'
                }];
                nbs.forEach(function(n, i) {
                  var nbSplit = (splits.neighbours || []).find(function(s) { return s.id === n.id; });
                  contacts.push({
                    name: [n.firstName, n.lastName].filter(Boolean).join(' '),
                    phone: n.phone || '',
                    email: neighbourSend[i + 1] ? neighbourSend[i + 1].email : '',
                    portion_ex_gst: nbSplit ? nbSplit.portion_ex_gst : 0,
                    assigned_runs: nbSplit ? nbSplit.assigned_runs : [],
                    contact_type: 'neighbour'
                  });
                });
              } else {
                var nbTotalShare = nbs.reduce(function(s, n) { return s + (n.sharePercent || 50); }, 0);
                var clientShare = 100 - nbTotalShare;
                contacts = [{
                  name: clientName,
                  phone: app.job.phone || '',
                  email: neighbourSend[0].email || '',
                  share_percentage: clientShare,
                  contact_type: 'primary'
                }];
                nbs.forEach(function(n, i) {
                  contacts.push({
                    name: [n.firstName, n.lastName].filter(Boolean).join(' '),
                    phone: n.phone || '',
                    email: neighbourSend[i + 1] ? neighbourSend[i + 1].email : '',
                    share_percentage: n.sharePercent || 50,
                    contact_type: 'neighbour'
                  });
                });
              }

              var nbRes = await fetch(cloud.supabaseUrl + '/functions/v1/ghl-proxy?action=prepare_neighbour_quotes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ jobId: jobId, contacts: contacts, fileName: fileName })
              });
              var nbData = await nbRes.json();
              if (nbRes.ok && nbData.success) {
                neighbourQuoteData = nbData;
                quoteNumber = nbData.contacts[0]?.quote_number || null;
              }
            } else {
              var prepRes = await fetch(cloud.supabaseUrl + '/functions/v1/ghl-proxy?action=prepare_quote', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ jobId: jobId, fileName: fileName })
              });
              var prepData = await prepRes.json();
              if (prepRes.ok && prepData.quoteNumber) {
                quoteNumber = prepData.quoteNumber;
              }
            }
          } catch(e) {
            console.warn('[SendQuote] Could not reserve quote number (non-blocking):', e.message);
          }
        }

        // Step 2: Generate PDF
        updateStep('Generating PDF...', '');
        window._currentQuoteNumber = quoteNumber;
        app.generateQuotePDF();
        window._currentQuoteNumber = null;

        // Step 2b: Generate + upload per-neighbour PDFs
        if (neighbourQuoteData && neighbourQuoteData.contacts && cloud) {
          updateStep('Generating neighbour PDFs...', '');
          try {
            var d = app._collectOutputData();
            var nbs = app.job.neighbours.filter(function(n) { return n.firstName || n.lastName; });
            for (var pi = 0; pi < neighbourQuoteData.contacts.length; pi++) {
              var pContact = neighbourQuoteData.contacts[pi];
              if (!pContact.upload_url) continue;
              var nbKey = pi === 0 ? '__client__' : (nbs[pi - 1] ? nbs[pi - 1].id : null);
              if (!nbKey || !d.neighbourCosts[nbKey]) continue;
              var blob = app.generateNeighbourPDF(pContact, d, nbKey);
              if (!blob) continue;
              try {
                var upRes = await fetch(pContact.upload_url, {
                  method: 'PUT',
                  headers: { 'Content-Type': 'application/pdf' },
                  body: blob
                });
                if (upRes.ok) console.log('[SendQuote] Uploaded PDF for', pContact.client_name);
              } catch(ue) {
                console.warn('[SendQuote] PDF upload error for', pContact.client_name, ue.message);
              }
            }
          } catch(pdfErr) {
            console.warn('[SendQuote] Neighbour PDF generation failed (non-blocking):', pdfErr.message);
          }
        }

        // Step 3: Update job status
        if (cloud && jobId) {
          updateStep('Updating job status...', '');
          await cloud.jobs.updateJobStatus(jobId, 'quoted');
        }

        // Step 4: Send emails
        var sendResults = []; // { name, email, status: 'sent'|'skipped'|'failed'|'no-email' }

        if (hasNeighbours && neighbourQuoteData && neighbourQuoteData.contacts) {
          updateStep('Sending quote emails...', '');
          for (var ci = 0; ci < neighbourQuoteData.contacts.length; ci++) {
            var contact = neighbourQuoteData.contacts[ci];
            var sendInfo = neighbourSend[ci] || {};
            if (!sendInfo.send && ci > 0) {
              sendResults.push({ name: sendInfo.name || contact.client_name, email: '', status: 'skipped' });
              continue;
            }
            var contactEmail = sendInfo.email || '';
            if (!contactEmail || !contactEmail.includes('@')) {
              sendResults.push({ name: sendInfo.name || contact.client_name, email: '', status: 'no-email' });
              continue;
            }
            if (!contact.document_id) {
              sendResults.push({ name: sendInfo.name || contact.client_name, email: contactEmail, status: 'failed' });
              continue;
            }
            try {
              updateStep('Sending email...', 'to ' + contactEmail);
              var sendRes = await fetch(cloud.supabaseUrl + '/functions/v1/send-quote/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  document_id: contact.document_id,
                  client_email: contactEmail,
                  client_name: sendInfo.name,
                  message: message || '',
                  cc_emails: ccEmails.length > 0 ? ccEmails : undefined,
                  subject: customSubject || undefined,
                  attachment_paths: libraryPaths.length > 0 ? libraryPaths : undefined,
                  scoper_name: scoperName !== 'The SecureWorks Team' ? scoperName : undefined,
                })
              });
              if (sendRes.ok) {
                var sendData = await sendRes.json();
                sendResults.push({ name: sendInfo.name, email: contactEmail, status: 'sent', viewUrl: sendData.view_url });
              } else {
                sendResults.push({ name: sendInfo.name, email: contactEmail, status: 'failed' });
              }
            } catch(e) {
              console.warn('[SendQuote] Email send failed for', sendInfo.name, e.message);
              sendResults.push({ name: sendInfo.name, email: contactEmail, status: 'failed' });
            }
          }
        } else if (!hasNeighbours && cloud && jobId) {
          // Single recipient send
          var toEmail = singleTo;
          if (toEmail && toEmail.includes('@')) {
            updateStep('Sending email...', 'to ' + toEmail);
            // Need a document_id — for single non-neighbour, use prepData
            if (prepData && prepData.documentId) {
              // Upload PDF first (fencing tool generates PDF via app.generateQuotePDF() which downloads it,
              // but the prepare_quote gave us an upload URL)
              // The fencing tool's generateQuotePDF downloads the PDF directly. We need to capture it instead.
              // For now, just send the email with the document_id — the PDF is already stored via prepare_quote
              try {
                var sendRes = await fetch(cloud.supabaseUrl + '/functions/v1/send-quote/send', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    document_id: prepData.documentId,
                    client_email: toEmail,
                    client_name: clientName,
                    message: message || '',
                    cc_emails: ccEmails.length > 0 ? ccEmails : undefined,
                    subject: customSubject || undefined,
                    attachment_paths: libraryPaths.length > 0 ? libraryPaths : undefined,
                    scoper_name: scoperName !== 'The SecureWorks Team' ? scoperName : undefined,
                  })
                });
                var sendData = await sendRes.json();
                if (sendRes.ok) {
                  sendResults.push({ name: clientName, email: toEmail, status: 'sent', viewUrl: sendData.view_url });
                } else {
                  sendResults.push({ name: clientName, email: toEmail, status: 'failed' });
                }
              } catch(e) {
                sendResults.push({ name: clientName, email: toEmail, status: 'failed' });
              }
            }
          }
        }

        // Step 5: Show success screen
        var sentCount = sendResults.filter(function(r) { return r.status === 'sent'; }).length;
        var firstViewUrl = (sendResults.find(function(r) { return r.viewUrl; }) || {}).viewUrl || '';

        var resultRows = sendResults.map(function(r) {
          var icon = r.status === 'sent' ? '✓' : r.status === 'skipped' ? '—' : r.status === 'no-email' ? '✉' : '✕';
          var iconColor = r.status === 'sent' ? '#22C55E' : r.status === 'skipped' ? '#999' : r.status === 'no-email' ? '#F59E0B' : '#EF4444';
          var detail = r.status === 'sent' ? r.email : r.status === 'no-email' ? 'No email address' : r.status === 'skipped' ? 'Skipped' : 'Failed';
          return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;">' +
            '<span style="color:' + iconColor + ';font-size:18px;width:24px;text-align:center;">' + icon + '</span>' +
            '<div style="flex:1;">' +
              '<div style="font-size:14px;font-weight:600;color:#293C46;">' + r.name + '</div>' +
              '<div style="font-size:12px;color:#4C6A7C;">' + detail + '</div>' +
            '</div>' +
          '</div>';
        }).join('');

        overlay.innerHTML =
          '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;">' +
            '<div style="width:64px;height:64px;border-radius:50%;background:#DCFCE7;display:flex;align-items:center;justify-content:center;margin-bottom:20px;">' +
              '<span style="font-size:32px;color:#22C55E;">✓</span>' +
            '</div>' +
            '<div style="font-size:20px;font-weight:700;color:#293C46;margin-bottom:4px;">' +
              (quoteNumber ? 'Quote ' + quoteNumber + ' ' : '') + (sentCount > 0 ? 'Sent!' : 'Done!') +
            '</div>' +
            '<div style="font-size:13px;color:#999;margin-bottom:24px;">' + sentCount + ' email' + (sentCount !== 1 ? 's' : '') + ' sent</div>' +

            // Per-recipient results
            '<div style="width:100%;max-width:360px;text-align:left;margin-bottom:24px;">' + resultRows + '</div>' +

            (firstViewUrl ? '<button id="sqCopyLink" style="width:100%;max-width:360px;padding:14px;background:#293C46;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px;">Copy Acceptance Link</button>' : '') +
            '<button id="sqDone" style="width:100%;max-width:360px;padding:14px;background:#fff;color:#4C6A7C;border:1px solid #D4DEE4;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;">Done</button>' +
          '</div>';

        setTimeout(function() {
          if (firstViewUrl && document.getElementById('sqCopyLink')) {
            document.getElementById('sqCopyLink').onclick = function() {
              if (navigator.clipboard) {
                navigator.clipboard.writeText(firstViewUrl).then(function() {
                  document.getElementById('sqCopyLink').textContent = 'Copied! ✓';
                  setTimeout(function() {
                    var el = document.getElementById('sqCopyLink');
                    if (el) el.textContent = 'Copy Acceptance Link';
                  }, 2000);
                });
              }
            };
          }
          document.getElementById('sqDone').onclick = function() {
            document.getElementById('sendQuoteModal').remove();
          };
        }, 50);

        app.showToast('Quote ' + (quoteNumber || '') + ' — ' + sentCount + ' email(s) sent', 'success');

      } catch(e) {
        console.error('[SendQuote] Error:', e);
        overlay.innerHTML =
          '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;">' +
            '<div style="width:64px;height:64px;border-radius:50%;background:#FEE2E2;display:flex;align-items:center;justify-content:center;margin-bottom:20px;">' +
              '<span style="font-size:32px;color:#991B1B;">✕</span>' +
            '</div>' +
            '<div style="font-size:18px;font-weight:700;color:#991B1B;margin-bottom:8px;">Send Failed</div>' +
            '<div style="font-size:14px;color:#4C6A7C;margin-bottom:32px;max-width:360px;">' + (e.message || 'Unknown error') + '</div>' +
            '<button id="sqRetry" style="width:100%;max-width:360px;padding:14px;background:#F15A29;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px;">Try Again</button>' +
            '<button id="sqCancel" style="width:100%;max-width:360px;padding:14px;background:#fff;color:#4C6A7C;border:1px solid #D4DEE4;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;">Cancel</button>' +
          '</div>';
        setTimeout(function() {
          document.getElementById('sqRetry').onclick = function() { _showSendQuoteModalInternal(); };
          document.getElementById('sqCancel').onclick = function() { overlay.remove(); };
        }, 50);
      }
    }

    // ════════════════════════════════════════════════════════
    // SYNC DOT — cloud sync status indicator
    // ════════════════════════════════════════════════════════
    // ── Sync indicator (matches patio pattern) ──
    function updateSyncDot(state, detail) {
      var dot = document.querySelector('#headerSyncStatus .sync-dot');
      var label = document.querySelector('#headerSyncStatus .sync-label');
      var timeEl = document.getElementById('syncLastTime');
      var jobIdEl = document.getElementById('syncJobId');
      var retryBtn = document.getElementById('syncRetryBtn');
      if (!dot) return;

      dot.className = 'sync-dot';
      if (state === 'saved') {
        dot.classList.add('saved');
        if (label) label.textContent = 'Saved';
        if (timeEl) {
          var d = new Date();
          timeEl.textContent = d.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
        }
      } else if (state === 'error') {
        dot.classList.add('failed');
        if (label) label.textContent = 'Failed';
      } else {
        // local / saving / default — orange dot
        if (label) label.textContent = (state === 'saving') ? (detail || 'Saving...') : 'Local';
      }

      if (jobIdEl) {
        var jid = window._swIntegration && window._swIntegration.getJobId ? window._swIntegration.getJobId() : null;
        jobIdEl.textContent = jid ? jid.slice(0, 8) + '...' : '--';
      }
      if (retryBtn) retryBtn.style.display = (state === 'error') ? '' : 'none';

      if (app && app._updateHeaderStatus) app._updateHeaderStatus();
    }

    function toggleSyncDetail() {
      var el = document.getElementById('syncDetail');
      if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    // Close sync popover when clicking outside
    document.addEventListener('click', function(e) {
      var syncDetail = document.getElementById('syncDetail');
      var syncInd = document.getElementById('headerSyncStatus');
      if (syncDetail && syncInd && !syncInd.contains(e.target)) syncDetail.style.display = 'none';
    });

    // ════════════════════════════════════════════════════════
    // BOTTOM BAR — More overflow menu
    // ════════════════════════════════════════════════════════
    function toggleGenMore(e) {
      e.stopPropagation();
      var menu = document.getElementById('genMoreMenu');
      if (menu) menu.classList.toggle('open');
    }
    document.addEventListener('click', function(e) {
      var menu = document.getElementById('genMoreMenu');
      if (menu && !e.target.closest('.gen-more-wrap')) menu.classList.remove('open');
    });

    // ════════════════════════════════════════════════════════
    // PROGRESSIVE DISCLOSURE — Stage-based button visibility
    // ════════════════════════════════════════════════════════
    function detectJobStage() {
      var j = app.job;
      if (!j) return 1;

      // Stage 4: Scope complete (has job number)
      var hasJobNumber = !!(j.ref && j.ref.startsWith('SWF')) || !!(window._swIntegration && window._swIntegration.getLastJobNumber && window._swIntegration.getLastJobNumber());
      if (hasJobNumber) return 4;
      if (j.scopeComplete) return 4;

      // Stage 3: Has runs + client + valid pricing — ready for output
      // QA is enforced at action time (Send Quote auto-triggers it), not at stage level
      var hasRuns = j.runs && j.runs.some(function(r) { return r.panels && r.panels.length > 0; });
      var hasClient = !!(j.clientFirstName && j.address && j.email);
      if (hasRuns && hasClient) {
        try {
          var d = app._collectOutputData();
          if (d.grandTotal > 0) return 3;
        } catch(e) { /* pricing failed, stay at 2 */ }
        return 2;
      }

      // Stage 2: Has some data entered (name, address, or any run)
      if (j.clientFirstName || j.address || (j.runs && j.runs.length > 0 && j.runs[0].panels.length > 0)) return 2;

      // Stage 1: Empty/new job
      return 1;
    }

    function updateButtonStages() {
      var stage = detectJobStage();
      var bar = document.getElementById('generateBar');
      var inner = document.getElementById('genBarButtons');
      if (!bar || !inner) return;

      // Always show the bar — save buttons are always available
      bar.style.display = '';
      document.body.style.paddingBottom = '70px';
      var html = '';
      var qaPassed = typeof fenceQA !== 'undefined' && fenceQA.isSignedOff();

      if (!qaPassed) {
        // ── Pre-QA: Save Local + Save Draft to Cloud + QA ──
        html += '<button class="gen-btn gen-btn-save-local" onclick="app.save(); app.showToast(\'Saved locally\', \'success\')">' +
                  '<span style="font-size:16px;line-height:1;">&#128190;</span> Save to Local' +
                '</button>';
        html += '<button class="gen-btn gen-btn-save-cloud" onclick="if(window._swIntegration){window._swIntegration.save();app.showToast(\'Draft saved to cloud\',\'success\')}else{app.showToast(\'Not logged in — saved locally only\',\'warning\');app.save()}">' +
                  '<span style="font-size:16px;line-height:1;">&#9729;</span> Save Draft to Cloud' +
                '</button>';
        html += '<button class="gen-btn gen-btn-qa" onclick="fenceQA.showScopeVerification()">QA Check</button>';
      } else {
        // ── Post-QA: Save to Cloud + Send Quote + output buttons ──
        html += '<button class="gen-btn gen-btn-save-cloud" onclick="if(window._swIntegration){window._swIntegration.save();app.showToast(\'Saved to cloud\',\'success\')}else{app.showToast(\'Not logged in\',\'warning\')}">' +
                  '<span style="font-size:16px;line-height:1;">&#9729;</span> Save to Cloud' +
                '</button>';
        html += '<button class="gen-btn gen-btn-send" onclick="showSendQuoteModal()">Send Quote</button>';
        html += '<button class="gen-btn gen-btn-quote" onclick="app.generateQuotePDF()">Quote PDF</button>';
        html += '<div class="gen-more-wrap">' +
                  '<button class="gen-btn gen-btn-more" onclick="toggleGenMore(event)">More \u22EF</button>' +
                  '<div class="gen-more-menu" id="genMoreMenu">' +
                    '<button class="gen-more-item" onclick="app.generateMaterialOrder()">Material Order</button>' +
                    '<button class="gen-more-item" onclick="app.generateWorkOrder()">Work Order</button>' +
                  '</div>' +
                '</div>';
        html += '<button class="gen-btn gen-btn-scope" onclick="scopeComplete()">Scope Complete</button>';
      }

      inner.innerHTML = html;
      if (app && app._updateHeaderStatus) app._updateHeaderStatus();
    }

    // Hook into app.save() to update stages whenever data changes
    var _origSave = null;
    function hookStageUpdates() {
      if (_origSave || !app || !app.save) return;
      _origSave = app.save.bind(app);
      app.save = function() {
        _origSave();
        updateButtonStages();
      };
      // Initial update
      updateButtonStages();
    }

    window.addEventListener('DOMContentLoaded', () => {
      app.init();
      // Hook stage updates after a tick so app is fully initialized
      setTimeout(hookStageUpdates, 500);

      // Auto-fill scoper from cloud auth
      setTimeout(function() {
        if (window.SECUREWORKS_CLOUD && window.SECUREWORKS_CLOUD.on) {
          window.SECUREWORKS_CLOUD.on('auth:login', function(user) {
            if (!user || !user.name) return;
            // Only set if scoper is empty or at default
            if (!app.job.scoper) {
              app.job.scoper = user.name;
              var sf = document.getElementById('scoperField');
              if (sf) sf.value = user.name;
              var sh = document.getElementById('scoper');
              if (sh) sh.value = user.name;
              app.save();
            }
          });
        }
      }, 100);
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.address-autocomplete-wrap')) { app.hideAddressDropdown(); app.hideClientNameDropdown(); }
    });
  </script>
