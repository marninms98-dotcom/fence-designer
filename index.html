    // ── Section 6.3: Post height lookup tables ──
    // Key: sheetHeight, Value: array of { maxRetaining, postSize, patioTube }
    // Post height = sheet + retaining + 600mm embed, rounded up to standard size
    // Standard post lengths: 1500, 1800, 2100, 2400, 2700, 3000
    // Patio tube required when retaining >= 450mm (3+ plinths)
    const POST_LOOKUP = {
      900: [
        { ret: 0,   post: 1500, patio: false },
        { ret: 150, post: 1800, patio: false },
        { ret: 300, post: 1800, patio: false },
        { ret: 450, post: 2100, patio: true },
        { ret: 600, post: 2100, patio: true }
      ],
      1200: [
        { ret: 0,   post: 1800, patio: false },
        { ret: 150, post: 2100, patio: false },
        { ret: 300, post: 2100, patio: false },
        { ret: 450, post: 2400, patio: true },
        { ret: 600, post: 2400, patio: true }
      ],
      1500: [
        { ret: 0,   post: 2100, patio: false },
        { ret: 150, post: 2400, patio: false },
        { ret: 300, post: 2400, patio: false },
        { ret: 450, post: 2700, patio: true },
        { ret: 600, post: 2700, patio: true }
      ],
      1800: [
        { ret: 0,   post: 2400, patio: false },
        { ret: 150, post: 2700, patio: false },
        { ret: 300, post: 2700, patio: false },
        { ret: 450, post: 3000, patio: true },
        { ret: 600, post: 3000, patio: true }
      ],
      2100: [
        { ret: 0,   post: 2700, patio: false },
        { ret: 150, post: 3000, patio: false },
        { ret: 300, post: 3000, patio: false },
        { ret: 450, post: 3000, patio: true },
        { ret: 600, post: 3000, patio: true }
      ]
    };

    const RETAINING_OPTIONS = [0, 150, 300, 450, 600];
    const SHEET_HEIGHTS = [900, 1200, 1500, 1800, 2100];
    const RUN_NAME_OPTIONS = ['', 'LHS', 'RHS', 'Rear', 'Front', 'LHS Rear', 'RHS Rear', 'LHS Front', 'RHS Front', 'Side Return', 'Other'];
    const RUN_NAME_CYCLE = ['Rear', 'LHS', 'RHS', 'Front'];

    // ── Business rules: cost prices (internal) ──
    const COST_PRICES = {
      panelKit1800_2400: 185,  // 1800H panel kit with 2400 posts, per panel
      panelKit1800_2700: 210,  // 1800H panel kit with 2700 posts
      panelKit1800_3000: 235,  // 1800H panel kit with 3000 posts
      panelKit1500_2400: 165,
      panelKit1200_2400: 145,
      panelKit2100_2700: 230,
      panelKit2100_3000: 255,
      plinth: 52,              // per plinth (150mm) — $42 material + $10 labour
      patioTube: 45,           // 76x38 RHS 3000mm
      gateKitPedestrian: 320,  // pedestrian gate kit
      gateKitDouble: 580,      // double swing gate kit
      gatePost90x90: 85,       // 90x90mm SHS gate post
      concrete: 9.50,          // per bag
      tekScrewBox: 18,         // per box
      removeHardie: 15,        // per metre cost
      removeTimberLap: 20,     // per metre cost
      removeColorbond: 15,     // per metre cost
      removeAsbestos: 65,      // per metre cost (licenced disposal)
      vegClear: 150,           // flat fee
      groundMulch: 12,         // per lineal metre
      groundStones: 18,        // per lineal metre
      groundTurf: 22,          // per lineal metre
      labourPerMetre: 35,      // base labour rate per metre
      delivery: 250            // default delivery
    };

    const MARGIN = 0.30; // 30% margin: sell = cost / (1 - 0.30)

    const ACCESS_SURCHARGE = { easy: 0, moderate: 0.10, difficult: 0.20 }; // % of labour
    const URGENCY_SURCHARGE = { standard: 0, urgent: 0.10, rush: 0.20, emergency: 0.35 }; // % of subtotal

    const DISCLAIMERS = [
      'This quote is based on information provided and a standard site assessment. Actual costs may vary if unforeseen site conditions are encountered during installation, including but not limited to rock, tree roots, clay, underground services, water table, or non-standard soil conditions. Any additional costs arising from such conditions will be communicated before proceeding.',
      'Customer is responsible for confirming property boundaries before installation. SecureWorks WA strongly recommends engaging a licensed surveyor to mark boundaries prior to works commencing. SecureWorks WA accepts no liability for fencing installed on incorrect boundaries or for any disputes arising from boundary placement.',
      'Retaining walls over 500mm in height may require a Building Permit and/or engineer certification under the Building Act 2011 (WA) and associated regulations. Customer is responsible for obtaining all required approvals, permits, and certifications prior to commencement. SecureWorks WA can assist with applications upon request at additional cost.',
      'This quote does not include any electrical or plumbing relocation, stormwater management, tree removal requiring council approval, asbestos testing or removal, or any works not specifically listed in the scope above. Any additional works requested after acceptance will be quoted separately.',
      'Payment terms: 50% deposit required to confirm booking and secure materials. Balance due on day of completion prior to handover. Overdue accounts incur interest at the rate of 2% per month (24% per annum) compounding. The customer is liable for all collection costs, including legal fees, in the event of non-payment.',
      'All COLORBOND\u00AE steel products carry the manufacturer\u2019s standard warranty (BlueScope 10-year fencing warranty). SecureWorks WA provides a 12-month workmanship warranty from the date of completion covering defects in installation. This warranty does not cover damage caused by third parties, acts of nature, ground movement, or unauthorised modifications.',
      'This quote is valid for 30 days from the date of issue. After this period, pricing may be subject to change due to material cost fluctuations. A new quote will be provided upon request.',
      'SecureWorks WA holds appropriate public liability insurance and workers\u2019 compensation coverage for all works performed. Copies of insurance certificates are available upon request.',
      'The customer must provide clear and safe access to the worksite for the duration of works. Any delays caused by restricted access, adverse weather, or other factors outside SecureWorks WA\u2019s control may result in schedule adjustments. SecureWorks WA is not liable for consequential losses arising from such delays.',
      'Site cleanup is included as part of the scope of works. SecureWorks WA will remove all installation debris and excess materials. Any existing waste, dumped materials, or items not related to this project remain the customer\u2019s responsibility.',
      'By accepting this quote, the customer agrees to these terms and conditions in full. Acceptance may be communicated in writing, via email, or by payment of the deposit. Verbal acceptance followed by deposit payment constitutes a binding agreement.',
      'Either party may cancel this agreement in writing. If the customer cancels after deposit has been paid and materials have been ordered, the deposit is non-refundable to the extent of costs already incurred. SecureWorks WA will provide an itemised breakdown of costs incurred upon request.'
    ];

    // ── Lookup helper ──
    function lookupPost(sheetHeight, retaining) {
      const table = POST_LOOKUP[sheetHeight] || POST_LOOKUP[1800];
      const entry = table.find(e => e.ret === retaining);
      if (entry) return entry;
      // Fallback: post = sheet + retaining + 600mm embed, round up to standard size
      const required = sheetHeight + retaining + 600;
      let postSize;
      if (required <= 1500) postSize = 1500;
      else if (required <= 1800) postSize = 1800;
      else if (required <= 2100) postSize = 2100;
      else if (required <= 2400) postSize = 2400;
      else if (required <= 2700) postSize = 2700;
      else postSize = 3000;
      const plinths = retaining / 150;
      return { ret: retaining, post: postSize, patio: plinths >= 3 && plinths <= 4 };
    }

    // ── Application ──
    const app = {
      job: null,
      currentRunId: null,

      init() {
        this.loadFromStorage();
        this.bindHeaderInputs();

        if (!this.job) {
          this.job = {
            ref: '',
            client: '',
            clientFirstName: '',
            clientLastName: '',
            scoper: '',
            address: '',
            suburb: '',
            siteNotes: '',
            phone: '',
            email: '',
            neighboursRequired: undefined,
            neighbours: [{ id: 'nb-1', firstName: '', lastName: '', phone: '', email: '', address: '' }],
            supplier: '',
            profile: '',
            colour: '',
            pricePerMetre: 115,
            runs: [],
            gatesRequired: undefined,
            gates: [],
            date: new Date().toISOString().slice(0, 10),
            removal: {
              removalRequired: undefined,
              existingFenceLength: 0,
              existingFenceType: '',
              disposal: 'company',
              vegetation: false,
              gateOnExisting: false,
              access: 'easy',
              notes: ''
            },
            installation: {
              coreDrill: false,
              coreDrillHoles: 0,
              fenceLocation: [],
              manufacturer: '',
              supplierSource: ''
            },
            quote: {
              urgency: 'standard',
              deliveryFee: 250,
              groundFinish: 'none',
              customLineItems: [{}, {}, {}],
              // Scope add-ons (use custom line items instead)
              addons: {}
            },
            checklist: {
              photosTaken: 0,
              photos: [],
              videoWalkthrough: false,
              finalNotes: ''
            }
          };
          this.addRun();
        } else {
          this.syncHeaderFromJob();
          if (this.job.runs.length > 0 && !this.currentRunId) {
            this.currentRunId = this.job.runs[0].id;
          }
        }

        this._loadPanelTexture();
        this.render();

        // Resize handler for profile view canvas
        window.addEventListener('resize', () => {
          if (this._openSections.visualizer) this.renderProfileView();
          if (this._fence3DReady && this.currentView === '3d') this._resizeFence3D();
        });
      },

      // ── Colour dropdown (Section 9.3) ──
      populateColourDropdown() {
        const select = document.getElementById('colour');
        if (!select) return;
        let html = '<optgroup label="── Stock ──">';
        COLOURS_STOCK.forEach(c => {
          html += `<option value="${c.name}" data-hex="${c.hex}" ${c.name === this.job.colour ? 'selected' : ''}>${c.name}</option>`;
        });
        html += '</optgroup><optgroup label="── Special Order ──">';
        COLOURS_SPECIAL.forEach(c => {
          html += `<option value="${c.name}" data-hex="${c.hex}" ${c.name === this.job.colour ? 'selected' : ''}>${c.name} (SO)</option>`;
        });
        html += '</optgroup>';
        select.innerHTML = html;
      },

      // ── Profile dropdown (Section 4B) ──
      updateProfileDropdown() {
        const select = document.getElementById('profile');
        if (!select) return;
        const supplierData = SUPPLIER_PROFILES[this.job.supplier];
        if (!supplierData) {
          select.innerHTML = '<option value="">Select panel system first...</option>';
          return;
        }
        select.innerHTML = '<option value="" ' + (!this.job.profile ? 'selected' : '') + '>Select...</option>' +
          supplierData.profiles.map(p =>
            `<option value="${p}" ${p === this.job.profile ? 'selected' : ''}>${p}</option>`
          ).join('');
        if (this.job.profile && !supplierData.profiles.includes(this.job.profile)) {
          this.job.profile = '';
          select.value = '';
        }
      },

      _updateHeaderBadge() {
        var badge = document.getElementById('headerBadge');
        if (!badge) return;
        var ref = this.job.ref || '';
        var name = [this.job.clientFirstName, this.job.clientLastName].filter(Boolean).join(' ');
        if (ref || name) {
          badge.style.display = '';
          badge.innerHTML = '<strong>' + (ref || 'SW—') + '</strong>' + (name ? ' &nbsp;' + name : '');
        } else {
          badge.style.display = 'none';
        }
      },

      bindHeaderInputs() {
        // jobRef is read-only — auto-assigned on scope complete
        document.getElementById('jobDate').addEventListener('change', (e) => {
          this.job.date = e.target.value;
          this.save();
        });
        document.getElementById('scoper').addEventListener('input', (e) => {
          this.job.scoper = e.target.value;
          this.save();
          this.updateSectionStatuses();
        });
      },

      syncHeaderFromJob() {
        document.getElementById('jobRef').value = this.job.ref || '';
        document.getElementById('jobDate').value = this.job.date || new Date().toISOString().slice(0, 10);
        document.getElementById('scoper').value = this.job.scoper || '';
        this._updateHeaderBadge();
      },

      // ── Section 3.5: Panel width by supplier ──
      getPanelWidthMm() {
        const s = SUPPLIER_PROFILES[this.job.supplier];
        return s ? s.panelWidth : 2380;
      },

      getPanelWidthM() {
        return this.getPanelWidthMm() / 1000;
      },

      // ── Section 6.1: Auto-calculate panel count from run length ──
      calcPanelCount(lengthM) {
        if (!lengthM || lengthM <= 0) return 0;
        const lengthMm = lengthM * 1000;
        const panelW = this.getPanelWidthMm();
        // Panels are cut to fit — only add another panel if overshoot > 50mm
        // e.g. 2400mm run with 2380mm panels = 1 panel (trimmed), not 2
        const raw = lengthMm / panelW;
        const floored = Math.floor(raw);
        return (raw - floored > 0.02) ? floored + 1 : Math.max(1, floored);
      },

      // ── Section 6.3: Post height per-post (between two panels) ──
      getPostHeight(leftPanel, rightPanel) {
        let leftTotal = 0, rightTotal = 0;
        let leftLookup = null, rightLookup = null;

        if (leftPanel) {
          leftTotal = leftPanel.height + leftPanel.retaining;
          leftLookup = lookupPost(leftPanel.height, leftPanel.retaining);
        }
        if (rightPanel) {
          rightTotal = rightPanel.height + rightPanel.retaining;
          rightLookup = lookupPost(rightPanel.height, rightPanel.retaining);
        }

        // Use whichever side demands the taller post
        let postSize = 2400;
        let patio = false;

        if (leftLookup && rightLookup) {
          postSize = Math.max(leftLookup.post, rightLookup.post);
          patio = leftLookup.patio || rightLookup.patio;
        } else if (leftLookup) {
          postSize = leftLookup.post;
          patio = leftLookup.patio;
        } else if (rightLookup) {
          postSize = rightLookup.post;
          patio = rightLookup.patio;
        }

        return { postSize, patio };
      },

      // ── Sync panels to match calculated panel count ──
      syncPanels(run) {
        const targetCount = this.calcPanelCount(run.length);
        if (targetCount === 0) {
          run.panels = [];
          return;
        }

        while (run.panels.length < targetCount) {
          run.panels.push({
            id: 'panel-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
            height: run.sheetHeight,
            retaining: 0,
            step: 'level',
            stepMm: 0,
            slopePlinths: 0
          });
        }

        // If decreased, remove from end (but only excess)
        if (run.panels.length > targetCount) {
          run.panels = run.panels.slice(0, targetCount);
        }

        // Sync slope points to match current run length
        this.syncSlopePoints(run);
      },

      // ── Compute derived values per panel (not stored, used for display) ──
      getPanelDerived(panel) {
        const slopePlinths = panel.slopePlinths || 0;
        const manualPlinths = panel.retaining / 150;
        const rawPlinths = slopePlinths + manualPlinths;
        const plinths = Math.min(4, rawPlinths); // Total capped at 4
        const plinthsCapped = rawPlinths > 4;
        const totalRetaining = plinths * 150;
        const totalHeight = panel.height + totalRetaining;
        const lookup = lookupPost(panel.height, Math.min(600, totalRetaining));
        return {
          plinths,
          rawPlinths,
          plinthsCapped,
          slopePlinths,
          manualPlinths,
          totalRetaining,
          totalHeight,
          postSize: lookup.post,
          patio: lookup.patio,
          needsPatioTube: plinths >= 3 && plinths <= 4
        };
      },

      // ── Compute post array for a run (posts = panels + 1) ──
      getRunPosts(run) {
        const posts = [];
        for (let i = 0; i <= run.panels.length; i++) {
          const leftPanel = i > 0 ? run.panels[i - 1] : null;
          const rightPanel = i < run.panels.length ? run.panels[i] : null;
          posts.push(this.getPostHeight(leftPanel, rightPanel));
        }
        return posts;
      },

      // ── Ground height interpolation: get heightMm at a distance along the run ──
      // slopePoints is [{distanceM, heightMm}, ...] sorted by distanceM
      computeGroundHeight(slopePoints, distanceM) {
        if (!slopePoints || slopePoints.length === 0) return 0;
        if (slopePoints.length === 1) return slopePoints[0].heightMm;
        if (distanceM <= slopePoints[0].distanceM) return slopePoints[0].heightMm;
        if (distanceM >= slopePoints[slopePoints.length - 1].distanceM) return slopePoints[slopePoints.length - 1].heightMm;
        for (let j = 0; j < slopePoints.length - 1; j++) {
          if (distanceM >= slopePoints[j].distanceM && distanceM <= slopePoints[j + 1].distanceM) {
            const span = slopePoints[j + 1].distanceM - slopePoints[j].distanceM;
            if (span === 0) return slopePoints[j].heightMm;
            const t = (distanceM - slopePoints[j].distanceM) / span;
            return slopePoints[j].heightMm + t * (slopePoints[j + 1].heightMm - slopePoints[j].heightMm);
          }
        }
        return 0;
      },

      // ── Calculate slope-derived steps and plinths for all panels in a run ──
      // This sets panel.slopePlinths and panel.step based on the slope line.
      // Called whenever slope points change or panels are synced.
      calcSlopeForRun(run) {
        if (!run || !run.panels.length) return;
        const panelCount = run.panels.length;
        const runLengthM = run.length || 0;
        const slopePoints = (run.slope && run.slope.points) || [];
        const plinthH = 150;
        const maxStepsPerPanel = 4; // 600mm max step between adjacent panels

        // Get the interpolated ground height at each post position (panelCount + 1 posts)
        const groundHeights = [];
        for (let i = 0; i <= panelCount; i++) {
          const distM = runLengthM > 0 ? (i / panelCount) * runLengthM : 0;
          groundHeights.push(this.computeGroundHeight(slopePoints, distM));
        }

        // Each panel spans from post i to post i+1.
        // The panel's "base level" snaps to the nearest plinthH step below the ground.
        // We work left-to-right. Panel 0's base = 0 (reference).
        // For each subsequent panel, the base steps down/up when ground changes enough.

        // Panel base levels (in mm, relative to start — negative = lower, positive = higher)
        const baseLevels = new Array(panelCount).fill(0);
        baseLevels[0] = 0; // First panel is the reference

        for (let i = 1; i < panelCount; i++) {
          // Ground height at this panel's left post
          const groundAtPost = groundHeights[i];
          // How far has ground dropped from the previous panel's base?
          const prevBase = baseLevels[i - 1];
          const dropFromPrevBase = prevBase - groundAtPost; // positive = ground is lower
          if (dropFromPrevBase >= plinthH) {
            // Step down by however many full plinths fit, capped at 4 (600mm)
            const steps = Math.min(maxStepsPerPanel, Math.floor(dropFromPrevBase / plinthH));
            baseLevels[i] = prevBase - steps * plinthH;
          } else if (dropFromPrevBase <= -plinthH) {
            // Ground has risen — step up, capped at 4 (600mm)
            const steps = Math.min(maxStepsPerPanel, Math.floor(-dropFromPrevBase / plinthH));
            baseLevels[i] = prevBase + steps * plinthH;
          } else {
            baseLevels[i] = prevBase;
          }
        }

        // Now calculate slopePlinths, step direction, and stepMm for each panel
        for (let i = 0; i < panelCount; i++) {
          const panel = run.panels[i];

          // Slope plinths = how far this panel's base is above the lowest ground
          // at either end of the panel, measured in plinth units
          const groundLeft = groundHeights[i];
          const groundRight = groundHeights[i + 1];
          const lowestGround = Math.min(groundLeft, groundRight);
          const gapMm = baseLevels[i] - lowestGround; // how far base is above ground
          const slopePlinths = Math.max(0, Math.min(4, Math.round(gapMm / plinthH)));
          panel.slopePlinths = slopePlinths;

          // Step direction and magnitude: compare this panel's base to previous
          if (i === 0) {
            panel.step = 'level';
            panel.stepMm = 0;
          } else {
            const diff = baseLevels[i] - baseLevels[i - 1];
            if (diff < 0) panel.step = 'down';
            else if (diff > 0) panel.step = 'up';
            else panel.step = 'level';
            panel.stepMm = diff; // negative = down, positive = up, 0 = level
          }
        }
      },

      recalculateAll() {
        this.job.runs.forEach(run => this.syncPanels(run));
        this.render();
      },

      // ── Runs ──
      addRun() {
        const run = {
          id: 'run-' + Date.now(),
          name: '',
          length: 0,
          sheetHeight: 1800,
          extension: 'none',
          panels: [],
          slope: { mode: 'simple', points: [], simple: { direction: 'left-to-right', totalFallMm: 0, startsFrom: 'start' }, monotonic: null }
        };
        this.job.runs.push(run);
        this.currentRunId = run.id;
        this.save();
        this.render();
      },

      deleteRun(runId) {
        if (this.job.runs.length <= 1) {
          app.showToast('Must have at least one run', 'warning');
          return;
        }
        if (!confirm('Delete this run?')) return;
        this.job.runs = this.job.runs.filter(r => r.id !== runId);
        if (this.currentRunId === runId) {
          this.currentRunId = this.job.runs[0].id;
        }
        this.save();
        this.render();
      },

      switchRun(runId) {
        this.currentRunId = runId;
        this.render();
      },

      // ── Slope point management ──

      syncSlopePoints(run) {
        if (!run.slope) run.slope = { mode: 'simple', points: [], simple: { direction: 'left-to-right', totalFallMm: 0, startsFrom: 'start' }, monotonic: null };
        if (!run.slope.simple) run.slope.simple = { direction: 'left-to-right', totalFallMm: 0, startsFrom: 'start' };
        if (run.slope.mode === undefined) run.slope.mode = 'simple';
        const pts = run.slope.points;
        const runLen = run.length || 0;
        const isAdvanced = run.slope.mode === 'advanced';

        // In simple mode, regenerate points from simple inputs
        if (!isAdvanced) {
          this._generateSimpleSlopePoints(run);
          return;
        }

        // Advanced mode: ensure start and end points exist
        const startIdx = pts.findIndex(p => p.distanceM === 0);
        if (startIdx < 0) {
          pts.unshift({ distanceM: 0, heightMm: 0 });
        }
        // In advanced mode, do NOT force start point to 0 — Point A is unlocked

        if (runLen > 0) {
          // Remove intermediate points beyond run length (keep first/start)
          for (let i = pts.length - 1; i >= 1; i--) {
            if (pts[i].distanceM > runLen) pts.splice(i, 1);
          }

          // Ensure end point exists at runLen
          const endIdx = pts.findIndex(p => p.distanceM === runLen);
          if (endIdx < 0) {
            const lastPt = pts[pts.length - 1];
            pts.push({ distanceM: runLen, heightMm: lastPt ? lastPt.heightMm : 0 });
          }
        } else {
          pts.length = 1;
        }

        pts.sort((a, b) => a.distanceM - b.distanceM);
      },

      // Generate slope points from simple mode inputs
      _generateSimpleSlopePoints(run) {
        const slope = run.slope;
        if (!slope.simple) slope.simple = { direction: 'left-to-right', totalFallMm: 0, startsFrom: 'start' };
        const simple = slope.simple;
        const runLen = run.length || 0;
        if (runLen <= 0) {
          slope.points = [{ distanceM: 0, heightMm: 0 }];
          return;
        }
        const totalFall = simple.totalFallMm || 0;
        const startPctMap = { 'start': 0, '25': 0.25, '50': 0.50, '75': 0.75 };
        const startPct = startPctMap[simple.startsFrom] || 0;

        // Build points for left-to-right direction first
        let points;
        if (totalFall === 0) {
          points = [
            { distanceM: 0, heightMm: 0 },
            { distanceM: runLen, heightMm: 0 }
          ];
        } else if (startPct === 0) {
          // Gradual slope across entire run
          points = [
            { distanceM: 0, heightMm: 0 },
            { distanceM: runLen, heightMm: -totalFall }
          ];
        } else {
          // Flat portion then slope
          const flatEndM = Math.round(startPct * runLen * 2) / 2;
          points = [
            { distanceM: 0, heightMm: 0 },
            { distanceM: Math.min(flatEndM, runLen - 0.5), heightMm: 0 },
            { distanceM: runLen, heightMm: -totalFall }
          ];
        }

        // If right-to-left, mirror the profile horizontally
        if (simple.direction === 'right-to-left') {
          points = points.map(p => ({
            distanceM: Math.round((runLen - p.distanceM) * 2) / 2,
            heightMm: p.heightMm
          }));
          points.sort((a, b) => a.distanceM - b.distanceM);
        }

        slope.points = points;
      },

      // Toggle between simple and advanced slope modes
      toggleSlopeMode(runId) {
        const run = this.job.runs.find(r => r.id === runId);
        if (!run || !run.slope) return;

        if (run.slope.mode === 'simple') {
          // Switch to advanced: keep current points, add userSet flags
          run.slope.mode = 'advanced';
          run.slope.monotonic = null;
          run.slope.points.forEach(p => { p.userSet = false; });
        } else {
          // Switch back to simple: calculate closest simple values
          this._slopeAdvancedToSimple(run);
          this._generateSimpleSlopePoints(run);
        }

        this.calcSlopeForRun(run);
        this.save();
        this.render();
      },

      // Calculate closest simple mode values from advanced profile
      _slopeAdvancedToSimple(run) {
        const pts = run.slope.points;
        if (!pts || pts.length < 2) {
          run.slope.simple = { direction: 'left-to-right', totalFallMm: 0, startsFrom: 'start' };
          run.slope.mode = 'simple';
          run.slope.monotonic = null;
          return;
        }

        const firstH = pts[0].heightMm || 0;
        const lastH = pts[pts.length - 1].heightMm || 0;
        const diff = lastH - firstH; // negative = falls L→R, positive = rises L→R

        let direction, totalFall;
        if (diff <= 0) {
          direction = 'left-to-right';
          totalFall = Math.abs(diff);
        } else {
          direction = 'right-to-left';
          totalFall = diff;
        }

        // Snap totalFall to nearest 150mm
        totalFall = Math.round(totalFall / 150) * 150;
        totalFall = Math.min(1800, Math.max(0, totalFall));

        // Detect startsFrom by checking for flat initial portion
        let startsFrom = 'start';
        const runLen = run.length || pts[pts.length - 1].distanceM;
        if (pts.length >= 3 && runLen > 0) {
          const highEndH = direction === 'left-to-right' ? firstH : lastH;
          // Check intermediate points near the high-end level
          for (let i = 1; i < pts.length - 1; i++) {
            if (Math.abs(pts[i].heightMm - highEndH) < 30) {
              const pct = direction === 'left-to-right'
                ? pts[i].distanceM / runLen
                : (runLen - pts[i].distanceM) / runLen;
              if (pct >= 0.65) startsFrom = '75';
              else if (pct >= 0.40) startsFrom = '50';
              else if (pct >= 0.18) startsFrom = '25';
            }
          }
        }

        run.slope.simple = { direction, totalFallMm: totalFall, startsFrom };
        run.slope.mode = 'simple';
        run.slope.monotonic = null;
      },

      // Update simple mode slope inputs
      updateSimpleSlope(runId, field, value) {
        const run = this.job.runs.find(r => r.id === runId);
        if (!run || !run.slope || !run.slope.simple) return;

        if (field === 'direction') {
          run.slope.simple.direction = value;
        } else if (field === 'totalFallMm') {
          let numVal = parseInt(value, 10) || 0;
          numVal = Math.round(numVal / 150) * 150;
          numVal = Math.max(0, Math.min(1800, numVal));
          run.slope.simple.totalFallMm = numVal;
        } else if (field === 'startsFrom') {
          run.slope.simple.startsFrom = value;
        }

        this._generateSimpleSlopePoints(run);
        this.calcSlopeForRun(run);
        this.save();
        this.render();
      },

      addSlopePoint(runId) {
        const run = this.job.runs.find(r => r.id === runId);
        if (!run || !run.slope) return;
        const pts = run.slope.points;
        if (pts.length < 2) return;

        // Find longest segment
        let maxSpan = 0, maxIdx = 0;
        for (let i = 0; i < pts.length - 1; i++) {
          const span = pts[i + 1].distanceM - pts[i].distanceM;
          if (span > maxSpan) { maxSpan = span; maxIdx = i; }
        }

        const midDist = (pts[maxIdx].distanceM + pts[maxIdx + 1].distanceM) / 2;
        const rounded = Math.round(midDist * 2) / 2;
        const heightMm = this.computeGroundHeight(pts, rounded);

        pts.push({ distanceM: rounded, heightMm: Math.round(heightMm), userSet: false });
        pts.sort((a, b) => a.distanceM - b.distanceM);
        this.calcSlopeForRun(run);
        this.save();
        this.render();
      },

      removeSlopePoint(runId, pointIdx) {
        const run = this.job.runs.find(r => r.id === runId);
        if (!run || !run.slope) return;
        const pts = run.slope.points;
        if (pointIdx <= 0 || pointIdx >= pts.length - 1) return;
        pts.splice(pointIdx, 1);
        this.calcSlopeForRun(run);
        this.save();
        this.render();
      },

      updateSlopePoint(runId, pointIdx, field, value) {
        const run = this.job.runs.find(r => r.id === runId);
        if (!run || !run.slope) return;
        const pts = run.slope.points;
        if (!pts[pointIdx]) return;

        if (field === 'heightMm') {
          // Direct heightMm input (advanced mode, Point A included)
          const numVal = parseFloat(value) || 0;
          pts[pointIdx].heightMm = Math.max(-2400, Math.min(2400, numVal));
          pts[pointIdx].userSet = true;
        } else if (field === 'fallMm') {
          // User enters positive = ground drops, stored as negative heightMm
          const numVal = parseFloat(value) || 0;
          pts[pointIdx].heightMm = -numVal;
          pts[pointIdx].userSet = true;
        } else if (field === 'distanceM') {
          if (pointIdx === 0 || pointIdx === pts.length - 1) return;
          const numVal = parseFloat(value) || 0;
          pts[pointIdx].distanceM = Math.max(0.5, Math.min((run.length || 0) - 0.5, numVal));
          pts.sort((a, b) => a.distanceM - b.distanceM);
          return; // Don't apply waterfall for distance changes
        }

        // Waterfall: auto-adjust subsequent non-userSet points
        const changedHeight = pts[pointIdx].heightMm;
        for (let i = pointIdx + 1; i < pts.length; i++) {
          if (!pts[i].userSet) {
            pts[i].heightMm = changedHeight;
          } else {
            // Enforce monotonic on userSet points
            if (run.slope.monotonic === 'falling') {
              pts[i].heightMm = Math.min(pts[i].heightMm, pts[i - 1].heightMm);
            } else if (run.slope.monotonic === 'rising') {
              pts[i].heightMm = Math.max(pts[i].heightMm, pts[i - 1].heightMm);
            }
          }
        }

        this.calcSlopeForRun(run);
        this.save();
        this.render();
      },

      resetSlope(runId) {
        const run = this.job.runs.find(r => r.id === runId);
        if (!run || !run.slope) return;

        if (run.slope.mode === 'simple') {
          run.slope.simple = { direction: 'left-to-right', totalFallMm: 0, startsFrom: 'start' };
          this._generateSimpleSlopePoints(run);
        } else {
          // Advanced mode: reset all points to 0, clear userSet and monotonic
          run.slope.points.forEach(p => { p.heightMm = 0; p.userSet = false; });
          run.slope.monotonic = null;
        }

        this.calcSlopeForRun(run);
        this.save();
        this.render();
      },

      updateRunSettings(runId, field, value) {
        const run = this.job.runs.find(r => r.id === runId);
        if (!run) return;

        if (field === 'name') {
          run.name = value;
        } else if (field === 'length') {
          run.length = parseFloat(value) || 0;
          this.syncPanels(run);
        } else if (field === 'sheetHeight') {
          run.sheetHeight = parseInt(value);
        } else if (field === 'extension') {
          run.extension = value;
        }

        this.save();
        this.render();
      },

      applyHeightToAll(runId) {
        const run = this.job.runs.find(r => r.id === runId);
        if (!run) return;
        run.panels.forEach(p => { p.height = run.sheetHeight; });
        this.save();
        this.render();
      },

      updatePanel(runId, panelIdx, field, value) {
        const run = this.job.runs.find(r => r.id === runId);
        if (!run || !run.panels[panelIdx]) return;

        const panel = run.panels[panelIdx];
        if (field === 'height') {
          panel.height = parseInt(value);
        } else if (field === 'retaining') {
          panel.retaining = parseInt(value);
        } else if (field === 'step') {
          panel.step = value;
        }

        this.save();
        this.render();
      },

      deletePanel(runId, panelIdx) {
        const run = this.job.runs.find(r => r.id === runId);
        if (!run || run.panels.length <= 1) return;
        run.panels.splice(panelIdx, 1);
        this.save();
        this.render();
      },

      applyQuickRetaining(runId) {
        const run = this.job.runs.find(r => r.id === runId);
        if (!run) return;

        const startPanel = parseInt(document.getElementById(`qr-start-${runId}`).value);
        const endPanel = parseInt(document.getElementById(`qr-end-${runId}`).value);
        const retaining = parseInt(document.getElementById(`qr-retaining-${runId}`).value);

        if (startPanel < 1 || endPanel > run.panels.length || startPanel > endPanel) {
          app.showToast('Invalid panel range', 'warning');
          return;
        }

        for (let i = startPanel - 1; i < endPanel; i++) {
          run.panels[i].retaining = retaining;
        }

        this.save();
        this.render();
      },

      // ── Gates ──
      addGate() {
        if (!this.job.runs.length) return;
        this.job.gates.push({
          id: 'gate-' + Date.now(),
          type: 'pedestrian',
          width: 900,
          runIndex: 0,
          afterPanel: 1,
          height: 1800,
          gatePosts: '',
          groundFinish: 'none'
        });
        this.save();
        this.render();
      },

      updateGate(gateId, field, value) {
        const gate = this.job.gates.find(g => g.id === gateId);
        if (!gate) return;
        if (field === 'type') gate.type = value;
        else if (field === 'width') gate.width = parseInt(value) || 900;
        else if (field === 'runIndex') gate.runIndex = parseInt(value);
        else if (field === 'afterPanel') gate.afterPanel = parseInt(value);
        else if (field === 'height') gate.height = parseInt(value) || 1800;
        else if (field === 'gatePosts') gate.gatePosts = value;
        else if (field === 'groundFinish') gate.groundFinish = value;
        this.save();
        this.render();
      },

      deleteGate(gateId) {
        this.job.gates = this.job.gates.filter(g => g.id !== gateId);
        this.save();
        this.render();
      },

      // ── Section 11: Compliance warnings ──
      getComplianceWarnings() {
        const warnings = [];
        this.job.runs.forEach(run => {
          run.panels.forEach((panel, idx) => {
            const totalRetaining = panel.retaining + (panel.slopePlinths || 0) * 150;
            const totalPlinths = totalRetaining / 150;
            if (totalPlinths >= 4) {
              warnings.push({
                type: 'warn',
                msg: `${run.name} P${idx + 1}: Panel at maximum plinth capacity (${totalRetaining}mm). Additional retaining requires engineered solution.`
              });
            }
            if (totalRetaining > 500) {
              warnings.push({
                type: 'warn',
                msg: `${run.name} P${idx + 1}: Retaining >${500}mm requires Building Permit + Engineer Cert in WA.`
              });
            }
          });
        });
        return warnings;
      },

      // ── Stats ──
      updateStats() {
        let totalPanels = 0;
        let totalPosts = 0;
        let totalMetres = 0;
        let totalPlinths = 0;
        let plinthPanelCount = 0;
        const panelWidthMm = this.getPanelWidthMm();

        this.job.runs.forEach(run => {
          const panelCount = run.panels.length;
          totalPanels += panelCount;
          totalPosts += panelCount + 1;
          totalMetres += run.length || 0;
          run.panels.forEach(p => {
            const pl = Math.min(4, (p.slopePlinths || 0) + p.retaining / 150);
            totalPlinths += pl;
            if (pl > 0) plinthPanelCount++;
          });
        });

        document.getElementById('statMetres').textContent =
          totalMetres > 0 ? `${totalMetres.toFixed(1)}m / ${totalPanels} × ${panelWidthMm}mm` : '0.0m';
        document.getElementById('statPanels').textContent = totalPanels;
        document.getElementById('statPosts').textContent = totalPosts;
        document.getElementById('statPlinths').textContent =
          totalPlinths > 0 ? `${totalPlinths} (across ${plinthPanelCount} panels)` : '0';

        // Full pricing from _collectOutputData
        try {
          const d = this._collectOutputData();
          document.getElementById('statCost').textContent =
            d.grandTotal > 0 ? `$${Math.round(d.grandTotal).toLocaleString()}` : '$0';
          document.getElementById('statDeposit').textContent =
            d.grandTotal > 0 ? `$${Math.round(d.grandTotal * 0.5).toLocaleString()}` : '$0';

          const totalCost = d.internalCost + d.internalLabour;
          const marginPct = d.subtotal > 0 ? ((d.subtotal - totalCost) / d.subtotal * 100) : 0;
          const marginEl = document.getElementById('statMargin');
          marginEl.textContent = `${marginPct.toFixed(0)}%`;
          marginEl.style.color = marginPct < 20 ? '#dc2626' : marginPct < 30 ? '#d97706' : '#16a34a';

          document.getElementById('statInternalCost').textContent =
            totalCost > 0 ? `$${Math.round(totalCost).toLocaleString()}` : '$0';
        } catch (e) {
          document.getElementById('statCost').textContent = '$0';
          document.getElementById('statDeposit').textContent = '$0';
          document.getElementById('statMargin').textContent = '—';
          document.getElementById('statInternalCost').textContent = '$0';
        }
      },

      // ── Quote Breakdown (live pricing table) ──
      renderQuoteBreakdown() {
        const el = document.getElementById('bodyBreakdown');
        if (!el) return;
        const statusEl = document.getElementById('statusBreakdown');
        let d;
        try { d = this._collectOutputData(); } catch(e) {
          el.innerHTML = '<div style="padding:12px;color:#4C6A70;font-size:13px;">Add fence runs to see pricing breakdown.</div>';
          if (statusEl) { statusEl.className = 'section-status empty'; }
          return;
        }
        if (d.totalMetres <= 0) {
          el.innerHTML = '<div style="padding:12px;color:#4C6A70;font-size:13px;">Add fence runs to see pricing breakdown.</div>';
          if (statusEl) { statusEl.className = 'section-status empty'; }
          return;
        }

        const f = (n) => n.toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const totalCost = d.internalCost + d.internalLabour;
        const marginPct = d.subtotal > 0 ? ((d.subtotal - totalCost) / d.subtotal * 100) : 0;
        const marginCol = marginPct < 20 ? '#dc2626' : marginPct < 30 ? '#d97706' : '#16a34a';

        let rows = '';

        // ── Fencing ──
        rows += `<tr class="qb-cat"><td colspan="3">Fencing</td></tr>`;
        rows += `<tr><td>COLORBOND ${this._esc(d.profile || '')} — ${this._esc(d.colour || '')} (${d.totalMetres.toFixed(1)}m @ $${d.pricePerMetre}/m)</td><td class="r">${d.totalPanels} panels</td><td class="r">$${f(d.fencingTotal)}</td></tr>`;
        if (d.totalPlinths > 0)
          rows += `<tr><td>Retaining plinths (150mm COLORBOND)</td><td class="r">${d.totalPlinths} × $${d.plinthSell}</td><td class="r">$${f(d.plinthsTotal)}</td></tr>`;
        if (d.totalPatioTubes > 0)
          rows += `<tr><td>Patio tube bracing (76×38 RHS)</td><td class="r">${d.totalPatioTubes} × $${d.patioSell}</td><td class="r">$${f(d.patioTotal)}</td></tr>`;

        // ── Gates ──
        if (d.gateLineItems.length > 0) {
          rows += `<tr class="qb-cat"><td colspan="3">Gates</td></tr>`;
          d.gateLineItems.forEach(g => {
            rows += `<tr><td>${this._esc(g.desc)}</td><td class="r">${g.qty > 1 ? g.qty + ' ×' : ''}</td><td class="r">$${f(g.total)}</td></tr>`;
          });
        }

        // ── Removal ──
        if (d.removalItems.length > 0) {
          rows += `<tr class="qb-cat"><td colspan="3">Removal</td></tr>`;
          d.removalItems.forEach(r => {
            rows += `<tr><td>${this._esc(r.desc)}</td><td class="r">${r.qty} ${r.unit}</td><td class="r">$${f(r.total)}</td></tr>`;
          });
        }

        // ── Site Works ──
        const hasSiteWorks = d.groundFinishTotal > 0 || d.addonItems.length > 0;
        if (hasSiteWorks) {
          rows += `<tr class="qb-cat"><td colspan="3">Site Works</td></tr>`;
          if (d.groundFinishTotal > 0)
            rows += `<tr><td>${this._esc(d.groundFinishDesc)}</td><td class="r">${d.totalMetres.toFixed(1)}m</td><td class="r">$${f(d.groundFinishTotal)}</td></tr>`;
          d.addonItems.forEach(a => {
            rows += `<tr><td>${this._esc(a.desc)}</td><td class="r"></td><td class="r">$${f(a.total)}</td></tr>`;
          });
        }

        // ── Custom Items ──
        if (d.customItems.length > 0) {
          rows += `<tr class="qb-cat"><td colspan="3">Custom Items</td></tr>`;
          d.customItems.forEach(c => {
            rows += `<tr><td>${this._esc(c.desc)}</td><td class="r">${c.qty} ${c.unit} × $${f(c.unitPrice)}</td><td class="r">$${f(c.total)}</td></tr>`;
          });
        }

        // ── Surcharges ──
        if (d.accessSurcharge > 0 || d.urgencySurcharge > 0) {
          rows += `<tr class="qb-cat"><td colspan="3">Surcharges</td></tr>`;
          if (d.accessSurcharge > 0) rows += `<tr><td>Access difficulty (${d.js.access})</td><td class="r">${Math.round(d.accessRate * 100)}%</td><td class="r">$${f(d.accessSurcharge)}</td></tr>`;
          if (d.urgencySurcharge > 0) rows += `<tr><td>Urgency (${d.js.urgency})</td><td class="r">${Math.round(d.urgencyRate * 100)}%</td><td class="r">$${f(d.urgencySurcharge)}</td></tr>`;
        }

        // ── Delivery ──
        rows += `<tr><td>Delivery</td><td class="r"></td><td class="r">$${f(d.deliveryFee)}</td></tr>`;

        // ── Totals ──
        rows += `<tr class="qb-subtotal"><td>Subtotal (ex GST)</td><td></td><td class="r">$${f(d.subtotal)}</td></tr>`;
        rows += `<tr class="qb-subtotal"><td>GST (10%)</td><td></td><td class="r">$${f(d.gst)}</td></tr>`;
        rows += `<tr class="qb-grand"><td>Total (inc GST)</td><td></td><td class="r">$${f(d.grandTotal)}</td></tr>`;

        // ── Internal (scoper only) ──
        rows += `<tr class="qb-internal"><td colspan="3" style="padding-top:12px;font-weight:700;">Internal (not shown to client)</td></tr>`;
        rows += `<tr class="qb-internal"><td>Material cost</td><td></td><td class="r">$${f(d.internalCost)}</td></tr>`;
        rows += `<tr class="qb-internal"><td>Labour cost</td><td></td><td class="r">$${f(d.internalLabour)}</td></tr>`;
        rows += `<tr class="qb-internal"><td>Total cost</td><td></td><td class="r">$${f(totalCost)}</td></tr>`;
        rows += `<tr class="qb-internal"><td>Margin</td><td></td><td class="r"><span class="qb-margin-pill" style="background:${marginCol}15;color:${marginCol};">${marginPct.toFixed(1)}%</span></td></tr>`;
        rows += `<tr class="qb-internal"><td>Deposit (50%)</td><td></td><td class="r" style="font-weight:700;color:#F15A29;">$${f(d.grandTotal * 0.5)}</td></tr>`;

        el.innerHTML = `<table class="qb-table"><thead><tr><th>Item</th><th class="r">Detail</th><th class="r">Amount</th></tr></thead><tbody>${rows}</tbody></table>`;

        if (statusEl) { statusEl.className = 'section-status done'; }
      },

      // ── Profit & Orders (GP breakdown + draft PO approval) ──
      _poApproved: { materials: false, labour: false },

      renderProfitOrders() {
        const el = document.getElementById('bodyProfitOrders');
        if (!el) return;
        const statusEl = document.getElementById('statusProfitOrders');
        let d;
        try { d = this._collectOutputData(); } catch(e) {
          el.innerHTML = '<div style="padding:12px;color:#4C6A70;font-size:13px;">Add fence runs to see profit breakdown.</div>';
          if (statusEl) statusEl.className = 'section-status empty';
          return;
        }
        if (d.totalMetres <= 0) {
          el.innerHTML = '<div style="padding:12px;color:#4C6A70;font-size:13px;">Add fence runs to see profit breakdown.</div>';
          if (statusEl) statusEl.className = 'section-status empty';
          return;
        }

        const f = (n) => n.toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const totalCost = d.internalCost + d.internalLabour;
        const gp = d.subtotal - totalCost;
        const gpPct = d.subtotal > 0 ? (gp / d.subtotal * 100) : 0;
        const gpCol = gpPct < 20 ? '#dc2626' : gpPct < 30 ? '#d97706' : '#16a34a';

        // ── GP Overview Card ──
        let html = `<div class="po-card" style="border-color:${gpCol}40;">
          <div class="po-card-header" style="background:${gpCol}10;color:${gpCol};">
            Gross Profit Analysis
            <span class="qb-margin-pill" style="background:${gpCol}15;color:${gpCol};font-size:14px;">${gpPct.toFixed(1)}% GP</span>
          </div>
          <div class="po-card-body">
            <div class="po-gp-bar">
              <div class="po-gp-fill" style="width:${Math.min(100, Math.max(0, gpPct))}%;background:${gpCol};"></div>
              <div class="po-gp-label">$${f(gp)} GP on $${f(d.subtotal)} revenue</div>
            </div>
            <table>
              <tr><td>Revenue (ex GST)</td><td class="r" style="font-weight:700;">$${f(d.subtotal)}</td></tr>
              <tr><td>Total cost (materials + labour)</td><td class="r">$${f(totalCost)}</td></tr>
              <tr class="po-total"><td style="color:${gpCol};">Gross Profit</td><td class="r" style="color:${gpCol};font-size:15px;">$${f(gp)}</td></tr>
            </table>
          </div>
        </div>`;

        // ── Material PO Card ──
        let matRows = '';
        Object.values(d.postGroups).forEach(g => {
          let unitCost = 0;
          if (g.sheetH === 1200) unitCost = COST_PRICES.panelKit1200_2400;
          else if (g.sheetH === 1500) unitCost = COST_PRICES.panelKit1500_2400;
          else if (g.sheetH === 1800) {
            if (g.postH <= 2400) unitCost = COST_PRICES.panelKit1800_2400;
            else if (g.postH <= 2700) unitCost = COST_PRICES.panelKit1800_2700;
            else unitCost = COST_PRICES.panelKit1800_3000;
          } else if (g.sheetH === 2100) {
            unitCost = g.postH <= 2700 ? COST_PRICES.panelKit2100_2700 : COST_PRICES.panelKit2100_3000;
          } else unitCost = COST_PRICES.panelKit1800_2400;
          matRows += `<tr><td>Panel kit ${g.sheetH}H/${g.postH}H</td><td class="r">${g.count} × $${f(unitCost)}</td><td class="r">$${f(g.count * unitCost)}</td></tr>`;
        });
        if (d.totalPlinths > 0) matRows += `<tr><td>Retaining plinths</td><td class="r">${d.totalPlinths} × $${f(COST_PRICES.plinth)}</td><td class="r">$${f(d.totalPlinths * COST_PRICES.plinth)}</td></tr>`;
        if (d.totalPatioTubes > 0) matRows += `<tr><td>Patio tubes (76×38 RHS)</td><td class="r">${d.totalPatioTubes} × $${f(COST_PRICES.patioTube)}</td><td class="r">$${f(d.totalPatioTubes * COST_PRICES.patioTube)}</td></tr>`;
        matRows += `<tr><td>Concrete (20kg bags)</td><td class="r">${d.concreteBags} × $${f(COST_PRICES.concrete)}</td><td class="r">$${f(d.concreteBags * COST_PRICES.concrete)}</td></tr>`;
        matRows += `<tr><td>Tek screw boxes</td><td class="r">${d.tekBoxes} × $${f(COST_PRICES.tekScrewBox)}</td><td class="r">$${f(d.tekBoxes * COST_PRICES.tekScrewBox)}</td></tr>`;
        (d.job.gates || []).forEach(g => {
          if (g.type === 'pedestrian') {
            matRows += `<tr><td>Ped gate kit + 2× posts</td><td class="r">1</td><td class="r">$${f(COST_PRICES.gateKitPedestrian + 2 * COST_PRICES.gatePost90x90)}</td></tr>`;
          } else if (g.type === 'double') {
            matRows += `<tr><td>Double gate kit + 4× posts</td><td class="r">1</td><td class="r">$${f(COST_PRICES.gateKitDouble + 4 * COST_PRICES.gatePost90x90)}</td></tr>`;
          }
        });
        // Removal costs in PO
        if (d.removalItems.length > 0) {
          matRows += `<tr><td colspan="3" style="padding-top:8px;font-weight:700;font-size:11px;text-transform:uppercase;color:#4C6A70;border-top:1px solid #e5e7eb;">Removal</td></tr>`;
          d.removalItems.forEach(r => {
            if (r.costPrice) matRows += `<tr><td>${r.desc}</td><td class="r">${r.qty} ${r.unit} × $${f(r.costPrice)}</td><td class="r">$${f(r.qty * r.costPrice)}</td></tr>`;
          });
        }
        matRows += `<tr class="po-total"><td colspan="2">Total Cost (materials + removal)</td><td class="r">$${f(d.internalCost)}</td></tr>`;

        const matApproved = this._poApproved.materials;
        html += `<div class="po-card">
          <div class="po-card-header" style="background:${matApproved ? '#dcfce7' : '#fef3c7'};color:${matApproved ? '#16a34a' : '#92400e'};">
            Draft Material & Removal Purchase Order
            <button class="po-approve-btn" style="background:${matApproved ? '#16a34a' : '#F15A29'};color:#fff;" onclick="app.togglePOApproval('materials')">
              ${matApproved ? 'Approved' : 'Approve'}
            </button>
          </div>
          <div class="po-card-body">
            <table>
              <thead><tr><th style="text-align:left;font-size:11px;color:#4C6A70;padding:4px 0;border-bottom:1px solid #e5e7eb;">Item</th><th style="text-align:right;font-size:11px;color:#4C6A70;padding:4px 0;border-bottom:1px solid #e5e7eb;">Qty/Rate</th><th style="text-align:right;font-size:11px;color:#4C6A70;padding:4px 0;border-bottom:1px solid #e5e7eb;">Cost</th></tr></thead>
              <tbody>${matRows}</tbody>
            </table>
          </div>
        </div>`;

        // ── Labour PO Card ──
        const labBase = d.totalMetres * COST_PRICES.labourPerMetre;
        const accessPct = d.accessRate || 0;
        const accessAmt = labBase * accessPct;
        let labRows = '';
        labRows += `<tr><td>Base labour (${d.totalMetres.toFixed(1)}m × $${f(COST_PRICES.labourPerMetre)}/m)</td><td class="r">$${f(labBase)}</td></tr>`;
        if (accessPct > 0) {
          labRows += `<tr><td>Access surcharge (${(accessPct * 100).toFixed(0)}%)</td><td class="r">$${f(accessAmt)}</td></tr>`;
        }
        // Removal labour costs
        if (d.removalItems.length > 0) {
          labRows += `<tr><td colspan="2" style="padding-top:8px;font-weight:700;font-size:11px;text-transform:uppercase;color:#4C6A70;border-top:1px solid #e5e7eb;">Removal</td></tr>`;
          d.removalItems.forEach(r => {
            if (r.costPrice) labRows += `<tr><td>${r.desc}</td><td class="r">${r.qty} ${r.unit} × $${f(r.costPrice)} = $${f(r.qty * r.costPrice)}</td></tr>`;
          });
        }
        labRows += `<tr class="po-total"><td>Total Labour Cost</td><td class="r">$${f(d.internalLabour + (d.internalRemovalCost || 0))}</td></tr>`;

        const labApproved = this._poApproved.labour;
        html += `<div class="po-card" style="margin-top:8px;">
          <div class="po-card-header" style="background:${labApproved ? '#dcfce7' : '#fef3c7'};color:${labApproved ? '#16a34a' : '#92400e'};">
            Draft Labour Purchase Order
            <button class="po-approve-btn" style="background:${labApproved ? '#16a34a' : '#F15A29'};color:#fff;" onclick="app.togglePOApproval('labour')">
              ${labApproved ? 'Approved' : 'Approve'}
            </button>
          </div>
          <div class="po-card-body">
            <table>
              <thead><tr><th style="text-align:left;font-size:11px;color:#4C6A70;padding:4px 0;border-bottom:1px solid #e5e7eb;">Item</th><th style="text-align:right;font-size:11px;color:#4C6A70;padding:4px 0;border-bottom:1px solid #e5e7eb;">Cost</th></tr></thead>
              <tbody>${labRows}</tbody>
            </table>
          </div>
        </div>`;

        // ── Revenue Split Summary ──
        const matSell = d.fencingTotal + d.plinthsTotal + d.patioTotal + d.gatesTotal + d.deliveryFee;
        const matMargin = matSell - d.internalCost;
        const matMarginPct = matSell > 0 ? (matMargin / matSell * 100) : 0;
        const matMCol = matMarginPct < 20 ? '#dc2626' : matMarginPct < 30 ? '#d97706' : '#16a34a';
        const removalMargin = d.removalTotal - d.internalRemovalCost;
        const removalMarginPct = d.removalTotal > 0 ? (removalMargin / d.removalTotal * 100) : 0;
        const remMCol = removalMarginPct < 20 ? '#dc2626' : removalMarginPct < 30 ? '#d97706' : '#16a34a';
        html += `<div style="margin-top:4px;padding:12px;background:#f8fafc;border-radius:8px;font-size:12px;color:#4C6A70;">
          <div style="font-weight:700;text-transform:uppercase;margin-bottom:8px;font-size:11px;">Revenue Split</div>
          <table style="width:100%;font-size:12px;">
            <tr><td>Materials: sell $${f(matSell)}, cost $${f(d.internalCost - d.internalRemovalCost)}</td><td class="r" style="color:${matMCol};font-weight:700;">GP $${f(matSell - (d.internalCost - d.internalRemovalCost))} (${(matSell > 0 ? ((matSell - (d.internalCost - d.internalRemovalCost)) / matSell * 100) : 0).toFixed(0)}%)</td></tr>
            ${d.removalTotal > 0 ? `<tr><td>Removal: sell $${f(d.removalTotal)}, cost $${f(d.internalRemovalCost)}</td><td class="r" style="color:${remMCol};font-weight:700;">GP $${f(removalMargin)} (${removalMarginPct.toFixed(0)}%)</td></tr>` : ''}
            <tr><td>Labour cost (${d.totalMetres.toFixed(1)}m × $${f(COST_PRICES.labourPerMetre)}/m${d.accessRate > 0 ? ' + access' : ''})</td><td class="r">$${f(d.internalLabour)}</td></tr>
            <tr><td>Other (addons, surcharges, custom)</td><td class="r" style="font-weight:700;">$${f(d.addonsTotal + d.customTotal + d.accessSurcharge + d.urgencySurcharge + d.groundFinishTotal)}</td></tr>
            <tr style="border-top:1px solid #e5e7eb;"><td style="padding-top:6px;font-weight:700;">Total GP</td><td class="r" style="padding-top:6px;font-weight:700;font-size:14px;color:${gpCol};">$${f(gp)} (${gpPct.toFixed(1)}%)</td></tr>
          </table>
        </div>`;

        el.innerHTML = html;
        const bothApproved = matApproved && labApproved;
        if (statusEl) {
          statusEl.className = 'section-status ' + (bothApproved ? 'done' : 'partial');
        }
      },

      togglePOApproval(type) {
        this._poApproved[type] = !this._poApproved[type];
        this.renderProfitOrders();
        if (this._poApproved[type]) {
          this.showToast(type.charAt(0).toUpperCase() + type.slice(1) + ' PO approved', 'success');
        }
      },

      // ── New Job ──
      newJob() {
        if (!confirm('Start a new job? This will clear all current data.')) return;
        localStorage.removeItem('fenceJob');
        this.job = null;
        this.currentRunId = null;
        this._resetSections();
        this.init();
        window.scrollTo(0, 0);
      },

      resetJob() {
        if (!confirm('Reset everything? All data, photos, and runs will be permanently deleted.')) return;
        localStorage.removeItem('fenceJob');
        this.job = null;
        this.currentRunId = null;
        this._siteInfoTab = 'client';
        this._resetSections();
        this.init();
        window.scrollTo(0, 0);
      },

      _resetSections() {
        Object.keys(this._openSections).forEach(k => {
          this._openSections[k] = false;
          const key = k.charAt(0).toUpperCase() + k.slice(1);
          const el = document.getElementById('section' + key);
          if (el) el.classList.remove('open');
        });
        this._openSections.siteInfo = true;
        const siteEl = document.getElementById('sectionSiteInfo');
        if (siteEl) siteEl.classList.add('open');
      },

      // ── Render ──
      // ── Section toggle & status system ──
      _openSections: { siteInfo: true, removal: false, installation: false, runs: false, gates: false, visualizer: false, stats: false, breakdown: false, profitOrders: false, quote: false, checklist: false },

      toggleSection(sectionId) {
        const opening = !this._openSections[sectionId];
        // Close all other sections
        Object.keys(this._openSections).forEach(k => {
          if (k !== sectionId && this._openSections[k]) {
            this._openSections[k] = false;
            const otherKey = k.charAt(0).toUpperCase() + k.slice(1);
            const otherEl = document.getElementById('section' + otherKey);
            if (otherEl) otherEl.classList.remove('open');
          }
        });
        this._openSections[sectionId] = opening;
        const key = sectionId.charAt(0).toUpperCase() + sectionId.slice(1);
        const el = document.getElementById('section' + key);
        if (el) el.classList.toggle('open', opening);
        if (sectionId === 'visualizer' && opening) {
          requestAnimationFrame(() => this.renderProfileView());
        }
      },

      updateSectionStatuses() {
        const j = this.job;
        const clientDone = [j.clientFirstName, j.clientLastName, j.address, j.phone, j.email].every(Boolean);
        const neighboursDone = j.neighboursRequired === false ||
          (j.neighboursRequired === true && j.neighbours && j.neighbours.length > 0 && j.neighbours[0].firstName);
        const siteComplete = clientDone && (j.neighboursRequired !== undefined) && neighboursDone;
        this._setSectionStatus('SiteInfo', siteComplete ? 'complete' : 'warning');

        const r = j.removal || {};
        const removalDone = r.removalRequired === false ||
          (r.removalRequired === true && r.existingFenceType && r.existingFenceLength > 0);
        this._setSectionStatus('Removal', removalDone ? 'complete' : 'warning');

        this._setSectionStatus('Installation',
          (j.profile && j.colour) ? 'complete' : 'warning');

        const allRunsComplete = j.runs.length > 0 && j.runs.every(run => run.name && run.length > 0 && run.sheetHeight);
        const hasRuns = j.runs.some(run => run.panels.length > 0);
        this._setSectionStatus('Runs', (hasRuns && allRunsComplete) ? 'complete' : 'warning');
        const gatesDone = j.gatesRequired === false ||
          (j.gatesRequired === true && (j.gates || []).length > 0);
        this._setSectionStatus('Gates', gatesDone ? 'complete' : 'warning');
        const hasLength = j.runs.some(run => run.length > 0);
        this._setSectionStatus('Visualizer', hasLength ? 'complete' : 'warning');
        this._setSectionStatus('Stats', hasRuns ? 'complete' : 'warning');
        this._setSectionStatus('Quote', j.pricePerMetre > 0 ? 'complete' : 'warning');

        const cl = j.checklist || {};
        const photoCount = (cl.photos || []).length;
        this._setSectionStatus('Checklist',
          (photoCount >= 5 && cl.videoWalkthrough) ? 'complete' : 'warning');
      },

      _setSectionStatus(name, status) {
        const el = document.getElementById('status' + name);
        if (el) el.className = 'section-status ' + status;
      },

      // ── Render Site Information ──
      _siteInfoTab: 'client',

      renderSiteInfo() {
        const j = this.job;
        const tab = this._siteInfoTab || 'client';
        const nbs = j.neighbours || [];

        let contentHtml = '';
        if (tab === 'client') {
          contentHtml = `
            <div class="form-row">
              <div class="form-group">
                <label>First Name * <span style="font-size:11px;font-weight:400;color:#4C6A7C;">(type to search GHL)</span></label>
                <div class="address-autocomplete-wrap">
                  <input type="text" id="clientFirstNameInput" value="${this._esc(j.clientFirstName)}" placeholder="Client first name"
                    oninput="app.onClientNameInput(this.value)"
                    onchange="app.updateField('clientFirstName', this.value)"
                    onkeydown="app.onClientNameKeydown(event)"
                    autocomplete="off">
                  <div class="address-dropdown" id="clientNameDropdown"></div>
                </div>
              </div>
              <div class="form-group">
                <label>Last Name *</label>
                <input type="text" id="clientLastNameInput" value="${this._esc(j.clientLastName)}" placeholder="Client last name"
                  onchange="app.updateField('clientLastName', this.value)">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Phone *</label>
                <input type="tel" id="clientPhone" value="${this._esc(j.phone)}" placeholder="+61 400 000 000"
                  onchange="app.updateField('phone', this.value)">
              </div>
              <div class="form-group">
                <label>Email *</label>
                <input type="email" id="clientEmail" value="${this._esc(j.email)}" placeholder="client@example.com"
                  onchange="app.updateField('email', this.value)">
              </div>
            </div>
            <div class="form-row full-width">
              <div class="form-group">
                <label>Site Address *</label>
                <div class="address-autocomplete-wrap">
                  <input type="text" id="addressInput" value="${this._esc(j.address)}" placeholder="Start typing address..."
                    oninput="app.onAddressInput(this.value)"
                    onchange="app.updateField('address', this.value)"
                    onkeydown="app.onAddressKeydown(event)"
                    autocomplete="off">
                  <div class="address-dropdown" id="addressDropdown"></div>
                </div>
              </div>
            </div>
            <div class="form-row full-width">
              <div class="form-group">
                <label>Suburb *</label>
                <input type="text" id="clientSuburb" value="${this._esc(j.suburb)}" placeholder="Suburb"
                  onchange="app.updateField('suburb', this.value)">
              </div>
            </div>
            <div class="form-row full-width" id="addressMapPreviewRow" style="display:${j._latlng ? '' : 'none'}">
              <div class="form-group">
                <img id="addressMapPreview" src="${j._latlng && GOOGLE_MAPS_API_KEY !== 'YOUR_API_KEY_HERE' ? 'https://maps.googleapis.com/maps/api/staticmap?center=' + j._latlng.lat + ',' + j._latlng.lng + '&zoom=18&size=300x150&maptype=satellite&key=' + GOOGLE_MAPS_API_KEY : ''}"
                  style="border-radius:4px;width:100%;max-width:300px;${j._latlng ? '' : 'display:none'}" alt="Property satellite view">
              </div>
            </div>
            <div class="form-row full-width">
              <div class="form-group">
                <label>Site Plan</label>

      addNeighbour() {
        if (!this.job.neighbours) this.job.neighbours = [];
        this.job.neighbours.push({
          id: 'nb-' + Date.now(),
          firstName: '', lastName: '', phone: '', email: '', address: ''
        });
        this.save();
        this.renderSiteInfo();
      },

      deleteNeighbour(nbId) {
        if (!this.job.neighbours) return;
        this.job.neighbours = this.job.neighbours.filter(n => n.id !== nbId);
        if (this.job.neighbours.length === 0) {
          this.job.neighbours.push({ id: 'nb-' + Date.now(), firstName: '', lastName: '', phone: '', email: '', address: '' });
        }
        this.save();
        this.renderSiteInfo();
      },

      updateNeighbour(nbId, field, value) {
        if (!this.job.neighbours) return;
        if (field === 'phone') value = this._formatPhone(value);
        const nb = this.job.neighbours.find(n => n.id === nbId);
        if (nb) nb[field] = value;
        this.save();
        if (field === 'phone') this.renderSiteInfo();
      },

        const photos = cl.photos || [];
        const photoCount = photos.length;
        const photoColor = photoCount === 0 ? '#dc2626' : photoCount < 5 ? '#d97706' : '#16a34a';
        const photoMsg = photoCount === 0 ? 'No photos — at least 1 required'
          : photoCount < 5 ? photoCount + ' photo' + (photoCount > 1 ? 's' : '') + ' — need ' + (5 - photoCount) + ' more for complete checklist'
          : photoCount + ' photos — Done';

        let thumbsHtml = '';
        if (photos.length > 0) {

            <div class="photo-thumb">
