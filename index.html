              <div class="photo-thumb-name">${this._esc(p.name)}</div>
              ${p.cloudUrl ? '<div style="position:absolute;top:2px;left:2px;background:#16a34a;color:#fff;font-size:9px;padding:1px 4px;border-radius:3px;">&#9989;</div>' : '<div style="position:absolute;top:2px;left:2px;background:#d97706;color:#fff;font-size:9px;padding:1px 4px;border-radius:3px;">pending</div>'}
            </div>
          `).join('') + '</div>';
        }

        document.getElementById('bodyChecklist').innerHTML = `
          <div class="form-row full-width">
            <div class="form-group">
              <label>Site Photos *</label>
              <div class="photo-upload-area" id="photoUploadArea"
                onclick="document.getElementById('photoFileInput').click()"
                ondragover="event.preventDefault(); this.classList.add('dragover')"
                ondragleave="this.classList.remove('dragover')"
                ondrop="event.preventDefault(); this.classList.remove('dragover'); app.handlePhotoDrop(event)">
                <div style="color:#4C6A70;">
                  <div style="font-size:32px;margin-bottom:6px;">&#128247;</div>
                  <div style="font-weight:600;font-size:15px;">Tap to take or select photos</div>
                  <div style="font-size:13px;margin-top:4px;opacity:0.8;">Camera or gallery — select multiple from photo library</div>
                </div>
              </div>
              <input type="file" id="photoFileInput" accept="image/*,.heic,.heif" multiple
                style="display:none" onchange="app.handlePhotoSelect(event)">
              ${thumbsHtml}
              <div style="margin-top:8px;font-size:14px;font-weight:600;color:${photoColor};">${photoMsg}</div>
            </div>
          </div>
          <div class="form-row full-width">
            <div class="form-group">
              <label>Video Walkthrough</label>
              <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px;">
                <div class="toggle-group">
                  <button class="toggle-btn ${cl.videoWalkthrough ? 'active' : ''}"
                    onclick="app.updateChecklist('videoWalkthrough', true)">Done</button>
                  <button class="toggle-btn ${!cl.videoWalkthrough ? 'active' : ''}"
                    onclick="app.updateChecklist('videoWalkthrough', false)">Not Done</button>
                </div>
                <button class="btn-orange" style="font-size:13px;padding:8px 14px;" onclick="document.getElementById('videoFileInput').click()">
                  Upload Video
                </button>
                <input type="file" id="videoFileInput" accept="video/*"
                  style="display:none" onchange="app.handleVideoSelect(event)">
                ${cl.videoFile ? '<span style="font-size:12px;color:#16a34a;font-weight:600;">Video attached: ' + (cl.videoFileName || 'walkthrough.mp4') + '</span>' : ''}
              </div>
            </div>
          </div>
          <div class="form-row full-width">
            <div class="form-group">
              <label>Final Notes <span style="font-weight:400;font-size:11px;color:#4C6A70;">(internal — not shown on client quote)</span></label>
              <textarea rows="4" placeholder="Anything else to note about this scope — appears on work order only..."
                onchange="app.updateChecklist('finalNotes', this.value)">${this._esc(cl.finalNotes)}</textarea>
            </div>
          </div>
        `;
      },

      // ── Field update handlers ──
      _formatPhone(val) {
        if (!val) return val;
        let d = val.replace(/[^\d+]/g, '');
        if (d.startsWith('0')) d = '+61' + d.slice(1);
        else if (d.startsWith('61') && !d.startsWith('+')) d = '+' + d;
        else if (/^\d{9}$/.test(d)) d = '+61' + d;
        // Format: +61 4XX XXX XXX
        const m = d.match(/^\+61(\d)(\d{2})(\d{3})(\d{3})$/);
        if (m) return '+61 ' + m[1] + m[2] + ' ' + m[3] + ' ' + m[4];
        return d;
      },

      updateField(field, value) {
        if (field === 'phone') value = this._formatPhone(value);
        this.job[field] = value;
        if (field === 'clientFirstName' || field === 'clientLastName') {
          this.job.client = [this.job.clientFirstName, this.job.clientLastName].filter(Boolean).join(' ');
          this._updateHeaderBadge();
        }
        this.save();
        this.updateSectionStatuses();
        if (field === 'neighboursRequired' || field === 'phone') {
          this.renderSiteInfo();
        }
        if (field === 'gatesRequired') {
          this.renderGatesSection();
        }
      },

      // ── Address autocomplete (Google Places with addressr.io fallback) ──
      _addressDebounceTimer: null,
      _addressResults: [],
      _addressActiveIdx: -1,
      _placesAutocomplete: null,
      _placesService: null,

      _isGooglePlacesAvailable() {
        return window.google && google.maps && google.maps.places && GOOGLE_MAPS_API_KEY !== 'YOUR_API_KEY_HERE';
      },

      onAddressInput(query) {
        clearTimeout(this._addressDebounceTimer);
        if (query.length < 3) {
          this.hideAddressDropdown();
          return;
        }
        this._addressDebounceTimer = setTimeout(() => this.fetchAddresses(query), 300);
      },

      async fetchAddresses(query) {
        if (this._isGooglePlacesAvailable()) {
          this._fetchGooglePlaces(query);
        } else {
          this._fetchAddressrFallback(query);
        }
      },

      _fetchGooglePlaces(query) {
        if (!this._placesAutocomplete) {
          this._placesAutocomplete = new google.maps.places.AutocompleteService();
        }
        this._placesAutocomplete.getPlacePredictions({
          input: query,
          componentRestrictions: { country: 'au' },
          types: ['address']
        }, (predictions, status) => {
          if (status !== google.maps.places.PlacesServiceStatus.OK || !predictions) {
            this._addressResults = [];
            this.renderAddressDropdown(query);
            return;
          }
          this._addressResults = predictions.map(p => ({
            sla: p.description,
            placeId: p.place_id,
            _isGoogle: true
          }));
          this.renderAddressDropdown(query);
        });
      },

      async _fetchAddressrFallback(query) {
        console.log('[Address] Google Places not available, using addressr.io fallback');
        try {
          const biased = /\bWA\b/i.test(query) ? query : query + ' WA';
          const res = await fetch('https://api.addressr.io/addresses?q=' + encodeURIComponent(biased));
          if (!res.ok) return;
          const data = await res.json();
          const all = Array.isArray(data) ? data : [];
          this._addressResults = [
            ...all.filter(r => /\bWA\b/.test(r.sla)),
            ...all.filter(r => !/\bWA\b/.test(r.sla))
          ];
          this.renderAddressDropdown(query);
        } catch (e) {
          // API error — silently fail, input still works as normal text field
        }
      },

      renderAddressDropdown(query) {
        const dd = document.getElementById('addressDropdown');
        if (!dd) return;
        const results = this._addressResults;
        if (results.length === 0) {
          dd.innerHTML = '<div class="address-dropdown-item" style="color:#6b7280;cursor:default;">No addresses found</div>';
          dd.classList.add('open');
          this._addressActiveIdx = -1;
          return;
        }
        dd.innerHTML = results.map((r, i) => {
          const display = (r.highlight && r.highlight.sla) ? r.highlight.sla : this._esc(r.sla);
          return `<div class="address-dropdown-item" data-idx="${i}" onmousedown="app.selectAddress(${i})">${display}</div>`;
        }).join('');
        dd.classList.add('open');
        this._addressActiveIdx = -1;
      },

      selectAddress(idx) {
        const r = this._addressResults[idx];
        if (!r) return;
        const input = document.getElementById('addressInput');

        if (r._isGoogle && r.placeId) {
          // Google Places: get full details
          if (!this._placesService) {
            const div = document.createElement('div');
            this._placesService = new google.maps.places.PlacesService(div);
          }
          this._placesService.getDetails({
            placeId: r.placeId,
            fields: ['formatted_address', 'address_components', 'geometry', 'place_id']
          }, (place, status) => {
            if (status !== google.maps.places.PlacesServiceStatus.OK || !place) {
              // Fallback: just use the prediction text
              if (input) input.value = r.sla;
              this.updateField('address', r.sla);
              this.hideAddressDropdown();
              return;
            }

            const fullAddress = place.formatted_address || r.sla;
            if (input) input.value = fullAddress;
            this.updateField('address', fullAddress);

            // Store Place ID and coordinates
            this.job._placeId = place.place_id;
            if (place.geometry && place.geometry.location) {
              this.job._latlng = {
                lat: place.geometry.location.lat(),
                lng: place.geometry.location.lng()
              };
            }

            // Parse structured address components
            const components = {};
            (place.address_components || []).forEach(c => {
              if (c.types.includes('street_number')) components.street_number = c.long_name;
              if (c.types.includes('route')) components.route = c.long_name;
              if (c.types.includes('locality')) components.suburb = c.long_name;
              if (c.types.includes('administrative_area_level_1')) components.state = c.short_name;
              if (c.types.includes('postal_code')) components.postcode = c.long_name;
            });
            const street = [components.street_number, components.route].filter(Boolean).join(' ');
            this.job._addressComponents = {
              street: street,
              suburb: components.suburb || '',
              state: components.state || '',
              postcode: components.postcode || ''
            };

            // Auto-fill suburb from structured data
            if (components.suburb) {
              this.job.suburb = components.suburb;
              const suburbInput = document.getElementById('clientSuburb');
              if (suburbInput) suburbInput.value = components.suburb;
            }

            // Show static map preview
            this._showAddressMapPreview();

            this.save();
            this.updateSectionStatuses();
            this.hideAddressDropdown();
          });
        } else {
          // addressr.io fallback — just use the text
          if (input) input.value = r.sla;
          this.updateField('address', r.sla);
          this.hideAddressDropdown();
        }
      },

      _showAddressMapPreview() {
        if (!this.job._latlng || GOOGLE_MAPS_API_KEY === 'YOUR_API_KEY_HERE') return;
        const row = document.getElementById('addressMapPreviewRow');
        const img = document.getElementById('addressMapPreview');
        if (row && img) {
          img.src = 'https://maps.googleapis.com/maps/api/staticmap?center=' +
            this.job._latlng.lat + ',' + this.job._latlng.lng +
            '&zoom=18&size=300x150&maptype=satellite&key=' + GOOGLE_MAPS_API_KEY;
          img.style.display = '';
          row.style.display = '';
        }
      },

      hideAddressDropdown() {
        const dd = document.getElementById('addressDropdown');
        if (dd) { dd.classList.remove('open'); dd.innerHTML = ''; }
        this._addressResults = [];
        this._addressActiveIdx = -1;
      },

      onAddressKeydown(e) {
        const dd = document.getElementById('addressDropdown');
        if (!dd || !dd.classList.contains('open')) return;
        const items = dd.querySelectorAll('.address-dropdown-item[data-idx]');
        if (!items.length) return;

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          this._addressActiveIdx = Math.min(this._addressActiveIdx + 1, items.length - 1);
          this._highlightAddressItem(items);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          this._addressActiveIdx = Math.max(this._addressActiveIdx - 1, 0);
          this._highlightAddressItem(items);
        } else if (e.key === 'Enter' && this._addressActiveIdx >= 0) {
          e.preventDefault();
          this.selectAddress(this._addressActiveIdx);
        } else if (e.key === 'Escape') {
          this.hideAddressDropdown();
        }
      },

      _highlightAddressItem(items) {
        items.forEach((el, i) => {
          el.classList.toggle('active', i === this._addressActiveIdx);
          if (i === this._addressActiveIdx) el.scrollIntoView({ block: 'nearest' });
        });
      },

      // ── GHL Contact search from client name field ──
      _clientNameDebounce: null,
      _clientNameResults: [],
      _clientNameActiveIdx: -1,

      onClientNameInput(query) {
        clearTimeout(this._clientNameDebounce);
        if (query.length < 2) {
          this.hideClientNameDropdown();
          return;
        }
        this._clientNameDebounce = setTimeout(() => this._searchGHLContacts(query), 400);
      },

      async _searchGHLContacts(query) {
        var cloud = window.SECUREWORKS_CLOUD;
        if (!cloud || !cloud.auth.isLoggedIn()) return;
        try {
          var opps = await cloud.ghl.search(query);
          this._clientNameResults = opps || [];
          this._renderClientNameDropdown();
        } catch(e) {
          console.warn('[GHL Search] Failed:', e);
        }
      },

      _renderClientNameDropdown() {
        const dd = document.getElementById('clientNameDropdown');
        if (!dd) return;
        const results = this._clientNameResults;
        if (results.length === 0) {
          dd.innerHTML = '<div class="address-dropdown-item" style="color:#6b7280;cursor:default;">No contacts found in GHL</div>';
          dd.classList.add('open');
          this._clientNameActiveIdx = -1;
          return;
        }
        dd.innerHTML = results.map((opp, i) => {
          const subtitle = [opp.contactPhone, opp.contactEmail, opp.stageName].filter(Boolean).join(' · ');
          return '<div class="address-dropdown-item" data-idx="' + i + '" onmousedown="app.selectGHLContact(' + i + ')" style="padding:8px 12px;">' +
            '<div style="font-weight:600;color:#293C46;">' + this._esc(opp.contactName || opp.name || '') + '</div>' +
            (subtitle ? '<div style="font-size:12px;color:#4C6A7C;margin-top:2px;">' + this._esc(subtitle) + '</div>' : '') +
          '</div>';
        }).join('');
        dd.classList.add('open');
        this._clientNameActiveIdx = -1;
      },

      async selectGHLContact(idx) {
        const opp = this._clientNameResults[idx];
        if (!opp) return;
        this.hideClientNameDropdown();

        // Trigger the full GHL load flow via integration
        if (window._swIntegration && window._swIntegration.loadPicker) {
          // Simulate the opportunity selection flow from integration.js
          var cloud = window.SECUREWORKS_CLOUD;
          if (!cloud) return;

          this.showToast('Loading ' + (opp.contactName || opp.name) + ' from GHL...', 'info');

          try {
            // Fetch full contact from GHL
            var contact = null;
            if (opp.contactId) {
              try {
                contact = await cloud.ghl.getContact(opp.contactId);
              } catch(e) {
                contact = { name: opp.contactName, email: opp.contactEmail, phone: opp.contactPhone };
              }
            } else {
              contact = { name: opp.contactName, email: opp.contactEmail, phone: opp.contactPhone };
            }

            // Prefill contact into the job
            if (contact) {
              if (contact.firstName) {
                this.job.clientFirstName = contact.firstName;
                this.job.clientLastName = contact.lastName || '';
              } else {
                var parts = (contact.name || '').split(' ');
                this.job.clientFirstName = parts[0] || '';
                this.job.clientLastName = parts.slice(1).join(' ');
              }
              this.job.client = contact.name || [contact.firstName, contact.lastName].filter(Boolean).join(' ');
              if (contact.email) this.job.email = contact.email;
              if (contact.phone) this.job.phone = contact.phone;
              var fullAddr = [contact.address, contact.suburb, contact.state, contact.postcode].filter(Boolean).join(', ');
              if (fullAddr) this.job.address = fullAddr;
              else if (contact.address) this.job.address = contact.address;
              if (contact.suburb) this.job.suburb = contact.suburb;
            }

            // Check for existing job linked to this opportunity
            var existingJob = null;
            try {
              existingJob = await cloud.ghl.findJobByOpportunity(opp.id, 'fencing');
            } catch(e) { /* no existing job */ }

            if (existingJob && existingJob.scope_json && Object.keys(existingJob.scope_json).length > 0) {
              if (confirm('Found existing scope for ' + (opp.contactName || opp.name) + '. Load it?')) {
                window.app.job = existingJob.scope_json.job || window.app.job;
                if (window.app.job.runs && window.app.job.runs.length > 0) {
                  window.app.currentRunId = window.app.job.runs[0].id;
                }
              }
            }

            this.save();
            this.render();
            this.updateSectionStatuses();
            this._updateHeaderBadge();
            this.showToast('Loaded: ' + (contact.name || opp.contactName), 'success');
          } catch(e) {
            this.showToast('Failed to load contact: ' + e.message, 'error');
          }
        }
      },

      hideClientNameDropdown() {
        const dd = document.getElementById('clientNameDropdown');
        if (dd) { dd.classList.remove('open'); dd.innerHTML = ''; }
        this._clientNameResults = [];
        this._clientNameActiveIdx = -1;
      },

      onClientNameKeydown(e) {
        const dd = document.getElementById('clientNameDropdown');
        if (!dd || !dd.classList.contains('open')) return;
        const items = dd.querySelectorAll('.address-dropdown-item[data-idx]');
        if (!items.length) return;
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          this._clientNameActiveIdx = Math.min(this._clientNameActiveIdx + 1, items.length - 1);
          items.forEach((el, i) => el.classList.toggle('active', i === this._clientNameActiveIdx));
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          this._clientNameActiveIdx = Math.max(this._clientNameActiveIdx - 1, 0);
          items.forEach((el, i) => el.classList.toggle('active', i === this._clientNameActiveIdx));
        } else if (e.key === 'Enter' && this._clientNameActiveIdx >= 0) {
          e.preventDefault();
          this.selectGHLContact(this._clientNameActiveIdx);
        } else if (e.key === 'Escape') {
          this.hideClientNameDropdown();
        }
      },

      // ── Site Plan Modal (satellite + drawing canvas) ──
      showSitePlanModal() {
        if (!this.job._latlng) {
          this.showToast('Enter a site address first to load the satellite view', 'error');
          return;
        }
        if (!this._isGooglePlacesAvailable()) {
          this.showToast('Google Maps API key not configured', 'error');
          return;
        }

        var existing = document.getElementById('sitePlanModal');
        if (existing) existing.remove();

        var overlay = document.createElement('div');
        overlay.id = 'sitePlanModal';
        overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:10000;display:flex;flex-direction:column;';

        overlay.innerHTML =
          '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:#293C46;">' +
            '<span style="color:#fff;font-weight:700;font-size:16px;">Site Plan — Draw Fence Lines</span>' +
            '<button onclick="document.getElementById(\'sitePlanModal\').remove()" style="background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:4px 8px;">&times;</button>' +
          '</div>' +
          '<div id="spMapContainer" style="flex:1;position:relative;overflow:hidden;">' +
            '<div id="spMap" style="width:100%;height:100%;"></div>' +
            '<canvas id="spCanvas" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;touch-action:none;"></canvas>' +
          '</div>' +
          '<div style="display:flex;gap:8px;padding:8px 16px;background:#293C46;justify-content:center;flex-wrap:wrap;">' +
            '<button id="spDrawBtn" onclick="app._spToggleDraw()" style="padding:10px 20px;background:#4C6A7C;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;">Draw</button>' +
            '<button onclick="app._spUndo()" style="padding:10px 20px;background:#4C6A7C;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;">Undo</button>' +
            '<button onclick="app._spClear()" style="padding:10px 20px;background:#4C6A7C;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;">Clear</button>' +
            '<button onclick="app._spCapture()" style="padding:10px 20px;background:#F15A29;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;">Capture Site Plan</button>' +
          '</div>';

        document.body.appendChild(overlay);

        // Init map
        var self = this;
        var latlng = this.job._latlng;
        setTimeout(function() {
          var mapDiv = document.getElementById('spMap');
          var canvas = document.getElementById('spCanvas');
          if (!mapDiv || !canvas) return;

          self._spMap = new google.maps.Map(mapDiv, {
            center: latlng,
            zoom: 19,
            mapTypeId: 'satellite',
            disableDefaultUI: true,
            zoomControl: true,
            gestureHandling: 'greedy'
          });

          // Size canvas
          var rect = mapDiv.getBoundingClientRect();
          canvas.width = rect.width * (window.devicePixelRatio || 1);
          canvas.height = rect.height * (window.devicePixelRatio || 1);
          canvas.style.width = rect.width + 'px';
          canvas.style.height = rect.height + 'px';

          var ctx = canvas.getContext('2d');
          ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);

          self._spCtx = ctx;
          self._spCanvas = canvas;
          self._spStrokes = [];
          self._spCurrentStroke = null;
          self._spDrawing = false;
          self._spDrawMode = false;
          self._spCanvasW = rect.width;
          self._spCanvasH = rect.height;
        }, 300);
      },

      _spToggleDraw() {
        this._spDrawMode = !this._spDrawMode;
        var btn = document.getElementById('spDrawBtn');
        var canvas = this._spCanvas;
        if (this._spDrawMode) {
          btn.style.background = '#F15A29';
          btn.textContent = 'Drawing ON';
          canvas.style.pointerEvents = 'all';
          // Touch/mouse handlers
          var self = this;
          canvas.onmousedown = function(e) { self._spStartStroke(e.offsetX, e.offsetY); };
          canvas.onmousemove = function(e) { if (self._spDrawing) self._spAddPoint(e.offsetX, e.offsetY); };
          canvas.onmouseup = function() { self._spEndStroke(); };
          canvas.ontouchstart = function(e) {
            e.preventDefault();
            var t = e.touches[0]; var r = canvas.getBoundingClientRect();
            self._spStartStroke(t.clientX - r.left, t.clientY - r.top);
          };
          canvas.ontouchmove = function(e) {
            e.preventDefault();
            if (!self._spDrawing) return;
            var t = e.touches[0]; var r = canvas.getBoundingClientRect();
            self._spAddPoint(t.clientX - r.left, t.clientY - r.top);
          };
          canvas.ontouchend = function(e) { e.preventDefault(); self._spEndStroke(); };
        } else {
          btn.style.background = '#4C6A7C';
          btn.textContent = 'Draw';
          canvas.style.pointerEvents = 'none';
          canvas.onmousedown = canvas.onmousemove = canvas.onmouseup = null;
          canvas.ontouchstart = canvas.ontouchmove = canvas.ontouchend = null;
        }
      },

      _spStartStroke(x, y) {
        this._spDrawing = true;
        this._spCurrentStroke = [{ x, y }];
      },

      _spAddPoint(x, y) {
        if (!this._spCurrentStroke) return;
        this._spCurrentStroke.push({ x, y });
        this._spRedraw();
      },

      _spEndStroke() {
        if (this._spCurrentStroke && this._spCurrentStroke.length > 1) {
          this._spStrokes.push(this._spCurrentStroke);
        }
        this._spCurrentStroke = null;
        this._spDrawing = false;
        this._spRedraw();
      },

      _spRedraw() {
        var ctx = this._spCtx;
        ctx.clearRect(0, 0, this._spCanvasW, this._spCanvasH);
        var allStrokes = this._spStrokes.concat(this._spCurrentStroke ? [this._spCurrentStroke] : []);
        ctx.strokeStyle = '#F15A29';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        allStrokes.forEach(function(stroke) {
          if (stroke.length < 2) return;
          ctx.beginPath();
          ctx.moveTo(stroke[0].x, stroke[0].y);
          for (var i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i].x, stroke[i].y);
          ctx.stroke();
        });
      },

      _spUndo() {
        if (this._spStrokes.length > 0) {
          this._spStrokes.pop();
          this._spRedraw();
        }
      },

      _spClear() {
        this._spStrokes = [];
        this._spCurrentStroke = null;
        this._spRedraw();
      },

      _spCapture() {
        if (!this._spMap || !this._spCanvas) return;
        var self = this;
        var center = this._spMap.getCenter();
        var zoom = this._spMap.getZoom();
        var w = this._spCanvasW;
        var h = this._spCanvasH;

        // Use Static Maps API for the background (avoids CORS issues with tile rendering)
        var staticUrl = 'https://maps.googleapis.com/maps/api/staticmap?center=' +
          center.lat() + ',' + center.lng() + '&zoom=' + zoom +
          '&size=' + Math.round(w) + 'x' + Math.round(h) + '&maptype=satellite&scale=2&key=' + GOOGLE_MAPS_API_KEY;

        var bgImg = new Image();
        bgImg.crossOrigin = 'anonymous';
        bgImg.onload = function() {
          var outCanvas = document.createElement('canvas');
          outCanvas.width = w * 2;
          outCanvas.height = h * 2;
          var outCtx = outCanvas.getContext('2d');

          // Draw satellite background
          outCtx.drawImage(bgImg, 0, 0, outCanvas.width, outCanvas.height);

          // Draw user strokes on top
          outCtx.strokeStyle = '#F15A29';
          outCtx.lineWidth = 8;
          outCtx.lineCap = 'round';
          outCtx.lineJoin = 'round';
          self._spStrokes.forEach(function(stroke) {
            if (stroke.length < 2) return;
            outCtx.beginPath();
            outCtx.moveTo(stroke[0].x * 2, stroke[0].y * 2);
            for (var i = 1; i < stroke.length; i++) outCtx.lineTo(stroke[i].x * 2, stroke[i].y * 2);
            outCtx.stroke();
          });

          var dataUrl = outCanvas.toDataURL('image/png');
          self.job.sitePlanImage = dataUrl;

          // Also push to checklist photos for cloud upload
          if (!self.job.checklist) self.job.checklist = {};
          if (!self.job.checklist.photos) self.job.checklist.photos = [];
          // Remove any previous site plan photo
          self.job.checklist.photos = self.job.checklist.photos.filter(function(p) { return p.label !== 'Site Plan'; });
          self.job.checklist.photos.push({
            id: 'siteplan-' + Date.now(),
            name: 'Site Plan',
            label: 'Site Plan',
            dataUrl: dataUrl,
            timestamp: Date.now()
          });

          self.save();
          self.showToast('Site plan captured', 'success');
          var modal = document.getElementById('sitePlanModal');
          if (modal) modal.remove();
          self.renderSiteInfo();
        };
        bgImg.onerror = function() {
          self.showToast('Failed to capture map image — check API key', 'error');
        };
        bgImg.src = staticUrl;
      },

      showSitePlanEnlarged() {
        if (!this.job.sitePlanImage) return;
        var overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:10001;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:20px;';
        overlay.innerHTML = '<img src="' + this.job.sitePlanImage + '" style="max-width:100%;max-height:100%;border-radius:8px;">';
        overlay.onclick = function() { overlay.remove(); };
        document.body.appendChild(overlay);
      },

      updateRemoval(field, value) {
        if (!this.job.removal) this.job.removal = {};
        if (field === 'existingFenceLength') value = parseFloat(value) || 0;
        if (field === 'asbestosSheetCount') value = parseInt(value) || 0;
        this.job.removal[field] = value;
        // Auto-set asbestos defaults when type changes to asbestos
        if (field === 'existingFenceType' && value === 'asbestos') {
          if (this.job.removal.asbestosCert === undefined) this.job.removal.asbestosCert = true;
          this.job.removal.asbestosSheetCount = Math.ceil(this.job.removal.existingFenceLength || 0);
        }
        // Re-calc sheet count when length changes and type is asbestos
        if (field === 'existingFenceLength' && this.job.removal.existingFenceType === 'asbestos') {
          this.job.removal.asbestosSheetCount = Math.ceil(value || 0);
        }
        this.save();
        this.updateSectionStatuses();
        this.renderRemoval();
      },

      updateInstallation(field, value) {
        if (!this.job.installation) this.job.installation = {};
        if (field === 'coreDrill') value = !!value;
        if (field === 'coreDrillHoles') value = parseInt(value) || 0;
        this.job.installation[field] = value;
        this.save();
        this.renderInstallation();
        this.updateSectionStatuses();
      },

      updateSupplier(value) {
        this.job.supplier = value;
        const supplierData = SUPPLIER_PROFILES[value];
        if (!supplierData.profiles.includes(this.job.profile)) {
          this.job.profile = supplierData.profiles[0];
        }
        this.recalculateAll();
        this.save();
        this.renderInstallation();
      },

      updateProfile(value) {
        this.job.profile = value;
        this.save();
        this.renderInstallation();
        this.updateSectionStatuses();
      },

      updateColour(value) {
        this.job.colour = value;

        this.save();
        this.renderInstallation();
        this.updateSectionStatuses();
      },

      updateQuote(field, value) {
        if (!this.job.quote) this.job.quote = {};

        this.job.quote[field] = value;
        this.save();
        this.updateStats();
        this.renderQuoteBreakdown();

      },

      updateCustomItem(idx, field, value) {
        if (!this.job.quote) this.job.quote = {};
        if (!this.job.quote.customLineItems) this.job.quote.customLineItems = [{}, {}, {}];
        while (this.job.quote.customLineItems.length <= idx) this.job.quote.customLineItems.push({});
        if (field === 'qty' || field === 'price') value = parseFloat(value) || 0;
        this.job.quote.customLineItems[idx][field] = value;
        this.save();
        this.updateStats();
        this.renderQuoteBreakdown();

      },

      updateChecklist(field, value) {
        if (!this.job.checklist) this.job.checklist = {};
        this.job.checklist[field] = value;
        this.save();
        this.renderChecklist();
        this.updateSectionStatuses();
      },

      handlePhotoSelect(event) {
        const files = event.target.files;
        if (files && files.length > 0) this._processPhotoFiles(files);
        event.target.value = '';
      },

      handlePhotoDrop(event) {
        const files = event.dataTransfer.files;
        if (files && files.length > 0) this._processPhotoFiles(files);
      },

      async _processPhotoFiles(files) {
        if (!this.job.checklist) this.job.checklist = {};
        if (!this.job.checklist.photos) this.job.checklist.photos = [];
        if (!window._photoFiles) window._photoFiles = {};

        let added = 0;
        for (const file of files) {
          // Accept image/* types and also files with image extensions (HEIC/HEIF may have empty type)
          const ext = (file.name || '').split('.').pop().toLowerCase();
          const imgExts = ['jpg','jpeg','png','gif','webp','heic','heif','bmp','tiff'];
          if (!file.type.startsWith('image/') && !imgExts.includes(ext)) continue;
          try {
            // Small thumbnail for display only (~3-5KB each, localStorage friendly)
            const thumbUrl = await this._compressImage(file, 200, 0.5);
            // Medium resolution for cloud upload (~50-100KB each)
            const uploadUrl = await this._compressImage(file, 1200, 0.8);
            const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            // Keep upload-quality image in memory (not localStorage)
            window._photoFiles[id] = uploadUrl;
            this.job.checklist.photos.push({
              id: id,
              name: file.name,
              dataUrl: thumbUrl,
              timestamp: Date.now()
            });
            added++;
          } catch (e) {
            console.warn('Failed to process photo:', file.name, e);
          }
        }
        this.job.checklist.photosTaken = this.job.checklist.photos.length;
        this.save();
        this.renderChecklist();
        this.updateSectionStatuses();
        if (added > 0) this.showToast(added + ' photo' + (added > 1 ? 's' : '') + ' added — will upload on Cloud Save', 'success');
      },

      _compressImage(file, maxDim, quality) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
              let w = img.width, h = img.height;
              if (w > maxDim || h > maxDim) {
                if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
                else { w = Math.round(w * maxDim / h); h = maxDim; }
              }
              const canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = reject;
            img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      },

      handleVideoSelect(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        if (!this.job.checklist) this.job.checklist = {};
        this.job.checklist.videoWalkthrough = true;
        this.job.checklist.videoFileName = file.name;
        this.job.checklist.videoSize = file.size;

        // Keep File object in memory for cloud upload — never store video in localStorage
        // (even small videos exceed localStorage's ~5-10MB limit as base64)
        window.siteVideo = {
          file: file,
          dataUrl: null,
          label: file.name || 'Site Walkthrough'
        };

        this.save();
        this.renderChecklist();
        this.updateSectionStatuses();
        this.showToast('Video attached: ' + file.name + ' (' + (file.size / 1048576).toFixed(1) + 'MB) — will upload on Cloud Save', 'success');
      },

      deletePhoto(photoId) {
        if (!this.job.checklist || !this.job.checklist.photos) return;
        this.job.checklist.photos = this.job.checklist.photos.filter(p => p.id !== photoId);
        this.job.checklist.photosTaken = this.job.checklist.photos.length;
        this.save();
        this.renderChecklist();
        this.updateSectionStatuses();
      },

      _esc(val) {
        if (!val) return '';
        return String(val).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      },

      _getColourHex(name) {
        const c = [...COLOURS_STOCK, ...COLOURS_SPECIAL].find(c => c.name === name);
        return c ? c.hex : '#cccccc';
      },

      _getProfileSVG(profile) {
        const imgBase = 'https://steelselect.com.au/sites/default/files/images/products/main/';
        const dimBase = 'https://steelselect.com.au/sites/default/files/images/products/dimensions/';
        const urls = {
          'Ridgeside': dimBase + 'Ridgeside%20Front.jpg',
          'Sameside': dimBase + 'Sameside%20Front.jpg',
          'Trimclad': imgBase + 'Metroll%20Trimclad-%C2%AB%20Fencing.jpg',
          'Metline Premium': imgBase + 'Metroll%20Metline%20Premium.jpg',
          'Harmony': imgBase + 'Metroll%20Metline%20Harmony.jpg',
          'Metzag': imgBase + 'Metroll%20Metzag%20Fencing.jpg',
          'Corodek': imgBase + 'Metroll%20Corodek-%C2%AB%20Fencing.jpg',
          'Mini Corodek': imgBase + 'Metroll%20Mini%20Corodek-%C2%AB%20Fencing.jpg',
          'Atlas': imgBase + 'Atlas1200.jpg',
          'Polaris': imgBase + 'Polaris%201200.jpg',
          'Gemini': imgBase + 'gemini1200.jpg',
          'Neetascreen': imgBase + 'LYSAGHT%20NEETASCREEN-%C2%AB%20Fencing.jpg',
          'Smartascreen': imgBase + 'LYSAGHT%20SMARTASCREEN-%C2%AB%20Fencing.jpg',
          'Miniscreen': imgBase + 'LYSAGHT%20MINISCREEN-%C2%AB%20Fencing.jpg',
          'Customscreen': imgBase + 'LYSAGHT%20CUSTOMSCREEN-%C2%AB%20Fencing.jpg',
          'Superdek': imgBase + 'stratco-superdek-fencing.jpg',
          'Good Neighbour': imgBase + 'stratco-good-neighbour-fencing.jpg'
        };
        const url = urls[profile];
        const escaped = profile.replace(/'/g, "\\'");
        if (url) {
          return `<div style="margin-top:8px;max-width:340px;">
            <img src="${url}" alt="${this._esc(profile)} profile"
              style="width:100%;border-radius:4px;display:block;background:#f3f4f6;"
              onerror="app._onProfileImgError(this,'${escaped}')">
          </div>`;
        }
        return this._buildProfileSVG(profile);
      },

      _onProfileImgError(img, profile) {
        img.parentElement.innerHTML = this._buildProfileSVG(profile);
      },

      _buildProfileSVG(profile) {
        const pw = 300, ph = 180, railH = 8, postW = 6;
        const base = '#d9d9d9', rail = '#b0b0b0', railEdge = '#a0a0a0';
        const rib = '#c5c5c5', shade = '#b0b0b0', deep = '#a0a0a0', hi = '#e4e4e4';
        const st = railH, sh = ph - 2 * railH;
        const sx = postW, ex = pw - postW;
        let strips = '';

        const drawStrips = (pattern) => {
          let x = sx;
          while (x < ex) {
            for (const [w, c] of pattern) {
              if (x >= ex) break;
              const dw = Math.min(w, ex - x);
              if (c !== base) strips += `<rect x="${x.toFixed(1)}" y="${st}" width="${dw.toFixed(1)}" height="${sh}" fill="${c}"/>`;
              x += w;
            }
          }
        };
        const drawWave = (period, minV, maxV) => {
          for (let x = sx; x < ex; x += 1.5) {
            const t = Math.sin(x * 2 * Math.PI / period);
            const v = Math.round(minV + (maxV - minV) * (t + 1) / 2);
            strips += `<rect x="${x}" y="${st}" width="${Math.min(1.5, ex - x)}" height="${sh}" fill="rgb(${v},${v},${v})"/>`;
          }
        };

        switch(profile) {
          case 'Ridgeside':
            drawStrips([[9,base],[1.5,rib],[0.8,shade],[7,base],[2,rib],[1,shade]]);
            break;
          case 'Sameside':
          case 'Good Neighbour':
            drawWave(24, 185, 225);
            break;
          case 'Trimclad':
          case 'Neetascreen':
            drawStrips([[15,base],[2,rib],[1,shade]]);
            break;
          case 'Metline Premium':
            drawStrips([[10,base],[0.8,shade],[2,hi],[0.8,shade]]);
            break;
          case 'Harmony':
            drawStrips([[2,base],[1.5,rib],[0.8,shade],[2,base],[1.5,rib],[0.8,shade],[2,base],[1.5,rib],[0.8,shade],[10,base]]);
            break;
          case 'Metzag':
            drawStrips([[7,hi],[2.5,shade],[7,hi],[2.5,shade]]);
            break;
          case 'Corodek':
          case 'Customscreen':
            drawWave(20, 180, 228);
            break;
          case 'Mini Corodek':
          case 'Miniscreen':
            drawWave(12, 185, 225);
            break;
          case 'Atlas':
            drawStrips([[1.5,shade],[22,hi],[1.5,shade],[5,base]]);
            break;
          case 'Polaris':
            drawStrips([[14,base],[0.8,shade],[5,hi],[0.8,shade]]);
            break;
          case 'Gemini':
            drawStrips([[5,hi],[2,shade],[5,hi],[2,shade]]);
            break;
          case 'Smartascreen': {
            for (let x = sx; x < ex; x += 1) {
              const t = (x % 20) / 20;
              const v = Math.round(190 + 35 * t);
              strips += `<rect x="${x}" y="${st}" width="1" height="${sh}" fill="rgb(${v},${v},${v})"/>`;
            }
            break;
          }
          case 'Spanscreen':
            drawStrips([[1.5,deep],[20,hi],[1.5,deep],[8,base]]);
            break;
          case 'Superdek':
            drawStrips([[1.5,shade],[16,hi],[1.5,shade],[8,base]]);
            break;
          default:
            drawStrips([[14,base],[2,rib],[1,shade]]);
        }

        return `<svg viewBox="0 0 ${pw} ${ph}" preserveAspectRatio="xMidYMid meet" overflow="hidden" style="width:100%;max-width:340px;height:auto;margin-top:8px;display:block;border-radius:4px;">
          <rect width="${pw}" height="${ph}" fill="${base}" rx="2"/>
          ${strips}
          <rect width="${pw}" height="${railH}" fill="${rail}"/>
          <line x1="0" y1="${railH}" x2="${pw}" y2="${railH}" stroke="${railEdge}" stroke-width="0.5"/>
          <rect y="${ph-railH}" width="${pw}" height="${railH}" fill="${rail}"/>
          <line x1="0" y1="${ph-railH}" x2="${pw}" y2="${railH}" stroke="${railEdge}" stroke-width="0.5"/>
          <rect width="${postW}" height="${ph}" fill="${rail}"/>
          <rect x="${pw-postW}" width="${postW}" height="${ph}" fill="${rail}"/>
          <rect width="${pw}" height="${ph}" fill="none" stroke="${railEdge}" stroke-width="1" rx="2"/>
        </svg>`;
      },

      render() {
        // Sync section open/closed state to DOM
        Object.keys(this._openSections).forEach(k => {
          const key = k.charAt(0).toUpperCase() + k.slice(1);
          const el = document.getElementById('section' + key);
          if (el) el.classList.toggle('open', this._openSections[k]);
        });

        // Recalc slope-derived steps + plinths for all runs before rendering
        this.job.runs.forEach(run => this.calcSlopeForRun(run));

        // Render all scope form sections
        this.renderSiteInfo();
        this.renderRemoval();
        this.renderInstallation();
        this.renderRunTabs();
        this.renderRunContent();
        this.renderGatesSection();
        this.updateStats();
        this.renderQuoteBreakdown();
        this.renderProfitOrders();
        this.renderQuote();
        this.renderChecklist();
        this.updateSectionStatuses();

        // Only render profile view if visualizer section is open
        if (this._openSections.visualizer) {
          this.renderProfileView();
        }
      },

      renderRunTabs() {
        const tabsHtml = this.job.runs.map(run => {
          const panelCount = run.panels.length;
          return `<div class="run-tab ${run.id === this.currentRunId ? 'active' : ''}"
                       onclick="app.switchRun('${run.id}')">
                    ${run.name || 'Unnamed'}${panelCount > 0 ? ` (${panelCount})` : ''}
                  </div>`;
        }).join('');

        document.getElementById('runTabs').innerHTML = `
          ${tabsHtml}
          <button class="add-run-btn" onclick="app.addRun()">+ Add Run</button>
        `;
      },

      renderRunContent() {
        const run = this.job.runs.find(r => r.id === this.currentRunId);
        if (!run) {
          document.getElementById('runContent').innerHTML =
            '<p style="padding: 20px; color: #4C6A70;">No run selected. Click "+ Add Run" to begin.</p>';
          return;
        }

        // Warnings
        const warnings = this.getComplianceWarnings();
        let warningsHtml = '';
        warnings.forEach(w => {
          const cls = w.type === 'stop' ? '' : 'warn';
          warningsHtml += `<div class="compliance-warning ${cls}">
            <h4>${w.type === 'stop' ? '🔴 STOP' : '⚠️ Warning'}</h4>
            <p>${w.msg}</p>
          </div>`;
        });

        // Compute posts for this run
        const posts = this.getRunPosts(run);

        // Panel table rows
        const panelRows = run.panels.map((panel, idx) => {
          const derived = this.getPanelDerived(panel);
          // Post for this panel = the post to the RIGHT of the panel (post index idx+1)
          // But per spec, "Post" column shows the calculated post height.
          // Post at position idx sits between panel idx-1 and panel idx.
          // We'll show the max post relevant to this panel (max of left and right post).
          const leftPost = posts[idx];
          const rightPost = posts[idx + 1];
          const maxPost = Math.max(leftPost.postSize, rightPost.postSize);
          const anyPatio = leftPost.patio || rightPost.patio;

          const totalClass = derived.totalHeight > 1800 ? 'total-elevated' : 'total-standard';
          const postDisplay = anyPatio
            ? `<span class="post-patio">${maxPost}†</span>`
            : `${maxPost}`;

          // Plinths display: total plinths (slope + manual), append † when >= 3 (patio tube)
          const plinthsDisplay = derived.plinths >= 3 ? `${derived.plinths}†` : `${derived.plinths}`;

          // Slope plinths display (read-only, greyed out)
          const slopePlinthsDisplay = derived.slopePlinths > 0 ? `${derived.slopePlinths}` : '—';

          // Step auto-calculated from slope — shows direction + mm amount
          const stepMm = panel.stepMm || 0;
          let stepDisplay;
          if (stepMm < 0) stepDisplay = '\u2193' + Math.abs(stepMm);
          else if (stepMm > 0) stepDisplay = '\u2191' + stepMm;
          else stepDisplay = '\u2014';

          // Warning badge for max capacity (capped or at limit)
          const maxWarning = derived.plinthsCapped
            ? ' <span title="Max plinth capacity — slope + retaining exceeds 4" style="color:#e65100;font-weight:700;">\u26A0</span>'
            : (derived.plinths >= 4 ? ' <span title="Max retaining — consider engineered wall" style="color:#e65100;font-weight:700;">\u26A0</span>' : '');

          return `<tr data-panel-idx="${idx}" onclick="app.selectPanel(${idx})" style="cursor:pointer;" class="${this.highlightedPanelIdx === idx ? 'panel-row-highlight' : ''}">
            <td class="col-pnum">P${idx + 1}</td>
            <td class="col-ht">
              <select onchange="app.updatePanel('${run.id}', ${idx}, 'height', this.value)">
                ${SHEET_HEIGHTS.map(h =>
                  `<option value="${h}" ${panel.height === h ? 'selected' : ''}>${h / 100}</option>`
                ).join('')}
              </select>
            </td>
            <td class="col-slope" style="color:#8B7355;text-align:center;">${slopePlinthsDisplay}</td>
            <td class="col-ret">
              <select onchange="app.updatePanel('${run.id}', ${idx}, 'retaining', this.value)">
                ${RETAINING_OPTIONS.map(r =>
                  `<option value="${r}" ${panel.retaining === r ? 'selected' : ''}>${r}</option>`
                ).join('')}
              </select>
            </td>
            <td class="col-pl">${plinthsDisplay}${maxWarning}</td>
            <td class="col-step" style="text-align:center;color:#666;">${stepDisplay}</td>
            <td class="col-total ${totalClass}">${derived.totalHeight}</td>
            <td class="col-post">${postDisplay}</td>
            <td class="col-del"><button class="delete-panel-btn" onclick="app.deletePanel('${run.id}', ${idx})" title="Delete panel">&times;</button></td>
          </tr>`;
        }).join('');

        // Extension dropdown value mapping
        const extOptions = [
          { value: 'none', label: 'None' },
          { value: 'slat', label: 'Slat' },
          { value: 'solid_fill', label: 'Solid Fill' },
          { value: 'lattice', label: 'Lattice' }
        ];

        document.getElementById('runContent').innerHTML = `
          ${warningsHtml}

          <div class="run-settings">
            <h3>Run Settings</h3>
            <div class="run-settings-grid">
              <div class="form-group">
                <label>Side of Property *</label>
                <select onchange="app.updateRunSettings('${run.id}', 'name', this.value)">
                  ${RUN_NAME_OPTIONS.map(n => `<option value="${n}" ${run.name === n ? 'selected' : ''}>${n || '— Select —'}</option>`).join('')}
                </select>

              </div>

                <label>Length (m) *</label>

                  ).join('')}

                <label>Extension</label>

                    `<option value="${o.value}" ${run.extension === o.value ? 'selected' : ''}>${o.label}</option>`
                  ).join('')}
