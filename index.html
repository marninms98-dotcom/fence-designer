    // Build structured pricing JSON from _collectOutputData for dashboard/Xero
    app.buildPricingJson = function() {
      var d = this._collectOutputData();
      var lineItems = [];

      if (d.totalMetres > 0) {
        lineItems.push({
          description: d.totalPanels + '× ' + (d.profile || 'panels') + ' (' + d.totalMetres.toFixed(1) + 'm total)',
          quantity: d.totalMetres, unit: 'm',
          cost_price: null, sell_price: d.pricePerMetre,
          total_cost: null, total_sell: d.fencingTotal,
          category: 'fencing'
        });
      }
      if (d.totalPlinths > 0) {
        lineItems.push({
          description: 'Retaining plinths (150mm COLORBOND)',
          quantity: d.totalPlinths, unit: 'each',
          cost_price: COST_PRICES.plinth, sell_price: d.plinthSell,
          total_cost: d.totalPlinths * COST_PRICES.plinth, total_sell: d.plinthsTotal,
          category: 'materials'
        });
      }
      if (d.totalPatioTubes > 0) {
        lineItems.push({
          description: 'Patio tubes (76×38 RHS 3000mm)',
          quantity: d.totalPatioTubes, unit: 'each',
          cost_price: COST_PRICES.patioTube, sell_price: d.patioSell,
          total_cost: d.totalPatioTubes * COST_PRICES.patioTube, total_sell: d.patioTotal,
          category: 'materials'
        });
      }
      (d.gateLineItems || []).forEach(function(g) {
        lineItems.push({ description: g.desc, quantity: g.qty, unit: 'each', total_sell: g.total, category: 'gates' });
      });
      (d.removalItems || []).forEach(function(r) {
        lineItems.push({ description: r.desc, quantity: r.qty, unit: r.unit, total_sell: r.total, category: 'removal' });
      });
      if (d.groundFinishTotal > 0) {
        lineItems.push({ description: d.groundFinishDesc, quantity: d.totalMetres, unit: 'm', total_sell: d.groundFinishTotal, category: 'ground_finish' });
      }
      (d.addonItems || []).forEach(function(a) {
        lineItems.push({ description: a.desc, quantity: 1, unit: 'lot', total_sell: a.total, category: 'addon' });
      });
      (d.customItems || []).forEach(function(c) {
        lineItems.push({ description: c.desc, quantity: c.qty, unit: c.unit, sell_price: c.unitPrice, total_sell: c.total, category: 'custom' });
      });
      if (d.accessSurcharge > 0) {
        lineItems.push({ description: 'Access surcharge (' + (d.accessRate * 100) + '%)', quantity: 1, unit: 'lot', total_sell: d.accessSurcharge, category: 'surcharges' });
      }
      if (d.urgencySurcharge > 0) {
        lineItems.push({ description: 'Urgency surcharge (' + (d.urgencyRate * 100) + '%)', quantity: 1, unit: 'lot', total_sell: d.urgencySurcharge, category: 'surcharges' });
      }
      if (d.deliveryFee > 0) {
        lineItems.push({ description: 'Delivery', quantity: 1, unit: 'lot', cost_price: COST_PRICES.delivery, sell_price: d.deliveryFee, total_sell: d.deliveryFee, category: 'delivery' });
      }

      // Enhanced cost estimates for dashboard/reporting
      var materialCostEstimate = d.internalCost || 0;
      var labourCostEstimate = d.internalLabour || 0;
      var totalCostEstimate = materialCostEstimate + labourCostEstimate;
      var margin_pct = d.subtotal > 0 ? Math.round(((d.subtotal - totalCostEstimate) / d.subtotal) * 1000) / 10 : 0;

      // Auto-generate job description from scope data
      var heights = (d.runDetails || []).map(function(r) { return r.panels && r.panels[0] ? r.panels[0].height : null; }).filter(Boolean);
      var dominantHeight = heights.length > 0 ? heights[0] : '';
      var job_description = d.totalMetres.toFixed(0) + 'm Colorbond Fencing'
        + (dominantHeight ? ' — ' + dominantHeight + 'mm' : '')
        + (d.colour ? ' ' + d.colour : '')
        + (d.job && d.job.suburb ? ' — ' + d.job.suburb : '');

      return {
        source: 'scoping_tool', version: '2.0', generated_at: new Date().toISOString(),
        line_items: lineItems,
        subtotal: d.subtotal, gst: d.gst, totalExGST: d.subtotal, totalIncGST: d.grandTotal,
        totalCostEstimate: totalCostEstimate,
        materialCostEstimate: materialCostEstimate,
        labourCostEstimate: labourCostEstimate,
        margin_pct: margin_pct,
        job_description: job_description,
        internal: { cost: d.internalCost, labour: d.internalLabour, margin: d.materialMargin }
      };
    };

    // Validation gate for Scope Complete
    function validateForScopeComplete() {
      var j = app.job;
      var errors = [];
      if (!j.clientFirstName || j.clientFirstName.trim().length < 2) errors.push('• Client first name is required');
      if (!j.clientLastName || j.clientLastName.trim().length < 1) errors.push('• Client last name is required');
      if (!j.address || j.address.trim().length < 5) errors.push('• Site address is required');
      if (!j.email || !j.email.includes('@')) errors.push('• Valid email is required');
      if (!j.phone || j.phone.replace(/\D/g,'').length < 8) errors.push('• Phone number is required (min 8 digits)');
      if (!j.runs || j.runs.length === 0) errors.push('• At least 1 fence run required');
      if (j.runs && j.runs.some(function(r) { return !r.panels || r.panels.length === 0; })) errors.push('• All runs must have at least 1 panel');
      var totalM = (j.runs || []).reduce(function(s, r) { return s + (r.length || 0); }, 0);
      if (totalM <= 0) errors.push('• Total fence length must be > 0');
      var photos = (j.checklist && j.checklist.photos) || [];
      if (photos.length < 1) errors.push('• At least 1 site photo required');
      // Check pricing
      try {
        var d = app._collectOutputData();
        if (d.grandTotal <= 0) errors.push('• Pricing must be calculated (total > $0)');
      } catch(e) {
        errors.push('• Unable to calculate pricing — check fence run data');
      }
      return errors;
    }

    // Scope Complete — validation gate + cloud chain trigger
    async function scopeComplete() {
      // Sync client name
      app.job.client = [app.job.clientFirstName, app.job.clientLastName].filter(Boolean).join(' ');

      // Validate required fields
      var errors = validateForScopeComplete();
      if (errors.length > 0) {
        app.showToast('Cannot complete scope — ' + errors.length + ' issues found', 'error');
        return;
      }

      // Run compliance checks
      var checks = app._runComplianceChecks();
      if (checks.errors.length > 0) {
        app.showToast('Compliance errors — fix before completing', 'error');
        return;
      }

      // Warnings
      var warnings = checks.warnings.slice();
      var photos = (app.job.checklist && app.job.checklist.photos) || [];
      if (photos.length < 5) warnings.push('Fewer than 5 site photos (' + photos.length + ').');
      if (!(app.job.checklist && app.job.checklist.videoWalkthrough)) warnings.push('Video walkthrough not marked as done.');
      if (!app.job.scoper) warnings.push('Scoper name not filled in.');

      if (warnings.length > 0) {
        if (!confirm('Warnings:\n\n' + warnings.map(function(w) { return '• ' + w; }).join('\n') + '\n\nProceed anyway?')) return;
      }

      // Final confirmation
      if (!confirm('Mark scope COMPLETE?\n\nThis will:\n• Generate a job number (SWF-25XXX)\n• Create Xero contact\n• Update GHL opportunity stage\n\nProceed?')) return;

      // Enrich job state before cloud save
      app.job._pricing_json = app.buildPricingJson();

      // Trigger full cloud save + link chain
      if (window._swIntegration) {
        try {
          await window._swIntegration.save();
          app.showToast('Scope completed! Job number will appear in dashboard.', 'success');
        } catch (e) {
          app.showToast('Scope complete failed: ' + e.message, 'error');
        }
      } else {
        app.showToast('Cloud integration not available — sign in first', 'warning');
      }
    }

    // ════════════════════════════════════════════════════════
    // QA VERIFICATION SYSTEM
    // ════════════════════════════════════════════════════════
    const fenceQA = {
      _acknowledged: new Set(),

      close() {
        document.getElementById('qaOverlay').style.display = 'none';
      },

      showScopeVerification() {
        const checks = this.runScopeChecks();
        const cards = {};
        checks.forEach(c => {
          if (!cards[c.card]) cards[c.card] = { title: c.card, items: [], worst: 'green' };
          cards[c.card].items.push(c);
          if (c.severity === 'red') cards[c.card].worst = 'red';
          else if (c.severity === 'amber' && cards[c.card].worst !== 'red') cards[c.card].worst = 'amber';
        });

        // Add green cards for sections with no issues
        const allCards = ['Job Details', 'Fence Design', 'Colours & Profile', 'Gates', 'Removal', 'Pricing', 'Photos & Checklist', 'Compliance'];
        allCards.forEach(title => {
          if (!cards[title]) cards[title] = { title, items: [], worst: 'green' };
        });

        const hasRed = Object.values(cards).some(c => c.worst === 'red');
        const hasAmber = Object.values(cards).some(c => c.worst === 'amber');

        let html = `<div class="qa-modal">
          <div class="qa-modal-header">
            <h2>Scope QA Verification</h2>
            <button class="qa-modal-close" onclick="fenceQA.close()">&times;</button>
          </div>
          <div class="qa-modal-body">
            <div style="margin-bottom:16px;font-size:13px;color:#4C6A70;">
              ${hasRed ? '<span style="color:#dc2626;font-weight:700;">RED items must be fixed before outputs can be generated.</span>' :
                hasAmber ? '<span style="color:#d97706;font-weight:700;">AMBER warnings found — review before proceeding.</span>' :
                '<span style="color:#16a34a;font-weight:700;">All checks passed — ready to generate outputs.</span>'}
            </div>`;

        allCards.forEach(title => {
          const card = cards[title];
          html += `<div class="qa-card ${card.worst}">
            <div class="qa-card-title"><span class="qa-dot ${card.worst}"></span>${card.title}</div>`;
          if (card.items.length > 0) {
            html += '<ul class="qa-card-items">';
            card.items.forEach(item => {
              const icon = item.severity === 'red' ? '&#9679;' : item.severity === 'amber' ? '&#9679;' : '&#8226;';
              const col = item.severity === 'red' ? '#dc2626' : item.severity === 'amber' ? '#d97706' : '#4C6A70';
              html += `<li style="color:${col}">${icon} ${item.message}</li>`;
            });
            html += '</ul>';
          } else {
            html += '<div style="font-size:12px;color:#16a34a;">All good</div>';
          }
          html += '</div>';
        });

        html += `</div>
          <div class="qa-actions">
            <button class="qa-btn qa-btn-secondary" onclick="fenceQA.close()">Close</button>
            ${!hasRed ? '<button class="qa-btn qa-btn-primary" onclick="fenceQA.close(); app.showToast(\'QA passed — outputs unlocked\', \'success\')">Approve & Close</button>' : ''}
          </div>
        </div>`;

        const overlay = document.getElementById('qaOverlay');
        overlay.innerHTML = html;
        overlay.style.display = 'flex';
      },

      runScopeChecks() {
        const j = app.job;
        const flags = [];
        const flag = (card, severity, message, field) => flags.push({ card, severity, message, field });

        // Job Details
        if (!j.clientFirstName) flag('Job Details', 'red', 'Client first name missing', 'clientFirstName');
        if (!j.clientLastName) flag('Job Details', 'red', 'Client last name missing', 'clientLastName');
        if (!j.address) flag('Job Details', 'red', 'Site address missing', 'address');
        if (!j.phone) flag('Job Details', 'red', 'Phone number missing', 'phone');
        if (!j.email) flag('Job Details', 'red', 'Email missing', 'email');
        if (!j.ref) flag('Job Details', 'amber', 'Job reference not set', 'ref');
        if (!j.scoper) flag('Job Details', 'amber', 'Scoper name not filled in', 'scoper');
        if (j.neighboursRequired === undefined) flag('Job Details', 'amber', 'Neighbour details: not answered (Yes/No)', 'neighboursRequired');
        if (j.neighboursRequired === true && (!j.neighbours || !j.neighbours[0] || !j.neighbours[0].firstName)) {
          flag('Job Details', 'amber', 'Neighbour name not filled in', 'neighbours');
        }

        // Fence Design
        if (!j.runs || j.runs.length === 0) flag('Fence Design', 'red', 'No fence runs added');
        if (j.runs && j.runs.some(r => !r.panels || r.panels.length === 0)) flag('Fence Design', 'red', 'A run has no panels');
        if (j.runs && j.runs.some(r => !r.name)) flag('Fence Design', 'amber', 'A run has no side-of-property name');
        if (j.runs && j.runs.some(r => !r.length || r.length <= 0)) flag('Fence Design', 'red', 'A run has no length set');
        if (j.runs && j.runs.some(r => !r.sheetHeight)) flag('Fence Design', 'amber', 'A run has no sheet height set');

        // Colours & Profile
        if (!j.colour) flag('Colours & Profile', 'red', 'No fence colour selected');
        if (!j.profile) flag('Colours & Profile', 'amber', 'No sheet profile selected');
        if (!j.supplier) flag('Colours & Profile', 'amber', 'No supplier selected');

        // Gates
        if (j.gatesRequired === undefined) flag('Gates', 'amber', 'Gates: not answered (Yes/No)');

        // Removal
        const rem = j.removal || {};
        if (rem.removalRequired === undefined) flag('Removal', 'amber', 'Removal required: not answered');
        if (rem.existingFenceType === 'asbestos' && rem.asbestosCert !== false) {
          flag('Removal', 'info', 'Asbestos removal certificate will be included ($' + ((j.quote && j.quote.asbestosCertFee) || 300) + ')');
        }

        // Pricing
        const totalM = (j.runs || []).reduce((s, r) => s + (r.length || 0), 0);
        if (totalM > 0 && (!j.pricePerMetre || j.pricePerMetre <= 0)) flag('Pricing', 'red', 'Price per metre is $0');
        try {
          const d = app._collectOutputData();
          if (d.grandTotal <= 0) flag('Pricing', 'red', 'Total quote is $0');
          const marginPct = d.subtotal > 0 ? ((d.subtotal - d.internalCost - d.internalLabour) / d.subtotal * 100) : 0;
          if (marginPct < 20) flag('Pricing', 'amber', `Margin is only ${marginPct.toFixed(1)}% — below 20% threshold`);
          if (marginPct > 60) flag('Pricing', 'amber', `Margin is ${marginPct.toFixed(1)}% — unusually high, double check`);
        } catch (e) {
          flag('Pricing', 'red', 'Cannot calculate pricing — check fence run data');
        }

        // Photos & Checklist
        const photos = (j.checklist && j.checklist.photos) || [];
        if (photos.length === 0) flag('Photos & Checklist', 'red', 'No site photos uploaded');
        else if (photos.length < 5) flag('Photos & Checklist', 'amber', `Only ${photos.length} photos — recommend at least 5`);
        if (!(j.checklist && j.checklist.videoWalkthrough)) flag('Photos & Checklist', 'amber', 'Video walkthrough not marked done');
        if (j.checklist && j.checklist.videoWalkthrough && !window.siteVideo && !(j.checklist.videoCloudUrl)) flag('Photos & Checklist', 'amber', 'Video marked done but no file attached — re-select video or do Cloud Save');
        if (window.siteVideo && !window.siteVideo.cloudUrl) flag('Photos & Checklist', 'amber', 'Video attached but not yet uploaded — do Cloud Save');

        // Compliance
        const comp = app._runComplianceChecks();
        comp.errors.forEach(e => flag('Compliance', 'red', e));
        comp.warnings.forEach(w => flag('Compliance', 'amber', w));

        return flags;
      }
    };

    // ════════════════════════════════════════════════════════
    // MATERIAL VERIFICATION GATE
    // ════════════════════════════════════════════════════════
    function showMaterialVerificationModal(d) {
      var existing = document.getElementById('materialVerifyModal');
      if (existing) existing.remove();

      // Get pricing JSON for cross-check
      var pricing = app.buildPricingJson();
      var pricingItems = pricing.line_items || [];

      // Helper to find pricing quantity for a category
      function pricingQty(category, descMatch) {
        var found = pricingItems.filter(function(li) {
          if (li.category !== category) return false;
          if (descMatch) return li.description && li.description.toLowerCase().includes(descMatch.toLowerCase());
          return true;
        });
        var total = 0;
        found.forEach(function(li) { total += (li.quantity || 0); });
        return { qty: total, count: found.length };
      }

      // Build checklist sections
      var sections = [];
      var checkIdx = 0;

      // ── Section 1: Panels & Posts ──
      var panelRows = [];
      Object.values(d.postGroups).forEach(function(g) {
        var desc = g.count + ' &times; ' + g.sheetH + 'H &times; ' + d.panelWidthMm + 'W panels W/ ' + g.postH + 'H posts | ' + (d.profile || 'Trimclad') + ' | ' + (d.colour || 'Shale Grey');
        panelRows.push({ idx: checkIdx++, desc: desc, matQty: g.count });
      });
      // Cross-check total panels vs pricing fencing line
      var pricingFencing = pricingQty('fencing');
      var panelMismatch = d.totalPanels !== Math.round(pricingFencing.qty / d.panelWidthM);

      sections.push({
        title: 'Panels & Posts',
        rows: panelRows,
        mismatch: panelMismatch ? 'Material panels: ' + d.totalPanels + ' | Pricing metres: ' + pricingFencing.qty.toFixed(1) + 'm (' + Math.round(pricingFencing.qty / d.panelWidthM) + ' panels)' : null
      });

      // ── Section 2: Plinths & Tubing ──
      var plinthRows = [];
      if (d.totalPlinths > 0) {
        plinthRows.push({ idx: checkIdx++, desc: d.totalPlinths + ' &times; 150mm Plinths &mdash; ' + (d.colour || 'Shale Grey'), matQty: d.totalPlinths });
      }
      if (d.totalPatioTubes > 0) {
        var tubeBreakdown = (d.runDetails || []).filter(function(r) { return r.patioTubes > 0; }).map(function(r) { return r.name + ': ' + r.patioTubes; }).join(', ');
        plinthRows.push({ idx: checkIdx++, desc: d.totalPatioTubes + ' &times; 76&times;38 RHS Patio Tube @ 3000mm' + (tubeBreakdown ? ' (' + tubeBreakdown + ')' : ''), matQty: d.totalPatioTubes });
      }
      // Cross-check plinths
      var pricingPlinths = pricingQty('materials', 'plinth');
      var plinthMismatch = d.totalPlinths > 0 && pricingPlinths.qty !== d.totalPlinths;
      var pricingTubes = pricingQty('materials', 'patio');
      var tubeMismatch = d.totalPatioTubes > 0 && pricingTubes.qty !== d.totalPatioTubes;

      if (plinthRows.length > 0) {
        var mismatchMsg = null;
        if (plinthMismatch) mismatchMsg = 'Plinth mismatch — Material: ' + d.totalPlinths + ' | Pricing: ' + pricingPlinths.qty;
        if (tubeMismatch) mismatchMsg = (mismatchMsg ? mismatchMsg + '<br>' : '') + 'Patio tube mismatch — Material: ' + d.totalPatioTubes + ' | Pricing: ' + pricingTubes.qty;
        sections.push({ title: 'Plinths & Tubing', rows: plinthRows, mismatch: mismatchMsg });
      }

      // ── Section 3: Gates ──
      var gateRows = [];
      if (d.gatePosts > 0) {
        var totalGatePosts = 0;
        (d.gateDetails || []).forEach(function(g) { totalGatePosts += g.posts; });
        gateRows.push({ idx: checkIdx++, desc: totalGatePosts + ' &times; 90&times;90mm SHS Gate Posts', matQty: totalGatePosts });
      }
      (app.job.gates || []).forEach(function(g) {
        var typeLabel = g.type === 'pedestrian' ? 'Pedestrian gate kit' : 'Double swing gate kit';
        var panelH = (app.job.runs && app.job.runs[0] && app.job.runs[0].panels[0]) ? app.job.runs[0].panels[0].height : 1800;
        gateRows.push({ idx: checkIdx++, desc: typeLabel + ' | ' + (g.width || 900) + 'mm W | ' + panelH + 'mm H | ' + (d.colour || 'Shale Grey'), matQty: 1 });
      });
      // Cross-check gates
      var pricingGates = pricingQty('gates');
      var gateMismatch = gateRows.length > 0 && pricingGates.count !== (app.job.gates || []).length;

      if (gateRows.length > 0) {
        sections.push({
          title: 'Gates',
          rows: gateRows,
          mismatch: gateMismatch ? 'Gate count mismatch — Material: ' + (app.job.gates || []).length + ' | Pricing line items: ' + pricingGates.count : null
        });
      }

      // ── Section 4: Fixings & Hardware (editable quantities) ──
      var fixingRows = [];
      var overrides = app.job._materialOverrides || {};
      var concreteBagsActual = overrides.concreteBags != null ? overrides.concreteBags : d.concreteBags;
      var tekBoxesActual = overrides.tekBoxes != null ? overrides.tekBoxes : d.tekBoxes;
      fixingRows.push({ idx: checkIdx++, desc: 'Bags Quickset Concrete <span style="font-size:12px;color:#6b7280;">(' + d.allPosts + ' posts &times; 2 bags = ' + d.concreteBags + ' calc)</span>', matQty: d.concreteBags, editable: true, editKey: 'concreteBags', editVal: concreteBagsActual });
      fixingRows.push({ idx: checkIdx++, desc: 'Tek Screws &amp; Fixings Pack <span style="font-size:12px;color:#6b7280;">(screws, rivets, brackets — 1 per 4 panels = ' + d.tekBoxes + ' calc)</span>', matQty: d.tekBoxes, editable: true, editKey: 'tekBoxes', editVal: tekBoxesActual });
      sections.push({ title: 'Fixings & Hardware', rows: fixingRows, mismatch: null });

      // ── Section 5: Removal (if applicable) ──
      if (d.removalItems && d.removalItems.length > 0) {
        var removalRows = [];
        d.removalItems.forEach(function(r) {
          if (r.desc.toLowerCase().includes('certificate')) return; // skip cert line — it's admin not materials
          removalRows.push({ idx: checkIdx++, desc: r.qty + ' ' + r.unit + ' &mdash; ' + r.desc + ' <span style="font-size:12px;color:#6b7280;">($' + (r.unitPrice || 0) + '/' + r.unit + ' sell)</span>', matQty: r.qty });
        });
        if (removalRows.length > 0) sections.push({ title: 'Removal', rows: removalRows, mismatch: null });
      }

      var totalChecks = checkIdx;

      // ── Build quote preview summary ──
      var f = function(n) { return n.toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
      var quoteLines = '';
      var detailParts = d.totalMetres.toFixed(1) + 'm ' + (d.profile || 'Trimclad') + ' in ' + (d.colour || '');
      if (d.totalPlinths > 0) detailParts += ' | ' + d.totalPlinths + ' retaining plinths';
      if ((d.gateLineItems || []).length > 0) detailParts += ' | ' + d.gateLineItems.length + ' gate' + (d.gateLineItems.length > 1 ? 's' : '');
      if (d.removalTotal > 0) detailParts += ' | Old fence removal';
      quoteLines += '<tr><td><strong>COLORBOND Fencing — Supply &amp; Install</strong><br><span style="font-size:11px;color:#4C6A7C;">' + detailParts + '</span></td><td style="text-align:right;vertical-align:top;font-weight:600;">$' + f(d.subtotal) + '</td></tr>';

      var quoteSummaryHtml =
        '<div style="margin-bottom:16px;">' +
          '<button onclick="var el=document.getElementById(\'mvQuotePreview\');el.style.display=el.style.display===\'none\'?\'\':\'none\';this.textContent=el.style.display===\'none\'?\'▶ Show Quote Preview\':\'▼ Hide Quote Preview\'" ' +
            'style="background:none;border:none;font-size:14px;font-weight:700;color:#293C46;cursor:pointer;padding:0;text-align:left;">▶ Show Quote Preview</button>' +
          '<div id="mvQuotePreview" style="display:none;margin-top:10px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:14px;font-size:13px;">' +
            '<div style="font-weight:700;font-size:12px;color:#4C6A7C;text-transform:uppercase;margin-bottom:8px;">Client: ' + (d.job.client || '—') + ' | ' + (d.job.address || '—') + '</div>' +
            '<table style="width:100%;border-collapse:collapse;font-size:13px;">' +
              '<thead><tr><th style="text-align:left;padding:4px 0;border-bottom:2px solid #293C46;font-size:11px;color:#4C6A7C;">Item</th><th style="text-align:right;padding:4px 0;border-bottom:2px solid #293C46;font-size:11px;color:#4C6A7C;">Amount</th></tr></thead>' +
              '<tbody>' + quoteLines + '</tbody>' +
              '<tfoot>' +
                '<tr style="border-top:2px solid #293C46;"><td style="padding-top:6px;font-weight:700;">Subtotal (excl. GST)</td><td style="text-align:right;padding-top:6px;font-weight:700;">$' + f(d.subtotal) + '</td></tr>' +
                '<tr><td>GST (10%)</td><td style="text-align:right;">$' + f(d.gst) + '</td></tr>' +
                '<tr><td style="font-weight:700;font-size:16px;color:#F15A29;">TOTAL (incl. GST)</td><td style="text-align:right;font-weight:700;font-size:16px;color:#F15A29;">$' + f(d.grandTotal) + '</td></tr>' +
              '</tfoot>' +
            '</table>' +
            '<div style="margin-top:10px;font-size:12px;color:#4C6A7C;">Deposit (50%): $' + f(d.grandTotal * 0.5) + ' | Balance on completion: $' + f(d.grandTotal * 0.5) + '</div>' +
          '</div>' +
        '</div>';

      // Build HTML
      var sectionsHtml = sections.map(function(sec) {
        var rowsHtml = sec.rows.map(function(row) {
          var borderStyle = 'border-left:3px solid #22C55E;';
          var isOverridden = row.editable && row.editVal != row.matQty;
          if (isOverridden) borderStyle = 'border-left:3px solid #F59E0B;';

          if (row.editable) {
            // Editable row with number input
            return '<label style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;margin-bottom:4px;background:#fff;border-radius:6px;cursor:pointer;' + borderStyle + '">' +
              '<input type="checkbox" class="mv-check" data-idx="' + row.idx + '" style="margin-top:3px;min-width:18px;min-height:18px;accent-color:#F15A29;" onchange="window._mvCheckChanged()">' +
              '<div style="flex:1;font-size:14px;color:#293C46;line-height:1.4;">' +
                '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
                  '<span>' + row.desc + '</span>' +
                '</div>' +
                '<div style="display:flex;align-items:center;gap:8px;margin-top:6px;">' +
                  '<span style="font-size:12px;color:#6b7280;">Qty:</span>' +
                  '<input type="number" min="0" value="' + row.editVal + '" data-edit-key="' + row.editKey + '" data-calc-val="' + row.matQty + '" ' +
                    'style="width:60px;padding:4px 6px;border:1px solid #D4DEE4;border-radius:4px;font-size:14px;text-align:center;-webkit-appearance:none;" ' +
                    'onchange="window._mvEditQty(this)" onclick="event.stopPropagation()">' +
                  (isOverridden ? '<span style="display:inline-block;background:#FEF3C7;color:#92400E;font-size:10px;font-weight:700;padding:2px 6px;border-radius:100px;text-transform:uppercase;letter-spacing:0.5px;">Manual Edit</span>' : '') +
                '</div>' +
              '</div>' +
            '</label>';
          }

          return '<label style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;margin-bottom:4px;background:#fff;border-radius:6px;cursor:pointer;' + borderStyle + '">' +
            '<input type="checkbox" class="mv-check" data-idx="' + row.idx + '" style="margin-top:3px;min-width:18px;min-height:18px;accent-color:#F15A29;" onchange="window._mvCheckChanged()">' +
            '<span style="font-size:14px;color:#293C46;line-height:1.4;">' + row.desc + '</span>' +
          '</label>';
        }).join('');

        var mismatchHtml = sec.mismatch ?
          '<div style="padding:8px 12px;background:#FEE2E2;border-left:3px solid #DC2626;border-radius:4px;margin-bottom:4px;font-size:13px;color:#991B1B;">' +
            '<strong>Mismatch:</strong> ' + sec.mismatch +
          '</div>' : '';

        return '<div style="margin-bottom:16px;">' +
          '<h4 style="margin:0 0 8px;font-size:14px;font-weight:700;color:#4C6A7C;text-transform:uppercase;letter-spacing:0.5px;">' + sec.title + '</h4>' +
          mismatchHtml + rowsHtml +
        '</div>';
      }).join('');

      // Custom supplier notes section
      var supplierNotesHtml =
        '<div style="margin-bottom:16px;">' +
          '<h4 style="margin:0 0 8px;font-size:14px;font-weight:700;color:#4C6A7C;text-transform:uppercase;letter-spacing:0.5px;">Notes for Supplier</h4>' +
          '<textarea id="mvSupplierNotes" rows="3" placeholder="e.g. Include saddle bracket, deliver to rear access, call before delivery..." ' +
            'style="width:100%;padding:10px 12px;border:1px solid #D4DEE4;border-radius:6px;font-size:14px;resize:vertical;font-family:inherit;box-sizing:border-box;">' +
            (app.job.supplierNotes || '') +
          '</textarea>' +
        '</div>';

      var overlay = document.createElement('div');
      overlay.id = 'materialVerifyModal';
      overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;';
      overlay.innerHTML =
        '<div style="background:#F9FAFB;border-radius:12px;width:95%;max-width:600px;max-height:90vh;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.3);display:flex;flex-direction:column;">' +
          '<div style="background:#293C46;padding:16px 24px;flex-shrink:0;">' +
            '<h3 style="margin:0;color:#fff;font-size:18px;font-weight:700;">Review & Confirm</h3>' +
            '<p style="margin:4px 0 0;color:rgba(255,255,255,0.7);font-size:13px;">Check materials, review quote, then confirm to send</p>' +
          '</div>' +
          '<div style="padding:20px 24px;overflow-y:auto;flex:1;">' +
            sectionsHtml +
            supplierNotesHtml +
            quoteSummaryHtml +
          '</div>' +
          '<div style="padding:16px 24px;border-top:1px solid #e5e7eb;display:flex;gap:10px;justify-content:flex-end;flex-shrink:0;">' +
            '<button onclick="document.getElementById(\'materialVerifyModal\').remove()" style="padding:12px 20px;border:1px solid #D4DEE4;background:#fff;border-radius:6px;font-size:14px;cursor:pointer;min-height:44px;">Cancel</button>' +
            '<button id="mvConfirmBtn" onclick="window._mvConfirm()" disabled style="padding:12px 24px;background:#ccc;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:not-allowed;min-height:44px;" title="Check all items first">Confirm & Send Quote</button>' +
          '</div>' +
        '</div>';

      document.body.appendChild(overlay);
      overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });

      // Checkbox tracking
      window._mvCheckChanged = function() {
        var checks = document.querySelectorAll('.mv-check');
        var allChecked = true;
        checks.forEach(function(cb) { if (!cb.checked) allChecked = false; });
        var btn = document.getElementById('mvConfirmBtn');
        if (allChecked) {
          btn.disabled = false;
          btn.style.background = '#F15A29';
          btn.style.cursor = 'pointer';
          btn.title = '';
        } else {
          btn.disabled = true;
          btn.style.background = '#ccc';
          btn.style.cursor = 'not-allowed';
          btn.title = 'Check all items first';
        }
      };

      // Editable quantity handler with double-confirmation
      window._mvEditQty = function(input) {
        var key = input.getAttribute('data-edit-key');
        var calcVal = parseInt(input.getAttribute('data-calc-val'));
        var newVal = parseInt(input.value) || 0;
        if (newVal < 0) { newVal = 0; input.value = 0; }

        if (newVal !== calcVal) {
          // Double-confirmation for manual edits
          var confirmed = confirm(
            'You are changing ' + key.replace(/([A-Z])/g, ' $1').toLowerCase() + ' from ' + calcVal + ' (calculated) to ' + newVal + '.\n\n' +
            'This will be flagged as a manual edit and visible to Shaun on the material order.\n\nConfirm this change?'
          );
          if (!confirmed) {
            input.value = calcVal;
            // Remove override if reverting
            if (app.job._materialOverrides) delete app.job._materialOverrides[key];
            // Remove badge if present
            var badge = input.parentElement.querySelector('span[style*="FEF3C7"]');
            if (badge) badge.remove();
            // Reset border
            var label = input.closest('label');
            if (label) label.style.borderLeft = '3px solid #22C55E';
            return;
          }
          // Store override
          if (!app.job._materialOverrides) app.job._materialOverrides = {};
          app.job._materialOverrides[key] = newVal;
          // Show badge if not already there
          var parent = input.parentElement;
          if (!parent.querySelector('span[style*="FEF3C7"]')) {
            var badge = document.createElement('span');
            badge.style.cssText = 'display:inline-block;background:#FEF3C7;color:#92400E;font-size:10px;font-weight:700;padding:2px 6px;border-radius:100px;text-transform:uppercase;letter-spacing:0.5px;';
            badge.textContent = 'Manual Edit';
            parent.appendChild(badge);
          }
          // Orange border
          var label = input.closest('label');
          if (label) label.style.borderLeft = '3px solid #F59E0B';
        } else {
          // Reverted to calculated — remove override
          if (app.job._materialOverrides) delete app.job._materialOverrides[key];
          var badge = input.parentElement.querySelector('span[style*="FEF3C7"]');
          if (badge) badge.remove();
          var label = input.closest('label');
          if (label) label.style.borderLeft = '3px solid #22C55E';
        }
      };

      window._mvConfirm = function() {
        // Save supplier notes
        var notesEl = document.getElementById('mvSupplierNotes');
        if (notesEl) app.job.supplierNotes = notesEl.value.trim();

        // Store verification metadata
        var verifier = '';
        if (window.SECUREWORKS_CLOUD && window.SECUREWORKS_CLOUD.auth.isLoggedIn()) {
          var user = window.SECUREWORKS_CLOUD.auth.getUser();
          verifier = (user && user.email) || '';
        }
        if (!verifier) verifier = app.job.scoper || 'unknown';

        app.job.materialVerification = {
          timestamp: new Date().toISOString(),
          verifier: verifier,
          verified: true,
          overrides: app.job._materialOverrides || null
        };
        app.job._pricing_json = app.buildPricingJson();
        app.save();

        // Remove modal and proceed to send quote
        document.getElementById('materialVerifyModal').remove();
        _showSendQuoteModalInternal();
      };
    }

    // ════════════════════════════════════════════════════════
    // SEND QUOTE — Gate through Material Verification
    // ════════════════════════════════════════════════════════
    function showSendQuoteModal() {
      // Step 1: Validate required fields
      var missing = app._validateRequired();
      if (missing.length > 0) {
        app.showToast('Missing: ' + missing.join(', '), 'error');
        return;
      }
      // Step 2: Collect output data
      var d;
      try { d = app._collectOutputData(); } catch(e) {
        app.showToast('Error calculating output: ' + e.message, 'error');
        return;
      }
      // Step 3: Show material verification modal (blocks until confirmed)
      showMaterialVerificationModal(d);
    }

    // ════════════════════════════════════════════════════════
    // SEND QUOTE — Modal + Upload + Email via Edge Functions
    // ════════════════════════════════════════════════════════

      var clientFirst = app.job.clientFirstName || '';

      var overlay = document.createElement('div');
      overlay.id = 'sendQuoteModal';
      overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;';
      overlay.innerHTML = '<div style="background:#fff;border-radius:8px;max-width:480px;width:100%;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,0.3);">' +
        '<h3 style="margin:0 0 4px;color:#293C46;font-size:18px;">Send Quote to Client</h3>' +
        '<p style="margin:0 0 16px;color:#4C6A7C;font-size:13px;">A branded email with Accept/Decline will be sent.</p>' +
        '<label style="display:block;margin-bottom:4px;font-weight:600;font-size:13px;color:#293C46;">Client Email</label>' +
        '<input type="email" id="sqClientEmail" value="' + (clientEmail || '') + '" placeholder="client@email.com" style="width:100%;padding:10px 12px;border:1px solid #D4DEE4;border-radius:4px;font-size:14px;margin-bottom:12px;" />' +
        '<label style="display:block;margin-bottom:4px;font-weight:600;font-size:13px;color:#293C46;">Personal Message (optional)</label>' +
        '<textarea id="sqMessage" rows="3" placeholder="Hi ' + (clientFirst || 'there') + ', here\'s your fencing quote..." style="width:100%;padding:10px 12px;border:1px solid #D4DEE4;border-radius:4px;font-size:14px;margin-bottom:12px;resize:vertical;font-family:inherit;"></textarea>' +
        '<label style="display:block;margin-bottom:6px;font-weight:600;font-size:13px;color:#293C46;">Supporting Documents</label>' +
        '<div style="margin-bottom:16px;">' +
          '<label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;color:#4C6A7C;cursor:pointer;"><input type="checkbox" class="sq-doc-check" value="colorbond_colour_chart"> Colorbond Colour Chart</label>' +
          '<label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;color:#4C6A7C;cursor:pointer;"><input type="checkbox" class="sq-doc-check" value="warranty_guide"> Warranty Guide</label>' +
        '</div>' +
        '<div id="sqStatus" style="display:none;padding:10px 12px;border-radius:4px;font-size:13px;margin-bottom:12px;"></div>' +
        '<div style="display:flex;gap:10px;justify-content:flex-end;">' +
          '<button onclick="document.getElementById(\'sendQuoteModal\').remove()" style="padding:10px 20px;border:1px solid #D4DEE4;background:#fff;border-radius:4px;font-size:14px;cursor:pointer;">Cancel</button>' +
          '<button id="sqSendBtn" onclick="executeSendQuote()" style="padding:10px 24px;background:#F15A29;color:#fff;border:none;border-radius:4px;font-size:14px;font-weight:700;cursor:pointer;">Send Quote</button>' +
        '</div>' +

    async function executeSendQuote() {
      var statusEl = document.getElementById('sqStatus');
      var sendBtn = document.getElementById('sqSendBtn');
      var clientEmail = (document.getElementById('sqClientEmail') || {}).value.trim();
      if (!clientEmail || !clientEmail.includes('@')) {
        statusEl.style.display = '';
        statusEl.style.background = '#FEE2E2';
        statusEl.style.color = '#991B1B';
        statusEl.textContent = 'Please enter a valid email address';
        return;
      }
      sendBtn.disabled = true;
      sendBtn.textContent = 'Generating PDF...';
      sendBtn.style.opacity = '0.6';
      statusEl.style.display = '';
      statusEl.style.background = '#EDF1F4';
      statusEl.style.color = '#293C46';
      statusEl.textContent = 'Generating quote PDF...';
      try {
        var cloud = window.SECUREWORKS_CLOUD;
        var jobId = window._swIntegration ? window._swIntegration.getJobId() : null;
        var clientName = [app.job.clientFirstName, app.job.clientLastName].filter(Boolean).join(' ') || 'Client';
        var jobRef = app.job.ref || 'DRAFT';
        var message = (document.getElementById('sqMessage') || {}).value.trim();
        var supportingDocs = [];
        document.querySelectorAll('.sq-doc-check:checked').forEach(function(cb) {
          supportingDocs.push(cb.value);
        });

        // Generate PDF by capturing blob instead of saving to disk
        app._capturePdfBlob = 'pending';
        app.generateQuotePDF();
        var pdfBlob = app._capturePdfBlob;
        app._capturePdfBlob = null;
        if (!pdfBlob || pdfBlob === 'pending') throw new Error('PDF generation failed');

        var safeFn = function(s) { return (s || '').replace(/[^a-zA-Z0-9._-]/g, '_'); };
        var fileName = 'Quote_' + safeFn(clientName) + '_' + jobRef + '.pdf';

        statusEl.textContent = 'Preparing upload...';
        sendBtn.textContent = 'Uploading PDF...';

        var prepRes = await fetch(cloud.supabaseUrl + '/functions/v1/ghl-proxy?action=prepare_quote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jobId: jobId, fileName: fileName, supportingDocs: supportingDocs.length > 0 ? supportingDocs : null })
        });
        var prepData = await prepRes.json();
        if (!prepRes.ok) throw new Error(prepData.error || 'Failed to prepare quote');

        statusEl.textContent = 'Uploading PDF (' + (pdfBlob.size / 1024).toFixed(0) + 'KB)...';

        var uploadRes = await fetch(prepData.uploadUrl, { method: 'PUT', headers: { 'Content-Type': 'application/pdf' }, body: pdfBlob });
        if (!uploadRes.ok) throw new Error('PDF upload failed: ' + uploadRes.status);

        statusEl.textContent = 'Sending email to ' + clientEmail + '...';
        sendBtn.textContent = 'Sending...';

        var sendRes = await fetch(cloud.supabaseUrl + '/functions/v1/send-quote/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ document_id: prepData.documentId, client_email: clientEmail, client_name: clientName, message: message || '' })
        });
        var sendData = await sendRes.json();
        if (!sendRes.ok) throw new Error(sendData.error || 'Failed to send quote');

        statusEl.style.background = '#DCFCE7';
        statusEl.style.color = '#166534';
        statusEl.innerHTML = '<strong>Quote sent!</strong> Client will receive a branded email with an Accept/Decline page.';
        sendBtn.textContent = 'Sent ✓';
        sendBtn.style.background = '#22C55E';
        app.showToast('Quote sent to ' + clientEmail, 'success');
        setTimeout(function() { var modal = document.getElementById('sendQuoteModal'); if (modal) modal.remove(); }, 2500);
      } catch(e) {
        console.error('[SendQuote] Error:', e);
        statusEl.style.display = '';
        statusEl.style.background = '#FEE2E2';
        statusEl.style.color = '#991B1B';
        statusEl.textContent = 'Failed: ' + e.message;
        sendBtn.disabled = false;
        sendBtn.textContent = 'Retry Send';
        sendBtn.style.opacity = '1';
      }
    }

    // ════════════════════════════════════════════════════════
    // PROGRESSIVE DISCLOSURE — Stage-based button visibility
    // ════════════════════════════════════════════════════════
    function detectJobStage() {
      var j = app.job;
      if (!j) return 1;

      // Stage 4: Scope complete / linked to GHL
      if (j.scopeComplete || (j.materialVerification && j.materialVerification.verified)) {
        // Check if scope was actually linked (has a job number from GHL)
        var badge = document.getElementById('headerBadge');
        if (badge && badge.style.display !== 'none' && badge.textContent.includes('SWF')) return 4;
        if (j.materialVerification && j.materialVerification.verified) return 3; // verified but not yet linked
      }

      // Stage 3: Has runs + client + pricing + checklist complete — ready for output
      var hasRuns = j.runs && j.runs.some(function(r) { return r.panels && r.panels.length > 0; });
      var hasClient = !!(j.clientFirstName && j.address && j.email);
      var cl = j.checklist || {};
      var checklistDone = (cl.photos && cl.photos.length >= 5) && cl.videoWalkthrough;
      if (hasRuns && hasClient) {
        if (checklistDone) {
          try {
            var d = app._collectOutputData();
            if (d.grandTotal > 0) return 3;
          } catch(e) { /* pricing failed, stay at 2 */ }
        }
        return 2;
      }

      // Stage 2: Has some data entered (name, address, or any run)
      if (j.clientFirstName || j.address || (j.runs && j.runs.length > 0 && j.runs[0].panels.length > 0)) return 2;

      // Stage 1: Empty/new job
      return 1;
    }

    function updateButtonStages() {
      var stage = detectJobStage();
      // Determine which stages to show buttons for
      // Each stage includes its own buttons + logically needed ones
      var visible = {};
      if (stage === 1) {
        visible = { 1: true };
      } else if (stage === 2) {
        visible = { 1: true, 2: true };
      } else if (stage === 3) {
        visible = { 2: true, 3: true };
      } else if (stage === 4) {
        visible = { 2: true, 3: true, 4: true };
      }

      // Header buttons
      document.querySelectorAll('.btn-stage').forEach(function(btn) {
        var match = false;
        for (var s = 1; s <= 4; s++) {
          if (btn.classList.contains('btn-stage-' + s) && visible[s]) match = true;
        }
        btn.classList.toggle('stage-active', match);
      });

      // Bottom bar buttons
      document.querySelectorAll('.gen-stage').forEach(function(btn) {
        var match = false;
        for (var s = 1; s <= 4; s++) {
          if (btn.classList.contains('gen-stage-' + s) && visible[s]) match = true;
        }
        btn.classList.toggle('stage-active', match);
      });

      // Hide bottom bar entirely in stage 1
      var bar = document.getElementById('generateBar');
      if (bar) bar.style.display = (stage === 1) ? 'none' : '';
    }

    // Hook into app.save() to update stages whenever data changes
    var _origSave = null;
    function hookStageUpdates() {
      if (_origSave || !app || !app.save) return;
      _origSave = app.save.bind(app);
      app.save = function() {
        _origSave();
        updateButtonStages();
      };
      // Initial update
      updateButtonStages();
    }

    window.addEventListener('DOMContentLoaded', () => {
      app.init();
      // Hook stage updates after a tick so app is fully initialized
      setTimeout(hookStageUpdates, 500);
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.address-autocomplete-wrap')) { app.hideAddressDropdown(); app.hideClientNameDropdown(); }
    });
  </script>
