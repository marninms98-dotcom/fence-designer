      },

      _renderClientNameDropdown() {
        const dd = document.getElementById('clientNameDropdown');
        if (!dd) return;
        const results = this._clientNameResults;
        if (results.length === 0) {
          dd.innerHTML = '<div class="address-dropdown-item" style="color:#6b7280;cursor:default;">No contacts found in GHL</div>';
          dd.classList.add('open');
          this._clientNameActiveIdx = -1;
          return;
        }
        dd.innerHTML = results.map((opp, i) => {
          const subtitle = [opp.contactPhone, opp.contactEmail, opp.stageName].filter(Boolean).join(' · ');
          return '<div class="address-dropdown-item" data-idx="' + i + '" onmousedown="app.selectGHLContact(' + i + ')" style="padding:8px 12px;">' +
            '<div style="font-weight:600;color:#293C46;">' + this._esc(opp.contactName || opp.name || '') + '</div>' +
            (subtitle ? '<div style="font-size:12px;color:#4C6A7C;margin-top:2px;">' + this._esc(subtitle) + '</div>' : '') +
          '</div>';

      async selectGHLContact(idx) {
        const opp = this._clientNameResults[idx];
        if (!opp) return;
        this.hideClientNameDropdown();

        // Trigger the full GHL load flow via integration
        if (window._swIntegration && window._swIntegration.loadPicker) {
          // Simulate the opportunity selection flow from integration.js
          var cloud = window.SECUREWORKS_CLOUD;
          if (!cloud) return;

          this.showToast('Loading ' + (opp.contactName || opp.name) + ' from GHL...', 'info');

          // ── Reset to clean state before loading new opportunity ──
          localStorage.removeItem('fenceJob');
          this.job = null;
          this.currentRunId = null;
          this._resetSections();
          this.init();
          // Clear QA state for old job
          localStorage.removeItem('fenceQA_verification');
          if (typeof fenceQA !== 'undefined') {
            fenceQA._verificationState = {};
          }
          // Stop any running auto-save for old job
          if (window.SECUREWORKS_CLOUD) window.SECUREWORKS_CLOUD.stopAutoSave();
          // Clear integration state for old job
          if (window._swIntegration) {
            window._swIntegration._connectJob(null, null, null);
          }

          try {
            // Fetch full contact from GHL
            var contact = null;
            if (opp.contactId) {
              try {
                contact = await cloud.ghl.getContact(opp.contactId);
              } catch(e) {
                contact = { name: opp.contactName, email: opp.contactEmail, phone: opp.contactPhone };
              }
            } else {
              contact = { name: opp.contactName, email: opp.contactEmail, phone: opp.contactPhone };
            }

            // Prefill contact into the job
            if (contact) {
              if (contact.firstName) {
                this.job.clientFirstName = contact.firstName;
                this.job.clientLastName = contact.lastName || '';
              } else {
                var parts = (contact.name || '').split(' ');
                this.job.clientFirstName = parts[0] || '';
                this.job.clientLastName = parts.slice(1).join(' ');
              }
              this.job.client = contact.name || [contact.firstName, contact.lastName].filter(Boolean).join(' ');
              if (contact.email) this.job.email = contact.email;
              if (contact.phone) this.job.phone = contact.phone;
              var fullAddr = [contact.address, contact.suburb, contact.state, contact.postcode].filter(Boolean).join(', ');
              if (fullAddr) this.job.address = fullAddr;
              else if (contact.address) this.job.address = contact.address;
              if (contact.suburb) this.job.suburb = contact.suburb;
            }

            // Check for existing cloud job linked to this opportunity
            var existingJob = null;
            try {
              existingJob = await cloud.ghl.findJobByOpportunity(opp.id, 'fencing');
            } catch(e) { /* no existing job */ }

            if (existingJob && existingJob.scope_json && Object.keys(existingJob.scope_json).length > 0) {
              // Load cloud scope data
              window.app.job = existingJob.scope_json.job || window.app.job;
              if (window.app.job.runs && window.app.job.runs.length > 0) {
                window.app.currentRunId = window.app.job.runs[0].id;
              }
              // GHL contact is source of truth — overwrite stale scope_json contact fields
              if (contact.firstName) {
                window.app.job.clientFirstName = contact.firstName;
                window.app.job.clientLastName = contact.lastName || '';
              }
              if (contact.email) window.app.job.email = contact.email;
              if (contact.phone) window.app.job.phone = contact.phone;
              if (contact.address) {
                var addr = [contact.address, contact.suburb, contact.state, contact.postcode].filter(Boolean).join(', ');
                window.app.job.address = addr || contact.address;
              }
              if (contact.suburb) window.app.job.suburb = contact.suburb;
              window.app.job.client = [window.app.job.clientFirstName, window.app.job.clientLastName].filter(Boolean).join(' ');
            }

            // Wire up the integration layer so cloud save, auto-save, and sync dot all work
            if (window._swIntegration) {
              window._swIntegration._connectJob(existingJob ? existingJob.id : null, opp.id, opp.contactId || null);
            }

            this.save();
            this.render();
            this.updateSectionStatuses();
            this._updateHeaderStatus();
            if (typeof updateButtonStages === 'function') updateButtonStages();
            this.showToast('Loaded: ' + (contact.name || opp.contactName), 'success');
          } catch(e) {
            this.showToast('Failed to load contact: ' + e.message, 'error');
          }
        }
      },

      hideClientNameDropdown() {
        const dd = document.getElementById('clientNameDropdown');
        if (dd) { dd.classList.remove('open'); dd.innerHTML = ''; }
        this._clientNameResults = [];
        this._clientNameActiveIdx = -1;

      // ── Site Plan Modal (satellite + click-to-place line drawing + pan) ──
      showSitePlanModal() {

          this.showToast('Enter a site address first to load the satellite view', 'error');

        var existing = document.getElementById('sitePlanModal');

        var overlay = document.createElement('div');

          '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:#293C46;">' +

            '<canvas id="spCanvas" style="position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;"></canvas>' +
            '<div id="spLoadingOverlay" style="display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.3);pointer-events:none;"></div>' +
          '</div>' +
          '<div style="display:flex;gap:8px;padding:8px 16px;background:#293C46;justify-content:center;flex-wrap:wrap;align-items:center;">' +
            '<button onclick="app._spZoom(-1)" style="padding:10px 14px;background:#4C6A7C;color:#fff;border:none;border-radius:6px;font-size:18px;font-weight:700;cursor:pointer;min-height:44px;line-height:1;">&minus;</button>' +
            '<button onclick="app._spZoom(1)" style="padding:10px 14px;background:#4C6A7C;color:#fff;border:none;border-radius:6px;font-size:18px;font-weight:700;cursor:pointer;min-height:44px;line-height:1;">+</button>' +
            '<button id="spDrawBtn" onclick="app._spToggleDraw()" style="padding:10px 20px;background:#4C6A7C;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;">Draw</button>' +
            '<button id="spFinishBtn" onclick="app._spFinishLine()" style="display:none;padding:10px 20px;background:#F15A29;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;">Finish Line</button>' +
            '<button onclick="app._spUndo()" style="padding:10px 20px;background:#4C6A7C;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;">Undo</button>' +
            '<button onclick="app._spClear()" style="padding:10px 20px;background:#4C6A7C;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;">Clear</button>' +
            '<button onclick="app._spCapture()" style="padding:10px 20px;background:#F15A29;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;">Capture Site Plan</button>' +
          '</div>';

        document.body.appendChild(overlay);

        // Store latlng and zoom for static image
        var self = this;
        var latlng = this.job._latlng;
        this._spLatlng = { lat: latlng.lat, lng: latlng.lng };
        this._spZoomLevel = 19;

        setTimeout(function() {
          var container = document.getElementById('spMapContainer');
          var canvas = document.getElementById('spCanvas');
          if (!container || !canvas) return;

          var rect = container.getBoundingClientRect();
          canvas.width = rect.width * (window.devicePixelRatio || 1);
          canvas.height = rect.height * (window.devicePixelRatio || 1);
          canvas.style.width = rect.width + 'px';
          canvas.style.height = rect.height + 'px';

          var ctx = canvas.getContext('2d');
          ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);

          self._spCtx = ctx;
          self._spCanvas = canvas;
          self._spContainer = container;
          self._spStrokes = [];
          self._spCurrentLine = null;
          self._spMousePos = null;
          self._spDrawing = false;
          self._spDrawMode = false;
          self._spPanStart = null;
          self._spPanning = false;
          self._spCanvasW = rect.width;
          self._spCanvasH = rect.height;

          // Attach pan + draw handlers (always active, behaviour depends on mode)
          self._spAttachHandlers();

          // Load static satellite image
          self._spLoadStaticImage();
        }, 100);
      },

      _spLoadStaticImage() {
        var img = document.getElementById('spMapImg');
        var loadingEl = document.getElementById('spLoadingOverlay');
        if (!img) return;
        if (loadingEl) loadingEl.style.display = 'block';
        var w = Math.round(this._spCanvasW);
        var h = Math.round(this._spCanvasH);
        // Static Maps API max size is 640x640 (scale=2 gives 1280x1280 actual pixels)
        var reqW = Math.min(w, 640);
        var reqH = Math.min(h, 640);
        var url = 'https://maps.googleapis.com/maps/api/staticmap?center=' +
          this._spLatlng.lat + ',' + this._spLatlng.lng +
          '&zoom=' + this._spZoomLevel +
          '&size=' + reqW + 'x' + reqH +
          '&maptype=satellite&scale=2&key=' + GOOGLE_MAPS_API_KEY;
        img.onload = function() { if (loadingEl) loadingEl.style.display = 'none'; };
        img.src = url;
      },

      _spZoom(delta) {
        var newZoom = this._spZoomLevel + delta;
        if (newZoom < 17 || newZoom > 21) return;
        this._spZoomLevel = newZoom;
        this._spStrokes = [];
        this._spCurrentLine = null;
        this._spDrawing = false;
        this._spUpdateFinishBtn();
        this._spRedraw();
        this._spLoadStaticImage();
      },

      _spAttachHandlers() {
        var self = this;
        var canvas = this._spCanvas;
        var container = this._spContainer;
        var lastTapTime = 0;

        // ── Mouse handlers ──
        canvas.addEventListener('mousedown', function(e) {
          if (self._spDrawMode) return; // draw clicks handled separately
          // Pan mode: start pan
          self._spPanStart = { x: e.clientX, y: e.clientY };
          self._spPanning = false;
          container.style.cursor = 'grabbing';
        });

        canvas.addEventListener('mousemove', function(e) {
          if (self._spDrawMode) {
            // Update preview line position
            var r = canvas.getBoundingClientRect();
            self._spMousePos = { x: e.clientX - r.left, y: e.clientY - r.top };
            if (self._spCurrentLine && self._spCurrentLine.length > 0) {
              self._spRedraw();
            }
            return;
          }
          // Pan mode: drag
          if (self._spPanStart) {
            self._spPanning = true;
            container.style.cursor = 'grabbing';
          }
        });

        canvas.addEventListener('mouseup', function(e) {
          if (self._spDrawMode) return;
          if (self._spPanning && self._spPanStart) {
            var dx = e.clientX - self._spPanStart.x;
            var dy = e.clientY - self._spPanStart.y;
            self._spApplyPan(dx, dy);
          }
          self._spPanStart = null;
          self._spPanning = false;
          container.style.cursor = self._spDrawMode ? 'crosshair' : 'grab';
        });

        canvas.addEventListener('mouseleave', function() {
          self._spMousePos = null;
          if (self._spCurrentLine && self._spCurrentLine.length > 0) self._spRedraw();
          if (!self._spDrawMode && self._spPanning && self._spPanStart) {
            // Cancel pan on leave
            self._spPanStart = null;
            self._spPanning = false;
            container.style.cursor = 'grab';
          }
        });

        // Click for draw mode (place vertex)
        canvas.addEventListener('click', function(e) {
          if (!self._spDrawMode) return;
          var r = canvas.getBoundingClientRect();
          var x = e.clientX - r.left;
          var y = e.clientY - r.top;
          self._spPlaceVertex(x, y);
        });

        // Double-click to finish line
        canvas.addEventListener('dblclick', function(e) {
          if (!self._spDrawMode) return;
          e.preventDefault();
          self._spFinishLine();
        });

        // ── Touch handlers ──
        canvas.addEventListener('touchstart', function(e) {
          e.preventDefault();
          if (e.touches.length !== 1) return;
          var t = e.touches[0];
          var r = canvas.getBoundingClientRect();

          if (self._spDrawMode) {
            // Detect double-tap
            var now = Date.now();
            if (now - lastTapTime < 350) {
              self._spFinishLine();
              lastTapTime = 0;
              return;
            }
            lastTapTime = now;
            // Place vertex
            self._spPlaceVertex(t.clientX - r.left, t.clientY - r.top);
            return;
          }
          // Pan mode
          self._spPanStart = { x: t.clientX, y: t.clientY };
          self._spPanning = false;
        });

        canvas.addEventListener('touchmove', function(e) {
          e.preventDefault();
          if (e.touches.length !== 1) return;
          var t = e.touches[0];

          if (self._spDrawMode) {
            // Update preview
            var r = canvas.getBoundingClientRect();
            self._spMousePos = { x: t.clientX - r.left, y: t.clientY - r.top };
            if (self._spCurrentLine && self._spCurrentLine.length > 0) self._spRedraw();
            return;
          }
          // Pan mode
          if (self._spPanStart) self._spPanning = true;
        });

        canvas.addEventListener('touchend', function(e) {
          e.preventDefault();
          if (self._spDrawMode) {
            self._spMousePos = null;
            if (self._spCurrentLine && self._spCurrentLine.length > 0) self._spRedraw();
            return;
          }
          if (self._spPanning && self._spPanStart) {
            var ct = e.changedTouches[0];
            var dx = ct.clientX - self._spPanStart.x;
            var dy = ct.clientY - self._spPanStart.y;
            self._spApplyPan(dx, dy);
          }
          self._spPanStart = null;
          self._spPanning = false;
        });
      },

      _spApplyPan(dx, dy) {
        // Convert pixel drag distance to lat/lng offset
        var zoom = this._spZoomLevel;
        var dppLng = 360 / (256 * Math.pow(2, zoom));
        var dppLat = dppLng / Math.cos(this._spLatlng.lat * Math.PI / 180);
        // Use CSS display size for conversion (what the user sees / drags in)
        var displayW = this._spCanvasW;
        var displayH = this._spCanvasH;
        // dx positive = dragged right = map should move left = lng decreases
        this._spLatlng.lng -= dx * dppLng;
        // dy positive = dragged down = map should move up = lat increases
        this._spLatlng.lat += dy * dppLat;
        // Clear strokes since image changed
        this._spStrokes = [];
        this._spCurrentLine = null;
        this._spDrawing = false;
        this._spUpdateFinishBtn();
        this._spRedraw();
        this._spLoadStaticImage();
      },

      _spToggleDraw() {
        this._spDrawMode = !this._spDrawMode;
        var btn = document.getElementById('spDrawBtn');
        var container = this._spContainer;
        if (this._spDrawMode) {
          btn.style.background = '#F15A29';
          btn.textContent = 'Drawing';
          container.style.cursor = 'crosshair';
        } else {
          btn.style.background = '#4C6A7C';
          btn.textContent = 'Draw';
          container.style.cursor = 'grab';
          // If there's a current line being drawn, finish it
          if (this._spCurrentLine && this._spCurrentLine.length > 1) {
            this._spStrokes.push(this._spCurrentLine);
          }
          this._spCurrentLine = null;
          this._spDrawing = false;
          this._spMousePos = null;
          this._spUpdateFinishBtn();
          this._spRedraw();
        }
      },

      _spPlaceVertex(x, y) {
        if (!this._spCurrentLine) {
          this._spCurrentLine = [{ x: x, y: y }];
          this._spDrawing = true;
        } else {
          this._spCurrentLine.push({ x: x, y: y });
        }
        this._spUpdateFinishBtn();
        this._spRedraw();
      },

      _spFinishLine() {
        if (this._spCurrentLine && this._spCurrentLine.length > 1) {
          this._spStrokes.push(this._spCurrentLine);
        }
        this._spCurrentLine = null;
        this._spDrawing = false;
        this._spMousePos = null;
        this._spUpdateFinishBtn();
        this._spRedraw();
      },

      _spUpdateFinishBtn() {
        var btn = document.getElementById('spFinishBtn');
        if (!btn) return;
        btn.style.display = (this._spDrawMode && this._spCurrentLine && this._spCurrentLine.length > 0) ? '' : 'none';
      },

      _spIsLineClosed(line) {
        if (!line || line.length < 3) return false;
        var first = line[0];
        var last = line[line.length - 1];
        var dx = first.x - last.x;
        var dy = first.y - last.y;
        return Math.sqrt(dx * dx + dy * dy) < 20;
      },

      _spMetresPerPixel() {
        if (!this._spLatlng) return 0.3; // fallback
        var C = 40075016.686;
        var zoom = this._spZoomLevel || 19;
        var mPerPx = (C / (256 * Math.pow(2, zoom))) * Math.cos(this._spLatlng.lat * Math.PI / 180);
        var canvasW = this._spCanvasW || 400;
        var reqW = Math.min(canvasW, 640);
        var scale = canvasW / reqW;
        return mPerPx / scale;
      },

      _spDrawLineOnCtx(ctx, line, scale, isDashed) {
        if (!line || line.length < 1) return;
        var s = scale || 1;

        // If closed and 3+ vertices, draw semi-transparent fill
        if (line.length >= 3 && this._spIsLineClosed(line)) {
          ctx.fillStyle = 'rgba(241, 90, 41, 0.15)';
          ctx.beginPath();
          ctx.moveTo(line[0].x * s, line[0].y * s);
          for (var i = 1; i < line.length; i++) ctx.lineTo(line[i].x * s, line[i].y * s);
          ctx.closePath();
          ctx.fill();
        }

        // Draw lines
        ctx.strokeStyle = '#F15A29';
        ctx.lineWidth = 3 * s;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (isDashed) ctx.setLineDash([8 * s, 6 * s]);
        else ctx.setLineDash([]);

        if (line.length >= 2) {
          ctx.beginPath();
          ctx.moveTo(line[0].x * s, line[0].y * s);
          for (var i = 1; i < line.length; i++) ctx.lineTo(line[i].x * s, line[i].y * s);
          ctx.stroke();
        }
        ctx.setLineDash([]);

        // Draw vertex circles
        for (var i = 0; i < line.length; i++) {
          ctx.beginPath();
          ctx.arc(line[i].x * s, line[i].y * s, 6 * s, 0, Math.PI * 2);
          ctx.fillStyle = '#F15A29';
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2 * s;
          ctx.stroke();
        }

        // Distance labels on segments
        if (!isDashed && line.length >= 2) {
          var mpp = this._spMetresPerPixel();
          for (var i = 0; i < line.length - 1; i++) {
            var x1 = line[i].x * s, y1 = line[i].y * s;
            var x2 = line[i+1].x * s, y2 = line[i+1].y * s;
            var dx = x2 - x1, dy = y2 - y1;
            var pxDist = Math.sqrt(dx*dx + dy*dy);
            var metres = (pxDist / s) * mpp;
            if (metres < 0.5) continue;

            var mx = (x1 + x2) / 2;
            var my = (y1 + y2) / 2;
            var angle = Math.atan2(dy, dx);
            if (angle > Math.PI/2 || angle < -Math.PI/2) angle += Math.PI;

            var label = metres.toFixed(1) + 'm';

            ctx.save();
            ctx.translate(mx, my);
            ctx.rotate(angle);
            ctx.translate(0, -12 * s);

            ctx.font = 'bold ' + (11 * s) + 'px sans-serif';
            var tw = ctx.measureText(label).width;
            var pad = 4 * s;

            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.beginPath();
            var r = 3 * s;
            var rx = -(tw/2+pad), ry = -(8*s), rw = tw+pad*2, rh = 16*s;
            if (ctx.roundRect) {
              ctx.roundRect(rx, ry, rw, rh, r);
            } else {
              ctx.rect(rx, ry, rw, rh);
            }
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, 0, 0);

            ctx.restore();
          }
        }
      },

      _spRedraw() {
        var ctx = this._spCtx;
        if (!ctx) return;
        ctx.clearRect(0, 0, this._spCanvasW, this._spCanvasH);

        // Draw completed lines
        var self = this;
        this._spStrokes.forEach(function(line) {
          self._spDrawLineOnCtx(ctx, line, 1, false);
        });

        // Draw current line being placed (with preview to cursor)
        if (this._spCurrentLine && this._spCurrentLine.length > 0) {
          // Build preview: current points + mouse position
          var previewLine = this._spCurrentLine.slice();
          if (this._spMousePos) {
            previewLine = previewLine.concat([this._spMousePos]);
          }
          // Draw the placed segments as solid
          if (this._spCurrentLine.length >= 2) {
            self._spDrawLineOnCtx(ctx, this._spCurrentLine, 1, false);
          } else {
            // Just one point — draw vertex
            self._spDrawLineOnCtx(ctx, this._spCurrentLine, 1, false);
          }
          // Draw preview (dashed) line from last placed point to cursor
          if (this._spMousePos && this._spCurrentLine.length > 0) {
            var lastPt = this._spCurrentLine[this._spCurrentLine.length - 1];
            ctx.strokeStyle = '#F15A29';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 6]);
            ctx.beginPath();
            ctx.moveTo(lastPt.x, lastPt.y);
            ctx.lineTo(this._spMousePos.x, this._spMousePos.y);
            ctx.stroke();
            ctx.setLineDash([]);
          }
        }

        // Total measurement bar
        this._spDrawTotalBar(ctx, 1);
      },

      _spDrawTotalBar(ctx, scale) {
        var s = scale || 1;
        var totalDrawnM = 0;
        var mpp = this._spMetresPerPixel();
        var self = this;
        this._spStrokes.forEach(function(line) {
          for (var i = 0; i < line.length - 1; i++) {
            var dx = line[i+1].x - line[i].x;
            var dy = line[i+1].y - line[i].y;
            totalDrawnM += Math.sqrt(dx*dx + dy*dy) * mpp;
          }
        });
        if (this._spCurrentLine && this._spCurrentLine.length >= 2) {
          for (var i = 0; i < this._spCurrentLine.length - 1; i++) {
            var dx = this._spCurrentLine[i+1].x - this._spCurrentLine[i].x;
            var dy = this._spCurrentLine[i+1].y - this._spCurrentLine[i].y;
            totalDrawnM += Math.sqrt(dx*dx + dy*dy) * mpp;
          }
        }

        var totalRunsM = 0;
        if (this.job && this.job.runs) {
          this.job.runs.forEach(function(run) {
            totalRunsM += (run.length || 0);
          });
        }

        if (totalDrawnM > 0 || totalRunsM > 0) {
          var barText = 'Drawn: ' + totalDrawnM.toFixed(1) + 'm';
          if (totalRunsM > 0) barText += '  |  Runs total: ' + totalRunsM.toFixed(1) + 'm';

          ctx.font = 'bold ' + (13 * s) + 'px sans-serif';
          var tw = ctx.measureText(barText).width;
          var pad = 10 * s;
          var canvasW = (this._spCanvasW || 400) * s;
          var bx = (canvasW - tw) / 2 - pad;
          var by = 10 * s;
          var bh = 28 * s;

          ctx.fillStyle = 'rgba(0,0,0,0.75)';
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(bx, by, tw + pad*2, bh, 6 * s);
          } else {
            ctx.rect(bx, by, tw + pad*2, bh);
          }
          ctx.fill();

          ctx.fillStyle = '#fff';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(barText, canvasW / 2, by + bh / 2);
        }
      },

      _spUndo() {
        if (this._spCurrentLine && this._spCurrentLine.length > 0) {
          // Remove last placed vertex
          this._spCurrentLine.pop();
          if (this._spCurrentLine.length === 0) {
            this._spCurrentLine = null;
            this._spDrawing = false;
          }
          this._spUpdateFinishBtn();
          this._spRedraw();
        } else if (this._spStrokes.length > 0) {
          this._spStrokes.pop();
          this._spRedraw();
        }
      },

      _spClear() {
        this._spStrokes = [];
        this._spCurrentLine = null;
        this._spDrawing = false;
        this._spMousePos = null;
        this._spUpdateFinishBtn();
        this._spRedraw();
      },

      _spCapture() {
        if (!this._spCanvas) {
          this.showToast('Site plan not ready — try reopening the modal', 'error');
          return;
        }
        // Finish any in-progress line first
        if (this._spCurrentLine && this._spCurrentLine.length > 1) {
          this._spStrokes.push(this._spCurrentLine);
          this._spCurrentLine = null;
          this._spDrawing = false;
        }
        var self = this;
        var mapImg = document.getElementById('spMapImg');
        var container = this._spContainer || document.getElementById('spMapContainer');
        if (!container || !mapImg) {
          this.showToast('Cannot capture — map not loaded', 'error');
          return;
        }

        var rect = container.getBoundingClientRect();
        var w = Math.round(rect.width);
        var h = Math.round(rect.height);
        var scale = 2; // retina

        var outCanvas = document.createElement('canvas');
        outCanvas.width = w * scale;
        outCanvas.height = h * scale;
        var outCtx = outCanvas.getContext('2d');

        // Draw the satellite background from the visible map image
        try {
          outCtx.drawImage(mapImg, 0, 0, outCanvas.width, outCanvas.height);
        } catch(e) {
          // If cross-origin tainted, fall back to fetching a fresh static image
          self._spCaptureFallback(w, h);
          return;
        }

        // Draw user lines on top (scaled 2x for retina)
        self._spStrokes.forEach(function(line) {
          self._spDrawLineOnCtx(outCtx, line, scale, false);
        });

        // Draw total measurement bar on capture
        self._spDrawTotalBar(outCtx, scale);

        try {
          var dataUrl = outCanvas.toDataURL('image/jpeg', 0.85);
          self.job.sitePlanImage = dataUrl;
        } catch(e) {
          // Canvas tainted by cross-origin image — use fallback
          self._spCaptureFallback(w, h);
          return;
        }

        // Remove any old site plan from checklist photos
        if (self.job.checklist && self.job.checklist.photos) {
          self.job.checklist.photos = self.job.checklist.photos.filter(function(p) { return p.label !== 'Site Plan'; });
        }

        self.save();
        self.showToast('Site plan captured', 'success');
        var modal = document.getElementById('sitePlanModal');
        if (modal) modal.remove();
        self.renderSiteInfo();
      },

      _spCaptureFallback(w, h) {
        // Re-fetch static map with crossOrigin=anonymous for clean canvas export
        var self = this;
        if (!this._spLatlng) {
          this.showToast('No location data — cannot capture', 'error');
          return;
        }
        var lat = this._spLatlng.lat;
        var lng = this._spLatlng.lng;
        var zoom = this._spZoomLevel;
        var reqW = Math.min(Math.round(w), 640);
        var reqH = Math.min(Math.round(h), 640);
        var scale = 2;

        var staticUrl = 'https://maps.googleapis.com/maps/api/staticmap?center=' +
          lat + ',' + lng + '&zoom=' + zoom +
          '&size=' + reqW + 'x' + reqH + '&maptype=satellite&scale=2&key=' + GOOGLE_MAPS_API_KEY;

        var bgImg = new Image();
        bgImg.crossOrigin = 'anonymous';
        bgImg.onload = function() {
          var outCanvas = document.createElement('canvas');
          outCanvas.width = w * scale;
          outCanvas.height = h * scale;
          var outCtx = outCanvas.getContext('2d');
          outCtx.drawImage(bgImg, 0, 0, outCanvas.width, outCanvas.height);

          self._spStrokes.forEach(function(line) {
            self._spDrawLineOnCtx(outCtx, line, scale, false);
          });

          // Draw total measurement bar on capture
          self._spDrawTotalBar(outCtx, scale);

          try {
            var dataUrl = outCanvas.toDataURL('image/jpeg', 0.85);
            self.job.sitePlanImage = dataUrl;

            if (self.job.checklist && self.job.checklist.photos) {
              self.job.checklist.photos = self.job.checklist.photos.filter(function(p) { return p.label !== 'Site Plan'; });
            }

            self.save();
            self.showToast('Site plan captured', 'success');
            var modal = document.getElementById('sitePlanModal');
            if (modal) modal.remove();
            self.renderSiteInfo();
          } catch(e) {
            self.showToast('Failed to capture: ' + e.message, 'error');
          }
        };
        bgImg.onerror = function() {
          self.showToast('Failed to load map image for capture', 'error');
        };
        bgImg.src = staticUrl;
      },

      showSitePlanEnlarged() {
        if (!this.job.sitePlanImage) return;
        var overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:10001;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:20px;';
        overlay.innerHTML = '<img src="' + this.job.sitePlanImage + '" style="max-width:100%;max-height:100%;border-radius:8px;">';
        overlay.onclick = function() { overlay.remove(); };
        document.body.appendChild(overlay);
      },

      updateRemoval(field, value) {
        this.logScopeDecision('removal_change', { field, value });
        if (!this.job.removal) this.job.removal = {};
        if (field === 'existingFenceLength') value = parseFloat(value) || 0;
        if (field === 'asbestosSheetCount') value = parseInt(value) || 0;
        this.job.removal[field] = value;
        // Auto-set asbestos defaults when type changes to asbestos
        if (field === 'existingFenceType' && value === 'asbestos') {
          if (this.job.removal.asbestosCert === undefined) this.job.removal.asbestosCert = true;
          this.job.removal.asbestosSheetCount = Math.ceil(this.job.removal.existingFenceLength || 0);
        }
        // Re-calc sheet count when length changes and type is asbestos
        if (field === 'existingFenceLength' && this.job.removal.existingFenceType === 'asbestos') {
          this.job.removal.asbestosSheetCount = Math.ceil(value || 0);
        }
        this.save();
        this.updateSectionStatuses();
        this.renderRemoval();
      },

      addRemovalExtra() {
        if (!this.job.removal) this.job.removal = {};
        if (!this.job.removal.removalExtras) this.job.removal.removalExtras = [];
        this.job.removal.removalExtras.push({ fenceType: '', length: 0, disposal: 'company' });
        this.save();
        this.updateSectionStatuses();
        this.renderRemoval();
      },

      removeRemovalExtra(idx) {
        if (!this.job.removal || !this.job.removal.removalExtras) return;

      updateQuote(field, value) {

      updateCustomItem(idx, field, value) {
        if (!this.job.quote) this.job.quote = {};
        if (!this.job.quote.customLineItems) this.job.quote.customLineItems = [{}, {}, {}];
        while (this.job.quote.customLineItems.length <= idx) this.job.quote.customLineItems.push({});
        if (field === 'qty' || field === 'price') value = parseFloat(value) || 0;
        this.job.quote.customLineItems[idx][field] = value;

      updateChecklist(field, value) {

      handlePhotoSelect(event) {
        const files = Array.from(event.target.files || []);
        event.target.value = '';
        if (files.length > 0) this._processPhotoFiles(files);
      },

      handlePhotoDrop(event) {
        const files = Array.from(event.dataTransfer.files || []);
        if (files.length > 0) this._processPhotoFiles(files);
      },

      async _processPhotoFiles(files) {
        if (!this.job.checklist) this.job.checklist = {};
        if (!this.job.checklist.photos) this.job.checklist.photos = [];
        if (!window._photoFiles) window._photoFiles = {};

        let added = 0;
        for (const file of files) {
          // Accept image/* types and also files with image extensions (HEIC/HEIF may have empty type)
          const ext = (file.name || '').split('.').pop().toLowerCase();
          const imgExts = ['jpg','jpeg','png','gif','webp','heic','heif','bmp','tiff'];
          if (!file.type.startsWith('image/') && !imgExts.includes(ext)) continue;
          try {
            // Load once, resize to both thumbnail and upload quality
            const { thumb: thumbUrl, upload: uploadUrl } = await this._processOnePhoto(file, 200, 0.5, 1200, 0.8);
            const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            // Keep upload-quality image in memory (not localStorage)
            window._photoFiles[id] = uploadUrl;
            this.job.checklist.photos.push({
              id: id,
              name: file.name,
              dataUrl: thumbUrl,
              timestamp: Date.now()
            });
            added++;
          } catch (e) {
            console.warn('Failed to process photo:', file.name, e);
          }
        }
        this.job.checklist.photosTaken = this.job.checklist.photos.length;
        this.save();
        this.renderChecklist();
        this.updateSectionStatuses();
        if (added > 0) this.showToast(added + ' photo' + (added > 1 ? 's' : '') + ' added — will upload on Cloud Save', 'success');
      },

      _processOnePhoto(file, thumbDim, thumbQ, uploadDim, uploadQ) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = function() {
            URL.revokeObjectURL(url);
            function resize(maxDim, quality) {
              let w = img.width, h = img.height;
              if (w > maxDim || h > maxDim) {
                if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
                else { w = Math.round(w * maxDim / h); h = maxDim; }
              }
              const c = document.createElement('canvas');
              c.width = w; c.height = h;
              c.getContext('2d').drawImage(img, 0, 0, w, h);
              const dataUrl = c.toDataURL('image/jpeg', quality);
              c.width = 0; c.height = 0;
              return dataUrl;
            }
            resolve({ thumb: resize(thumbDim, thumbQ), upload: resize(uploadDim, uploadQ) });
          };
          img.onerror = function() { URL.revokeObjectURL(url); reject(new Error('Failed to load image')); };
          img.src = url;
        });
      },

      // Legacy wrapper in case anything else calls _compressImage
      _compressImage(file, maxDim, quality) {
        return this._processOnePhoto(file, maxDim, quality, maxDim, quality).then(r => r.upload);
      },

      handleVideoSelect(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        if (!this.job.checklist) this.job.checklist = {};
        this.job.checklist.videoWalkthrough = true;
        this.job.checklist.videoFileName = file.name;
        this.job.checklist.videoSize = file.size;

        // Keep File object in memory for cloud upload — never store video in localStorage
        // (even small videos exceed localStorage's ~5-10MB limit as base64)
        window.siteVideo = {
          file: file,
          dataUrl: null,
          label: file.name || 'Site Walkthrough'
        };

        this.save();
        this.renderChecklist();
        this.updateSectionStatuses();
        this.showToast('Video attached: ' + file.name + ' (' + (file.size / 1048576).toFixed(1) + 'MB) — will upload on Cloud Save', 'success');
      },

      deletePhoto(photoId) {
        if (!this.job.checklist || !this.job.checklist.photos) return;
        this.job.checklist.photos = this.job.checklist.photos.filter(p => p.id !== photoId);
        this.job.checklist.photosTaken = this.job.checklist.photos.length;
        this.save();
        this.renderChecklist();
        this.updateSectionStatuses();
      },

      _esc(val) {
        if (!val) return '';
        return String(val).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      },

      _getColourHex(name) {
        const c = [...COLOURS_STOCK, ...COLOURS_SPECIAL].find(c => c.name === name);
        return c ? c.hex : '#cccccc';
      },

      _getProfileSVG(profile) {
        const imgBase = 'https://steelselect.com.au/sites/default/files/images/products/main/';
        const dimBase = 'https://steelselect.com.au/sites/default/files/images/products/dimensions/';
        const urls = {
          'Ridgeside': dimBase + 'Ridgeside%20Front.jpg',
          'Sameside': dimBase + 'Sameside%20Front.jpg',
          'Trimclad': imgBase + 'Metroll%20Trimclad-%C2%AB%20Fencing.jpg',
          'Metline Premium': imgBase + 'Metroll%20Metline%20Premium.jpg',
          'Harmony': imgBase + 'Metroll%20Metline%20Harmony.jpg',
          'Metzag': imgBase + 'Metroll%20Metzag%20Fencing.jpg',
          'Corodek': imgBase + 'Metroll%20Corodek-%C2%AB%20Fencing.jpg',
          'Mini Corodek': imgBase + 'Metroll%20Mini%20Corodek-%C2%AB%20Fencing.jpg',
          'Atlas': imgBase + 'Atlas1200.jpg',
          'Polaris': imgBase + 'Polaris%201200.jpg',
          'Gemini': imgBase + 'gemini1200.jpg',
          'Neetascreen': imgBase + 'LYSAGHT%20NEETASCREEN-%C2%AB%20Fencing.jpg',
          'Smartascreen': imgBase + 'LYSAGHT%20SMARTASCREEN-%C2%AB%20Fencing.jpg',
          'Miniscreen': imgBase + 'LYSAGHT%20MINISCREEN-%C2%AB%20Fencing.jpg',
          'Customscreen': imgBase + 'LYSAGHT%20CUSTOMSCREEN-%C2%AB%20Fencing.jpg',
          'Superdek': imgBase + 'stratco-superdek-fencing.jpg',
          'Good Neighbour': imgBase + 'stratco-good-neighbour-fencing.jpg'
        };
        const url = urls[profile];
        const escaped = profile.replace(/'/g, "\\'");
        if (url) {
          return `<div style="margin-top:8px;max-width:340px;">
            <img src="${url}" alt="${this._esc(profile)} profile"
              style="width:100%;border-radius:4px;display:block;background:#f3f4f6;"
              onerror="app._onProfileImgError(this,'${escaped}')">
          </div>`;
        }
        return this._buildProfileSVG(profile);
      },

      _onProfileImgError(img, profile) {
        img.parentElement.innerHTML = this._buildProfileSVG(profile);
      },

      _buildProfileSVG(profile) {
        const pw = 300, ph = 180, railH = 8, postW = 6;
        const base = '#d9d9d9', rail = '#b0b0b0', railEdge = '#a0a0a0';
        const rib = '#c5c5c5', shade = '#b0b0b0', deep = '#a0a0a0', hi = '#e4e4e4';
        const st = railH, sh = ph - 2 * railH;
        const sx = postW, ex = pw - postW;
        let strips = '';

        const drawStrips = (pattern) => {
          let x = sx;
          while (x < ex) {
            for (const [w, c] of pattern) {
              if (x >= ex) break;
              const dw = Math.min(w, ex - x);
              if (c !== base) strips += `<rect x="${x.toFixed(1)}" y="${st}" width="${dw.toFixed(1)}" height="${sh}" fill="${c}"/>`;
              x += w;
            }
          }
        };
        const drawWave = (period, minV, maxV) => {
          for (let x = sx; x < ex; x += 1.5) {
            const t = Math.sin(x * 2 * Math.PI / period);
            const v = Math.round(minV + (maxV - minV) * (t + 1) / 2);
            strips += `<rect x="${x}" y="${st}" width="${Math.min(1.5, ex - x)}" height="${sh}" fill="rgb(${v},${v},${v})"/>`;
          }
        };

        switch(profile) {
          case 'Ridgeside':
            drawStrips([[9,base],[1.5,rib],[0.8,shade],[7,base],[2,rib],[1,shade]]);
            break;
          case 'Sameside':
          case 'Good Neighbour':
            drawWave(24, 185, 225);
            break;
          case 'Trimclad':
          case 'Neetascreen':
            drawStrips([[15,base],[2,rib],[1,shade]]);
            break;
          case 'Metline Premium':
            drawStrips([[10,base],[0.8,shade],[2,hi],[0.8,shade]]);
            break;
          case 'Harmony':
            drawStrips([[2,base],[1.5,rib],[0.8,shade],[2,base],[1.5,rib],[0.8,shade],[2,base],[1.5,rib],[0.8,shade],[10,base]]);
            break;
          case 'Metzag':
            drawStrips([[7,hi],[2.5,shade],[7,hi],[2.5,shade]]);
            break;
          case 'Corodek':
          case 'Customscreen':
            drawWave(20, 180, 228);
            break;
          case 'Mini Corodek':
          case 'Miniscreen':
            drawWave(12, 185, 225);
            break;
          case 'Atlas':
            drawStrips([[1.5,shade],[22,hi],[1.5,shade],[5,base]]);
            break;
          case 'Polaris':
            drawStrips([[14,base],[0.8,shade],[5,hi],[0.8,shade]]);
            break;
          case 'Gemini':
            drawStrips([[5,hi],[2,shade],[5,hi],[2,shade]]);
            break;
          case 'Smartascreen': {
            for (let x = sx; x < ex; x += 1) {
              const t = (x % 20) / 20;
              const v = Math.round(190 + 35 * t);
              strips += `<rect x="${x}" y="${st}" width="1" height="${sh}" fill="rgb(${v},${v},${v})"/>`;
            }
            break;
          }
          case 'Spanscreen':
            drawStrips([[1.5,deep],[20,hi],[1.5,deep],[8,base]]);
            break;
          case 'Superdek':
            drawStrips([[1.5,shade],[16,hi],[1.5,shade],[8,base]]);
            break;
          default:
            drawStrips([[14,base],[2,rib],[1,shade]]);
        }

        return `<svg viewBox="0 0 ${pw} ${ph}" preserveAspectRatio="xMidYMid meet" overflow="hidden" style="width:100%;max-width:340px;height:auto;margin-top:8px;display:block;border-radius:4px;">
          <rect width="${pw}" height="${ph}" fill="${base}" rx="2"/>
          ${strips}
          <rect width="${pw}" height="${railH}" fill="${rail}"/>
          <line x1="0" y1="${railH}" x2="${pw}" y2="${railH}" stroke="${railEdge}" stroke-width="0.5"/>
          <rect y="${ph-railH}" width="${pw}" height="${railH}" fill="${rail}"/>
          <line x1="0" y1="${ph-railH}" x2="${pw}" y2="${railH}" stroke="${railEdge}" stroke-width="0.5"/>
          <rect width="${postW}" height="${ph}" fill="${rail}"/>
          <rect x="${pw-postW}" width="${postW}" height="${ph}" fill="${rail}"/>
          <rect width="${pw}" height="${ph}" fill="none" stroke="${railEdge}" stroke-width="1" rx="2"/>
        </svg>`;
      },

      render() {
        // Sync section open/closed state to DOM
        Object.keys(this._openSections).forEach(k => {
          const key = k.charAt(0).toUpperCase() + k.slice(1);
          const el = document.getElementById('section' + key);
          if (el) el.classList.toggle('open', this._openSections[k]);
        });

        // Recalc slope-derived steps + plinths for all runs before rendering
        this.job.runs.forEach(run => this.calcSlopeForRun(run));

        // Render all scope form sections
        this.renderSiteInfo();
        this.renderRemoval();
        this.renderInstallation();
        this.renderRunTabs();
        this.renderRunContent();
        this.renderGatesSection();
        this.updateStats();
        this.renderQuoteAndOrders();
        this.renderQuote();
        this.renderChecklist();
        this.updateSectionStatuses();

        // Only render profile view if visualizer section is open
        if (this._openSections.visualizer) {
          this.renderProfileView();
        }
      },

      renderRunTabs() {
        const tabsHtml = this.job.runs.map(run => {
          const panelCount = run.panels.length;
          return `<div class="run-tab ${run.id === this.currentRunId ? 'active' : ''}"
                       onclick="app.switchRun('${run.id}')">
                    ${run.name || 'Unnamed'}${panelCount > 0 ? ` (${panelCount})` : ''}

        document.getElementById('runTabs').innerHTML = `
          ${tabsHtml}
          <button class="add-run-btn" onclick="app.addRun()">+ Add Run</button>
        `;
      },

      renderRunContent() {
        const run = this.job.runs.find(r => r.id === this.currentRunId);
        if (!run) {
          document.getElementById('runContent').innerHTML =
            '<p style="padding: 20px; color: #4C6A70;">No run selected. Click "+ Add Run" to begin.</p>';
          return;
        }

        // Warnings
        const warnings = this.getComplianceWarnings();
        let warningsHtml = '';

          </div>`;
        });

        // Compute posts for this run
        const posts = this.getRunPosts(run);

        // Panel table rows
        const panelRows = run.panels.map((panel, idx) => {
          const derived = this.getPanelDerived(panel);
          // Post for this panel = the post to the RIGHT of the panel (post index idx+1)
          // But per spec, "Post" column shows the calculated post height.
          // Post at position idx sits between panel idx-1 and panel idx.
          // We'll show the max post relevant to this panel (max of left and right post).
          const leftPost = posts[idx];
          const rightPost = posts[idx + 1];
          const maxPost = Math.max(leftPost.postSize, rightPost.postSize);
          const anyPatio = leftPost.patio || rightPost.patio;

          const totalClass = derived.totalHeight > 1800 ? 'total-elevated' : 'total-standard';
          const postDisplay = anyPatio

          // Plinths display: total plinths (slope + manual), append † when >= 3 (patio tube)
          const plinthsDisplay = derived.plinths >= 3 ? `${derived.plinths}†` : `${derived.plinths}`;

          // Slope plinths display (read-only, greyed out)
          const slopePlinthsDisplay = derived.slopePlinths > 0 ? `${derived.slopePlinths}` : '—';

          // Step auto-calculated from slope — shows direction + mm amount

          let stepDisplay;
          if (stepMm < 0) stepDisplay = '\u2193' + Math.abs(stepMm);

        document.getElementById('runContent').innerHTML = `

              </div>

              <div class="form-group">

                  <option value="" ${!run.neighbourId ? 'selected' : ''}>No neighbour (client side)</option>
                  ${(this.job.neighbours || []).map(nb => {

              <div class="form-group">
                <label>Length (m) *</label>

              <div class="form-group">

                    `<option value="${o.value}" ${run.extension === o.value ? 'selected' : ''}>${o.label}</option>`
                  ).join('')}

              </div>
            </div>
            <div class="run-settings-actions">
              <button class="btn-orange" onclick="app.applyHeightToAll('${run.id}')">Apply Height to All</button>
              <button class="btn-delete" onclick="app.deleteRun('${run.id}')">Delete Run</button>
            </div>
          </div>

          ${(() => {
            const slope = run.slope || {};
            const slopeMode = slope.mode || 'simple';
            const simple = slope.simple || { direction: 'left-to-right', totalFallMm: 0, startsFrom: 'start' };
            const slopePts = (slope.points) || [];
            const rid = run.id;
            const runLen = run.length || 0;

            if (slopeMode === 'simple') {
              // ── SIMPLE MODE ──
              const dirLR = simple.direction === 'left-to-right';
              const fall = simple.totalFallMm || 0;
              // Helper label
              let helperText = '';
              if (fall === 0) {
                helperText = 'Flat ground (no slope)';
              } else {
                const dirText = dirLR ? 'left to right' : 'right to left';
                const startLabels = { 'start': '', '25': ' from 25%', '50': ' from 50%', '75': ' from 75%' };
                helperText = 'Ground drops ' + fall + 'mm over ' + runLen.toFixed(1) + 'm (' + dirText + ')' + (startLabels[simple.startsFrom] || '');
              }

              return '<div class="slope-section">' +
                '<h3>Ground Slope</h3>' +
                '<div class="slope-simple-controls">' +
                  '<div class="slope-control-row">' +
                    '<label>Direction</label>' +
                    '<div class="slope-direction-toggle">' +
                      '<button class="slope-direction-btn' + (dirLR ? ' active' : '') + '" onclick="app.updateSimpleSlope(\'' + rid + '\', \'direction\', \'left-to-right\')">Falls left \u2192 right</button>' +
                      '<button class="slope-direction-btn' + (!dirLR ? ' active' : '') + '" onclick="app.updateSimpleSlope(\'' + rid + '\', \'direction\', \'right-to-left\')">Falls right \u2192 left</button>' +
                    '</div>' +
                  '</div>' +
                  '<div class="slope-control-row">' +
                    '<label>Total Fall</label>' +
                    '<input type="number" class="slope-fall-input-simple" value="' + fall + '" step="150" min="0" max="1800" ' +
                      'onchange="app.updateSimpleSlope(\'' + rid + '\', \'totalFallMm\', this.value)">' +
                    '<span style="font-size:12px;color:#6B5335;">mm</span>' +
                  '</div>' +
                  '<div class="slope-helper-label">' + helperText + '</div>' +
                  '<div class="slope-control-row">' +
                    '<label>Starts at</label>' +
                    '<select class="slope-starts-select" onchange="app.updateSimpleSlope(\'' + rid + '\', \'startsFrom\', this.value)">' +
                      '<option value="start"' + (simple.startsFrom === 'start' ? ' selected' : '') + '>From start</option>' +
                      '<option value="25"' + (simple.startsFrom === '25' ? ' selected' : '') + '>From 25%</option>' +
                      '<option value="50"' + (simple.startsFrom === '50' ? ' selected' : '') + '>From 50%</option>' +
                      '<option value="75"' + (simple.startsFrom === '75' ? ' selected' : '') + '>From 75%</option>' +

                  '</div>' +
                '</div>' +
                '<a class="slope-mode-link" onclick="app.toggleSlopeMode(\'' + rid + '\')">Advanced mode \u2192</a>' +
              '</div>';
            } else {
              // ── ADVANCED MODE ──
              const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
              let slopeRows = '';
              slopePts.forEach((pt, pi) => {
                const letter = pi < letters.length ? letters[pi] : '?';
                const hMm = pt.heightMm || 0;
                const userFlag = pt.userSet ? ' \u2022' : '';

                if (pi === 0) {
                  // Point A — UNLOCKED in advanced mode
                  slopeRows += '<div class="slope-point-row">' +

                    'onchange="app.updateSlopePoint(\'' + rid + '\', 0, \'heightMm\', this.value)">' +
                    '<span>mm' + userFlag + '</span>' +
                    '</div>';
                } else if (pi === slopePts.length - 1) {
