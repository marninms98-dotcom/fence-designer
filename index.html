        const earthMat = new THREE.MeshStandardMaterial({ color: 0xC4A882, roughness: 0.85, metalness: 0.0 });
        const galvMat = new THREE.MeshStandardMaterial({ color: 0xB0B0B0, metalness: 0.5, roughness: 0.45 });
        const concreteMat = new THREE.MeshStandardMaterial({ color: 0xB8B8B0, roughness: 0.85, metalness: 0.0 });

        // Dimensions
        const supplier = SUPPLIER_PROFILES[job.supplier] || SUPPLIER_PROFILES.RNR;
        const panelWidthMm = supplier.panelWidth;
        const panelWidthM = panelWidthMm / 1000;
        const postW = 0.05;
        const railH = 0.025;
        const plinthH = 0.15;
        const embedDepth = 0.6;
        const profile = job.profile || 'Trimclad';

        // Compute slope data
        this._calcSlopePlinths(run);
        const panelCount = run.panels.length;

        // Ground offsets from slope
        const groundOffsets = new Array(panelCount + 1).fill(0);
        if (run.slope && run.slope.points && run.slope.points.length >= 2) {
          const pts = run.slope.points;
          const totalLen = run.length || (panelCount * panelWidthMm / 1000);
          for (let pi = 0; pi <= panelCount; pi++) {
            const xM = pi * panelWidthM;
            let hMm = 0;
            for (let si = 0; si < pts.length - 1; si++) {
              const dS = pts[si].distanceM || 0;
              const dE = pts[si+1].distanceM || totalLen;
              if (xM >= dS && xM <= dE) {
                const t = dE > dS ? (xM - dS) / (dE - dS) : 0;
                hMm = (pts[si].heightMm||0) + t * ((pts[si+1].heightMm||0) - (pts[si].heightMm||0));
                break;
              }
            }
            groundOffsets[pi] = hMm / 1000;
          }
        }
        const minGnd = Math.min(...groundOffsets);
        for (let i = 0; i < groundOffsets.length; i++) groundOffsets[i] -= minGnd;

        // Track panel positions for dimensions
        const panelPositions = [];
        let cursorX = 0;
        let maxFenceTop = 0;

        // ══ BUILD FENCE ══
        for (let pi = 0; pi <= panelCount; pi++) {
          const gndY = groundOffsets[pi];

          // ── POST ──
          let postH = 2.4;
          const leftPanel = pi > 0 ? run.panels[pi-1] : null;
          const rightPanel = pi < panelCount ? run.panels[pi] : null;
          if (leftPanel) {
            const lk = lookupPost(leftPanel.height, Math.min(4, (leftPanel.slopePlinths||0) + leftPanel.retaining/150) * 150);
            postH = Math.max(postH, lk.post / 1000);
          }
          if (rightPanel) {
            const rk = lookupPost(rightPanel.height, Math.min(4, (rightPanel.slopePlinths||0) + rightPanel.retaining/150) * 150);
            postH = Math.max(postH, rk.post / 1000);
          }
          const aboveGnd = postH - embedDepth;
          maxFenceTop = Math.max(maxFenceTop, gndY + aboveGnd);

          // Post body
          const postGeo = new THREE.BoxGeometry(postW, aboveGnd, postW);
          const post = new THREE.Mesh(postGeo, postMat);
          post.position.set(cursorX, gndY + aboveGnd/2, 0);
          post.castShadow = true; post.receiveShadow = true;
          post.userData = { info: `<b>Post ${pi+1}</b><br>Height: ${postH*1000}mm<br>Above ground: ${Math.round(aboveGnd*1000)}mm<br>Embed: ${embedDepth*1000}mm` };
          f.fenceGrp.add(post);

          // Post cap (small square on top)
          const postCapGeo = new THREE.BoxGeometry(postW + 0.008, 0.006, postW + 0.008);
          const postCap = new THREE.Mesh(postCapGeo, capMat);
          postCap.position.set(cursorX, gndY + aboveGnd + 0.003, 0);
          f.fenceGrp.add(postCap);

          // Embed (underground)
          const embedGeo = new THREE.BoxGeometry(postW, embedDepth, postW);
          const eMat = postMat.clone(); eMat.transparent = true; eMat.opacity = 0.3;
          const embed = new THREE.Mesh(embedGeo, eMat);
          embed.position.set(cursorX, gndY - embedDepth/2, 0);
          f.fenceGrp.add(embed);

          // Concrete footing
          const footGeo = new THREE.CylinderGeometry(0.12, 0.14, 0.5, 8);
          const foot = new THREE.Mesh(footGeo, concreteMat.clone());
          foot.material.transparent = true; foot.material.opacity = 0.4;
          foot.position.set(cursorX, gndY - 0.35, 0);
          f.fenceGrp.add(foot);

          // Patio tube if needed
          if (leftPanel || rightPanel) {
            const checkP = rightPanel || leftPanel;
            const totalPl = Math.min(4, (checkP.slopePlinths||0) + checkP.retaining/150);
            if (totalPl >= 3 && totalPl <= 4) {
              const tube = new THREE.Mesh(new THREE.BoxGeometry(0.076, aboveGnd, 0.038), galvMat);
              tube.position.set(cursorX, gndY + aboveGnd/2, -0.04);
              tube.castShadow = true;
              tube.userData = { info: '<b>Patio Tube</b><br>76×38mm RHS<br>Galvanised steel<br>Reinforcement for high retaining' };
              f.fenceGrp.add(tube);
            }
          }

          // ── PANEL ──
          if (pi < panelCount) {
            const panel = run.panels[pi];
            const panelX = cursorX + postW/2 + panelWidthM/2;
            const panelGnd = Math.min(groundOffsets[pi], groundOffsets[pi+1]);

            const slopePl = panel.slopePlinths || 0;
            const manualPl = panel.retaining / 150;
            const totalPl = Math.min(4, slopePl + manualPl);
            const retH = totalPl * plinthH;
            let stackY = panelGnd;

            // Plinths
            for (let pli = 0; pli < totalPl; pli++) {
              const plGeo = new THREE.BoxGeometry(panelWidthM, plinthH - 0.002, 0.008);
              const pl = new THREE.Mesh(plGeo, plinthMat);
              pl.position.set(panelX, stackY + plinthH/2, 0);
              pl.castShadow = true; pl.receiveShadow = true;
              pl.userData = { info: `<b>Plinth ${pli+1}/${Math.round(totalPl)}</b><br>Panel ${pi+1}<br>150mm COLORBOND<br>${job.colour}` };
              f.fenceGrp.add(pl);
              // Horizontal ribs
              for (let ri = 1; ri <= 3; ri++) {
                const rib = new THREE.Mesh(new THREE.BoxGeometry(panelWidthM, 0.002, 0.001), postMat);
                rib.position.set(panelX, stackY + (plinthH*ri/4), 0.005);
                f.fenceGrp.add(rib);
              }
              stackY += plinthH;
            }

            // Retaining earth
            if (totalPl > 0) {
              const earthGeo = new THREE.BoxGeometry(panelWidthM, retH, 0.5);
              const earth = new THREE.Mesh(earthGeo, earthMat);
              earth.position.set(panelX, panelGnd + retH/2, -0.3);
              earth.receiveShadow = true;
              f.fenceGrp.add(earth);
              // Grass on top of earth
              const gsGeo = new THREE.BoxGeometry(panelWidthM, 0.01, 0.5);
              const gs = new THREE.Mesh(gsGeo, new THREE.MeshStandardMaterial({ color: 0x5C8A3C, roughness: 0.9 }));
              gs.position.set(panelX, panelGnd + retH + 0.005, -0.3);
              f.fenceGrp.add(gs);
            }

            // Bottom rail
            const bRail = new THREE.Mesh(new THREE.BoxGeometry(panelWidthM, railH, 0.04), railMat);
            bRail.position.set(panelX, stackY + railH/2, 0);
            bRail.castShadow = true;
            f.fenceGrp.add(bRail);
            stackY += railH;

            // Sheet (corrugated)
            const sheetH = panel.height / 1000;
            const sheetGeo = this._createFenceSheetGeo(panelWidthM, sheetH, profile);
            const sheet = new THREE.Mesh(sheetGeo, panelMat);
            sheet.position.set(panelX, stackY + sheetH/2, 0);
            sheet.castShadow = true; sheet.receiveShadow = true;
            sheet.userData = { info: `<b>Panel ${pi+1}</b><br>${panel.height}mm ${profile}<br>${job.colour}<br>Width: ${panelWidthMm}mm${totalPl > 0 ? '<br>Retaining: '+Math.round(retH*1000)+'mm ('+Math.round(totalPl)+' plinths)' : ''}` };
            f.fenceGrp.add(sheet);
            stackY += sheetH;

            // Cap rail
            const cRail = new THREE.Mesh(new THREE.BoxGeometry(panelWidthM, railH, 0.045), capMat);
            cRail.position.set(panelX, stackY + railH/2, 0);
            cRail.castShadow = true;
            f.fenceGrp.add(cRail);

            // Track panel position
            const panelTop = stackY + railH;
            maxFenceTop = Math.max(maxFenceTop, panelTop);
            panelPositions.push({ x: panelX, gnd: panelGnd, top: panelTop, retH, sheetH, panelIdx: pi });

            cursorX += postW + panelWidthM;
          }
        }

        // ══ GATES ══
        if (job.gates && job.gates.length > 0) {
          let gateX = cursorX + 0.3;
          job.gates.forEach((gate, gi) => {
            const gateW = gate.type === 'double' ? 3.255 : 0.9;
            const gateH = 1.75;
            const gatePostH = 2.4;
            const gpMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.5, roughness: 0.4 });

            // Gate posts (90x90mm SHS)
            for (let gpi = 0; gpi < 2; gpi++) {
              const gp = new THREE.Mesh(new THREE.BoxGeometry(0.09, gatePostH - embedDepth, 0.09), gpMat);
              gp.position.set(gateX + gpi * gateW, (gatePostH - embedDepth)/2, 0);
              gp.castShadow = true;
              gp.userData = { info: `<b>Gate Post</b><br>90×90mm SHS<br>${gate.type === 'double' ? 'Double' : 'Pedestrian'} gate` };
              f.fenceGrp.add(gp);
              // Post cap
              const gc = new THREE.Mesh(new THREE.BoxGeometry(0.098, 0.006, 0.098), capMat);
              gc.position.set(gateX + gpi * gateW, (gatePostH - embedDepth) + 0.003, 0);
              f.fenceGrp.add(gc);
            }

            // Gate panels
            if (gate.type === 'double') {
              for (let leaf = 0; leaf < 2; leaf++) {
                const lW = gateW/2 - 0.03;
                const lMesh = new THREE.Mesh(this._createFenceSheetGeo(lW, gateH, profile), panelMat);
                lMesh.position.set(gateX + leaf*(gateW/2) + lW/2 + 0.015, gateH/2 + railH, 0);
                lMesh.castShadow = true;
                lMesh.userData = { info: `<b>Double Gate Leaf ${leaf+1}</b><br>${gateH*1000}mm × ${Math.round(lW*1000)}mm<br>${job.colour} ${profile}` };
                f.fenceGrp.add(lMesh);
              }
              // Hinge cylinders
              for (let hi = 0; hi < 2; hi++) {
                const hinge = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.06, 6), galvMat);
                hinge.position.set(gateX, 0.4 + hi * 0.95, 0.025);
                f.fenceGrp.add(hinge);
                const hinge2 = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.06, 6), galvMat);
                hinge2.position.set(gateX + gateW, 0.4 + hi * 0.95, 0.025);
                f.fenceGrp.add(hinge2);
              }
            } else {
              const gP = new THREE.Mesh(this._createFenceSheetGeo(gateW - 0.03, gateH, profile), panelMat);
              gP.position.set(gateX + gateW/2, gateH/2 + railH, 0);
              gP.castShadow = true;
              gP.userData = { info: `<b>Pedestrian Gate</b><br>${gateH*1000}mm × ${Math.round((gateW-0.03)*1000)}mm<br>${job.colour} ${profile}` };
              f.fenceGrp.add(gP);
              // Hinges
              for (let hi = 0; hi < 2; hi++) {
                const hinge = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.06, 6), galvMat);
                hinge.position.set(gateX, 0.4 + hi * 0.95, 0.025);
                f.fenceGrp.add(hinge);
              }
              // Handle
              const handle = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.08, 0.02), galvMat);
              handle.position.set(gateX + gateW - 0.06, gateH/2 + railH, 0.025);
              f.fenceGrp.add(handle);
            }

            // Top rail on gate
            const gCap = new THREE.Mesh(new THREE.BoxGeometry(gateW, railH, 0.045), capMat);
            gCap.position.set(gateX + gateW/2, gateH + railH*1.5, 0);
            f.fenceGrp.add(gCap);
            // Bottom rail on gate
            const gBot = new THREE.Mesh(new THREE.BoxGeometry(gateW, railH, 0.04), railMat);
            gBot.position.set(gateX + gateW/2, railH/2, 0);
            f.fenceGrp.add(gBot);

            gateX += gateW + 0.3;
          });
        }

        // ══ DIMENSIONS ══
        const totalLenM = run.length || (panelCount * panelWidthM);
        // Run length dimension (along top)
        const dimOffY = maxFenceTop + 0.3;
        f.dimGrp.add(this._createDimLine(
          new THREE.Vector3(0, dimOffY, 0),
          new THREE.Vector3(cursorX, dimOffY, 0),
          new THREE.Vector3(0, 0.15, 0),
          `${totalLenM.toFixed(1)}m`
        ));

        // Fence height dimension (first panel)
        if (panelPositions.length > 0) {
          const pp = panelPositions[0];
          f.dimGrp.add(this._createDimLine(
            new THREE.Vector3(-0.3, pp.gnd, 0),
            new THREE.Vector3(-0.3, pp.top, 0),
            new THREE.Vector3(-0.2, 0, 0),
            `${run.panels[0].height}mm`
          ));
          // Retaining height if present
          if (pp.retH > 0) {
            f.dimGrp.add(this._createDimLine(
              new THREE.Vector3(-0.3, pp.gnd, 0),
              new THREE.Vector3(-0.3, pp.gnd + pp.retH, 0),
              new THREE.Vector3(-0.5, 0, 0),
              `${Math.round(pp.retH*1000)}mm ret.`
            ));
          }
        }

        // Panel number labels
        panelPositions.forEach((pp, i) => {
          const lbl = this._createDimSprite(`P${i+1}`);
          lbl.position.set(pp.x, pp.gnd + pp.retH + railH + pp.sheetH/2, 0.08);
          f.dimGrp.add(lbl);
        });

        // ══ ENVIRONMENT ══
        const grassTex = this._createGrassTexture();
        const paverTex = this._createPaverTexture();
        const mulchTex = this._createMulchTexture();
        const fenceLen = Math.max(cursorX + 2, 10);
        const cx = cursorX / 2;

        // Lawn
        const lawn = new THREE.Mesh(new THREE.PlaneGeometry(60, 60),
          new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.92, metalness: 0.0 }));
        lawn.rotation.x = -Math.PI/2; lawn.position.y = -0.005; lawn.receiveShadow = true;
        f.envGrp.add(lawn);

        // Concrete strip along fence base (front side)
        const concreteStrip = new THREE.Mesh(new THREE.PlaneGeometry(cursorX + 0.5, 0.6),
          concreteMat);
        concreteStrip.rotation.x = -Math.PI/2;
        concreteStrip.position.set(cx, -0.003, 0.35);
        concreteStrip.receiveShadow = true;
        f.envGrp.add(concreteStrip);

        // Paver path (behind fence, neighbour side)
        const paverPath = new THREE.Mesh(new THREE.PlaneGeometry(cursorX + 1, 1.5),
          new THREE.MeshStandardMaterial({ map: paverTex, roughness: 0.8, metalness: 0.0 }));
        paverPath.rotation.x = -Math.PI/2;
        paverPath.position.set(cx, -0.004, -0.9);
        paverPath.receiveShadow = true;
        f.envGrp.add(paverPath);

        // House wall (behind fence, client side)
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xD4C8B0, roughness: 0.75, metalness: 0.0 });
        const wall = new THREE.Mesh(new THREE.BoxGeometry(fenceLen + 6, 3.0, 0.25), wallMat);
        wall.position.set(cx, 1.5, 5);
        wall.receiveShadow = true; wall.castShadow = true;
        f.envGrp.add(wall);
        // House roof edge
        const roofEdge = new THREE.Mesh(new THREE.BoxGeometry(fenceLen + 7, 0.08, 0.8),
          new THREE.MeshStandardMaterial({ color: 0x5A4A3A, roughness: 0.7, metalness: 0.1 }));
        roofEdge.position.set(cx, 3.04, 5.3);
        f.envGrp.add(roofEdge);
        // Fascia
        const fascia = new THREE.Mesh(new THREE.BoxGeometry(fenceLen + 7, 0.2, 0.03),
          new THREE.MeshStandardMaterial({ color: 0xE8E0D0, roughness: 0.6 }));
        fascia.position.set(cx, 2.9, 4.86);
        f.envGrp.add(fascia);
        // Gutter
        const gutter = new THREE.Mesh(new THREE.BoxGeometry(fenceLen + 7, 0.08, 0.12),
          new THREE.MeshStandardMaterial({ color: fenceCol.clone(), metalness: 0.1, roughness: 0.4 }));
        gutter.position.set(cx, 2.86, 4.8);
        f.envGrp.add(gutter);

        // Neighbour boundary fences (Colorbond, with posts)
        const boundaryCol = new THREE.Color('#C4C0B6').convertSRGBToLinear();
        const boundaryMat = new THREE.MeshStandardMaterial({ color: boundaryCol, metalness: 0.1, roughness: 0.45 });
        const boundaryPostMat = new THREE.MeshStandardMaterial({ color: boundaryCol.clone().multiplyScalar(0.85), metalness: 0.1, roughness: 0.45 });

        const addBoundaryFence = (x1, z1, x2, z2) => {
          const dx = x2-x1, dz = z2-z1;
          const len = Math.sqrt(dx*dx + dz*dz);
          const angle = Math.atan2(dx, dz);
          // Panels
          const bf = new THREE.Mesh(this._createFenceSheetGeo(len, 1.8, 'Trimclad'), boundaryMat);
          bf.position.set((x1+x2)/2, 0.9, (z1+z2)/2);
          bf.rotation.y = angle;
          bf.receiveShadow = true;
          f.envGrp.add(bf);
          // Posts every ~2.4m
          const postCount = Math.ceil(len / 2.4) + 1;
          for (let bp = 0; bp < postCount; bp++) {
            const t = bp / (postCount - 1);
            const bPost = new THREE.Mesh(new THREE.BoxGeometry(0.05, 2.0, 0.05), boundaryPostMat);
            bPost.position.set(x1 + dx*t, 1.0, z1 + dz*t);
            bPost.castShadow = true;
            f.envGrp.add(bPost);
          }
        };
        addBoundaryFence(-3, -4, -3, 6);
        addBoundaryFence(cursorX + 3, -4, cursorX + 3, 6);
        addBoundaryFence(-3, -4, cursorX + 3, -4);

        // Garden beds with mulch
        const mulchMat = new THREE.MeshStandardMaterial({ map: mulchTex, roughness: 0.9, metalness: 0.0 });
        // Along back boundary
        const bedBack = new THREE.Mesh(new THREE.BoxGeometry(fenceLen + 4, 0.08, 1.5), mulchMat);
        bedBack.position.set(cx, 0.04, -3.5);
        bedBack.receiveShadow = true;
        f.envGrp.add(bedBack);
        // Along side boundaries
        const bedL = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 10), mulchMat.clone());
        bedL.position.set(-2.4, 0.04, 1);
        bedL.receiveShadow = true;
        f.envGrp.add(bedL);
        const bedR = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 10), mulchMat.clone());
        bedR.position.set(cursorX + 2.4, 0.04, 1);
        bedR.receiveShadow = true;
        f.envGrp.add(bedR);

        // Paver edging
        const edgeMat = new THREE.MeshStandardMaterial({ color: 0x8C7A68, roughness: 0.85 });
        const edgeF = new THREE.Mesh(new THREE.BoxGeometry(fenceLen + 4, 0.1, 0.12), edgeMat);
        edgeF.position.set(cx, 0.05, -2.76);
        f.envGrp.add(edgeF);

        // Shrubs
        const shrubCols = [0x3D6B35, 0x4A7D42, 0x356130, 0x508A48, 0x2D5A28];
        const addShrub = (x, z, scale) => {
          const col = shrubCols[Math.floor(Math.random() * shrubCols.length)];
          const s = new THREE.Mesh(new THREE.SphereGeometry(scale, 7, 5),
            new THREE.MeshStandardMaterial({ color: col, roughness: 0.9 }));
          s.position.set(x, scale * 0.7, z);
          s.castShadow = true;
          f.envGrp.add(s);
        };
        // Along back fence
        for (let i = 0; i < 8; i++) addShrub(-2 + i * (fenceLen/7), -3.8 + Math.random()*0.4, 0.3 + Math.random()*0.35);
        // Along sides
        for (let i = 0; i < 4; i++) {
          addShrub(-2.5, -2 + i * 2, 0.25 + Math.random()*0.3);
          addShrub(cursorX + 2.5, -2 + i * 2, 0.25 + Math.random()*0.3);
        }

        // Trees
        const addTree = (x, z, trunkH, foliageR) => {
          const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.09, trunkH, 6),
            new THREE.MeshStandardMaterial({ color: 0x6B4226, roughness: 0.85 }));
          trunk.position.set(x, trunkH/2, z);
          trunk.castShadow = true;
          f.envGrp.add(trunk);
          const foliage = new THREE.Mesh(new THREE.SphereGeometry(foliageR, 8, 6),
            new THREE.MeshStandardMaterial({ color: 0x2D5A1E + Math.floor(Math.random()*0x101010), roughness: 0.9 }));
          foliage.position.set(x, trunkH + foliageR*0.6, z);
          foliage.castShadow = true;
          f.envGrp.add(foliage);
        };
        addTree(-2.2, -3.2, 3.5, 1.6);
        addTree(cursorX + 2.2, -3, 3, 1.3);
        addTree(cx + 2, 4.5, 2.5, 1.0);

        // ── Camera ──
        f.controls.target.set(cx, maxFenceTop * 0.4, 0);
        if (!this._fence3DUserMoved) {
          f.camera.position.set(cx + cursorX * 0.4, maxFenceTop * 0.7, cursorX * 0.6 + 3);
          this._fence3DUserMoved = false;
          f.controls.addEventListener('start', () => { this._fence3DUserMoved = true; }, { once: true });
        }
        f.controls.update();
      },

      // ── View presets ──
      setFence3DView(view) {
        const f = this._f3d;
        if (!f.scene) return;

        document.querySelectorAll('.fence-3d-view-btns button').forEach(btn => {
          btn.classList.toggle('active', btn.textContent.trim().toLowerCase() === view);
        });

        const box = new THREE.Box3().setFromObject(f.fenceGrp);
        const centre = new THREE.Vector3();
        const size = new THREE.Vector3();
        box.getCenter(centre);
        box.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);
        const padding = 1.3;

        if (view === '3d') {
          f.activeCamera = f.camera;
          f.controls.object = f.camera;
          this._f3dFocusAnim = {
            targetPos: new THREE.Vector3(centre.x + maxDim * 0.8, centre.y + maxDim * 0.5, maxDim * 1.2),
            targetLook: centre.clone()
          };
          f.controls.enableRotate = true;
        } else {
          const aspect = (document.getElementById('fence3DViewport').clientWidth || 600) /
                         (document.getElementById('fence3DViewport').clientHeight || 400);
          const frustum = maxDim * padding;
          f.orthoCam.left = -frustum * aspect / 2;
          f.orthoCam.right = frustum * aspect / 2;
          f.orthoCam.top = frustum / 2;
          f.orthoCam.bottom = -frustum / 2;
          f.orthoCam.near = -100;
          f.orthoCam.far = 100;
          f.orthoCam.updateProjectionMatrix();

          if (view === 'front') {
            f.orthoCam.position.set(centre.x, centre.y, centre.z + 20);
          } else if (view === 'side') {
            f.orthoCam.position.set(centre.x - 20, centre.y, centre.z);
          } else if (view === 'top') {
            f.orthoCam.position.set(centre.x, centre.y + 20, centre.z);
          }
          f.orthoCam.lookAt(centre);

          f.activeCamera = f.orthoCam;
          f.controls.object = f.orthoCam;
          f.controls.target.copy(centre);
          f.controls.enableRotate = false;
          f.controls.update();
        }
      },

      // Track the last run ID we auto-fitted, so we re-fit when switching runs
      _lastFittedRunId: null,

      resetProfileView() {
        this.profilePan = { x: 0, y: 0 };
        this.profileZoom = 1;
        this._lastFittedRunId = null; // force re-fit
        this.renderProfileView();
      },

      renderProfileView() {
        const container = document.getElementById('profileViewContainer');
        const canvas = document.getElementById('profileCanvas');
        if (!container || !canvas) return;

        this.initProfileViewControls();

        const cw = container.clientWidth;
        const ch = container.clientHeight;
        if (cw === 0 || ch === 0) return;

        canvas.width = cw;
        canvas.height = ch;
        const ctx = canvas.getContext('2d');

        // Background
        ctx.fillStyle = '#f0f4f8';
        ctx.fillRect(0, 0, cw, ch);

        const run = this.job.runs.find(r => r.id === this.currentRunId);
        if (!run || run.panels.length === 0) {
          ctx.fillStyle = '#4C6A70';
          ctx.font = '18px Helvetica Neue, Helvetica, Arial, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('No panels — add a run and set its length', cw / 2, ch / 2);
          return;
        }

        // ── Colour lookup ──
        const allColours = [...COLOURS_STOCK, ...COLOURS_SPECIAL];
        const colourEntry = allColours.find(c => c.name === this.job.colour) || { hex: '#BDBFBA' };
        const fenceHex = colourEntry.hex;

        function darkenHex(hex, factor) {
          const r = parseInt(hex.slice(1, 3), 16);
          const g = parseInt(hex.slice(3, 5), 16);
          const b = parseInt(hex.slice(5, 7), 16);
          return `rgb(${Math.round(Math.min(255, r * factor))},${Math.round(Math.min(255, g * factor))},${Math.round(Math.min(255, b * factor))})`;
        }

        // Total retaining per panel (slope plinths + manual retaining), capped at 4 plinths (600mm)
        function panelTotalRetaining(p) {
          const raw = (p.slopePlinths || 0) * 150 + p.retaining;
          return Math.min(600, raw); // cap at 4 plinths
        }

        // ── Dimensions in mm ──
        const panelCount = run.panels.length;
        const postCount = panelCount + 1;
        const panelWidthMm = this.getPanelWidthMm();
        const postWidthMm = 50;
        const patioWidthMm = 120;  // visual only, does not affect layout spacing
        const embedDepthMm = 600;
        const railHeightMm = 25;
        const plinthHeightMm = 150;

        let maxTotalH = 0;
        run.panels.forEach(p => {
          const th = p.height + panelTotalRetaining(p);
          if (th > maxTotalH) maxTotalH = th;
        });

        // ── Ground offsets from step amounts (variable per panel) ──
        const groundOffsets = new Array(postCount).fill(0);
        for (let i = 0; i < panelCount; i++) {
          const stepMm = run.panels[i].stepMm || 0;
          // stepMm negative = step down = ground lower → offset increases
          // stepMm positive = step up = ground higher → offset decreases
          groundOffsets[i + 1] = groundOffsets[i] - stepMm;
        }
        const minGndOffset = Math.min(...groundOffsets);
        for (let i = 0; i < groundOffsets.length; i++) groundOffsets[i] -= minGndOffset;
        const maxGndOffset = Math.max(...groundOffsets);

        // Cache ground offsets for soil handle drag calculations (stored as array in mm)
        this._soilGroundOffsets = groundOffsets.slice();

        const posts = this.getRunPosts(run);

        let maxPostAbove = 0;
        posts.forEach(p => {
          const above = p.postSize - embedDepthMm;
          if (above > maxPostAbove) maxPostAbove = above;
        });

        // ── Scaling: 90% width, 70% height ──
        // Compute max visible extent above groundY (accounting for plinths raising sheets)
        let maxAboveGndYMm = 0;
        run.panels.forEach((p, idx) => {
          const lowOffset = Math.max(groundOffsets[idx], groundOffsets[idx + 1]);
          const panelTopMm = panelTotalRetaining(p) + railHeightMm + p.height + railHeightMm;
          const above = panelTopMm - lowOffset;
          if (above > maxAboveGndYMm) maxAboveGndYMm = above;
        });
        const totalFenceWidthMm = panelCount * panelWidthMm + postCount * postWidthMm;
        const totalAboveMm = maxAboveGndYMm + 50; // small padding above fence top
        const totalBelowMm = maxGndOffset + embedDepthMm + 200;
        const totalVisualHeightMm = totalAboveMm + totalBelowMm + 150;

        const scaleX = (cw * 0.90) / totalFenceWidthMm;
        const scaleY = (ch * 0.70) / totalVisualHeightMm;
        const scale = Math.min(scaleX, scaleY);

        // Auto-fit on first render or when switching runs
        if (this._lastFittedRunId !== run.id) {
          this.profilePan = { x: 0, y: 0 };
          this.profileZoom = 1;
          this._lastFittedRunId = run.id;
        }

        // Pan/zoom transform
        ctx.save();
        ctx.translate(this.profilePan.x, this.profilePan.y);
        ctx.scale(this.profileZoom, this.profileZoom);

        const fencePixelW = totalFenceWidthMm * scale;
        const originX = (cw / this.profileZoom - fencePixelW) / 2;
        const groundY = (ch / this.profileZoom) * 0.55 + totalAboveMm * scale * 0.1;

        // Cache layout for soil handle drag math
        this._soilHandleLayout = { groundY, scale, groundOffsets, originX, postWidthMm, panelWidthMm };

        const railH = railHeightMm * scale;
        const footingWMm = 300;
        const footingHMm = 450;

        // ── Run label ──
        const labelFontSize = Math.max(11, Math.min(18, 14 * scale * 2.5));
        ctx.fillStyle = '#293C46';
        ctx.font = `700 ${labelFontSize}px Helvetica Neue, Helvetica, Arial, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(
          `${run.name}  ·  ${panelCount} panels  ·  ${run.length}m`,
          originX + fencePixelW / 2,
          groundY - maxAboveGndYMm * scale - 10
        );

        // ── Soil profile (retained earth behind plinths, viewed from LOW side) ──
        // Build the high-side ground profile as a path across the full run
        {
          let sx = originX;
          const earthBottomY = groundY + maxGndOffset * scale + embedDepthMm * scale + 50;

          ctx.save();
          ctx.beginPath();
          // Start at bottom-left
          ctx.moveTo(sx, earthBottomY);

          for (let ei = 0; ei <= panelCount; ei++) {
            const postGnd = groundY + groundOffsets[ei] * scale;
            const epanel = ei < panelCount ? run.panels[ei] : null;
            const epw = postWidthMm * scale;
            const epanelW = panelWidthMm * scale;

            // High-side ground at this post = low-side ground of adjacent panel - plinth stack
            // For a post, we use the highest adjacent panel's high-side level
            let highSideAtPost = postGnd; // default: no retaining = ground level
            if (ei > 0) {
              const lp = run.panels[ei - 1];
              const lpLowOff = Math.max(groundOffsets[ei - 1], groundOffsets[ei]);
              const lpLowGndY = groundY + lpLowOff * scale;
              const lpHighSide = lpLowGndY - panelTotalRetaining(lp) * scale;
              highSideAtPost = Math.min(highSideAtPost, lpHighSide);
            }
            if (ei < panelCount) {
              const rp = run.panels[ei];
              const rpLowOff = Math.max(groundOffsets[ei], groundOffsets[ei + 1]);
              const rpLowGndY = groundY + rpLowOff * scale;
              const rpHighSide = rpLowGndY - panelTotalRetaining(rp) * scale;
              highSideAtPost = Math.min(highSideAtPost, rpHighSide);
            }

            if (ei === 0) {
              // First post: line up from bottom to high-side level
              ctx.lineTo(sx, highSideAtPost);
            } else {
              // Step vertically at post junction then across
              ctx.lineTo(sx, highSideAtPost);
            }

            sx += epw; // past post

            if (epanel) {
              // Across the panel at its high-side level
              const pLowOff = Math.max(groundOffsets[ei], groundOffsets[ei + 1]);
              const pLowGndY = groundY + pLowOff * scale;
              const pHighSide = pLowGndY - panelTotalRetaining(epanel) * scale;
              ctx.lineTo(sx, pHighSide); // left edge of panel at high-side
              sx += epanelW;
              ctx.lineTo(sx, pHighSide); // right edge of panel at high-side
            }
          }

          // Close path down to bottom-right and back
          ctx.lineTo(sx, earthBottomY);
          ctx.closePath();

          // Earth fill gradient
          const earthTopY = groundY - maxGndOffset * scale - 200;
          const grdEarth = ctx.createLinearGradient(0, earthTopY, 0, earthBottomY);
          grdEarth.addColorStop(0, '#C4A882');
          grdEarth.addColorStop(1, '#8B7355');
          ctx.fillStyle = grdEarth;
          ctx.fill();
          ctx.restore();

          // Grass strip along the top edge of the earth profile (4px green line)
          ctx.save();
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#5B8C3E';
          ctx.beginPath();
          let gx = originX;
          let firstPoint = true;
          for (let ei = 0; ei <= panelCount; ei++) {
            const postGnd = groundY + groundOffsets[ei] * scale;
            const epw = postWidthMm * scale;
            const epanelW = panelWidthMm * scale;
            const epanel = ei < panelCount ? run.panels[ei] : null;

            let highSideAtPost = postGnd;
            if (ei > 0) {
              const lp = run.panels[ei - 1];
              const lpLowOff = Math.max(groundOffsets[ei - 1], groundOffsets[ei]);
              const lpLowGndY = groundY + lpLowOff * scale;
              highSideAtPost = Math.min(highSideAtPost, lpLowGndY - panelTotalRetaining(lp) * scale);
            }
            if (ei < panelCount) {
              const rp = run.panels[ei];
              const rpLowOff = Math.max(groundOffsets[ei], groundOffsets[ei + 1]);
              const rpLowGndY = groundY + rpLowOff * scale;
              highSideAtPost = Math.min(highSideAtPost, rpLowGndY - panelTotalRetaining(rp) * scale);
            }

            if (firstPoint) {
              ctx.moveTo(gx, highSideAtPost);
              firstPoint = false;
            } else {
              ctx.lineTo(gx, highSideAtPost);
            }

            gx += epw;

            if (epanel) {
              const pLowOff = Math.max(groundOffsets[ei], groundOffsets[ei + 1]);
              const pLowGndY = groundY + pLowOff * scale;
              const pHighSide = pLowGndY - panelTotalRetaining(epanel) * scale;
              ctx.lineTo(gx, pHighSide);
              gx += epanelW;
              ctx.lineTo(gx, pHighSide);
            }
          }
          ctx.stroke();
          ctx.restore();
        }

        // ── Draw posts and panels ──
        let cursorX = originX;
        const pw = postWidthMm * scale;

        for (let i = 0; i <= panelCount; i++) {
          const panel = i < panelCount ? run.panels[i] : null;
          const gndOff = groundOffsets[i] * scale;
          const postGndY = groundY + gndOff;

          // ── POST — height clamped to adjacent panel tops ──
          const postInfo = posts[i];

          // Find post top Y from adjacent panels' cap rail tops
          let postTopY = postGndY; // default
          const leftPanel = i > 0 ? run.panels[i - 1] : null;
          const rightPanel = i < panelCount ? run.panels[i] : null;
          if (leftPanel) {
            const lpLowOff = Math.max(groundOffsets[i - 1], groundOffsets[i]);
            const lpLowGndY = groundY + lpLowOff * scale;
            const lpCapTopY = lpLowGndY - (panelTotalRetaining(leftPanel) + railHeightMm + leftPanel.height + railHeightMm) * scale;
            postTopY = Math.min(postTopY, lpCapTopY);
          }
          if (rightPanel) {
            const rpLowOff = Math.max(groundOffsets[i], groundOffsets[i + 1]);
            const rpLowGndY = groundY + rpLowOff * scale;
            const rpCapTopY = rpLowGndY - (panelTotalRetaining(rightPanel) + railHeightMm + rightPanel.height + railHeightMm) * scale;
            postTopY = Math.min(postTopY, rpCapTopY);
          }
          const postAboveH = postGndY - postTopY;

          // Patio tube RHS behind the post (wider backing, same height)
          if (postInfo.patio) {
            const patioW = patioWidthMm * scale;
            const patioX = cursorX - (patioW - pw) / 2;
            ctx.fillStyle = fenceHex;
            ctx.fillRect(patioX, postTopY, patioW, postAboveH);
            ctx.strokeStyle = darkenHex(fenceHex, 0.7);
            ctx.lineWidth = 0.5;
            ctx.strokeRect(patioX, postTopY, patioW, postAboveH);
          }

          // Post body — fence colour
          ctx.fillStyle = fenceHex;
          ctx.fillRect(cursorX, postTopY, pw, postAboveH);
          ctx.fillStyle = 'rgba(0,0,0,0.2)';
          ctx.fillRect(cursorX, postTopY, 1, postAboveH);
          ctx.fillRect(cursorX + pw - 1, postTopY, 1, postAboveH);
          ctx.fillStyle = 'rgba(0,0,0,0.15)';
          ctx.fillRect(cursorX + (pw - 1) / 2, postTopY, 1, postAboveH);
          ctx.strokeStyle = darkenHex(fenceHex, 0.7);
          ctx.lineWidth = 0.5;
          ctx.strokeRect(cursorX, postTopY, pw, postAboveH);

          // Underground: faded post extension + concrete footing
          const embedH = embedDepthMm * scale;
          const postCentreX = cursorX + pw / 2;
          ctx.save();
          ctx.globalAlpha = 0.5;
          ctx.fillStyle = fenceHex;
          ctx.fillRect(cursorX, postGndY, pw, embedH);
          ctx.strokeStyle = darkenHex(fenceHex, 0.7);
          ctx.lineWidth = 0.5;
          ctx.strokeRect(cursorX, postGndY, pw, embedH);
          ctx.restore();
          const footingW = footingWMm * scale;
          const footingH = footingHMm * scale;
          const footingX = postCentreX - footingW / 2;
          const footingY = postGndY + embedH - footingH;
          ctx.fillStyle = '#A0A0A0';
          ctx.fillRect(footingX, footingY, footingW, footingH);
          ctx.save();
          ctx.setLineDash([4, 3]);
          ctx.strokeStyle = '#808080';
          ctx.lineWidth = 1;
          ctx.strokeRect(footingX, footingY, footingW, footingH);
          ctx.restore();

          cursorX += pw;

          // ── PANEL (correct construction stacking: plinths → bottom rail → sheets → cap rail) ──
          if (panel) {
            const panelW = panelWidthMm * scale;
            const sheetH = panel.height * scale;
            const totalRet = panelTotalRetaining(panel);
            const plinths = totalRet / plinthHeightMm;
            const plinthStackH = totalRet * scale;
            const btmRailH = railH;
            const capRailH = railH;

            // Low-side ground (bottom of plinths)
            const lowSideOff = Math.max(groundOffsets[i], groundOffsets[i + 1]);
            const lowSideGndY = groundY + lowSideOff * scale;
            // High-side ground (top of plinths)
            const highSideGndY = lowSideGndY - plinthStackH;

            // Stacking from bottom to top:
            const plinthBottomY = lowSideGndY;
            const btmRailBottomY = highSideGndY;
            const btmRailTopY = btmRailBottomY - btmRailH;
            const sheetBottomY = btmRailTopY;
            const sheetTopY = sheetBottomY - sheetH;
            const capRailTopY = sheetTopY - capRailH;

            // ── Plinths (Colorbond steel plinth panels with horizontal ribs) ──
            if (plinths > 0) {
              const plinthH = plinthHeightMm * scale;
              for (let pi = 0; pi < plinths; pi++) {
                const py = plinthBottomY - (pi + 1) * plinthH; // stack upward from low-side ground
                ctx.fillStyle = fenceHex;
                ctx.fillRect(cursorX, py, panelW, plinthH);
                const ribCount = 5;
                const ribSpacing = plinthH / (ribCount + 1);
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                for (let ri = 1; ri <= ribCount; ri++) {
                  ctx.fillRect(cursorX, py + ri * ribSpacing, panelW, 1);
                }
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(cursorX, py + plinthH - 1, panelW, 1);
                if (pi < plinths - 1) {
                  ctx.fillStyle = 'rgba(0,0,0,0.25)';
                  ctx.fillRect(cursorX, py, panelW, 1);
                }
              }
              ctx.strokeStyle = darkenHex(fenceHex, 0.7);
              ctx.lineWidth = 0.5;
              ctx.strokeRect(cursorX, highSideGndY, panelW, plinthStackH);
            }

            // ── Bottom rail (from image crop) on top of plinths ──
            if (this._panelTextureLoaded) {
              const sr = this.SRC_RAIL;
              ctx.drawImage(this._panelTextureImg, sr.sx, sr.sy, sr.sw, sr.sh,
                cursorX, btmRailTopY, panelW, btmRailH);
              ctx.save();
              ctx.globalCompositeOperation = 'multiply';
              ctx.fillStyle = fenceHex;
              ctx.fillRect(cursorX, btmRailTopY, panelW, btmRailH);
              ctx.globalCompositeOperation = 'source-over';
              ctx.restore();
            } else {
              ctx.fillStyle = fenceHex;
              ctx.fillRect(cursorX, btmRailTopY, panelW, btmRailH);
            }
            ctx.strokeStyle = darkenHex(fenceHex, 0.7);
            ctx.lineWidth = 0.5;
            ctx.strokeRect(cursorX, btmRailTopY, panelW, btmRailH);

            // ── Sheets (tiled from image crop) on top of bottom rail ──
            ctx.save();
            ctx.beginPath();
            ctx.rect(cursorX, sheetTopY, panelW, sheetH);
            ctx.clip();

            if (this._panelTextureLoaded) {
              const ss = this.SRC_SHEET;
              const sheetWidthMm = 762;
              const numSheets = Math.max(1, Math.floor(panelWidthMm / sheetWidthMm));
              const tileW = panelW / numSheets;
              for (let si = 0; si < numSheets; si++) {
                ctx.drawImage(this._panelTextureImg, ss.sx, ss.sy, ss.sw, ss.sh,
                  cursorX + si * tileW, sheetTopY, tileW, sheetH);
              }
              ctx.globalCompositeOperation = 'multiply';
              ctx.fillStyle = fenceHex;
              ctx.fillRect(cursorX, sheetTopY, panelW, sheetH);
              ctx.globalCompositeOperation = 'source-over';
            } else {
              ctx.fillStyle = fenceHex;
              ctx.fillRect(cursorX, sheetTopY, panelW, sheetH);
            }
            ctx.restore();

            ctx.strokeStyle = darkenHex(fenceHex, 0.7);
            ctx.lineWidth = 0.5;
            ctx.strokeRect(cursorX, sheetTopY, panelW, sheetH);

            // ── Per-panel capping rail (from image crop) on top of sheets ──
            if (this._panelTextureLoaded) {
              const sc = this.SRC_CAP;
              ctx.drawImage(this._panelTextureImg, sc.sx, sc.sy, sc.sw, sc.sh,
                cursorX, capRailTopY, panelW, capRailH);
              ctx.save();
              ctx.globalCompositeOperation = 'multiply';
              ctx.fillStyle = fenceHex;
              ctx.fillRect(cursorX, capRailTopY, panelW, capRailH);
              ctx.globalCompositeOperation = 'source-over';
              ctx.restore();
            } else {
              ctx.fillStyle = fenceHex;
              ctx.fillRect(cursorX, capRailTopY, panelW, capRailH);
            }
            ctx.strokeStyle = darkenHex(fenceHex, 0.7);
            ctx.lineWidth = 0.5;
            ctx.strokeRect(cursorX, capRailTopY, panelW, capRailH);

            // ── Panel number (circled) ──
            const circleCX = cursorX + panelW / 2;
            const circleCY = sheetTopY + sheetH / 2;
            const circleR = Math.max(9, Math.min(18, 14 * scale));
            ctx.fillStyle = 'rgba(255,255,255,0.88)';
            ctx.beginPath();
            ctx.arc(circleCX, circleCY, circleR, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#293C46';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.fillStyle = '#293C46';
            const numFontSize = Math.max(8, Math.min(14, 11 * scale));
            ctx.font = `700 ${numFontSize}px Helvetica Neue, Helvetica, Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`P${i + 1}`, circleCX, circleCY);

            // ── Highlight panel during retaining handle drag ──
            if (this._soilHandleDrag && this._soilHandleDrag.active) {
              const dragIdx = this._soilHandleDrag.panelIdx;
              if (dragIdx === i) {
                ctx.save();
                ctx.fillStyle = 'rgba(241,90,41,0.10)';
                ctx.fillRect(cursorX, capRailTopY, panelW, lowSideGndY - capRailTopY);
                ctx.strokeStyle = 'rgba(241,90,41,0.30)';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(cursorX, capRailTopY, panelW, lowSideGndY - capRailTopY);
                ctx.restore();
              }
            }

            cursorX += panelW;
          }
        }

        // ── Ground gradient band ──
        const groundBandTop = groundY;
        const groundBandH = (ch / this.profileZoom) - groundBandTop + 100;
        if (groundBandH > 0) {
          const grdGround = ctx.createLinearGradient(0, groundBandTop, 0, groundBandTop + groundBandH);
          grdGround.addColorStop(0, 'rgba(74, 222, 128, 0.15)');
          grdGround.addColorStop(0.12, 'rgba(74, 222, 128, 0.06)');
          grdGround.addColorStop(0.4, 'rgba(146,64,14,0.05)');
          grdGround.addColorStop(1, 'rgba(146,64,14,0.1)');
          ctx.fillStyle = grdGround;
          ctx.fillRect(originX - 30, groundBandTop, fencePixelW + 60, groundBandH);
        }

        // ── Slope line (variable point-based ground profile) ──
        {
          const slopePoints = (run.slope && run.slope.points) || [];
          const slopeHandleR = 12;
          const runLengthM = run.length || 0;
          const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

          // Map slope points to world coordinates
          this._slopePointPositions = [];
          const slopeWorldPoints = [];
          for (let si = 0; si < slopePoints.length; si++) {
            const pt = slopePoints[si];
            const frac = runLengthM > 0 ? pt.distanceM / runLengthM : 0;
            const wx = originX + frac * fencePixelW;
            const wy = groundY - pt.heightMm * scale;
            slopeWorldPoints.push({ x: wx, y: wy });
            this._slopePointPositions.push({ x: wx, y: wy, pointIdx: si });
          }

          if (slopeWorldPoints.length >= 2) {
            // Draw slope line (2px solid earth brown)
            ctx.save();
            ctx.strokeStyle = '#8B7355';
            ctx.lineWidth = 2 / this.profileZoom;
            ctx.beginPath();
            ctx.moveTo(slopeWorldPoints[0].x, slopeWorldPoints[0].y);
            for (let si = 1; si < slopeWorldPoints.length; si++) {
              ctx.lineTo(slopeWorldPoints[si].x, slopeWorldPoints[si].y);
            }
            ctx.stroke();

            // 4px green grass strip on top of slope line
            ctx.strokeStyle = '#5B8C3E';
            ctx.lineWidth = 4 / this.profileZoom;
            ctx.beginPath();
            ctx.moveTo(slopeWorldPoints[0].x, slopeWorldPoints[0].y);
            for (let si = 1; si < slopeWorldPoints.length; si++) {
              ctx.lineTo(slopeWorldPoints[si].x, slopeWorldPoints[si].y);
            }
            ctx.stroke();
            ctx.restore();
          }

          // Draw labelled circles at each slope point — advanced mode only
          const slopeIsAdvanced = run.slope && run.slope.mode === 'advanced';
          if (slopeIsAdvanced) {
            for (let si = 0; si < slopeWorldPoints.length; si++) {
              const sp = slopeWorldPoints[si];
              const isHovered = this._slopePointHover === si;
              const isDragged = this._slopePointDrag && this._slopePointDrag.active && this._slopePointDrag.pointIdx === si;
              const letter = si < letters.length ? letters[si] : '?';

              ctx.beginPath();
              ctx.arc(sp.x, sp.y, slopeHandleR / this.profileZoom, 0, Math.PI * 2);
              ctx.fillStyle = isDragged ? '#6B5335' : (isHovered ? '#A0895F' : '#8B7355');
              ctx.fill();
              ctx.strokeStyle = '#FFFFFF';
              ctx.lineWidth = 2 / this.profileZoom;
              ctx.stroke();

              const labelSize = Math.max(7, Math.min(11, 9 / this.profileZoom));
              ctx.fillStyle = '#FFFFFF';
              ctx.font = `700 ${labelSize}px Helvetica Neue, Helvetica, Arial, sans-serif`;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(letter, sp.x, sp.y);

              if (isDragged) {
                ctx.save();
                ctx.setLineDash([6 / this.profileZoom, 4 / this.profileZoom]);
                ctx.strokeStyle = 'rgba(139,115,85,0.5)';
                ctx.lineWidth = 1 / this.profileZoom;
                ctx.beginPath();
                ctx.moveTo(originX - 20, sp.y);
                ctx.lineTo(originX + fencePixelW + 20, sp.y);
                ctx.stroke();
                ctx.restore();
              }
            }
          }
        }

        // ── Retaining draggable handles (per-panel, orange) ──
        {
          const isTouchDevice = 'ontouchstart' in window;
          const showHandles = isTouchDevice || this._soilHandleProximity || (this._soilHandleDrag && this._soilHandleDrag.active);
          const handleR = isTouchDevice ? 12 : 8;
          const epw = postWidthMm * scale;
          const epanelW = panelWidthMm * scale;

          // Calculate handle positions (world coords) at each panel centre
          this._soilHandlePositions = [];
          let hx = originX;

          for (let hi = 0; hi < panelCount; hi++) {
            const panel = run.panels[hi];
            const totalRet = panelTotalRetaining(panel);

            // Panel X start = after post hi
            const panelStartX = hx + epw;
            const panelCentreX = panelStartX + epanelW / 2;

            // Handle Y = bottom rail position (top of plinths / high-side ground)
            const lowSideOff = Math.max(groundOffsets[hi], groundOffsets[hi + 1]);
            const lowSideGndY = groundY + lowSideOff * scale;
            const highSideGndY = lowSideGndY - totalRet * scale;
            const handleY = highSideGndY;

            this._soilHandlePositions.push({ x: panelCentreX, y: handleY, panelIdx: hi });

            // Draw handle if visible
            if (showHandles) {
              const isHovered = this._soilHandleHover === hi;
              const isDragged = this._soilHandleDrag && this._soilHandleDrag.active && this._soilHandleDrag.panelIdx === hi;

              ctx.beginPath();
              ctx.arc(panelCentreX, handleY, handleR / this.profileZoom, 0, Math.PI * 2);
              ctx.fillStyle = isDragged ? '#C44520' : (isHovered ? '#F47A52' : '#F15A29');
              ctx.fill();
              ctx.strokeStyle = '#FFFFFF';
              ctx.lineWidth = 2 / this.profileZoom;
              ctx.stroke();

              // If dragging this handle, draw a horizontal guide line
              if (isDragged) {
                ctx.save();
                ctx.setLineDash([6 / this.profileZoom, 4 / this.profileZoom]);
                ctx.strokeStyle = 'rgba(241,90,41,0.4)';
                ctx.lineWidth = 1 / this.profileZoom;
                ctx.beginPath();
                ctx.moveTo(originX - 20, handleY);
                ctx.lineTo(originX + fencePixelW + 20, handleY);
                ctx.stroke();
                ctx.restore();
              }
            }

            // Advance cursor: past this post + this panel
            hx += epw + epanelW;
          }
        }

        ctx.restore();
      },

      // ── Job Settings (legacy — now integrated into scope sections) ──

      // ── Compliance checks ──
      _runComplianceChecks() {
        const errors = []; // STOP errors
        const warnings = [];
        this.job.runs.forEach(run => {
          run.panels.forEach((panel, idx) => {
            const slopePl = panel.slopePlinths || 0;
            const manualPl = panel.retaining / 150;
            const totalPl = slopePl + manualPl;
            if (totalPl > 4) {
              errors.push(`${run.name} P${idx+1}: ${totalPl} plinths exceeds maximum 4. Requires engineered retaining solution.`);
            }
            const totalRet = Math.min(4, totalPl) * 150;
            if (totalRet > 500) {
              warnings.push(`${run.name} P${idx+1}: Retaining ${totalRet}mm > 500mm requires Building Permit + Engineer Cert in WA.`);
            }
          });
        });
        return { errors, warnings };
      },

      // ── Collect all data for outputs ──
      _collectOutputData() {
        const job = this.job;
        const rem = job.removal || {};
        const q = job.quote || {};
        const js = {
          access: rem.access || 'easy',
          urgency: q.urgency || 'standard',
          delivery: q.deliveryFee != null ? q.deliveryFee : 250,
          removeHardie: rem.existingFenceType === 'hardie',
          removeHardieQty: rem.existingFenceType === 'hardie' ? Math.ceil(rem.existingFenceLength || 0) : 0,
          removeTimber: rem.existingFenceType === 'timber' || rem.existingFenceType === 'lap',
          removeTimberQty: (rem.existingFenceType === 'timber' || rem.existingFenceType === 'lap') ? (rem.existingFenceLength || 0) : 0,
          removeAsbestos: rem.existingFenceType === 'asbestos',
          removeAsbestosQty: rem.existingFenceType === 'asbestos' ? (rem.asbestosSheetCount != null ? rem.asbestosSheetCount : Math.ceil(rem.existingFenceLength || 0)) : 0,
          vegClear: rem.vegetation,
          groundFinish: q.groundFinish || 'none',
          custom: (q.customLineItems || []).map(c => ({ desc: c.desc || '', qty: c.qty || 0, unit: c.unit || '', price: c.price || 0 })),
          notes: job.siteNotes || '',
          pedGate: false, pedGateQty: 0,
          dblGate: false, dblGateQty: 0,
        };
        const supplier = SUPPLIER_PROFILES[job.supplier] || SUPPLIER_PROFILES.RNR;
        const panelWidthMm = supplier.panelWidth;
        const panelWidthM = panelWidthMm / 1000;

        let totalMetres = 0;
        let totalPanels = 0;
        let totalPosts = 0;
        let totalPlinths = 0;
        let totalPatioTubes = 0;
        const postGroups = {}; // { "1800_2400": { sheetH, postH, count } }
        const runDetails = [];

        job.runs.forEach(run => {
          const panelCount = run.panels.length;
          const postCount = panelCount + 1;
          totalMetres += run.length || 0;
          totalPanels += panelCount;
          totalPosts += postCount;

          let runPlinths = 0;
          let panelsWithPatio = 0;
          const panelDetails = [];

          // For each panel, compute derived values
          run.panels.forEach((panel, idx) => {
            const slopePl = panel.slopePlinths || 0;
            const manualPl = panel.retaining / 150;
            const totalPl = Math.min(4, slopePl + manualPl);
            const totalRet = totalPl * 150;
            const plinths = totalPl;
            runPlinths += plinths;

            const lookup = lookupPost(panel.height, totalRet);
            const postH = lookup.post;
            const patio = plinths >= 3 && plinths <= 4;
            if (patio) panelsWithPatio++;

            // Group panels by sheet height + post height for material order
            const key = `${panel.height}_${postH}`;
            if (!postGroups[key]) postGroups[key] = { sheetH: panel.height, postH, count: 0 };
            postGroups[key].count++;

            panelDetails.push({
              num: idx + 1,
              height: panel.height,
              retaining: totalRet,
              plinths,
              totalH: panel.height + totalRet,
              postH,
              patio,
              stepMm: panel.stepMm || 0
            });
          });

          const patioTubes = panelsWithPatio > 0 ? panelsWithPatio + 1 : 0;
          totalPlinths += runPlinths;
          totalPatioTubes += patioTubes;

          // Check if run has any retaining at all
          const hasRetaining = run.panels.some(p => {
            const sp = p.slopePlinths || 0;
            const mp = p.retaining / 150;
            return (sp + mp) > 0;
          });

          runDetails.push({
            name: run.name,
            length: run.length || 0,
            panelCount,
            postCount,
            plinths: runPlinths,
            patioTubes,
            panelsWithPatio,
            hasRetaining,
            panels: panelDetails
          });
        });

        // Corner post sharing: subtract (runs - 1) for connected runs
        if (job.runs.length > 1) totalPosts -= (job.runs.length - 1);

        // Gate posts
        let gatePosts = 0;
        const gateDetails = [];
        (job.gates || []).forEach(g => {
          const gp = g.type === 'double' ? 4 : 2;
          gatePosts += gp;
          gateDetails.push({ type: g.type, width: g.width, posts: gp });
        });

        // Concrete: (totalPosts + gatePosts) * 2 * 1.1, round up to even
        const allPosts = totalPosts + gatePosts;
        const rawBags = allPosts * 2 * 1.1;
        const concreteBags = Math.ceil(rawBags / 2) * 2;

        // Tek screw boxes: 1 per 4 panels, min 1
        const tekBoxes = totalPanels > 0 ? Math.max(1, Math.ceil(totalPanels / 4)) : 0;

        // ── Pricing ──
        const pricePerMetre = job.pricePerMetre || 115;

        // Fencing line item
        const fencingTotal = totalMetres * pricePerMetre;

        // Plinths: use override price or default $80
        const plinthSell = q.plinthPrice || 80;
        const plinthsTotal = totalPlinths * plinthSell;

        // Patio tubes: use override price or default $65
        const patioSell = q.patioTubePrice || 65;
        const patioTotal = totalPatioTubes * patioSell;

        // Gates
        let gatesTotal = 0;
        const gateLineItems = [];
        (job.gates || []).forEach(g => {
          if (g.type === 'pedestrian') {
            const sell = COST_PRICES.gateKitPedestrian / (1 - MARGIN);
            const postSell = COST_PRICES.gatePost90x90 / (1 - MARGIN);
            gatesTotal += sell + 2 * postSell;
            gateLineItems.push({ desc: `Pedestrian gate ${g.width}mm`, qty: 1, total: sell + 2 * postSell });
          } else if (g.type === 'double') {
            const sell = COST_PRICES.gateKitDouble / (1 - MARGIN);
            const postSell = COST_PRICES.gatePost90x90 / (1 - MARGIN);
            gatesTotal += sell + 4 * postSell;
            gateLineItems.push({ desc: `Double swing gate ${g.width}mm`, qty: 1, total: sell + 4 * postSell });
          }
        });

        // Removal items
        let removalTotal = 0;
        const removalItems = [];
        if (js.removeHardie && js.removeHardieQty > 0) {
          const hardiePerSheet = q.hardiePrice || 36;
          const t = js.removeHardieQty * hardiePerSheet;
          removalTotal += t;
          removalItems.push({ desc: 'Remove Hardie fence', qty: js.removeHardieQty, unit: 'm', total: t });
        }
        if (js.removeTimber && js.removeTimberQty > 0) {
          const timberPerM = q.timberPrice || 22;
          const t = js.removeTimberQty * timberPerM;
          removalTotal += t;
          removalItems.push({ desc: 'Remove timber lap fence', qty: js.removeTimberQty, unit: 'm', total: t });
        }
        if (js.removeAsbestos && js.removeAsbestosQty > 0) {
          const asbestosPerSheet = q.asbestosPrice || 90;
          const t = js.removeAsbestosQty * asbestosPerSheet;
          removalTotal += t;
          removalItems.push({ desc: 'Remove asbestos fence (licenced)', qty: js.removeAsbestosQty, unit: 'm', total: t });
        }
        // Asbestos removal certificate (auto-included when asbestos selected)
        if (js.removeAsbestos && rem.asbestosCert !== false) {
          const certFee = q.asbestosCertFee || 300;
          removalTotal += certFee;
          removalItems.push({ desc: 'Asbestos removal certificate', qty: 1, unit: 'job', total: certFee });
        }
        if (js.vegClear) {
          const vegPrice = q.vegClearPrice || 215;
          removalTotal += vegPrice;
          removalItems.push({ desc: 'Vegetation / site clear', qty: 1, unit: 'lot', total: vegPrice });
        }

        // Ground finish
        let groundFinishTotal = 0;
        let groundFinishDesc = '';
        if (js.groundFinish && js.groundFinish !== 'none') {
          const rates = { mulch: COST_PRICES.groundMulch, stones: COST_PRICES.groundStones, turf: COST_PRICES.groundTurf };
          const costPerM = rates[js.groundFinish] || 0;
          const sellPerM = costPerM / (1 - MARGIN);
          groundFinishTotal = totalMetres * sellPerM;
          groundFinishDesc = js.groundFinish.charAt(0).toUpperCase() + js.groundFinish.slice(1) + ' ground finish';
        }

        // Custom items
        let customTotal = 0;
        const customItems = [];
        (js.custom || []).forEach(c => {
          if (c.desc && c.qty > 0 && c.price > 0) {
            const t = c.qty * c.price;
            customTotal += t;
            customItems.push({ desc: c.desc, qty: c.qty, unit: c.unit, unitPrice: c.price, total: t });
          }
        });

        // Labour
        const tradeDays = q.tradeDays || 0;
        const tradeRate = q.tradeRate || 450;
        const labourerDays = q.labourerDays || 0;
        const labourerRate = q.labourerRate || 300;
        const labourTotal = (tradeDays * tradeRate) + (labourerDays * labourerRate);
        let labourDesc = '';
        if (tradeDays > 0) labourDesc += `${tradeDays}d trade`;
        if (labourerDays > 0) labourDesc += `${labourDesc ? ' + ' : ''}${labourerDays}d labourer`;
        if (!labourDesc) labourDesc = 'None';

        // Scope add-ons
        const addons = q.addons || {};
        let addonsTotal = 0;
        const addonItems = [];
        const addonLabels = { demo: 'Demolition', skipBin: 'Skip bin hire', permit: 'Council permit', soakwell: 'Soakwell installation', electrical: 'Electrical relocation', crane: 'Crane hire' };
        Object.entries(addonLabels).forEach(([key, label]) => {
          const val = addons[key] || 0;
          if (val > 0) {
            addonsTotal += val;
            addonItems.push({ desc: label, total: val });
          }
        });

        // Access surcharge (on labour only)
        const labourBase = totalMetres * COST_PRICES.labourPerMetre;
        const accessRate = ACCESS_SURCHARGE[js.access] || 0;
        const accessSurcharge = labourBase * accessRate;

        // Delivery
        const deliveryFee = js.delivery || 250;

        // Subtotal before urgency
        const subtotalBeforeUrgency = fencingTotal + plinthsTotal + patioTotal + gatesTotal + removalTotal + groundFinishTotal + labourTotal + addonsTotal + customTotal + accessSurcharge + deliveryFee;

        // Urgency surcharge (on subtotal)
        const urgencyRate = URGENCY_SURCHARGE[js.urgency] || 0;
        const urgencySurcharge = subtotalBeforeUrgency * urgencyRate;

        const subtotal = subtotalBeforeUrgency + urgencySurcharge;
        const gst = subtotal * 0.10;
        const grandTotal = subtotal + gst;

        // ── Internal cost breakdown ──
        let internalCost = 0;
        // Panel costs
        Object.values(postGroups).forEach(g => {
          let unitCost = COST_PRICES.panelKit1800_2400; // default
          if (g.sheetH === 1200) unitCost = COST_PRICES.panelKit1200_2400;
          else if (g.sheetH === 1500) unitCost = COST_PRICES.panelKit1500_2400;
          else if (g.sheetH === 1800) {
            if (g.postH <= 2400) unitCost = COST_PRICES.panelKit1800_2400;
            else if (g.postH <= 2700) unitCost = COST_PRICES.panelKit1800_2700;
            else unitCost = COST_PRICES.panelKit1800_3000;
          } else if (g.sheetH === 2100) {
            if (g.postH <= 2700) unitCost = COST_PRICES.panelKit2100_2700;
            else unitCost = COST_PRICES.panelKit2100_3000;
          }
          internalCost += g.count * unitCost;
        });
        internalCost += totalPlinths * COST_PRICES.plinth;
        internalCost += totalPatioTubes * COST_PRICES.patioTube;
        internalCost += concreteBags * COST_PRICES.concrete;
        internalCost += tekBoxes * COST_PRICES.tekScrewBox;
        (job.gates || []).forEach(g => {
          if (g.type === 'pedestrian') internalCost += COST_PRICES.gateKitPedestrian + 2 * COST_PRICES.gatePost90x90;
          else if (g.type === 'double') internalCost += COST_PRICES.gateKitDouble + 4 * COST_PRICES.gatePost90x90;
        });
        const labourCost = labourBase;
        const internalLabour = labourCost * (1 + accessRate);
        const materialMargin = subtotal - gst - internalCost - internalLabour;

        return {
          job, js, supplier: job.supplier, profile: job.profile, colour: job.colour,
          panelWidthMm, panelWidthM, pricePerMetre,
          totalMetres, totalPanels, totalPosts, totalPlinths, totalPatioTubes,
          postGroups, runDetails, gatePosts, gateDetails, gateLineItems,
          concreteBags, tekBoxes, allPosts,
          fencingTotal, plinthsTotal, plinthSell, patioTotal, patioSell,
          gatesTotal, removalTotal, removalItems,
          groundFinishTotal, groundFinishDesc, customTotal, customItems,
          labourTotal, labourDesc, tradeDays, tradeRate, labourerDays, labourerRate,
          addonsTotal, addonItems,
          accessSurcharge, accessRate, deliveryFee,
          urgencySurcharge, urgencyRate,
          subtotal, gst, grandTotal,
          internalCost, internalLabour, materialMargin
        };
      },

      // ── Generate all outputs (legacy — kept for compatibility) ──
      generateOutputs() {
        const missing = this._validateRequired();
        if (missing.length > 0) {
          this.showToast('Missing: ' + missing.join(', '), 'error');
          return;
        }
        this.job.client = [this.job.clientFirstName, this.job.clientLastName].filter(Boolean).join(' ');
        const { errors } = this._runComplianceChecks();
        if (errors.length > 0) {
          this.showToast('Compliance errors — run QA Check', 'error');
          return;
        }
        const data = this._collectOutputData();
        this._openOutputTab('Client Quote', this._generateQuoteHTML(data));
        this._openOutputTab('Material Order', this._generateMaterialOrderHTML(data));
        this._openOutputTab('Work Order', this._generateWorkOrderHTML(data));
        this.showToast('All outputs generated', 'success');
      },

      _openOutputTab(title, html) {
        const w = window.open('', '_blank');
        if (!w) { alert('Popup blocked — please allow popups for this site.'); return; }
        w.document.write(html);
        w.document.close();
        w.document.title = title;
      },

      _generateQuoteHTML(d) {
        const date = d.job.date || new Date().toISOString().slice(0, 10);
        const validUntil = new Date(new Date(date).getTime() + 30 * 86400000).toISOString().slice(0, 10);

        // Auto-generate description
        let scopeDesc = `Supply and professional installation of ${d.totalMetres.toFixed(1)} lineal metres of COLORBOND\u00AE ${d.profile} fencing in ${d.colour}`;
        if (d.totalPlinths > 0) scopeDesc += `, including ${d.totalPlinths} retaining plinths`;
        if (d.totalPatioTubes > 0) scopeDesc += ` with patio tube bracing`;
        scopeDesc += '. All posts set in concrete. Site clean-up included.';
        const rem = d.job.removal || {};
        if (rem.existingFenceType && rem.existingFenceType !== 'none') {
          const ftype = rem.existingFenceType.charAt(0).toUpperCase() + rem.existingFenceType.slice(1);
          scopeDesc += ` Removal and disposal of existing ${ftype} fencing`;
          if (rem.existingFenceLength > 0) scopeDesc += ` (approx. ${rem.existingFenceLength}m)`;
          scopeDesc += rem.disposal === 'client' ? ' — client disposing.' : ' included.';
        }

        let lineItemsHtml = '';
        lineItemsHtml += `<tr><td>COLORBOND\u00AE ${d.profile} fencing — ${d.colour} (${d.totalMetres.toFixed(1)}m @ $${d.pricePerMetre}/m)</td><td class="text-right">$${this._fmt(d.fencingTotal)}</td></tr>`;

        doc.setFontSize(12);
        doc.setFont('helvetica', 'bold');
        doc.text('CLIENT QUOTE', pw / 2, 29, { align: 'center' });
        y = 40;

        doc.setFontSize(10);
        const date = d.job.date || new Date().toISOString().slice(0, 10);
        const validUntil = new Date(new Date(date).getTime() + 30 * 86400000).toISOString().slice(0, 10);
        const info = [

          ['Address', d.job.address || '—'], ['Date', date],
          ['Phone', d.job.phone || '—'], ['Valid Until', validUntil],
          ['Email', d.job.email || '—']
        ];
        info.forEach((row, i) => {
          const col = i % 2;
          const ry = y + Math.floor(i / 2) * 7;

          doc.setFontSize(8);
          doc.setTextColor(76, 106, 124);
          doc.text(row[0].toUpperCase(), mx + col * 85, ry);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(10);
          doc.setTextColor(41, 60, 70);
          doc.text(String(row[1]), mx + col * 85 + 30, ry);

        if (!this.job.address) missing.push('Site address');

      // ── LocalStorage ──
      save() {
        try {
          localStorage.setItem('fenceJob', JSON.stringify(this.job));
          const ind = document.getElementById('savedIndicator');

            ind.textContent = 'Saved';
            ind.style.opacity = '1';

          if (e.name === 'QuotaExceededError' || e.code === 22) {
            alert('Storage is full. Please delete some photos to free up space, then try again.');
            const ind = document.getElementById('savedIndicator');
            if (ind) { ind.textContent = 'NOT SAVED'; ind.style.opacity = '1'; ind.style.color = '#dc2626'; }
          } else {
            throw e;
          }
        }

      loadFromStorage() {
        const saved = localStorage.getItem('fenceJob');
        if (saved) {
          try {
            this.job = JSON.parse(saved);
            // Migration: ensure new fields exist
            if (!this.job.gates) this.job.gates = [];
            if (this.job.gatesRequired === undefined && !('gatesRequired' in this.job)) this.job.gatesRequired = undefined;
            this.job.runs.forEach(run => {
              if (run.sheetHeight === undefined) run.sheetHeight = run.defaultHeight || 1800;
              if (run.extension === undefined || run.extension === null) run.extension = 'none';
              // Migrate to new slope.points system
              if (!run.slope || !run.slope.points) {
                const runLen = run.length || 0;
                if (run.slopeProfile && run.slopeProfile.some(v => v !== 0)) {
                  const fracs = [0, 0.25, 0.50, 0.75, 1.0];
                  const rawPts = fracs.map((f, i) => ({
                    distanceM: Math.round(f * runLen * 2) / 2,
                    heightMm: run.slopeProfile[i]
                  }));
                  const simplified = [rawPts[0]];
                  for (let j = 1; j < rawPts.length - 1; j++) {
                    const prev = simplified[simplified.length - 1];
                    const next = rawPts[rawPts.length - 1];
                    const span = next.distanceM - prev.distanceM;
                    if (span === 0) continue;
                    const t = (rawPts[j].distanceM - prev.distanceM) / span;
                    const interp = prev.heightMm + t * (next.heightMm - prev.heightMm);
                    if (Math.abs(rawPts[j].heightMm - interp) > 10) simplified.push(rawPts[j]);
                  }
                  simplified.push(rawPts[rawPts.length - 1]);
                  run.slope = { mode: 'advanced', points: simplified, simple: { direction: 'left-to-right', totalFallMm: 0, startsFrom: 'start' }, monotonic: null };
                } else if (run.slopePoints && run.slopePoints.length >= 2) {
                  run.slope = {
                    mode: 'advanced',
                    points: run.slopePoints.map(p => ({
                      distanceM: Math.round(p.x * runLen * 2) / 2,
                      heightMm: p.y || 0
                    })),
                    simple: { direction: 'left-to-right', totalFallMm: 0, startsFrom: 'start' },
                    monotonic: null
                  };
                } else {
                  run.slope = {
                    mode: 'simple',
                    points: [
                      { distanceM: 0, heightMm: 0 },
                      { distanceM: runLen, heightMm: 0 }
                    ],
                    simple: { direction: 'left-to-right', totalFallMm: 0, startsFrom: 'start' },
                    monotonic: null
                  };
                }
                delete run.slopeProfile;
                delete run.slopePoints;
              }
              // Ensure new slope fields exist on existing slope data
              if (!run.slope.mode) run.slope.mode = 'simple';
              if (!run.slope.simple) run.slope.simple = { direction: 'left-to-right', totalFallMm: 0, startsFrom: 'start' };
              if (run.slope.monotonic === undefined) run.slope.monotonic = null;
              run.panels.forEach(p => {
                if (p.step === undefined) p.step = p.ground || 'level';
                if (p.slopePlinths === undefined) p.slopePlinths = 0;
                if (p.stepMm === undefined) p.stepMm = 0;
                // Clamp any legacy 750mm retaining to 600mm max
                if (p.retaining > 600) p.retaining = 600;
              });
            });
            // Migration: new scope form fields
            if (!this.job.scoper) this.job.scoper = '';
            if (!this.job.siteNotes) this.job.siteNotes = '';
            if (!this.job.clientFirstName) {
              const parts = (this.job.client || '').trim().split(/\s+/);
              this.job.clientFirstName = parts[0] || '';
              this.job.clientLastName = parts.slice(1).join(' ') || '';
            }
            if (!this.job.clientLastName && this.job.clientLastName !== '') this.job.clientLastName = '';

            if (!this.job.removal) {
              const js = this.job.jobSettings || {};
              this.job.removal = {
                existingFenceLength: 0,
                existingFenceType: js.removeAsbestos ? 'asbestos' : js.removeHardie ? 'hardie' : js.removeTimber ? 'timber' : 'none',
                disposal: 'company',
                vegetation: !!js.vegClear,
                gateOnExisting: false,
                access: js.access || 'easy',
                notes: ''
              };
            }

            if (!this.job.installation) {
              this.job.installation = {
                coreDrill: false,
                coreDrillHoles: 0,
                fenceLocation: [],
                manufacturer: '',
                supplierSource: ''
              };
            }

            if (!this.job.quote) {
              const js = this.job.jobSettings || {};
              this.job.quote = {
                urgency: js.urgency || 'standard',
                deliveryFee: js.delivery || 250,
                groundFinish: js.groundFinish || 'none',
                customLineItems: (js.custom || []).filter(c => c && c.desc).length > 0
                  ? js.custom.map(c => ({ desc: c.desc || '', qty: c.qty || 0, unit: c.unit || '', price: c.price || 0 }))
                  : [{}, {}, {}]
              };
            }
            // Migration: ensure labour & addon fields exist
            if (this.job.quote.tradeDays === undefined) this.job.quote.tradeDays = 1;
            if (this.job.quote.tradeRate === undefined) this.job.quote.tradeRate = 450;
            if (this.job.quote.labourerDays === undefined) this.job.quote.labourerDays = 1;
            if (this.job.quote.labourerRate === undefined) this.job.quote.labourerRate = 300;
            if (!this.job.quote.addons) this.job.quote.addons = {};

            if (!this.job.checklist) {
              this.job.checklist = { photosTaken: 0, photos: [], videoWalkthrough: false, finalNotes: '' };
            }
            if (this.job.phone === undefined) this.job.phone = '';
            if (this.job.email === undefined) this.job.email = '';
            if (!this.job.neighbours) this.job.neighbours = [{ id: 'nb-1', firstName: '', lastName: '', phone: '', email: '', address: '' }];
            if (this.job.neighboursRequired === undefined && !('neighboursRequired' in this.job)) this.job.neighboursRequired = undefined;
            if (!this.job.checklist.photos) this.job.checklist.photos = [];

            // Migrate gate objects
            (this.job.gates || []).forEach(g => {
              if (g.height === undefined) g.height = 1800;
              if (g.groundFinish === undefined) g.groundFinish = 'none';
              if (g.gatePosts === undefined) g.gatePosts = '';
            });

            if (this.job.runs.length > 0 && !this.currentRunId) {
              this.currentRunId = this.job.runs[0].id;
            }
          } catch (e) {
            this.job = null;
          }
        }
      }
    };
